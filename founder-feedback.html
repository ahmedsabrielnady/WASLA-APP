<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b35"><title>وصلة | إدارة الشكاوى والاقتراحات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Tahoma,Arial,sans-serif;background:#f3f7f6;color:#18343b}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:1150px;margin:18px auto}.panel,.item{background:#fff;border:1px solid #e0e9e7;border-radius:16px;padding:18px;margin-bottom:14px}.top{background:#063b35;color:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:23px;font-weight:900}.muted{color:#71868a;font-size:13px;line-height:1.7}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{padding:11px;border:1px solid #d5e2df;border-radius:9px;font:inherit}.field textarea{min-height:90px}.filters{display:grid;grid-template-columns:1fr 190px 190px;gap:10px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.item h3{margin:0 0 8px}.tag{display:inline-block;padding:4px 10px;border-radius:18px;background:#edf3f1;font-size:12px;font-weight:800}.btn{padding:10px 14px;border:0;border-radius:9px;background:#087a62;color:#fff;font:inherit;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:#063b35}.btn.secondary{background:#e6f5f0;color:#063b35}.hidden{display:none!important}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.error{color:#b42318}@media(max-width:650px){.filters{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.pager{flex-direction:column}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">وصلة | إدارة الشكاوى والاقتراحات</div><p>مركز خدمة العملاء ومتابعة البلاغات</p></div><div class="row"><a class="btn light" href="/founder-dashboard.html">لوحة الطلبات</a><a class="btn light" href="/">المنصة</a><button id="logout" class="btn secondary hidden">خروج</button></div></header>
<section id="login" class="panel"><h2>دخول الإدارة</h2><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginButton" class="btn">دخول</button><p id="loginMessage" class="muted"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>الرسائل الواردة</h2><p id="summary" class="muted"></p><p id="dashboardMessage" class="muted"></p><div class="filters"><input id="search" placeholder="بحث برقم المتابعة أو العنوان أو المحتوى"><select id="status"><option value="all">كل الحالات</option><option value="open">مفتوحة</option><option value="in_progress">قيد المعالجة</option><option value="resolved">تم الحل</option><option value="rejected">مرفوضة</option></select><select id="category"><option value="all">كل الأنواع</option><option value="complaint">شكاوى</option><option value="suggestion">اقتراحات</option></select></div><div id="items" class="grid"></div><div class="pager"><button id="prev" class="btn secondary">السابق</button><span id="pageInfo" class="muted"></span><button id="next" class="btn">التالي</button></div></div></section></main>
<script>
const URL='https://fdduzcytuhoelnnejgkl.supabase.co',KEY='sb_publishable_qRwoBnYmdrjrNfAVhTChnA_H8XzY529',db=window.supabase?.createClient(URL,KEY),$=id=>document.getElementById(id);
let offset=0,pageSize=50,total=0,rows=[];
const statuses={open:'مفتوحة',in_progress:'قيد المعالجة',resolved:'تم الحل',rejected:'مرفوضة'};
function msg(t,error=false){const target=$('dashboard').classList.contains('hidden')?$('loginMessage'):$('dashboardMessage');target.textContent=t;target.className=error?'error':'muted';}
function show(ok){$('login').classList.toggle('hidden',ok);$('dashboard').classList.toggle('hidden',!ok);$('logout').classList.toggle('hidden',!ok);}
async function authorize(){const {data,error}=await db.auth.getUser();if(error)throw error;if(!data.user){show(false);return;}const {data:allowed,error:authError}=await db.rpc('wasla_can_manage_operations');if(authError)throw authError;if(allowed!==true){await db.auth.signOut();show(false);msg('هذا الحساب غير مصرح له بإدارة الرسائل.',true);return;}show(true);await loadPage(true);}
async function loadPage(reset=false){if(reset)offset=0;$('items').textContent='جاري التحميل...';const {data,error,count}=await db.from('wasla_feedback').select('id,tracking_code,user_id,category,subject,message,status,admin_reply,created_at,updated_at',{count:'exact'}).order('created_at',{ascending:false}).range(offset,offset+pageSize-1);if(error)throw error;rows=data||[];total=count||0;render();}
function render(){const root=$('items');root.replaceChildren();const term=$('search').value.trim().toLowerCase(),status=$('status').value,category=$('category').value;const filtered=rows.filter(x=>(status==='all'||x.status===status)&&(category==='all'||x.category===category)&&(!term||[x.tracking_code,x.subject,x.message].some(v=>String(v||'').toLowerCase().includes(term))));if(!filtered.length){root.textContent='لا توجد نتائج في الصفحة الحالية.';}filtered.forEach(item=>{const card=document.createElement('article');card.className='item';const title=document.createElement('h3');title.textContent=(item.category==='complaint'?'شكوى: ':'اقتراح: ')+item.subject;const meta=document.createElement('p');meta.className='muted';meta.textContent=item.tracking_code+' · '+new Date(item.created_at).toLocaleString('ar-EG');const body=document.createElement('p');body.textContent=item.message;const tag=document.createElement('span');tag.className='tag';tag.textContent=statuses[item.status]||item.status;const statusField=document.createElement('div');statusField.className='field';const label=document.createElement('label');label.textContent='حالة البلاغ';const select=document.createElement('select');Object.entries(statuses).forEach(([value,text])=>{const option=document.createElement('option');option.value=value;option.textContent=text;select.append(option);});select.value=item.status;statusField.append(label,select);const replyField=document.createElement('div');replyField.className='field';const replyLabel=document.createElement('label');replyLabel.textContent='رد الإدارة';const reply=document.createElement('textarea');reply.maxLength=2000;reply.value=item.admin_reply||'';reply.placeholder='اكتب الرد الذي سيظهر لصاحب الرسالة';replyField.append(replyLabel,reply);const save=document.createElement('button');save.className='btn';save.textContent='حفظ وإشعار العميل';save.onclick=async()=>{save.disabled=true;try{const {data,error}=await db.rpc('wasla_update_feedback',{p_feedback_id:item.id,p_status:select.value,p_admin_reply:reply.value.trim()});if(error)throw error;if(data!==true)throw Error('لم يتم تأكيد التحديث.');msg('تم تحديث الرسالة وإشعار صاحبها.');await loadPage();}catch(e){msg('تعذر تحديث الرسالة: '+e.message,true);save.disabled=false;}};card.append(title,meta,body,tag,statusField,replyField,save);root.append(card);});$('summary').textContent='إجمالي الرسائل: '+total+' · المعروض في الصفحة: '+filtered.length;$('pageInfo').textContent='الصفحة '+(Math.floor(offset/pageSize)+1)+' · '+total+' رسالة';$('prev').disabled=offset===0;$('next').disabled=offset+pageSize>=total;}
$('loginButton').onclick=async()=>{try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await authorize();}catch(e){msg('تعذر الدخول: '+e.message,true);}};
$('logout').onclick=async()=>{await db.auth.signOut();show(false);};
$('prev').onclick=async()=>{if(offset===0)return;offset=Math.max(0,offset-pageSize);try{await loadPage();}catch(e){msg(e.message,true);}};
$('next').onclick=async()=>{if(offset+pageSize>=total)return;offset+=pageSize;try{await loadPage();}catch(e){msg(e.message,true);}};
$('search').oninput=render;$('status').onchange=render;$('category').onchange=render;
authorize().catch(e=>{show(false);msg('تعذر فتح مركز الإدارة: '+e.message,true);});
</script></body></html>
