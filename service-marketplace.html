<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#059669"><title>حجز الخدمات والمواعيد | وصلة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#0f172a}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:1100px;margin:18px auto}.panel,.provider,.service,.booking{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:14px}.brand{font-size:24px;font-weight:900;color:#059669}.muted{color:#64748b;font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff}button{padding:10px 14px;border:0;border-radius:9px;background:#059669;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#b91c1c}.hidden{display:none!important}.notice{padding:12px;background:#ecfdf5;color:#065f46;border-radius:10px;margin-top:10px}.price{font-weight:900;color:#059669}
</style>
</head>
<body><main class="wrap">
<section class="panel"><div class="brand">وصلة | الخدمات والمواعيد</div><a href="/">العودة إلى حسابي وطلباتي</a><h1>احجز خدمة أو موعدًا</h1><p class="muted">اختر مقدم الخدمة والخدمة والموعد. الطلب يظل «قيد التأكيد» حتى يراجعه مقدم الخدمة. المواعيد بتوقيت مصر.</p><div id="message" class="notice hidden"></div></section>
<section class="panel"><h2>مواعيدي</h2><div id="myBookings" class="grid">سجّل الدخول لعرض مواعيدك.</div></section>
<section><h2>مقدمو الخدمات</h2><div class="panel"><label for="serviceSearch">ابحث عن طبيب أو مقدم خدمة أو تخصص</label><input id="serviceSearch" type="search" placeholder="مثال: باطنة، أسنان، سباكة، غسيل سيارات" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit"></div><div id="catalog">جاري تحميل الخدمات...</div></section>
<section id="bookingBox" class="panel hidden"><h2>تأكيد طلب الحجز</h2><p id="selectedService" class="muted"></p>
<form id="bookingForm">
<div class="field"><label for="bookingDate">التاريخ</label><input id="bookingDate" type="date" required></div>
<div class="field"><label for="bookingTime">المواعيد المتاحة</label><select id="bookingTime" required><option value="">اختر التاريخ أولًا</option></select></div>
<div class="field"><label for="bookingPhone">رقم هاتف للتواصل</label><input id="bookingPhone" type="tel" minlength="8" maxlength="24" required></div>
<div class="field"><label for="bookingNotes">ملاحظات (اختياري)</label><textarea id="bookingNotes" maxlength="1200" rows="3"></textarea></div>
<button id="submitBooking" type="submit">إرسال طلب الحجز</button> <button id="closeBooking" type="button" class="secondary">إغلاق</button>
</form></section>
</main>
<script>
const URL='https://fdduzcytuhoelnnejgkl.supabase.co',KEY='sb_publishable_qRwoBnYmdrjrNfAVhTChnA_H8XzY529',db=window.supabase?.createClient(URL,KEY),$=id=>document.getElementById(id);
let currentUser=null,selected=null,providerNames={};
const sectors={medical:'خدمات طبية',education:'تعليم وتدريب',maintenance:'صيانة',automotive:'خدمات سيارات'};
const statuses={pending:'بانتظار تأكيد مقدم الخدمة',confirmed:'تم تأكيد الموعد',cancelled:'ملغي',completed:'مكتمل',no_show:'لم يحضر العميل'};
function say(message,error=false){$('message').textContent=message;$('message').classList.remove('hidden');$('message').style.background=error?'#fef2f2':'#ecfdf5';$('message').style.color=error?'#991b1b':'#065f46';}
function cairoParts(date){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);return Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));}
function cairoDate(d){const p=cairoParts(d);return p.year+'-'+p.month+'-'+p.day;}
function cairoDatePlusDays(days){const p=cairoParts(new Date());const d=new Date(Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day)+days));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
async function loadAvailableSlots(){const select=$('bookingTime');select.replaceChildren();const date=$('bookingDate').value;if(!selected||!date){const option=document.createElement('option');option.value='';option.textContent='اختر التاريخ أولًا';select.append(option);return;}select.disabled=true;const waiting=document.createElement('option');waiting.value='';waiting.textContent='جاري البحث عن المواعيد...';select.append(waiting);try{const {data,error}=await db.rpc('wasla_get_available_service_slots',{p_service_id:selected.service.id,p_date:date});if(error)throw error;select.replaceChildren();if(!data?.length){const empty=document.createElement('option');empty.value='';empty.textContent='لا توجد مواعيد متاحة في هذا اليوم';select.append(empty);return;}const prompt=document.createElement('option');prompt.value='';prompt.textContent='اختر الموعد المناسب';select.append(prompt);data.forEach(slot=>{const option=document.createElement('option');option.value=slot.slot_at;option.textContent=new Date(slot.slot_at).toLocaleTimeString('ar-EG',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit'});select.append(option);});}finally{select.disabled=false;}}
async function loadBookings(){
 const root=$('myBookings');if(!currentUser){root.textContent='سجّل الدخول لعرض مواعيدك.';return;}
 const {data,error}=await db.from('wasla_service_bookings').select('id,tracking_code,provider_id,service_name,price,scheduled_at,status,provider_note,queue_number,queue_status,queue_date').eq('customer_id',currentUser.id).order('scheduled_at',{ascending:false}).limit(100);
 if(error)throw error;root.replaceChildren();
 if(!data?.length){root.textContent='لا توجد مواعيد مسجلة.';return;}
 data.forEach(item=>{const card=document.createElement('article');card.className='booking';const title=document.createElement('h3');title.textContent=item.service_name+' · '+(statuses[item.status]||item.status);const provider=document.createElement('p');provider.className='muted';provider.textContent=providerNames[item.provider_id]||'مقدم خدمة';const date=document.createElement('p');date.textContent=new Date(item.scheduled_at).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'});const price=document.createElement('p');price.className='price';price.textContent=Number(item.price).toFixed(2)+' ج.م';const code=document.createElement('p');code.className='muted';code.textContent='رقم الحجز: '+item.tracking_code;card.append(title,provider,date,price,code);if(item.queue_number){const queue=document.createElement('p');queue.className='muted';queue.textContent='رقم انتظارك: '+item.queue_number+' · '+({waiting:'أنت في قائمة الانتظار',called:'دورك الآن، توجه لمقدم الخدمة',completed:'تمت الزيارة',cancelled:'ملغي',no_show:'لم تحضر'}[item.queue_status]||item.queue_status);card.append(queue);}if(item.provider_note){const note=document.createElement('p');note.textContent='ملاحظة مقدم الخدمة: '+item.provider_note;card.append(note);}if(['pending','confirmed'].includes(item.status)){const cancel=document.createElement('button');cancel.className='danger';cancel.textContent='إلغاء الحجز';cancel.onclick=async()=>{cancel.disabled=true;try{const {data,error}=await db.rpc('wasla_cancel_service_booking',{p_booking_id:item.id});if(error)throw error;if(data!==true)throw Error('لم يتم تأكيد الإلغاء.');say('تم إلغاء الحجز.');await loadBookings();}catch(e){say('تعذر إلغاء الحجز: '+e.message,true);cancel.disabled=false;}};card.append(cancel);}root.append(card);});
}
async function loadCatalog(){
 const root=$('catalog');root.textContent='جاري تحميل الخدمات...';
 const {data:providers,error}=await db.from('wasla_provider_profiles').select('id,business_name,sector,city,address,description').in('sector',['medical','education','maintenance','automotive']).eq('is_active',true).eq('is_published',true).order('business_name');
 if(error)throw error;
 if(!providers?.length){root.textContent='لا توجد خدمات منشورة حاليًا. يمكن لمقدمي الخدمات التقديم من حسابهم.';return;}
 providers.forEach(p=>providerNames[p.id]=p.business_name);
 const ids=providers.map(p=>p.id);
 const [{data:services,error:se},{data:schedules,error:ae}]=await Promise.all([
  db.from('wasla_provider_services').select('id,provider_id,name,category,description,price,duration_minutes').in('provider_id',ids).eq('is_available',true).order('name'),
  db.from('wasla_provider_availability').select('provider_id,weekday,starts_at,ends_at,slot_minutes').in('provider_id',ids).eq('is_active',true).order('weekday').order('starts_at')
 ]);
 if(se)throw se;if(ae)throw ae;root.replaceChildren();
 const days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
 providers.forEach(p=>{const card=document.createElement('section');card.className='provider';const title=document.createElement('h2');title.textContent=p.business_name;const meta=document.createElement('p');meta.className='muted';meta.textContent=(sectors[p.sector]||p.sector)+' · '+p.city+' · '+p.address;const desc=document.createElement('p');desc.className='muted';desc.textContent=p.description||'';card.append(title,meta,desc);const grid=document.createElement('div');grid.className='grid';const rows=(services||[]).filter(s=>s.provider_id===p.id);if(!rows.length){const empty=document.createElement('p');empty.textContent='لا توجد خدمات متاحة حاليًا.';grid.append(empty);}rows.forEach(s=>{const item=document.createElement('article');item.className='service';const name=document.createElement('h3');name.textContent=s.name;const category=document.createElement('p');category.className='muted';category.textContent=s.category+' · '+s.duration_minutes+' دقيقة';const detail=document.createElement('p');detail.className='muted';detail.textContent=s.description||'';const price=document.createElement('p');price.className='price';price.textContent=Number(s.price).toFixed(2)+' ج.م';const times=(schedules||[]).filter(x=>x.provider_id===p.id).map(x=>days[x.weekday]+' '+x.starts_at.slice(0,5)+'–'+x.ends_at.slice(0,5)+' (كل '+x.slot_minutes+' دقيقة)');const hours=document.createElement('p');hours.className='muted';hours.textContent=times.length?'المواعيد الأسبوعية: '+[...new Set(times)].join(' · '):'لم يحدد مقدم الخدمة مواعيد أسبوعية بعد.';const button=document.createElement('button');button.textContent='طلب حجز';button.disabled=!times.length;button.onclick=()=>openBooking(p,s);item.append(name,category,detail,price,hours,button);grid.append(item);});card.append(grid);root.append(card);});
}
$('serviceSearch').oninput=()=>{const term=$('serviceSearch').value.trim().toLowerCase();document.querySelectorAll('#catalog .provider').forEach(card=>card.classList.toggle('hidden',term.length>0&&!card.textContent.toLowerCase().includes(term)));};
async function openBooking(provider,service){selected={provider,service};$('selectedService').textContent=provider.business_name+' · '+service.name+' · '+Number(service.price).toFixed(2)+' ج.م';const today=cairoDate(new Date());$('bookingDate').min=today;$('bookingDate').max=cairoDatePlusDays(90);$('bookingDate').value=today;$('bookingBox').classList.remove('hidden');$('bookingBox').scrollIntoView({behavior:'smooth',block:'start'});try{await loadAvailableSlots();}catch(e){say('تعذر تحميل المواعيد المتاحة: '+e.message,true);}}
$('closeBooking').onclick=()=>{$('bookingBox').classList.add('hidden');selected=null;};
$('bookingDate').onchange=()=>loadAvailableSlots().catch(e=>say('تعذر تحميل المواعيد: '+e.message,true));
$('bookingForm').onsubmit=async ev=>{ev.preventDefault();const button=$('submitBooking');button.disabled=true;try{const {data:user,error:userError}=await db.auth.getUser();if(userError)throw userError;if(!user.user){say('سجّل الدخول أولًا من صفحة حسابي، ثم أعد طلب الحجز.',true);return;}const date=$('bookingDate').value;if(!selected||!date||!$('bookingTime').value)throw Error('اختر الخدمة والتاريخ والموعد المتاح.');const scheduledAt=$('bookingTime').value;if(!scheduledAt)throw Error('اختر موعدًا من المواعيد المتاحة.');const {data,error}=await db.rpc('wasla_create_service_booking',{p_service_id:selected.service.id,p_scheduled_at:scheduledAt,p_customer_phone:$('bookingPhone').value.trim(),p_customer_notes:$('bookingNotes').value.trim()});if(error)throw error;say('تم إرسال طلب الحجز. الموعد ينتظر تأكيد مقدم الخدمة، ورقم الطلب: '+data);$('bookingBox').classList.add('hidden');$('bookingForm').reset();selected=null;await loadBookings();}catch(e){say('تعذر إرسال طلب الحجز: '+e.message,true);}finally{button.disabled=false;}};
async function start(){const {data,error}=await db.auth.getUser();if(error)throw error;currentUser=data.user;if(currentUser?.phone)$('bookingPhone').value=currentUser.phone;await loadCatalog();await loadBookings();}
start().catch(e=>{$('catalog').textContent='تعذر تحميل الخدمات: '+e.message;say(e.message,true);});
</script></body></html>
