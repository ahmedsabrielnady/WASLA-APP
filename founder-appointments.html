<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b35"><title>وصلة | متابعة المواعيد</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Tahoma,Arial,sans-serif;background:#f3f7f6;color:#18343b}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:1180px;margin:18px auto}.top,.panel,.card{background:#fff;border:1px solid #e0e9e7;border-radius:16px;padding:18px;margin-bottom:14px}.top{background:#063b35;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:23px;font-weight:900}.muted{color:#71868a;font-size:13px;line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{padding:11px;border:1px solid #d5e2df;border-radius:9px;font:inherit;background:#fff}.filters{display:grid;grid-template-columns:1fr 220px;gap:10px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card h3{margin:0 0 8px}.status{display:inline-block;padding:4px 10px;border-radius:18px;background:#edf3f1;font-size:12px;font-weight:800}.btn{padding:10px 14px;border:0;border-radius:9px;background:#087a62;color:white;font:inherit;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:#063b35}.btn.secondary{background:#e6f5f0;color:#063b35}.hidden{display:none!important}.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.error{color:#b42318}
@media(max-width:600px){.filters{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.pager{flex-direction:column}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">وصلة | متابعة الحجوزات</div><p>لوحة قراءة ومتابعة للمؤسس والإدارة</p></div><div class="row"><a class="btn light" href="/founder-dashboard.html">لوحة الطلبات</a><a class="btn light" href="/">المنصة</a><button id="logout" class="btn secondary hidden">خروج</button></div></header>
<section id="login" class="panel"><h2>دخول الإدارة</h2><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginButton" class="btn">دخول</button><p id="loginMessage" class="muted"></p></section>
<section id="dashboard" class="hidden">
<div class="panel"><h2>حجوزات الخدمات والمواعيد</h2><p id="summary" class="muted">جاري تحميل الحجوزات...</p><div class="filters"><input id="search" placeholder="بحث برقم الحجز أو الخدمة أو هاتف العميل"><select id="status"><option value="all">كل الحالات</option><option value="pending">بانتظار التأكيد</option><option value="confirmed">مؤكد</option><option value="cancelled">ملغي</option><option value="completed">مكتمل</option><option value="no_show">لم يحضر العميل</option></select></div><div id="bookings" class="grid"></div><div class="pager"><button id="prev" class="btn secondary">السابق</button><span id="pageInfo" class="muted"></span><button id="next" class="btn">التالي</button></div></div>
</section></main>
<script>
const URL='https://fdduzcytuhoelnnejgkl.supabase.co',KEY='sb_publishable_qRwoBnYmdrjrNfAVhTChnA_H8XzY529',db=window.supabase?.createClient(URL,KEY),$=id=>document.getElementById(id);
let offset=0,pageSize=50,total=0,loaded=[],providers={};
const names={pending:'بانتظار التأكيد',confirmed:'مؤكد',cancelled:'ملغي',completed:'مكتمل',no_show:'لم يحضر العميل'};
function msg(t,error=false){$('loginMessage').textContent=t;$('loginMessage').className=error?'error':'muted';}
function show(ok){$('login').classList.toggle('hidden',ok);$('dashboard').classList.toggle('hidden',!ok);$('logout').classList.toggle('hidden',!ok);}
async function authorize(){const {data,error}=await db.auth.getUser();if(error)throw error;if(!data.user){show(false);return;}const {data:allowed,error:authError}=await db.rpc('wasla_can_manage_operations');if(authError)throw authError;if(allowed!==true){await db.auth.signOut();show(false);msg('هذا الحساب غير مصرح له بمتابعة الحجوزات.',true);return;}show(true);await loadPage(true);}
async function loadPage(reset=false){if(reset)offset=0;$('bookings').textContent='جاري التحميل...';const {data,error,count}=await db.from('wasla_service_bookings').select('id,tracking_code,provider_id,service_name,price,duration_minutes,scheduled_at,customer_phone,customer_notes,provider_note,status,created_at',{count:'exact'}).order('scheduled_at',{ascending:false}).range(offset,offset+pageSize-1);if(error)throw error;loaded=data||[];total=count||0;const ids=[...new Set(loaded.map(x=>x.provider_id))];providers={};if(ids.length){const {data:rows,error:pe}=await db.from('wasla_provider_profiles').select('id,business_name,sector').in('id',ids);if(pe)throw pe;(rows||[]).forEach(p=>providers[p.id]=p);}render();}
function render(){const root=$('bookings');root.replaceChildren();const term=$('search').value.trim().toLowerCase(),status=$('status').value;const rows=loaded.filter(b=>(status==='all'||b.status===status)&&(!term||[b.tracking_code,b.service_name,b.customer_phone,providers[b.provider_id]?.business_name].some(v=>String(v||'').toLowerCase().includes(term))));if(!rows.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='لا توجد نتائج في هذه الصفحة وفق عوامل البحث.';root.append(empty);}rows.forEach(b=>{const card=document.createElement('article');card.className='card';const title=document.createElement('h3');title.textContent=b.service_name+' · '+(names[b.status]||b.status);const provider=document.createElement('p');provider.className='muted';provider.textContent=(providers[b.provider_id]?.business_name||'مقدم خدمة')+' · '+(providers[b.provider_id]?.sector||'');const date=document.createElement('p');date.textContent=new Date(b.scheduled_at).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'})+' · '+b.duration_minutes+' دقيقة';const customer=document.createElement('p');customer.textContent='هاتف العميل: '+b.customer_phone;const price=document.createElement('p');price.textContent=Number(b.price).toFixed(2)+' ج.م · '+b.tracking_code;const note=document.createElement('p');note.className='muted';note.textContent=b.customer_notes||'لا توجد ملاحظات من العميل.';card.append(title,provider,date,customer,price,note);if(b.provider_note){const pn=document.createElement('p');pn.className='muted';pn.textContent='ملاحظة مقدم الخدمة: '+b.provider_note;card.append(pn);}root.append(card);});$('summary').textContent='إجمالي الحجوزات في قاعدة البيانات: '+total+' · المعروض في هذه الصفحة: '+rows.length;$('pageInfo').textContent='الصفحة '+(Math.floor(offset/pageSize)+1)+' · '+total+' حجزًا';$('prev').disabled=offset===0;$('next').disabled=offset+pageSize>=total;}
$('loginButton').onclick=async()=>{try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await authorize();}catch(e){msg('تعذر الدخول: '+e.message,true);}};
$('logout').onclick=async()=>{await db.auth.signOut();show(false);};
$('prev').onclick=async()=>{if(offset===0)return;offset=Math.max(0,offset-pageSize);try{await loadPage();}catch(e){msg(e.message,true);}};
$('next').onclick=async()=>{if(offset+pageSize>=total)return;offset+=pageSize;try{await loadPage();}catch(e){msg(e.message,true);}};
$('search').oninput=render;$('status').onchange=render;
authorize().catch(e=>{show(false);msg('تعذر فتح لوحة الحجوزات: '+e.message,true);});
</script></body></html>
