<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#059669"><title>وصلة | الشكاوى والاقتراحات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#102b30}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:900px;margin:20px auto}.panel,.item{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:14px}.brand{font-size:24px;font-weight:900;color:#059669}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.field select{padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.field textarea{min-height:120px}.muted{color:#64748b;font-size:13px;line-height:1.7}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{padding:11px 16px;border:0;border-radius:9px;background:#059669;color:white;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.status{display:inline-block;padding:4px 10px;border-radius:18px;background:#edf3f1;font-size:12px;font-weight:800}.notice{padding:12px;border-radius:10px;background:#ecfdf5;color:#065f46}.error{background:#fef2f2;color:#991b1b}
</style></head><body><main class="wrap">
<section class="panel"><div class="brand">وصلة | صوتك مهم</div><a href="/">العودة للمنصة</a><h1>الشكاوى والاقتراحات</h1><p class="muted">أرسل شكوى أو اقتراحًا. ستجد رقم متابعة ورسالة الإدارة هنا، وستصلك إشعارات عند تحديث الحالة.</p><div id="message" class="notice"></div></section>
<section id="formPanel" class="panel hidden"><h2>إرسال رسالة جديدة</h2><form id="feedbackForm">
<div class="field"><label for="category">نوع الرسالة</label><select id="category"><option value="complaint">شكوى</option><option value="suggestion">اقتراح</option></select></div>
<div class="field"><label for="subject">العنوان</label><input id="subject" minlength="3" maxlength="120" required placeholder="عنوان مختصر وواضح"></div>
<div class="field"><label for="body">التفاصيل</label><textarea id="body" minlength="10" maxlength="3000" required placeholder="اشرح المشكلة أو الاقتراح بالتفصيل"></textarea></div>
<button id="submit" type="submit">إرسال</button></form></section>
<section class="panel"><h2>رسائلي السابقة</h2><div id="items">جاري تحميل رسائلك...</div></section>
</main>
<script>
const URL='https://fdduzcytuhoelnnejgkl.supabase.co',KEY='sb_publishable_qRwoBnYmdrjrNfAVhTChnA_H8XzY529',db=window.supabase?.createClient(URL,KEY),$=id=>document.getElementById(id);
let user=null;
const states={open:'مفتوحة',in_progress:'قيد المعالجة',resolved:'تم الحل',rejected:'مرفوضة'};
function say(t,error=false){$('message').textContent=t;$('message').className=error?'notice error':'notice';}
async function loadItems(){const root=$('items');const {data,error}=await db.from('wasla_feedback').select('id,tracking_code,category,subject,message,status,admin_reply,created_at,updated_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100);if(error)throw error;root.replaceChildren();if(!data?.length){root.textContent='لم ترسل شكاوى أو اقتراحات بعد.';return;}data.forEach(item=>{const card=document.createElement('article');card.className='item';const title=document.createElement('h3');title.textContent=(item.category==='complaint'?'شكوى: ':'اقتراح: ')+item.subject;const status=document.createElement('span');status.className='status';status.textContent=states[item.status]||item.status;const code=document.createElement('p');code.className='muted';code.textContent='رقم المتابعة: '+item.tracking_code+' · '+new Date(item.created_at).toLocaleString('ar-EG');const message=document.createElement('p');message.textContent=item.message;card.append(title,status,code,message);if(item.admin_reply){const reply=document.createElement('div');reply.className='notice';reply.textContent='رد الإدارة: '+item.admin_reply;card.append(reply);}root.append(card);});}
async function start(){const {data,error}=await db.auth.getUser();if(error)throw error;user=data.user;if(!user){$('formPanel').classList.add('hidden');$('items').textContent='سجّل الدخول من صفحة حسابك لعرض وإرسال رسائلك.';say('يلزم تسجيل الدخول أولًا.',true);return;}$('formPanel').classList.remove('hidden');await loadItems();}
$('feedbackForm').onsubmit=async ev=>{ev.preventDefault();const button=$('submit');button.disabled=true;try{const {data,error}=await db.rpc('wasla_submit_feedback',{p_category:$('category').value,p_subject:$('subject').value.trim(),p_message:$('body').value.trim()});if(error)throw error;say('تم استلام رسالتك. رقم المتابعة: '+data);$('feedbackForm').reset();await loadItems();}catch(e){say('تعذر إرسال الرسالة: '+e.message,true);}finally{button.disabled=false;}};
start().catch(e=>say('تعذر تحميل مركز الرسائل: '+e.message,true));
</script></body></html>
