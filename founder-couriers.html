<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#059669"><title>مراجعة المندوبين | وصلة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#0f172a}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:980px;margin:24px auto}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin-bottom:16px}.brand{font-weight:900;color:#059669;font-size:24px}p{line-height:1.8;color:#64748b}input{padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;width:100%;margin:8px 0}button{padding:10px 16px;border:0;border-radius:10px;background:#059669;color:white;font:inherit;font-weight:700;cursor:pointer;margin:4px}button:disabled{opacity:.5}.reject{background:#b91c1c}.secondary{background:#e2e8f0;color:#0f172a}.notice{padding:12px;border-radius:10px;background:#ecfdf5;color:#065f46;margin:10px 0}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.app{border-top:1px solid #e2e8f0;padding-top:16px;margin-top:16px}
</style></head><body><main class="wrap"><section class="card"><div class="brand">وصلة | لوحة المؤسس</div><h1>طلبات العمل كمندوب</h1><p>الموافقة تنشئ ملف مندوب مبدئيًا. يمكن للإدارة إيقافه لاحقًا من جدول المندوبين، ولا يحصل على الطلبات إلا بعد التفعيل.</p><div id="message" class="notice hidden" role="status"></div>
<section id="login"><h2>دخول الإدارة</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="loginButton">دخول</button></section>
<section id="dashboard" class="hidden"><div class="row"><button id="refresh" class="secondary">تحديث</button><button id="logout" class="secondary">خروج</button><a href="/founder-dashboard.html">لوحة التشغيل</a></div><div id="applications"></div><h2>المندوبون النشطون</h2><div id="couriers"></div></section></section></main>
<script>
const URL='https://fdduzcytuhoelnnejgkl.supabase.co',KEY='sb_publishable_qRwoBnYmdrjrNfAVhTChnA_H8XzY529',db=window.supabase?.createClient(URL,KEY),$=id=>document.getElementById(id);
function say(t,err=false){const e=$('message');e.textContent=t;e.classList.remove('hidden');e.style.background=err?'#fef2f2':'#ecfdf5';e.style.color=err?'#991b1b':'#065f46';}
function show(ok){$('login').classList.toggle('hidden',ok);$('dashboard').classList.toggle('hidden',!ok);}
const vehicles={motorcycle:'دراجة نارية',car:'سيارة',bicycle:'دراجة',other:'أخرى'};
async function authorize(){const {data,error}=await db.auth.getUser();if(error)throw error;if(!data.user){show(false);return false;}const {data:ok,error:roleError}=await db.rpc('wasla_can_manage_operations');if(roleError)throw roleError;if(ok!==true){await db.auth.signOut();show(false);say('هذا القسم للإدارة فقط.',true);return false;}show(true);await load();return true;}
async function load(){const root=$('applications');root.textContent='جاري تحميل الطلبات...';const {data,error}=await db.from('wasla_courier_applications').select('id,applicant_id,full_name,phone,city,vehicle_type,vehicle_plate,status,admin_note,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;root.replaceChildren();if(!data?.length)root.textContent='لا توجد طلبات.';data?.forEach(item=>{const card=document.createElement('article');card.className='app';const h=document.createElement('h2');h.textContent=item.full_name;const p=document.createElement('p');p.textContent=item.phone+' · '+item.city+' · '+(vehicles[item.vehicle_type]||item.vehicle_type)+' · '+(item.vehicle_plate||'لا توجد لوحة')+' · '+item.status;const note=document.createElement('input');note.maxLength=1000;note.placeholder='ملاحظة الإدارة';note.value=item.admin_note||'';const approve=document.createElement('button');approve.textContent='قبول وتفعيل';approve.disabled=item.status!=='pending';const reject=document.createElement('button');reject.textContent='رفض';reject.className='reject';reject.disabled=item.status!=='pending';const decide=async status=>{approve.disabled=true;reject.disabled=true;try{const {data:user,error:userErr}=await db.auth.getUser();if(userErr)throw userErr;const {error}=await db.from('wasla_courier_applications').update({status,admin_note:note.value.trim()||null,reviewed_by:user.user.id,reviewed_at:new Date().toISOString()}).eq('id',item.id).eq('status','pending');if(error)throw error;say('تم تحديث الطلب.');await load();}catch(e){say('فشل تحديث الطلب: '+e.message,true);approve.disabled=false;reject.disabled=false;}};approve.onclick=()=>decide('approved');reject.onclick=()=>decide('rejected');card.append(h,p,note,approve,reject);root.append(card);});
const cr=$('couriers');cr.textContent='جاري تحميل المندوبين...';const {data:active,error:ce}=await db.from('wasla_courier_profiles').select('user_id,display_name,phone,city,vehicle_type,vehicle_plate,is_active').order('display_name');if(ce)throw ce;cr.replaceChildren();if(!active?.length)cr.textContent='لا يوجد مندوبون معتمدون.';active?.forEach(c=>{const row=document.createElement('p');row.textContent=c.display_name+' · '+c.phone+' · '+c.city+' · '+(vehicles[c.vehicle_type]||c.vehicle_type)+' · '+(c.is_active?'نشط':'موقوف');const btn=document.createElement('button');btn.className='secondary';btn.textContent=c.is_active?'إيقاف':'تفعيل';btn.onclick=async()=>{btn.disabled=true;try{const {error}=await db.from('wasla_courier_profiles').update({is_active:!c.is_active}).eq('user_id',c.user_id);if(error)throw error;say('تم تحديث حالة المندوب.');await load();}catch(e){say('تعذر تحديث المندوب: '+e.message,true);btn.disabled=false;}};cr.append(row,btn);});}
$('loginButton').onclick=async()=>{try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await authorize();}catch(e){say('تعذر الدخول أو التحقق من الصلاحية: '+e.message,true);}};
$('refresh').onclick=()=>load().catch(e=>say('تعذر التحديث: '+e.message,true));$('logout').onclick=async()=>{await db.auth.signOut();show(false);};authorize().catch(e=>{show(false);say('تعذر التحقق من صلاحيات الإدارة: '+e.message,true);});
</script></body></html>
