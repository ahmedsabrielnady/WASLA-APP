name: WASLA Static Checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'admin.html'
      - 'founder-announcements.html'
      - 'founder-dashboard.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'offline.html'
      - 'assets/wasla-icon.svg'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'index.html'
      - 'admin.html'
      - 'founder-announcements.html'
      - 'founder-dashboard.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'offline.html'
      - 'assets/wasla-icon.svg'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  inline-javascript:
    name: Validate inline JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile inline JavaScript blocks
        run: node scripts/check-inline-js.mjs
      - name: Check platform integrity guards
        run: node scripts/check-wasla-guards.mjs
