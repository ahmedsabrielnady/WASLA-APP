name: WASLA Static Checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'admin.html'
      - 'founder-announcements.html'
      - 'founder-dashboard.html'
      - 'courier-apply.html'
      - 'founder-couriers.html'
      - 'courier-dashboard.html'
      - 'merchant-dashboard.html'
      - 'marketplace.html'
      - 'courier-apply.html'
      - 'founder-couriers.html'
      - 'courier-dashboard.html'
      - 'merchant-dashboard.html'
      - 'marketplace.html'
      - 'supabase/migrations/20261119_provider_applications.sql'
      - 'supabase/migrations/20261120_order_lifecycle.sql'
      - 'supabase/migrations/20261121_courier_dispatch.sql'
      - 'supabase/migrations/20261122_provider_catalog.sql'
      - 'supabase/migrations/20261123_market_checkout.sql'
      - 'founder-providers.html'
      - 'provider-apply.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'offline.html'
      - 'assets/wasla-icon.svg'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'index.html'
      - 'admin.html'
      - 'founder-announcements.html'
      - 'founder-dashboard.html'
      - 'courier-apply.html'
      - 'founder-couriers.html'
      - 'courier-dashboard.html'
      - 'merchant-dashboard.html'
      - 'marketplace.html'
      - 'supabase/migrations/20261119_provider_applications.sql'
      - 'supabase/migrations/20261120_order_lifecycle.sql'
      - 'supabase/migrations/20261121_courier_dispatch.sql'
      - 'supabase/migrations/20261122_provider_catalog.sql'
      - 'supabase/migrations/20261123_market_checkout.sql'
      - 'founder-providers.html'
      - 'provider-apply.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'offline.html'
      - 'assets/wasla-icon.svg'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  inline-javascript:
    name: Validate inline JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile inline JavaScript blocks
        run: node scripts/check-inline-js.mjs
      - name: Check platform integrity guards
        run: node scripts/check-wasla-guards.mjs
