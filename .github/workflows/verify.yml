name: WASLA verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - app/phase-1-react-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (no external dependencies)
        run: npm ci
      - name: Syntax and unit tests
        run: npm run verify
