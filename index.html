<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary:#0B1220; --primary-light:#1E293B;
    --emerald:#059669; --emerald-light:#ECFDF5;
    --amber:#EA580C; --amber-light:#FFF7ED;
    --sky:#0284C7; --sky-light:#F0F9FF;
    --danger:#E11D48; --danger-light:#FFF1F2;
    --gold:#D97706; --gold-light:#FEF3C7;
    --indigo:#3730A3; --indigo-light:#EEF2FF;
    --gray:#64748B; --gray-light:#F8FAFC;
    --line:#E2E8F0; --bg:#F4F6FB;
    --radius-sm:10px; --radius-md:16px; --radius-lg:24px;
    --shadow-sm:0 2px 8px rgba(0,0,0,0.04);
    --shadow-md:0 8px 24px rgba(0,0,0,0.08);
    --shadow-lg:0 12px 48px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Cairo',sans-serif}
  body{background:var(--bg);color:var(--primary);margin:0;padding-bottom:80px;overflow-x:hidden}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--gray);border-radius:10px}

  .app-header{position:sticky;top:0;z-index:100;background:rgba(11,18,32,0.98);backdrop-filter:blur(10px);color:#fff;padding:10px 16px;box-shadow:var(--shadow-md)}
  .header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--emerald),#10B981);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(5,150,105,0.4)}
  .brand-title{font-size:19px;font-weight:900;margin:0;line-height:1}
  .brand-title span{font-size:9px;color:#34D399;background:rgba(52,211,153,0.15);padding:2px 6px;border-radius:6px;margin-right:4px}

  .header-actions{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .header-actions::-webkit-scrollbar{display:none}
  .btn-ui{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:8px 12px;border-radius:var(--radius-sm);font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;font-family:inherit;transition:0.2s}
  .btn-ui:active{transform:scale(0.95)}
  .btn-ui.primary{background:var(--emerald);border:none}

  .super-tabs{display:flex;gap:8px;padding:12px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:99}
  .super-tabs::-webkit-scrollbar{display:none}
  .tab{padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:900;color:var(--gray);background:var(--gray-light);border:1px solid var(--line);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px;transition:0.3s;font-family:inherit}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md)}

  .page-container{max-width:800px;margin:0 auto;padding:16px}
  .view-section{display:none;animation:fadeUp 0.4s ease}
  .view-section.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

  .card{background:#fff;border-radius:var(--radius-md);border:1px solid var(--line);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .section-title{font-size:18px;font-weight:900;margin:0 0 16px;display:flex;align-items:center;gap:8px}
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid-list{display:grid;grid-template-columns:1fr;gap:12px}

  .item-box{background:#FAFCFE;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;display:flex;align-items:center;gap:12px;transition:0.2s;cursor:pointer}
  .item-box:hover{background:#fff;box-shadow:var(--shadow-sm)}
  .item-icon{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--emerald-light);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .item-info{flex:1}
  .item-title{font-weight:900;font-size:14px;margin:0 0 4px;color:var(--primary)}
  .item-sub{font-size:11px;color:var(--gray);font-weight:700;margin:0}
  .item-price{font-weight:900;color:var(--emerald);font-size:15px}

  .btn-action{background:var(--emerald);color:#fff;border:none;padding:12px 20px;border-radius:var(--radius-sm);font-weight:900;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:0.2s}
  .btn-action:active{transform:scale(0.98)}
  .btn-action:disabled{opacity:0.5;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--emerald);border:2px solid var(--emerald)}

  .input-field{width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm);font-weight:700;font-size:14px;background:var(--gray-light);margin-bottom:12px;font-family:inherit;color:var(--primary)}
  .input-field:focus{outline:none;border-color:var(--emerald);background:#fff;box-shadow:0 0 0 4px var(--emerald-light)}

  .chip{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:800;background:#fff;color:var(--gray);border:1.5px solid var(--line);cursor:pointer;font-family:inherit;transition:0.2s}
  .chip.active{background:var(--emerald);color:#fff;border-color:var(--emerald)}

  .search-wrap{position:relative}
  .search-wrap i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:14px}
  .search-wrap .input-field{padding-right:40px;margin:0}

  .modal-wrap{position:fixed;inset:0;background:rgba(11,18,32,0.85);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-wrap.open{display:flex}
  .modal-box{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:520px;padding:24px;position:relative;max-height:90vh;overflow-y:auto}
  .modal-close{position:absolute;top:16px;left:16px;background:var(--gray-light);border:none;width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;color:var(--gray);font-size:16px;display:flex;align-items:center;justify-content:center}

  #toast-box{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast-msg{background:var(--primary);color:#fff;padding:12px 24px;border-radius:99px;font-size:13px;font-weight:900;box-shadow:var(--shadow-lg);border-right:4px solid var(--emerald);animation:slideDown 0.3s;display:flex;align-items:center;gap:8px}
  @keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

  /* Calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:900;cursor:pointer;background:var(--gray-light);position:relative;border:2px solid transparent;transition:0.2s}
  .cal-cell:hover{background:var(--emerald-light)}
  .cal-cell.today{background:var(--emerald);color:#fff}
  .cal-cell.has-appts{border-color:var(--emerald);background:var(--emerald-light);color:var(--emerald)}
  .cal-cell.today.has-appts{background:var(--emerald);color:#fff;border-color:var(--amber)}
  .cal-cell.other-month{opacity:0.3;cursor:default}
  .cal-badge{position:absolute;bottom:2px;font-size:9px;background:var(--danger);color:#fff;padding:0 4px;border-radius:6px}

  /* Slots */
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px;max-height:220px;overflow-y:auto;padding:4px}
  .slot-option{display:block;padding:10px;border-radius:8px;border:1.5px solid var(--line);text-align:center;cursor:pointer;font-size:12px;font-weight:900;background:#fff}
  .slot-option.selected{background:var(--emerald);color:#fff;border-color:var(--emerald)}
  .slot-option.disabled{opacity:0.35;cursor:not-allowed;text-decoration:line-through}
  .slot-option input{display:none}

  .stepper{display:flex;justify-content:space-between;position:relative;padding:10px 0;margin-top:15px}
  .stepper::before{content:'';position:absolute;top:24px;left:10%;right:10%;height:3px;background:var(--line);z-index:0}
  .step{display:flex;flex-direction:column;align-items:center;z-index:1;flex:1}
  .step-icon{width:32px;height:32px;border-radius:50%;background:var(--line);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;margin-bottom:6px;border:3px solid #fff}
  .step.active .step-icon{background:var(--emerald)}
  .step.current .step-icon{background:var(--amber);animation:pulse 1.5s infinite}
  .step-label{font-size:10px;font-weight:900;color:var(--gray);text-align:center}
  .step.active .step-label{color:var(--emerald)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(234,88,12,0.4)}70%{box-shadow:0 0 0 8px rgba(234,88,12,0)}100%{box-shadow:0 0 0 0 rgba(234,88,12,0)}}

  .pay-option{border:2px solid var(--line);padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px;cursor:pointer;background:#fff;margin-bottom:8px;transition:0.2s}
  .pay-option.selected{border-color:var(--emerald);background:var(--emerald-light)}
  .pay-option input{margin:0}

  .schedule-day{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
  .schedule-day.active{border-color:var(--emerald);background:var(--emerald-light)}
  .schedule-day .day-name{font-weight:900;font-size:13px;width:60px;flex-shrink:0}
  .schedule-day .time-input{width:70px;padding:6px;border:1px solid var(--line);border-radius:6px;font-size:11px;font-weight:900;text-align:center;font-family:inherit}
  .schedule-day .time-input:disabled{background:var(--gray-light);opacity:0.5}
</style>
</head>

    const el = document.createElement('div');
    el.className = 'toast-msg';
    el.style.borderRightColor = isError ? 'var(--danger)' : 'var(--emerald)';
    el.innerHTML = `<i class="fa-solid ${isError?'fa-circle-exclamation':'fa-circle-check'}"></i> ${msg}`;

  fmtDate: iso => {
    const d = new Date(iso);
    const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    return days[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
  },
  dayKey: iso => {
    const d = new Date(iso);
    return ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][d.getDay()];
  },
  dayArabic: key => ({
    saturday:'السبت', sunday:'الأحد', monday:'الاثنين', tuesday:'الثلاثاء',
    wednesday:'الأربعاء', thursday:'الخميس', friday:'الجمعة'

let audioCtx;
document.body.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, {once:true});
function playSound(isAlert=false) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = isAlert ? 'square' : 'sine';
    osc.frequency.setValueAtTime(isAlert ? 880 : 600, audioCtx.currentTime);
    if (isAlert) osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  } catch(e){}
}

/* ---------- SLOT GENERATOR ---------- */
function generateSlots(doctorId, dateISO) {
  const doc = DB.doctors.find(d => d.id === doctorId);
  if (!doc) return [];
  const day = Utils.dayKey(dateISO);
  const sched = doc.schedule[day];
  if (!sched || !sched.active) return [];

  const [sh, sm] = sched.start.split(':').map(Number);
  const [eh, em] = sched.end.split(':').map(Number);
  const startMin = sh * 60 + sm;
  const endMin = eh * 60 + em;
  const dur = sched.duration || 20;
  const breakStart = sched.breakStart ? sched.breakStart.split(':').map(Number) : null;
  const breakEnd = sched.breakEnd ? sched.breakEnd.split(':').map(Number) : null;
  const breakStartMin = breakStart ? breakStart[0] * 60 + breakStart[1] : null;
  const breakEndMin = breakEnd ? breakEnd[0] * 60 + breakEnd[1] : null;

  const booked = DB.appointments
    .filter(a => a.doctorId === doctorId && a.date === dateISO && a.status !== 'canceled')
    .map(a => a.slot);

  const slots = [];
  for (let t = startMin; t + dur <= endMin; t += dur) {
    if (breakStartMin !== null && t >= breakStartMin && t < breakEndMin) continue;
    const h = Math.floor(t / 60);
    const m = t % 60;
    const label = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
    slots.push({ time: label, booked: booked.includes(label) });
  }
  return slots;
}

  renderSlots: (docId) => {
    const dateISO = document.getElementById('book-date').value;

    const container = document.getElementById('slot-container');
    const noSlots = document.getElementById('no-slots');

    if (!slots.length) {
      container.innerHTML = '';
      noSlots.style.display = 'block';
      return;
    }
    noSlots.style.display = 'none';
    container.innerHTML = slots.map(s => `
      <label class="slot-option ${s.booked?'disabled':''}">
        <input type="radio" name="slot" value="${s.time}" ${s.booked?'disabled':''} onchange="MedicalModule.pickSlot(this)">

      </label>

    // اختيار أول موعد متاح
    const firstAvail = container.querySelector('.slot-option:not(.disabled)');

      firstAvail.classList.add('selected');
      firstAvail.querySelector('input').checked = true;
    }

  pickSlot: (el) => {
    document.querySelectorAll('.slot-option').forEach(o => o.classList.remove('selected'));
    el.closest('.slot-option').classList.add('selected');
  },

  selectPay: (el, docId) => {
    document.querySelectorAll('#pay-wrap .pay-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;
    const method = el.querySelector('input').value;
    const insWrap = document.getElementById('insurance-select-wrap');
    if (insWrap) insWrap.style.display = method === 'insurance' ? 'block' : 'none';
    MedicalModule.recalcTotal(docId);
  },

  recalcTotal: (docId) => {
    const doc = DB.doctors.find(d => d.id === docId);
    let total = doc.price;
    // خدمات إضافية
    document.querySelectorAll('.svc-check:checked').forEach(c => {
      total += parseInt(c.dataset.price);
    });
    // تأمين
    const payEl = document.querySelector('input[name="paymethod"]:checked');
    const payMethod = payEl ? payEl.value : 'cash';
    let discountText = '';
    if (payMethod === 'insurance') {
      const insId = document.getElementById('insurance-select').value;
      const ins = DB.insuranceCompanies.find(i => i.id === insId);
      const discount = Math.round(total * ins.coverage / 100);
      total = total - discount;
      discountText = `خصم تأمين: ${Utils.money(discount)} (${ins.coverage}%)`;
    }
    document.getElementById('total-amount').innerText = Utils.money(total);
    const insDisc = document.getElementById('insurance-discount');
    if (discountText) {
      insDisc.style.display = 'block';
      insDisc.innerText = discountText;
    } else {
      insDisc.style.display = 'none';
    }
  },

  confirmBooking: (docId) => {
    const doc = DB.doctors.find(d => d.id === docId);
    const dateISO = document.getElementById('book-date').value;
    const slotEl = document.querySelector('input[name="slot"]:checked');
    if (!slotEl) return Utils.toast('اختر موعد', true);
    const slot = slotEl.value;

    const payEl = document.querySelector('input[name="paymethod"]:checked');
    const payMethod = payEl ? payEl.value : 'cash';
    let insuranceId = null;

    // حساب السعر النهائي
    let total = doc.price;
    document.querySelectorAll('.svc-check:checked').forEach(c => total += parseInt(c.dataset.price));
    if (payMethod === 'insurance') {
      insuranceId = document.getElementById('insurance-select').value;
      const ins = DB.insuranceCompanies.find(i => i.id === insuranceId);
      total = Math.round(total * (1 - ins.coverage / 100));
    }

    const apptId = Utils.id();
    const queueNum = DB.appointments.filter(a => a.doctorId === docId && a.date === dateISO).length + 1;

      id: apptId, patientId: Auth.currentUser.id, patientName: Auth.currentUser.name,
      doctorId: doc.id, doctorName: doc.name, doctorSpec: doc.spec,

    const waMsg = `✅ تم تأكيد حجزك\n👨‍⚕️ ${doc.name}\n📅 ${Utils.fmtDate(dateISO)}\n⏰ ${slot}\n💰 ${Utils.money(total)}\n💳 ${PAYMENT_METHODS.find(p=>p.id===payMethod)?.name}\n🎫 #${apptId.substring(0,6).toUpperCase()}`;

/* ---------- CALENDAR MODULE ---------- */
const CalendarModule = {
  render: () => {
    const el = document.getElementById('view-calendar');
    const cursor = DB.calendarCursor; // YYYY-MM
    const [year, month] = cursor.split('-').map(Number);
    const firstDay = new Date(year, month - 1, 1);
    const lastDay = new Date(year, month, 0);
    const daysInMonth = lastDay.getDate();
    const startWeekDay = firstDay.getDay(); // 0=Sunday

    const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const dayNames = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

    // خريطة الحجوزات بالتاريخ
    const apptsByDate = {};
    DB.appointments.forEach(a => {
      if (a.status === 'canceled') return;
      if (!apptsByDate[a.date]) apptsByDate[a.date] = [];
      apptsByDate[a.date].push(a);
    });

    const todayISO = Utils.todayISO();

    let cells = '';
    // خلايا فارغة قبل أول يوم
    for (let i = 0; i < startWeekDay; i++) cells += `<div class="cal-cell other-month"></div>`;
    // أيام الشهر
    for (let d = 1; d <= daysInMonth; d++) {
      const dateISO = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const appts = apptsByDate[dateISO] || [];
      const isToday = dateISO === todayISO;
      const cls = `cal-cell ${isToday?'today':''} ${appts.length?'has-appts':''}`;
      cells += `<div class="${cls}" onclick="CalendarModule.openDay('${dateISO}')">
        <span>${d}</span>
        ${appts.length ? `<span class="cal-badge">${appts.length}</span>` : ''}
      </div>`;
    }

    el.innerHTML = `
      <h2 class="section-title"><i class="fa-solid fa-calendar-days" style="color:var(--emerald);"></i> الكاليندر</h2>
      
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <button onclick="CalendarModule.prevMonth()" class="btn-ui" style="background:var(--gray-light); color:var(--primary);"><i class="fa-solid fa-chevron-right"></i></button>
          <h3 style="margin:0; font-weight:900; font-size:16px;">${monthNames[month-1]} ${year}</h3>
          <button onclick="CalendarModule.nextMonth()" class="btn-ui" style="background:var(--gray-light); color:var(--primary);"><i class="fa-solid fa-chevron-left"></i></button>
        </div>
        <div class="cal-grid" style="margin-bottom:8px;">
          ${dayNames.map(d => `<div style="text-align:center; font-size:10px; font-weight:900; color:var(--gray); padding:4px;">${d}</div>`).join('')}
        </div>
        <div class="cal-grid">${cells}</div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 12px; font-weight:900; font-size:14px;"><i class="fa-solid fa-info-circle" style="color:var(--sky);"></i> دليل الألوان</h3>
        <div style="display:flex; gap:12px; flex-wrap:wrap; font-size:11px; font-weight:900;">
          <div style="display:flex; align-items:center; gap:6px;"><div style="width:20px; height:20px; background:var(--emerald); border-radius:6px;"></div> اليوم</div>
          <div style="display:flex; align-items:center; gap:6px;"><div style="width:20px; height:20px; background:var(--emerald-light); border:2px solid var(--emerald); border-radius:6px;"></div> فيه حجوزات</div>
          <div style="display:flex; align-items:center; gap:6px;"><div style="width:20px; height:20px; background:var(--gray-light); border-radius:6px;"></div> لا حجوزات</div>
          <div style="display:flex; align-items:center; gap:6px;"><div style="width:16px; height:16px; background:var(--danger); border-radius:4px;"></div> عدد</div>
        </div>
      </div>
    `;
  },

  prevMonth: () => {
    const [y, m] = DB.calendarCursor.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    DB.calendarCursor = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    saveDB();
    CalendarModule.render();
  },
  nextMonth: () => {

      .filter(a => a.patientId === Auth.currentUser.id && a.status !== 'completed' && a.status !== 'canceled')
      .sort((a,b) => a.ts - b.ts);

    if (!myAppts.length) {
      el.innerHTML = `
        <h2 class="section-title"><i class="fa-solid fa-users-viewfinder" style="color:var(--sky);"></i> تتبع الدور</h2>
        <div class="card text-center" style="padding:40px;">

        </div>
      `;
      return;
    }

    el.innerHTML = `
      <h2 class="section-title"><i class="fa-solid fa-users-viewfinder" style="color:var(--sky);"></i> تتبع الدور (Live)</h2>
      ${myAppts.map(appt => {
        const sameSessionAppts = DB.appointments
          .filter(a => a.doctorId === appt.doctorId && a.date === appt.date && a.status !== 'canceled' && a.status !== 'completed')
          .sort((a,b) => a.ts - b.ts);
        const position = sameSessionAppts.findIndex(a => a.id === appt.id) + 1;
        const ahead = position - 1;
        const doc = DB.doctors.find(d => d.id === appt.doctorId);
        const etaMin = ahead * (doc?.avgTime || 20);
        const isCurrent = appt.status === 'next';
        const isWaiting = appt.status === 'waiting';

        return `
        <div class="card" style="border-right:4px solid ${isCurrent?'var(--amber)':'var(--sky)'};">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;">
            <div>
              <h4 style="margin:0; font-weight:900; font-size:15px;">${appt.doctorName}</h4>
              <p style="margin:4px 0 0; font-size:11px; color:var(--gray); font-weight:700;">${appt.doctorSpec}</p>
              <p style="margin:4px 0 0; font-size:11px; color:var(--sky); font-weight:900;"><i class="fa-solid fa-calendar"></i> ${Utils.fmtDate(appt.date)} • ${appt.slot}</p>
            </div>
            <span style="font-size:11px; font-weight:900; padding:4px 10px; border-radius:6px; background:${isCurrent?'#FEF3C7':'var(--sky-light)'}; color:${isCurrent?'#92400E':'var(--sky)'};">
              ${isCurrent?'دورك الآن':'في الانتظار'}
            </span>
          </div>

          <div style="background:var(--gray-light); padding:16px; border-radius:12px; text-align:center; margin-bottom:12px;">
            <div style="font-size:11px; color:var(--gray); font-weight:900; margin-bottom:4px;">رقم دورك</div>
            <div style="font-size:42px; font-weight:900; color:${isCurrent?'var(--amber)':'var(--emerald)'}; line-height:1;">#${position}</div>
            <div style="font-size:11px; color:var(--gray); font-weight:700; margin-top:6px;">
              ${isCurrent ? 'توجه للعيادة الآن' : ahead > 0 ? `${ahead} حالات قبلك` : 'أنت التالي'}
            </div>
          </div>

          ${!isCurrent ? `
            <div style="background:var(--sky-light); padding:12px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <div style="font-size:11px; font-weight:900; color:var(--sky);"><i class="fa-solid fa-clock"></i> الوقت المتوقع</div>
              <div style="font-size:14px; font-weight:900; color:var(--sky);">${etaMin > 0 ? `~${etaMin} دقيقة` : 'دقائق'}</div>
            </div>
          ` : `
            <div style="background:var(--amber-light); padding:14px; border-radius:10px; text-align:center; color:#9A3412; font-size:13px; font-weight:900; margin-bottom:12px;">
              🔔 توجه للطبيب الآن
            </div>
          `}

          <div class="stepper" style="margin:0;">
            <div class="step active"><div class="step-icon"><i class="fa-solid fa-check"></i></div><div class="step-label">محجوز</div></div>
            <div class="step ${isCurrent?'current active':''}"><div class="step-icon"><i class="fa-solid ${isCurrent?'fa-microphone':'fa-hourglass-half'}"></i></div><div class="step-label">نداء</div></div>
            <div class="step"><div class="step-icon"><i class="fa-solid fa-stethoscope"></i></div><div class="step-label">كشف</div></div>
            <div class="step"><div class="step-icon"><i class="fa-solid fa-check"></i></div><div class="step-label">تم</div></div>
          </div>

          <button onclick="QueueModule.cancel('${appt.id}')" class="btn-action" style="width:100%; background:var(--danger-light); color:var(--danger); margin-top:12px; padding:10px; font-size:12px;">
            <i class="fa-solid fa-xmark"></i> إلغاء الحجز
          </button>
        </div>
        `;
      }).join('')}
    `;
  },

  cancel: (apptId) => {
    if (!confirm('هل تريد إلغاء الحجز؟')) return;
    const appt = DB.appointments.find(a => a.id === apptId);
    if (appt) {
      appt.status = 'canceled';
      saveDB();
      Utils.toast('تم إلغاء الحجز');
      QueueModule.render();
    }
  }
};

            <div class="item-icon"><i class="fa-solid fa-user-doctor"></i></div>
            <div class="item-info">
              <div class="item-title">${d.name}</div>
              <div class="item-sub">${d.spec} • ${Utils.money(d.price)} • ${d.services.length} خدمة</div>
            </div>
          </div>
        `).join('')}
      </div>

      <h3 class="section-title" style="margin-top:24px;"><i class="fa-solid fa-shield-halved" style="color:var(--gold);"></i> شركات التأمين (${DB.insuranceCompanies.length})</h3>
      <div class="grid-list">
        ${DB.insuranceCompanies.map(ins => `
          <div class="item-box">
            <div class="item-icon" style="background:var(--gold-light); color:var(--gold);"><i class="fa-solid ${ins.logo}"></i></div>
            <div class="item-info">
              <div class="item-title">${ins.name}</div>
              <div class="item-sub">تغطية ${ins.coverage}%</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
};

/* ---------- STAFF MODULE ---------- */
const StaffModule = {
  call: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    if (!appt) return;
    appt.status = 'next'; saveDB();
    Notifier.push(appt.patientId, `🔔 حان دورك الآن! توجه لعيادة ${appt.doctorName}`, true);
    Utils.toast('تم إرسال النداء');
    Views.staff();
  },
  finish: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    if (!appt) return;
    appt.status = 'completed'; saveDB();
    Utils.toast('تم إنهاء الكشف');
    Views.staff();
  }
};

/* ---------- DOCTOR MODULE ---------- */
const DoctorModule = {
  call: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    if (!appt) return;
    appt.status = 'next'; saveDB();
    Notifier.push(appt.patientId, `🔔 دورك الآن يا ${appt.patientName}`, true);
    Utils.toast('تم استدعاء المريض');
    Views.doctor();
  },
  finish: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    if (!appt) return;
    appt.status = 'completed'; saveDB();
    Utils.toast('تم إنهاء الكشف');
    Views.doctor();
  },
  updateSchedule: (docId, day, field, value) => {
    const doc = DB.doctors.find(d => d.id === docId);
    if (!doc) return;
    if (field === 'duration') value = parseInt(value) || 20;
    doc.schedule[day][field] = value;
    saveDB();
    Utils.toast('تم تحديث الجدول');
  },
  toggleDay: (docId, day) => {
    const doc = DB.doctors.find(d => d.id === docId);
    if (!doc) return;
    const s = doc.schedule[day];
    if (s.active) {
      doc.schedule[day] = {active:false};
    } else {
      doc.schedule[day] = {active:true, start:'17:00', end:'21:00', duration:20, breakStart:null, breakEnd:null};
    }
    saveDB();
    Views.doctor();
  },
  addServiceModal: (docId) => {
    document.getElementById('modal-generic-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-generic')"><i class="fa-solid fa-xmark"></i></button>
      <h3 style="margin:0 0 16px; font-weight:900;">إضافة خدمة جديدة</h3>
      <input type="text" id="svc-name" class="input-field" placeholder="اسم الخدمة">
      <input type="number" id="svc-price" class="input-field" placeholder="السعر (0 = ضمن الكشف)">
      <input type="number" id="svc-dur" class="input-field" placeholder="المدة (دقائق)" value="15">
      <button onclick="DoctorModule.addService('${docId}')" class="btn-action" style="width:100%;">إضافة</button>
    `;
    Utils.openModal('modal-generic');
  },
  addService: (docId) => {
    const name = document.getElementById('svc-name').value.trim();
    const price = parseInt(document.getElementById('svc-price').value) || 0;
    const dur = parseInt(document.getElementById('svc-dur').value) || 15;
    if (!name) return Utils.toast('اكتب اسم الخدمة', true);
    const doc = DB.doctors.find(d => d.id === docId);
    doc.services.push({id: 'sv-'+Utils.id(), name, price, duration: dur, icon:'fa-stethoscope'});
    saveDB();
    Utils.closeModal('modal-generic');
    Utils.toast('تمت الإضافة');
    Views.doctor();
  },
  removeService: (docId, svcId) => {
    if (!confirm('حذف الخدمة؟')) return;
    const doc = DB.doctors.find(d => d.id === docId);
    doc.services = doc.services.filter(s => s.id !== svcId);
    saveDB();
    Views.doctor();
    Utils.toast('تم الحذف');
  }
};

/* ---------- INIT ---------- */
window.addEventListener('DOMContentLoaded', () => {
  UI.renderHeader();
  router.navigate('medical');

  // محاكاة تحديث الطلبات
  setInterval(() => {
    let changed = false;
    DB.orders.forEach(o => {
      if (o.status === 'preparing') { o.status = 'on_way'; changed = true; }
      else if (o.status === 'on_way') { o.status = 'delivered'; changed = true; }
    });
    if (changed) {
      saveDB();
      if (Auth.currentUser && document.getElementById('view-dashboard').classList.contains('active')) {
        Views.dashboard();
      }
    }
    // تحديث الطابور تلقائياً لو المستخدم في شاشة التتبع
    if (Auth.currentUser && document.getElementById('view-queue').classList.contains('active')) {
      QueueModule.render();
    }
  }, 15000);
});
</script>
