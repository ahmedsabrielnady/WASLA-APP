        ];

        const defaultServices = [
            { id: 's1', cat: 'nursing', name: 'تمريض منزلي - حقن ومحاليل', price: 150, desc: 'زيارة ممرض معتمد لإعطاء الحقن والمحاليل الوريدية.' },
            { id: 's2', cat: 'nursing', name: 'رعاية كبار السن', price: 250, desc: 'رعاية شاملة لكبار السن في المنزل، متابعة أدوية.' }
        ];

        const DB = {
            doctors: JSON.parse(localStorage.getItem('wasla_docs')) || defaultDoctors,
            services: JSON.parse(localStorage.getItem('wasla_servs')) || defaultServices,
            appointments: JSON.parse(localStorage.getItem('wasla_appts')) || [],
            emr: JSON.parse(localStorage.getItem('wasla_emr')) || [],
            users: JSON.parse(localStorage.getItem('wasla_users')) || [
                { id: 'u1', name: 'أحمد محمود', phone: '01012345678', pass: '123', role: 'patient' },
                { id: 'd1', name: 'د. أحمد الشريف', phone: '01098765432', pass: '123', role: 'doctor' },
                { id: 'a1', name: 'المؤسس', phone: '01000000000', pass: '123', role: 'admin' }
            ]
        };

        // XSS Protection
        const sanitize = (str) => {
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        };
        
        const saveDB = () => {
            localStorage.setItem('wasla_docs', JSON.stringify(DB.doctors));
            localStorage.setItem('wasla_servs', JSON.stringify(DB.services));
            localStorage.setItem('wasla_appts', JSON.stringify(DB.appointments));
            localStorage.setItem('wasla_emr', JSON.stringify(DB.emr));
            localStorage.setItem('wasla_users', JSON.stringify(DB.users));
        };
    </script>

                    <h3 class="font-black text-slate-800 text-lg mb-2">خدمات التمريض المنزلي</h3><p class="text-xs text-slate-500 font-bold">حقن ومحاليل ورعاية كبار السن في المنزل.</p>
                </div>
            </div>
        `,

        login: () => `
            <div class="max-w-md mx-auto glass p-8 rounded-[2rem] mt-10 border border-slate-200 shadow-2xl animate-fade-in-up">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-brand-primary-light text-brand-primary rounded-3xl flex items-center justify-center mx-auto text-3xl mb-4"><i class="fa-solid fa-user-lock"></i></div>
                    <h2 class="text-3xl font-black text-slate-800">تسجيل الدخول</h2>
                    <p class="text-sm text-slate-500 font-bold mt-2">للمرضى والأطباء والإدارة</p>
                </div>
                <form onsubmit="App.handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف</label>
                        <input type="tel" id="login-phone" required placeholder="01xxxxxxxxx" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-50 font-bold text-sm">
                    </div>
                    <div>

                        <input type="password" id="login-pass" required placeholder="••••••••" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-50 font-bold text-sm">
                    </div>
                    <button type="submit" class="w-full bg-brand-primary text-white py-3.5 rounded-xl font-black text-base shadow-lg mt-2">دخول</button>
                </form>
                <div class="mt-6 pt-4 border-t border-slate-100">
                    <button onclick="App.navigate('register')" class="w-full text-center text-sm font-bold text-brand-primary hover:underline">ليس لديك حساب؟ سجل الآن</button>
                </div>

        `,

        register: () => `

                <div class="text-center mb-6">
                    <h2 class="text-2xl font-black text-slate-800">حساب جديد</h2>
                </div>
                <form onsubmit="App.handleRegister(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">الاسم بالكامل</label>
                        <input type="text" id="reg-name" required placeholder="الاسم الثلاثي" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-50 font-bold text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف</label>
                        <input type="tel" id="reg-phone" required placeholder="01xxxxxxxxx" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-50 font-bold text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                        <input type="password" id="reg-pass" required placeholder="••••••••" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-50 font-bold text-sm">
                    </div>
                    <button type="submit" class="w-full bg-brand-primary text-white py-3.5 rounded-xl font-black text-base shadow-lg">إنشاء الحساب</button>
                </form>
            </div>
        `,

        doctors: () => {
            const specialties = [...new Set(DB.doctors.map(d => d.spec))];
            const areas = [...new Set(DB.doctors.map(d => d.area))];
            return `
            <div class="animate-fade-in">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                    <div><h2 class="text-3xl font-black text-slate-800">دليل الأطباء</h2><p class="text-sm text-slate-500 font-bold mt-1">احجز كشف عيادة أو كشف منزلي.</p></div>
                </div>

                <!-- Filters (Functional) -->
                <div class="glass p-4 rounded-2xl border border-slate-200 mb-6 grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="search-name" oninput="App.renderDoctors()" placeholder="ابحث باسم الطبيب..." class="w-full px-4 py-2.5 border rounded-xl text-sm font-bold">
                    <select id="filter-spec" onchange="App.renderDoctors()" class="w-full px-4 py-2.5 border rounded-xl text-sm font-bold">
                        <option value="">كل التخصصات</option>
                        ${specialties.map(s => `<option value="${s}">${s}</option>`).join('')}
                    </select>
                    <select id="filter-area" onchange="App.renderDoctors()" class="w-full px-4 py-2.5 border rounded-xl text-sm font-bold">
                        <option value="">كل المناطق</option>
                        ${areas.map(a => `<option value="${a}">${a}</option>`).join('')}
                    </select>

                <div id="doctors-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        },

        services: () => `
            <div class="animate-fade-in">
                <div class="text-center mb-10"><h2 class="text-3xl font-black text-slate-800">خدمات التمريض المنزلي</h2></div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${DB.services.map(s => `
                        <div class="glass rounded-3xl p-6 border border-slate-200 hover-lift">
                            <h3 class="font-black text-slate-800 text-lg mb-2">${s.name}</h3>
                            <p class="text-xs text-slate-600 font-bold mb-6">${s.desc}</p>
                            <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                                <span class="text-brand-primary font-black text-xl">${s.price} <span class="text-xs">ج.م</span></span>
                                <button onclick="App.requestService('${s.id}')" class="bg-brand-primary text-white px-5 py-2.5 rounded-xl text-sm font-bold">اطلب الآن</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `
    };

    // 3. المحرك الأساسي (App Core)
    window.App = {
        state: {
            user: JSON.parse(localStorage.getItem('wasla_session')) || null,
            currentView: 'landing'
        },

        init() {
            this.updateHeader();
            this.navigate('landing');
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.style.display = 'none', 500); }
            }, 800);
        },

        navigate(view) {
            this.state.currentView = view;
            const container = document.getElementById('app-container');
            
            // Protect Routes
            if (['patientPortal', 'doctorDashboard', 'adminDashboard'].includes(view) && !this.state.user) {
                this.toast('يجب تسجيل الدخول أولاً.', 'warning');
                return this.navigate('login');
            }

            if (Views[view]) {
                container.innerHTML = Views[view]();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                if (view === 'doctors') this.renderDoctors();
            } else {
                container.innerHTML = Views.landing();
            }
            this.updateHeader(); // Update nav links
        },

        updateHeader() {
            const u = this.state.user;
            const nav = document.getElementById('desktop-nav');
            const mobileNav = document.getElementById('mobile-menu');
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');

            if (u) {
                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');
                
                let dashLink = '';
                if (u.role === 'patient') dashLink = `<button onclick="App.navigate('patientPortal')" class="px-3 py-2 text-xs font-bold text-brand-primary hover:text-white">ملفي</button>`;
                if (u.role === 'doctor') dashLink = `<button onclick="App.navigate('doctorDashboard')" class="px-3 py-2 text-xs font-bold text-brand-primary hover:text-white">لوحة الطبيب</button>`;
                if (u.role === 'admin') dashLink = `<button onclick="App.navigate('adminDashboard')" class="px-3 py-2 text-xs font-bold text-brand-accent hover:text-white">الإدارة</button>`;

                nav.innerHTML = `
                    <button onclick="App.navigate('landing')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">الرئيسية</button>
                    ${dashLink}
                `;
                mobileNav.innerHTML = `
                    <button onclick="App.navigate('landing')" class="block w-full text-right p-2 text-slate-300 font-bold">الرئيسية</button>
                    ${dashLink.replace('px-3 py-2 text-xs', 'block w-full text-right p-2 text-sm')}
                `;
            } else {
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                nav.innerHTML = `
                    <button onclick="App.navigate('landing')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">الرئيسية</button>
                    <button onclick="App.navigate('doctors')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">الأطباء</button>
                    <button onclick="App.navigate('services')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">الخدمات</button>
                `;
                mobileNav.innerHTML = `
                    <button onclick="App.navigate('landing'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-slate-300 font-bold">الرئيسية</button>

        confirmBooking(e, docId) {
            const doc = DB.doctors.find(d => d.id === docId);
            const type = document.querySelector('input[name="bk-type"]:checked').value;
            const name = document.getElementById('bk-name').value;
            const date = document.getElementById('bk-date').value;
            const time = document.getElementById('bk-time').value;
            const phone = document.getElementById('bk-phone').value;
            
            // Check for double booking
            const isBooked = DB.appointments.find(a => a.docId === docId && a.date === date && a.time === time && a.status !== 'cancelled');
            if (isBooked) {
                return this.toast('عذراً، هذا الميعاد محجوز بالفعل. يرجى اختيار وقت آخر.', 'error');
            }

            const amount = type === 'home' ? doc.homeFee : doc.fee;
            const refNum = 'WS-' + Math.floor(1000 + Math.random() * 9000);
            
            const newAppt = { 
                id: 'A' + Date.now(), 
                refNum: refNum,
                patient: sanitize(name), 
                phone: sanitize(phone), 
                docId: doc.id, 
                docName: doc.name, 
                date, time, 
                status: 'confirmed', 
                amount, 
                type 
            };
            
            DB.appointments.push(newAppt);
            saveDB();
            
            document.getElementById('modal-container').classList.add('hidden');
            this.toast(`تم تأكيد الحجز! رقمك المرجعي: ${refNum}`, 'success');
            
            if (this.state.user && this.state.user.role === 'patient') this.navigate('patientPortal');
            else this.navigate('landing');
            
            // WhatsApp (Direct open, no setTimeout)
            const msg = `*تذكرة حجز - منصة وصلة* 🏥\n\n*الرقم المرجعي:* ${refNum}\n*الطبيب:* ${doc.name}\n*النوع:* ${type === 'home' ? 'كشف منزلي' : 'كشف عيادة'}\n*المريض:* ${name}\n*التاريخ:* ${date} - ${time}\n*المبلغ:* ${amount} ج.م`;
            window.open(`https://wa.me/201012345678?text=${encodeURIComponent(msg)}`, '_blank');
        },

        // ================= SERVICES =================
        requestService(serviceId) {
            const service = DB.services.find(s => s.id === serviceId);
            if (!service) return;
            
            const phone = prompt("أدخل رقم هاتفك للتأكيد:");
            if(!phone) return;

            this.toast(`تم تسجيل طلبك لـ ${service.name}. سنتصل بك قريباً.`, 'success');
            
            const msg = `*طلب خدمة - منصة وصلة* 🏥\n\nالخدمة: ${service.name}\nالسعر: ${service.price} ج.م\nالهاتف: ${phone}`;
            window.open(`https://wa.me/201012345678?text=${encodeURIComponent(msg)}`, '_blank');
        },

        // ================= UI HELPERS =================

        toast(msg, type = 'info') {
            const colors = { success: 'bg-emerald-600', info: 'bg-brand-primary', warning: 'bg-amber-600', error: 'bg-red-600' };
            const el = document.createElement('div');
            el.className = `${colors[type] || colors.info} text-white px-5 py-3 rounded-xl shadow-lg text-sm font-bold mb-2 animate-fade-in-up max-w-sm`;
            el.innerText = msg;
            document.getElementById('toast-container').appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
        }
    };

    // 4. التشغيل الآمن

        try { App.init(); } catch (e) { console.error(e); document.getElementById('loading-screen').style.display = 'none'; }
    });
</script>

                    </div>

                    <!-- Tab: Doctors -->
                    <div id="admin-content-docs" class="admin-content hidden glass rounded-3xl p-6 border border-slate-200 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-lg">إدارة الأطباء</h3>
                            <button onclick="App.adminAddDoctor()" class="bg-brand-primary text-white px-4 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-plus"></i> إضافة طبيب</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${DB.doctors.map(d => `
                                <div class="p-4 bg-white border rounded-xl flex justify-between items-center">
                                    <div>
                                        <div class="font-bold text-sm">${d.name}</div>
                                        <div class="text-xs text-slate-500">${d.spec} | عيادة: ${d.fee} | منزلي: ${d.homeFee}</div>
                                    </div>
                                    <button onclick="App.adminDeleteDoctor('${d.id}')" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Tab: Services -->
                    <div id="admin-content-servs" class="admin-content hidden glass rounded-3xl p-6 border border-slate-200 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-lg">إدارة الخدمات (التمريض)</h3>
                            <button onclick="App.adminAddService()" class="bg-brand-primary text-white px-4 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-plus"></i> إضافة خدمة</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${DB.services.map(s => `
                                <div class="p-4 bg-white border rounded-xl flex justify-between items-center">
                                    <div>
                                        <div class="font-bold text-sm">${s.name}</div>
                                        <div class="text-xs text-slate-500">${s.price} ج.م</div>
                                    </div>
                                    <button onclick="App.adminDeleteService('${s.id}')" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                `;
            },

            // ==========================================
            // مودال الملف الطبي للطبيب (Doctor EMR)
            // ==========================================
            doctorEMR: (patientName) => `
                <div class="space-y-4">
                    <h3 class="font-black text-lg text-slate-800 border-b pb-2">إضافة ملف طبي لـ: ${patientName}</h3>
                    <form onsubmit="event.preventDefault(); App.saveEMR(event, '${patientName}')" class="space-y-3">
                        <select id="emr-type" class="w-full p-3 border rounded-xl font-bold text-sm bg-slate-50">
                            <option value="روشتة طبية">روشتة طبية</option>
                            <option value="نتيجة تحليل">نتيجة تحليل</option>
                            <option value="أشعة">أشعة</option>
                            <option value="ملاحظة طبية">ملاحظة طبية</option>
                        </select>
                        <textarea id="emr-notes" required rows="4" placeholder="اكتب تفاصيل الروشتة أو التشخيص..." class="w-full p-3 border rounded-xl font-bold text-sm bg-slate-50"></textarea>
                        <button type="submit" class="w-full bg-brand-info text-white py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition">حفظ في ملف المريض</button>
                    </form>
                    <div class="mt-4">
                        <h4 class="font-bold text-sm text-slate-600 mb-2">سجلات سابقة:</h4>
                        <div class="space-y-2 max-h-40 overflow-y-auto">
                            ${DB.emr.filter(e => e.patientName === patientName).map(e => `
                                <div class="p-2 bg-slate-50 text-xs border rounded">
                                    <span class="font-bold text-brand-info">${e.type}:</span> ${e.notes}
                                </div>
                            `).join('') || '<p class="text-xs text-slate-400">لا يوجد سجلات.</p>'}
                        </div>
                    </div>
                </div>
            `
        });

        // 2. إضافة دوال التحكم (App Logic)
        Object.assign(window.App, {
            
            // --- دوال الطبيب ---
            completeAppointment: function(id) {
                const appt = DB.appointments.find(a => a.id === id);
                if (appt) {
                    appt.status = 'completed';
                    saveDB();
                    this.toast('تم إنهاء الكشف بنجاح!', 'success');
                    this.navigate('doctorDashboard'); // تحديث الصفحة
                }
            },

            openEMRModal: function(patientName) {
                document.getElementById('modal-content').innerHTML = window.Views.doctorEMR(patientName);
                document.getElementById('modal-container').classList.remove('hidden');
            },

            saveEMR: function(e, patientName) {
                const type = document.getElementById('emr-type').value;
                const notes = document.getElementById('emr-notes').value;
                
                const newRecord = {
                    id: 'E' + Date.now(),
                    patientName: patientName,
                    docName: this.state.user.name, // اسم الطبيب الحالي
                    date: new Date().toISOString().split('T')[0],
                    type: type,
                    notes: sanitize(notes)
                };

                DB.emr.push(newRecord);
                saveDB();
                
                this.toast('تم حفظ السجل الطبي بنجاح!', 'success');
                this.openEMRModal(patientName); // تحديث المودال
            },

            // --- دوال الإدارة ---
            adminTab: function(tab) {
                document.querySelectorAll('.admin-content').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.admin-tab').forEach(el => el.classList.remove('bg-brand-primary', 'text-white'));
                
                document.getElementById(`admin-content-${tab}`).classList.remove('hidden');
                document.getElementById(`tab-${tab}`).classList.add('bg-brand-primary', 'text-white');
            },

            adminAddDoctor: function() {
                const name = prompt("اسم الطبيب:");
                if(!name) return;
                const spec = prompt("التخصص:");
                const fee = prompt("سعر العيادة:");
                const homeFee = prompt("سعر الكشف المنزلي:");
                
                DB.doctors.push({ 
                    id: 'd'+Date.now(), name: sanitize(name), spec: sanitize(spec), 
                    fee: Number(fee), homeFee: Number(homeFee), 
                    area: 'وسط المدينة', ins: 'GlobeMed', 
                    slots: ['09:00', '10:00', '11:00'], rating: 5.0, img: '👨‍⚕️' 
                });
                saveDB();
                this.navigate('adminDashboard');
                this.adminTab('docs');
                this.toast('تمت إضافة الطبيب', 'success');
            },

            adminDeleteDoctor: function(id) {
                if(confirm("تأكيد حذف الطبيب؟")) {
                    DB.doctors = DB.doctors.filter(d => d.id !== id);
                    saveDB();
                    this.navigate('adminDashboard');
                    this.adminTab('docs');
                }
            },

            adminAddService: function() {
                const name = prompt("اسم الخدمة:");
                if(!name) return;
                const price = prompt("سعر الخدمة:");
                
                DB.services.push({ 
                    id: 's'+Date.now(), cat: 'nursing', 
                    name: sanitize(name), price: Number(price), 
                    desc: 'خدمة مضافة حديثاً' 
                });
                saveDB();
                this.navigate('adminDashboard');
                this.adminTab('servs');
                this.toast('تمت إضافة الخدمة', 'success');
            },

            adminDeleteService: function(id) {
                if(confirm("تأكيد حذف الخدمة؟")) {
                    DB.services = DB.services.filter(s => s.id !== id);
                    saveDB();
                    this.navigate('adminDashboard');
                    this.adminTab('servs');
                }
            }
        });
        
        console.log("🎉 Wasla MVP Fully Loaded & Ready!");
    </script>
</body>
</html>
</body>
</html>
