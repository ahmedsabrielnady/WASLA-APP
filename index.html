<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>وصلة | منصة الرعاية الصحية المتكاملة</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { primary: '#0A8754', 'primary-dark': '#076B42', 'primary-light': '#E6F4ED', secondary: '#0B1120', accent: '#D97706', danger: '#E11D48', info: '#0284C7' },
                        surface: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0' }
                    },
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'fade-in-up': 'fadeInUp 0.4s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        fadeInUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .glass-dark { background: rgba(11, 17, 32, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.15); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #0A8754; border-radius: 4px; }
        .sidebar-link.active { background-color: #0A8754; color: white; border-right: 4px solid #F59E0B; }
        .sidebar-link:hover:not(.active) { background-color: #E6F4ED; color: #0A8754; }
        .modal-overlay { background: rgba(11, 17, 32, 0.7); backdrop-filter: blur(4px); }
        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 9999px; font-weight: 700; }
        .status-confirmed { background: #D1FAE5; color: #065F46; }
        .status-completed { background: #DBEAFE; color: #1E40AF; }
        .status-cancelled { background: #FEE2E2; color: #991B1B; }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- ================= LOADING SCREEN ================= -->
    <div id="loading-screen" class="fixed inset-0 z-[9999] bg-brand-secondary flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-20 h-20 bg-brand-primary text-white rounded-3xl flex items-center justify-center text-4xl shadow-2xl animate-pulse mb-4">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <h1 class="text-3xl font-black text-white mb-2">وَصْلَة</h1>
        <p class="text-sm text-slate-400 font-bold">جاري تحميل النظام الشامل...</p>
    </div>

    <!-- ================= HEADER ================= -->
    <header id="main-header" class="glass-dark text-white sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="App.navigate('landing')">
                <div class="bg-brand-primary p-2 rounded-xl text-xl"><i class="fa-solid fa-heart-pulse"></i></div>
                <div>
                    <h1 class="text-xl font-black">وَصْلَة</h1>
                    <p class="text-[9px] text-brand-primary font-bold">SMART HEALTH</p>
                </div>
            </div>

            <nav id="desktop-nav" class="hidden lg:flex items-center gap-1"></nav>

            <div class="flex items-center gap-2">
                <button onclick="App.navigate('login')" id="btn-login" class="text-xs font-bold hover:text-brand-primary transition"><i class="fa-regular fa-user ml-1"></i> دخول</button>
                <button onclick="App.navigate('register')" id="btn-register" class="bg-brand-primary px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-brand-primary-dark transition"><i class="fa-solid fa-user-plus ml-1"></i> حساب جديد</button>
                <button onclick="App.logout()" id="btn-logout" class="hidden bg-red-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-700 transition"><i class="fa-solid fa-power-off ml-1"></i> خروج</button>
                <button onclick="App.toggleCart()" class="relative text-white p-2"><i class="fa-solid fa-cart-shopping"></i><span id="cart-badge" class="absolute top-0 right-0 bg-red-500 text-[9px] rounded-full px-1 hidden">0</span></button>
            </div>
        </div>
    </header>

    <!-- ================= MAIN CONTAINER ================= -->
    <main id="app-container" class="flex-grow w-full max-w-7xl mx-auto px-4 py-6"></main>

    <!-- ================= FOOTER ================= -->
    <footer class="bg-brand-secondary text-slate-400 py-8 border-t border-slate-800 text-center text-xs mt-auto">
        <p class="font-bold text-white mb-2">منصة وصلة للرعاية الصحية الذكية</p>
        <p>© 2026 جميع الحقوق محفوظة.</p>
    </footer>

    <!-- ================= CART SIDEBAR ================= -->
    <div id="cart-sidebar" class="fixed top-0 left-0 h-full w-80 bg-white z-[200] shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 bg-brand-dark text-white flex justify-between items-center">
            <h3 class="font-black"><i class="fa-solid fa-cart-shopping ml-2"></i> سلة المشتريات</h3>
            <button onclick="App.toggleCart()" class="text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items" class="flex-grow p-4 overflow-y-auto space-y-3"></div>
        <div class="p-4 border-t bg-slate-50">
            <div class="flex justify-between font-black mb-3"><span>الإجمالي:</span><span id="cart-total" class="text-brand-primary">0 ج.م</span></div>
            <button onclick="App.checkout()" class="w-full bg-brand-primary text-white py-2 rounded-xl font-bold hover:bg-brand-primary-dark">إتمام الطلب (واتساب)</button>
        </div>
    </div>

    <!-- ================= MODALS ================= -->
    <div id="modal-container" class="fixed inset-0 modal-overlay z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto relative animate-fade-in-up custom-scrollbar">
            <button onclick="App.closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-red-500 z-10 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div id="modal-content" class="p-6"></div>
        </div>
    </div>

    <!-- ================= TOASTS ================= -->
    <div id="toast-container" class="fixed bottom-4 left-4 z-[400] space-y-2"></div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // ==========================================
        // 1. DATABASE (LocalStorage + Supabase Ready)
        // ==========================================
        const DB = {
            // Seed Data
            doctors: [
                { id: 'd1', name: 'د. أحمد الشريف', spec: 'باطنة وسكر', fee: 250, waslaFee: 220, area: 'وسط المدينة', ins: 'GlobeMed', slots: ['09:00', '10:00', '11:00'], rating: 4.8 },
                { id: 'd2', name: 'د. سارة عبد الرحمن', spec: 'أطفال', fee: 200, waslaFee: 180, area: 'الشرقية', ins: 'MetLife', slots: ['14:00', '15:00', '16:00'], rating: 4.9 },
                { id: 'd3', name: 'د. محمد فؤاد', spec: 'عظام', fee: 300, waslaFee: 260, area: 'الغربية', ins: 'AXA', slots: ['11:00', '12:00'], rating: 4.7 },
                { id: 'd4', name: 'د. هدى مصطفى', spec: 'نساء وتوليد', fee: 280, waslaFee: 240, area: 'وسط المدينة', ins: 'MedRight', slots: ['13:00', '14:00'], rating: 4.9 },
                { id: 'd5', name: 'د. كريم حسن', spec: 'أنف وأذن', fee: 220, waslaFee: 190, area: 'الشمالية', ins: 'Allianz', slots: ['10:00', '11:00'], rating: 4.6 },
                { id: 'd6', name: 'د. ليلى إبراهيم', spec: 'جلدية وتجميل', fee: 350, waslaFee: 300, area: 'وسط المدينة', ins: 'Bupa', slots: ['12:00', '13:00'], rating: 4.9 }
            ],
            services: [
                { id: 's1', cat: 'nursing', name: 'تمريض منزلي - حقن', price: 150, desc: 'زيارة ممرض معتمد.' },
                { id: 's2', cat: 'nursing', name: 'رعاية كبار السن', price: 300, desc: 'رعاية شاملة بالمنزل.' },
                { id: 's3', cat: 'home_visit', name: 'كشف منزلي - باطنة', price: 400, desc: 'زيارة طبيب للمنزل.' },
                { id: 's4', cat: 'ambulance', name: 'إسعاف طارئ', price: 500, desc: 'استجابة سريعة 24/7.' }
            ],
            supplies: [
                { id: 'm1', name: 'جهاز قياس ضغط', price: 450, cat: 'أجهزة', icon: '🩺' },
                { id: 'm2', name: 'جهاز قياس سكر', price: 300, cat: 'أجهزة', icon: '💉' },
                { id: 'm3', name: 'كمامات طبية (50)', price: 80, cat: 'مستلزمات', icon: '😷' },
                { id: 'm4', name: 'بانادول إكسترا', price: 35, cat: 'أدوية', icon: '💊' }
            ],
            insurance: ['GlobeMed', 'MetLife', 'MedRight', 'AXA', 'Bupa', 'Allianz', 'Nextcare'],
            appointments: [],
            emr: [],
            users: []
        };

        // Persistence Helper
        const Store = {
            save(key, data) { localStorage.setItem(`wasla_${key}`, JSON.stringify(data)); DB[key] = data; },
            load(key) { const d = localStorage.getItem(`wasla_${key}`); if(d) DB[key] = JSON.parse(d); }
        };

        // Load Data
        Store.load('appointments');
        Store.load('emr');
        Store.load('doctors');
        Store.load('users');

        // Seed if empty
        if(DB.appointments.length === 0) {
            DB.appointments.push(
                { id: 'A1', patient: 'محمود علي', phone: '01011112222', docId: 'd1', docName: 'د. أحمد الشريف', date: '2026-10-22', time: '10:00', status: 'confirmed', amount: 220 },
                { id: 'A2', patient: 'سعيد حسن', phone: '01033334444', docId: 'd2', docName: 'د. سارة عبد الرحمن', date: '2026-10-22', time: '14:00', status: 'completed', amount: 180 }
            );
            Store.save('appointments', DB.appointments);
        }

        // ==========================================
        // 2. CORE APP
        // ==========================================
        const App = {
            state: {
                user: JSON.parse(localStorage.getItem('wasla_user')) || null,
                cart: [],
                currentView: 'landing'
            },

            init() {
                this.updateHeader();
                this.navigate('landing');
                // Hide loader safely
                setTimeout(() => {
                    const loader = document.getElementById('loading-screen');
                    if(loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.style.display = 'none', 500);
                    }
                }, 800);
            },

            navigate(view, params = {}) {
                this.state.currentView = view;
                const container = document.getElementById('app-container');
                container.innerHTML = ''; 

                // Protect Routes
                if(['portal', 'doctor_dash', 'admin_dash'].includes(view) && !this.state.user) {
                    this.toast('يجب تسجيل الدخول أولاً', 'warning');
                    return this.navigate('login');
                }

                switch (view) {
                    case 'landing': container.innerHTML = Views.landing(); break;
                    case 'login': container.innerHTML = Views.login(); break;
                    case 'register': container.innerHTML = Views.register(); break;
                    case 'doctors': container.innerHTML = Views.doctors(); break;
                    case 'services': container.innerHTML = Views.services(); break;
                    case 'supplies': container.innerHTML = Views.supplies(); break;
                    case 'portal': container.innerHTML = Views.patientPortal(); break;
                    case 'doctor_dash': container.innerHTML = Views.doctorDashboard(); break;
                    case 'admin_dash': container.innerHTML = Views.adminDashboard(); break;
                    default: container.innerHTML = Views.landing();
                }
                window.scrollTo(0, 0);
            },

            updateHeader() {
                const u = this.state.user;
                const btnLogin = document.getElementById('btn-login');
                const btnReg = document.getElementById('btn-register');
                const btnLogout = document.getElementById('btn-logout');
                const nav = document.getElementById('desktop-nav');

                if (u) {
                    btnLogin.classList.add('hidden');
                    btnReg.classList.add('hidden');
                    btnLogout.classList.remove('hidden');
                    
                    if (u.role === 'patient') {
                        nav.innerHTML = `
                            <button onclick="App.navigate('landing')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">الرئيسية</button>
                            <button onclick="App.navigate('doctors')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">احجز طبيب</button>
                            <button onclick="App.navigate('services')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">خدمات أخرى</button>
                            <button onclick="App.navigate('portal')" class="px-3 py-2 text-xs font-bold text-brand-primary hover:text-white"><i class="fa-solid fa-user-circle ml-1"></i> ملفي الطبي</button>
                        `;
                    } else if (u.role === 'doctor') {
                        nav.innerHTML = `<button onclick="App.navigate('doctor_dash')" class="px-3 py-2 text-xs font-bold text-brand-primary hover:text-white"><i class="fa-solid fa-user-doctor ml-1"></i> لوحة الطبيب</button>`;
                    } else if (u.role === 'admin') {
                        nav.innerHTML = `<button onclick="App.navigate('admin_dash')" class="px-3 py-2 text-xs font-bold text-brand-primary hover:text-white"><i class="fa-solid fa-shield-halved ml-1"></i> لوحة الإدارة</button>`;
                    }
                } else {
                    btnLogin.classList.remove('hidden');
                    btnReg.classList.remove('hidden');
                    btnLogout.classList.add('hidden');
                    nav.innerHTML = `
                        <button onclick="App.navigate('landing')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">الرئيسية</button>
                        <button onclick="App.navigate('doctors')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">الأطباء</button>
                        <button onclick="App.navigate('services')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">الخدمات</button>
                        <button onclick="App.navigate('supplies')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">المتجر</button>
                    `;
                }
            },

            toast(msg, type = 'info') {
                const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-brand-primary', warning: 'bg-amber-600' };
                const el = document.createElement('div');
                el.className = `${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-bold flex items-center gap-2 animate-fade-in-up`;
                el.innerHTML = `<i class="fa-solid fa-info-circle"></i> ${msg}`;
                document.getElementById('toast-container').appendChild(el);
                setTimeout(() => el.remove(), 3000);
            },

            openModal(html) {
                document.getElementById('modal-content').innerHTML = html;
                document.getElementById('modal-container').classList.remove('hidden');
            },
            closeModal() {
                document.getElementById('modal-container').classList.add('hidden');
            },

            // --- Auth ---
            login(email, pass) {
                // Mock Auth
                const user = { role: 'patient', name: 'أحمد محمود', id: 'P-1001', email: email };
                if (email.includes('doc')) user.role = 'doctor', user.name = 'د. أحمد الشريف', user.id = 'd1';
                if (email.includes('admin')) user.role = 'admin', user.name = 'مدير النظام', user.id = 'A-1';
                
                this.state.user = user;
                localStorage.setItem('wasla_user', JSON.stringify(user));
                this.updateHeader();
                this.toast('تم تسجيل الدخول بنجاح', 'success');
                
                if (user.role === 'patient') this.navigate('portal');
                if (user.role === 'doctor') this.navigate('doctor_dash');
                if (user.role === 'admin') this.navigate('admin_dash');
            },
            logout() {
                this.state.user = null;
                localStorage.removeItem('wasla_user');
                this.updateHeader();
                this.navigate('landing');
                this.toast('تم تسجيل الخروج', 'info');
            },

            // --- Cart ---
            toggleCart() { document.getElementById('cart-sidebar').classList.toggle('translate-x-full'); },
            addToCart(item) {
                const existing = this.state.cart.find(i => i.id === item.id);
                if (existing) existing.qty++;
                else this.state.cart.push({ ...item, qty: 1 });
                this.updateCartUI();
                this.toast('تمت الإضافة للسلة', 'success');
            },
            removeFromCart(id) {
                this.state.cart = this.state.cart.filter(i => i.id !== id);
                this.updateCartUI();
            },
            updateCartUI() {
                const badge = document.getElementById('cart-badge');
                const itemsEl = document.getElementById('cart-items');
                const totalEl = document.getElementById('cart-total');
                const count = this.state.cart.reduce((s, i) => s + i.qty, 0);
                const total = this.state.cart.reduce((s, i) => s + (i.price * i.qty), 0);

                if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
                else { badge.classList.add('hidden'); }

                totalEl.textContent = `${total} ج.م`;
                itemsEl.innerHTML = this.state.cart.map(i => `
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border">
                        <div><div class="font-bold text-xs">${i.name}</div><div class="text-brand-primary text-xs font-bold">${i.price} ج.م × ${i.qty}</div></div>
                        <button onclick="App.removeFromCart('${i.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('') || '<p class="text-center text-slate-400 text-sm">السلة فارغة</p>';
            },
            checkout() {
                if (this.state.cart.length === 0) return this.toast('السلة فارغة', 'warning');
                const text = this.state.cart.map(i => `- ${i.name} (${i.qty})`).join('\n');
                window.open(`https://wa.me/201000000000?text=طلب جديد من وصلة:\n${text}`, '_blank');
                this.state.cart = [];
                this.updateCartUI();
                this.toggleCart();
            },

            // --- Booking ---
            bookDoctor(docId) {
                const doc = DB.doctors.find(d => d.id === docId);
                this.openModal(`
                    <h2 class="text-xl font-black mb-2">حجز مع ${doc.name}</h2>
                    <p class="text-sm text-slate-500 mb-4">${doc.spec} - الكشف: <strong class="text-brand-primary">${doc.waslaFee} ج.م</strong></p>
                    <form onsubmit="App.confirmBook(event, '${doc.id}')" class="space-y-4">
                        <div><label class="block text-xs font-bold mb-1">التاريخ</label><input type="date" id="bk-date" required class="w-full p-2 border rounded-xl" min="${new Date().toISOString().split('T')[0]}"></div>
                        <div><label class="block text-xs font-bold mb-1">الوقت</label><select id="bk-time" required class="w-full p-2 border rounded-xl">${doc.slots.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div>
                        <div><label class="block text-xs font-bold mb-1">اسم المريض</label><input type="text" id="bk-name" required class="w-full p-2 border rounded-xl" placeholder="الاسم بالكامل" value="${this.state.user ? this.state.user.name : ''}"></div>
                        <div><label class="block text-xs font-bold mb-1">رقم الهاتف (واتساب)</label><input type="tel" id="bk-phone" required class="w-full p-2 border rounded-xl" placeholder="01xxxxxxxxx"></div>
                        <button type="submit" class="w-full bg-brand-primary text-white py-3 rounded-xl font-bold">تأكيد الحجز وإرسال واتساب</button>
                    </form>
                `);
            },
            confirmBook(e, docId) {
                e.preventDefault();
                const doc = DB.doctors.find(d => d.id === docId);
                const name = document.getElementById('bk-name').value;
                const date = document.getElementById('bk-date').value;
                const time = document.getElementById('bk-time').value;
                const phone = document.getElementById('bk-phone').value;
                
                const newAppt = { id: 'A'+Date.now(), patient: name, phone, docId: doc.id, docName: doc.name, date, time, status: 'confirmed', amount: doc.waslaFee };
                DB.appointments.push(newAppt);
                Store.save('appointments', DB.appointments);
                
                this.closeModal();
                this.toast('تم تأكيد الحجز بنجاح!', 'success');
                
                const msg = `تذكرة حجز - وصلة\nالطبيب: ${doc.name}\nالمريض: ${name}\nالتاريخ: ${date} - ${time}\nالمبلغ: ${doc.waslaFee} ج.م`;
                window.open(`https://wa.me/201000000000?text=${encodeURIComponent(msg)}`, '_blank');
            }
        };

        // ==========================================
        // 3. VIEWS
        // ==========================================
        const Views = {
            landing: () => `
                <div class="bg-brand-secondary rounded-3xl p-8 sm:p-12 text-white mb-8 relative overflow-hidden text-center">
                    <div class="relative z-10">
                        <h1 class="text-3xl sm:text-5xl font-black mb-4">كل احتياجاتك الصحية<br><span class="text-brand-primary">في مكان واحد.</span></h1>
                        <p class="text-sm sm:text-base text-slate-300 max-w-2xl mx-auto mb-8">احجز مع أفضل الأطباء، اطلب تمريض منزلي، اشتر مستلزماتك الطبية، وتابع ملفك الطبي بسهولة وأمان.</p>
                        <div class="flex flex-wrap justify-center gap-3">
                            <button onclick="App.navigate('doctors')" class="bg-brand-primary px-6 py-3 rounded-xl font-bold hover:scale-105 transition shadow-lg shadow-brand-primary/30"><i class="fa-solid fa-calendar-check ml-2"></i> احجز موعد</button>
                            <button onclick="App.navigate('services')" class="bg-white/10 border border-white/20 px-6 py-3 rounded-xl font-bold hover:bg-white/20 transition"><i class="fa-solid fa-house-medical ml-2"></i> خدمات المنزل</button>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
