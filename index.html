<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>منصة وصلة | WASLA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* ==========================================================================
     WASLA DESIGN SYSTEM (CSS Variables)
     ========================================================================== */
  :root {
    --primary: #0B1220; --primary-light: #1E293B;
    --emerald: #059669; --emerald-light: #ECFDF5;
    --amber: #EA580C; --amber-light: #FFF7ED;
    --sky: #0284C7; --sky-light: #F0F9FF;
    --danger: #E11D48; --danger-light: #FFF1F2;
    --gold: #D97706; --gold-light: #FEF3C7;
    --indigo: #3730A3; --indigo-light: #EEF2FF;
    --gray: #64748B; --gray-light: #F8FAFC;
    --line: #E2E8F0; --bg: #F4F6FB;
    --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg); color: var(--primary); margin: 0; padding-bottom: 80px; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--gray); border-radius: 10px; }

  /* Header */
  .app-header { position: sticky; top: 0; z-index: 100; background: rgba(11,18,32,0.98); backdrop-filter: blur(10px); color: #fff; padding: 10px 16px; box-shadow: var(--shadow-md); }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--emerald), #10B981); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 12px rgba(5,150,105,0.4); }
  .brand-title { font-size: 19px; font-weight: 900; margin: 0; line-height: 1; }
  .brand-title span { font-size: 9px; color: #34D399; background: rgba(52,211,153,0.15); padding: 2px 6px; border-radius: 6px; margin-right: 4px; }
  
  .header-actions { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .header-actions::-webkit-scrollbar { display: none; }
  .btn-ui { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; font-family: inherit; transition: 0.2s; }
  .btn-ui:active { transform: scale(0.95); }
  .btn-ui.primary { background: var(--emerald); border: none; }
  
  /* Tabs */
  .super-tabs { display: flex; gap: 8px; padding: 12px; overflow-x: auto; scrollbar-width: none; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 60px; z-index: 99; }
  .super-tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 900; color: var(--gray); background: var(--gray-light); border: 1px solid var(--line); white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; font-family: inherit; }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }

  /* Layout */
  .page-container { max-width: 800px; margin: 0 auto; padding: 16px; }
  .view-section { display: none; animation: fadeUp 0.4s ease; }
  .view-section.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  
  .card { background: #fff; border-radius: var(--radius-md); border: 1px solid var(--line); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
  .section-title { font-size: 18px; font-weight: 900; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
  
  .item-box { background: #FAFCFE; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
  .item-icon { width: 48px; height: 48px; border-radius: var(--radius-sm); background: var(--emerald-light); color: var(--emerald); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .item-info { flex: 1; }
  .item-title { font-weight: 900; font-size: 14px; margin: 0 0 4px; color: var(--primary); }
  .item-sub { font-size: 11px; color: var(--gray); font-weight: 700; margin: 0; }
  .item-price { font-weight: 900; color: var(--emerald); font-size: 15px; }
  
  .btn-action { background: var(--emerald); color: #fff; border: none; padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 900; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; transition: 0.2s; }
  .btn-action:active { transform: scale(0.98); }
  .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--emerald); border: 2px solid var(--emerald); }
  
  .input-field { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; background: var(--gray-light); margin-bottom: 12px; font-family: inherit; color: var(--primary); }
  .input-field:focus { outline: none; border-color: var(--emerald); background: #fff; box-shadow: 0 0 0 4px var(--emerald-light); }

  .chip { padding: 8px 14px; border-radius: 99px; font-size: 12px; font-weight: 800; background: #fff; color: var(--gray); border: 1.5px solid var(--line); cursor: pointer; font-family: inherit; transition: 0.2s; }
  .chip.active { background: var(--emerald); color: #fff; border-color: var(--emerald); }

  .search-wrap { position: relative; }
  .search-wrap i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 14px; }
  .search-wrap .input-field { padding-right: 40px; margin: 0; }

  /* Modals & Sheets */
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: 0.3s; }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: #fff; border-radius: var(--radius-lg) var(--radius-lg) 0 0; z-index: 201; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
  .bottom-sheet.open { bottom: 0; }
  .sheet-header { padding: 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .sheet-body { padding: 20px; overflow-y: auto; flex: 1; }
  .sheet-footer { padding: 20px; border-top: 1px solid var(--line); background: var(--gray-light); }
  
  .modal-wrap { position: fixed; inset: 0; background: rgba(11,18,32,0.85); backdrop-filter: blur(4px); z-index: 300; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-wrap.open { display: flex; }
  .modal-box { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 480px; padding: 24px; position: relative; max-height: 90vh; overflow-y: auto; }
  .modal-close { position: absolute; top: 16px; left: 16px; background: var(--gray-light); border: none; width: 32px; height: 32px; border-radius: var(--radius-sm); cursor: pointer; color: var(--gray); font-size: 16px; display: flex; align-items: center; justify-content: center; }
  
  #toast-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast-msg { background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 99px; font-size: 13px; font-weight: 900; box-shadow: var(--shadow-lg); border-right: 4px solid var(--emerald); animation: slideDown 0.3s; display: flex; align-items: center; gap: 8px; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

  .stepper { display: flex; justify-content: space-between; position: relative; padding: 10px 0; margin-top: 15px; }
  .stepper::before { content: ''; position: absolute; top: 24px; left: 10%; right: 10%; height: 3px; background: var(--line); z-index: 0; }
  .step { display: flex; flex-direction: column; align-items: center; z-index: 1; flex: 1; }
  .step-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--line); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-bottom: 6px; border: 3px solid #fff; }
  .step.active .step-icon { background: var(--emerald); }
  .step.current .step-icon { background: var(--amber); animation: pulse 1.5s infinite; }
  .step-label { font-size: 10px; font-weight: 900; color: var(--gray); text-align: center; }
  .step.active .step-label { color: var(--emerald); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(234,88,12,0.4); } 70% { box-shadow: 0 0 0 8px rgba(234,88,12,0); } 100% { box-shadow: 0 0 0 0 rgba(234,88,12,0); } }

  .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 16px; max-height: 200px; overflow-y: auto; padding: 4px; }
  .slot-option { display: block; padding: 10px; border-radius: 8px; border: 1.5px solid var(--line); text-align: center; cursor: pointer; font-size: 12px; font-weight: 900; background: #fff; }
  .slot-option.selected { background: var(--emerald); color: #fff; border-color: var(--emerald); }
  .slot-option input { display: none; }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></div>
      <div><h1 class="brand-title">وَصْلَة <span>WASLA</span></h1></div>
    </div>
    <div class="header-actions" id="header-actions"></div>
  </div>
</header>

<div class="super-tabs" id="super-tabs">
  <button class="tab active" data-sector="medical" onclick="router.navigate('medical')"><i class="fa-solid fa-stethoscope"></i> طبي</button>
  <button class="tab" data-sector="market" onclick="router.navigate('market')"><i class="fa-solid fa-cart-shopping"></i> تسوق</button>
  <button class="tab" data-sector="cars" onclick="router.navigate('cars')"><i class="fa-solid fa-car"></i> سيارات</button>
  <button class="tab" data-sector="home" onclick="router.navigate('home')"><i class="fa-solid fa-screwdriver-wrench"></i> صيانة</button>
</div>

<main class="page-container">
  <section class="view-section active" id="view-medical"></section>
  <section class="view-section" id="view-market"></section>
  <section class="view-section" id="view-cars"></section>
  <section class="view-section" id="view-home"></section>
  <section class="view-section" id="view-founder"></section>
  <section class="view-section" id="view-staff"></section>
  <section class="view-section" id="view-doctor"></section>
  <section class="view-section" id="view-dashboard"></section>
</main>

<!-- Modals -->
<div class="modal-wrap" id="modal-auth"><div class="modal-box" id="modal-auth-body"></div></div>
<div class="modal-wrap" id="modal-book"><div class="modal-box" id="modal-book-body"></div></div>
<div class="modal-wrap" id="modal-payment"><div class="modal-box" id="modal-payment-body"></div></div>
<div class="modal-wrap" id="modal-map"><div class="modal-box" id="modal-map-body"></div></div>

<div id="toast-box"></div>

<script>
/* ==========================================================================
   WASLA — PART 1: CORE + MEDICAL SECTOR
   ========================================================================== */

const Utils = {
  id: () => Math.random().toString(36).substring(2, 10),
  money: (num) => Number(num).toLocaleString('ar-EG') + ' ج.م',
  toast: (msg, isError = false) => {
    const el = document.createElement('div');
    el.className = 'toast-msg';
    el.style.borderRightColor = isError ? 'var(--danger)' : 'var(--emerald)';
    el.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${msg}`;
    document.getElementById('toast-box').appendChild(el);
    setTimeout(() => el.remove(), 3000);
  },
  openModal: (id) => document.getElementById(id).classList.add('open'),
  closeModal: (id) => document.getElementById(id).classList.remove('open')
};

/* Audio */
let audioCtx;
document.body.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

function playSound(isAlert = false) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = isAlert ? 'square' : 'sine';
    osc.frequency.setValueAtTime(isAlert ? 880 : 600, audioCtx.currentTime);
    if (isAlert) osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  } catch(e) {}
}

/* Database */
const DB_KEY = 'wasla_db_v1';
let DB = JSON.parse(localStorage.getItem(DB_KEY));

if (!DB) {
  DB = {
    users: [
      { id: 'u-f', phone: '01068990089', pass: 'As123789456*', name: 'أحمد صبري', role: 'founder', wallet: 500, waslaId: 'WASLA-00001' },
      { id: 'u-p1', phone: '01000000001', pass: '123456', name: 'محمد المريض', role: 'patient', wallet: 150, waslaId: 'WASLA-10001', emr: { blood: 'O+', allergies: ['بنسلين'], chronic: ['سكري'], vitals: [] } },
      { id: 'u-d1', phone: '01000000002', pass: '123456', name: 'د. محمد الشريف', role: 'doctor', wallet: 0, waslaId: 'WASLA-20001', doctorId: 'd1' },
      { id: 'u-s1', phone: '01000000003', pass: '123456', name: 'موظف الاستقبال', role: 'staff', wallet: 0, waslaId: 'WASLA-30001' }
    ],
    doctors: [
      { id: 'd1', name: 'د. محمد الشريف', spec: 'باطنة وكبد', price: 250, avgTime: 20, area: 'شارع بورسعيد', rating: 4.9, reviews: 212, services: ['سكر وضغط', 'مناظير', 'علاج كبد'], status: 'available', insurances: ['ins1', 'ins2'] },
      { id: 'd2', name: 'د. سارة أحمد', spec: 'أطفال وحديثي الولادة', price: 200, avgTime: 15, area: 'ميدان المحطة', rating: 4.8, reviews: 168, services: ['تطعيمات', 'حساسية صدر', 'متابعة نمو'], status: 'busy', insurances: ['ins1', 'ins3'] },
      { id: 'd3', name: 'د. كريم عبد العزيز', spec: 'قلب وأوعية دموية', price: 350, avgTime: 25, area: 'شارع المستشفى', rating: 4.9, reviews: 142, services: ['تخطيط قلب', 'ضغط الدم', 'ذبحة صدرية'], status: 'available', insurances: ['ins2'] },
      { id: 'd4', name: 'د. منى سالم', spec: 'نساء وتوليد', price: 300, avgTime: 20, area: 'ميدان المحطة', rating: 4.7, reviews: 189, services: ['متابعة حمل', 'مناظير نسائية'], status: 'available', insurances: ['ins1', 'ins3'] }
    ],
    insuranceCompanies: [
      { id: 'ins1', name: 'جلوب ميد (GlobeMed)', coverage: 80, logo: 'fa-shield-halved' },
      { id: 'ins2', name: 'ميتلايف (MetLife)', coverage: 85, logo: 'fa-shield' },
      { id: 'ins3', name: 'ميد رايت (MedRight)', coverage: 75, logo: 'fa-heart-pulse' }
    ],
    pharmacies: [
      { id: 'ph1', name: 'صيدلية النور', area: 'شارع بورسعيد', phone: '0133221111', insurances: ['ins1', 'ins2'], rating: 4.8, delivery: true },
      { id: 'ph2', name: 'صيدلية الشفاء', area: 'ميدان المحطة', phone: '0133221122', insurances: ['ins1', 'ins3'], rating: 4.6, delivery: true }
    ],
    nursingServices: [
      { id: 'ns1', name: 'حقن وريد ومحاليل', price: 250, icon: 'fa-syringe', desc: 'زيارة ممرض معتمد' },
      { id: 'ns2', name: 'غيار جروح وحروق', price: 300, icon: 'fa-bandage', desc: 'غيار معقم ومواد طبية' },
      { id: 'ns3', name: 'رعاية مسنين (ساعة)', price: 150, icon: 'fa-hand-holding-medical', desc: 'رعاية ومتابعة' },
      { id: 'ns4', name: 'سحب عينات تحاليل', price: 120, icon: 'fa-vial', desc: 'سحب منزلي' },
      { id: 'ns5', name: 'تحاليل شاملة', price: 500, icon: 'fa-flask', desc: 'باقة كاملة' }
    ],
    appointments: [], orders: [], notifications: [], cart: [], emrNotes: [], loyalty: {}
  };
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}
function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

/* Auth */
let Auth = {
  currentUser: JSON.parse(sessionStorage.getItem('wasla_session')) || null,
  login: (phone, pass) => {
    const user = DB.users.find(u => u.phone === phone && u.pass === pass);
    if (user) {
      Auth.currentUser = user;
      sessionStorage.setItem('wasla_session', JSON.stringify(user));
      UI.renderHeader();
      Utils.closeModal('modal-auth');
      Utils.toast('مرحباً بك ' + user.name);
      if (user.role === 'founder') router.navigate('founder');
      else if (user.role === 'staff') router.navigate('staff');
      else if (user.role === 'doctor') router.navigate('doctor');
      else router.navigate('medical');
      return true;
    }
    return false;
  },
  register: (name, phone, pass) => {
    if (DB.users.find(u => u.phone === phone)) return Utils.toast('الرقم مسجل بالفعل', true);
    const newId = 'u-' + Utils.id();
    const waslaId = 'WASLA-' + Math.floor(10000 + Math.random() * 90000);
    const newUser = { id: newId, phone, pass, name, role: 'patient', wallet: 0, waslaId, emr: { blood: 'غير محدد', allergies: [], chronic: [], vitals: [] } };
    DB.users.push(newUser); saveDB();
    Auth.currentUser = newUser;
    sessionStorage.setItem('wasla_session', JSON.stringify(newUser));
    UI.renderHeader(); Utils.closeModal('modal-auth'); Utils.toast('تم إنشاء الحساب. رقمك: ' + waslaId);
    router.navigate('medical');
  },
  logout: () => {
    Auth.currentUser = null;
    sessionStorage.removeItem('wasla_session');
    UI.renderHeader(); router.navigate('medical'); Utils.toast('تم تسجيل الخروج');
  }
};

/* Notifier */
let Notifier = {
  push: (userId, text, isAlert = false) => {
    DB.notifications.unshift({ id: Utils.id(), userId, text, read: false, ts: Date.now() });
    saveDB();
    if (Auth.currentUser && Auth.currentUser.id === userId) {
      UI.renderHeader(); playSound(isAlert); Utils.toast(text);
    }
  }
};

/* UI */
const UI = {
  renderHeader: () => {
    const actions = document.getElementById('header-actions');
    if (!Auth.currentUser) {
      actions.innerHTML = `<button class="btn-ui primary" onclick="AuthUI.open()"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>`;
      return;
    }
    const isFounder = Auth.currentUser.role === 'founder';
    const isStaff = Auth.currentUser.role === 'staff';
    const isDoctor = Auth.currentUser.role === 'doctor';
    const myNotifs = DB.notifications.filter(n => n.userId === Auth.currentUser.id && !n.read);
    actions.innerHTML = `
      <div style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); padding:6px 10px; border-radius:10px; cursor:pointer;" onclick="router.navigate('${isFounder?'founder':isStaff?'staff':isDoctor?'doctor':'dashboard'}')">
        <div style="width:24px; height:24px; border-radius:50%; background:var(--emerald); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px;">${Auth.currentUser.name[0]}</div>
        <div style="font-size:11px; font-weight:900; color:#fff;">${Auth.currentUser.name.split(' ')[0]}</div>
        <div style="font-size:10px; color:#34D399; font-weight:800;">${Auth.currentUser.wallet || 0} ج.م</div>
      </div>
      ${isFounder ? `<button class="btn-ui" style="background:linear-gradient(135deg,var(--gold),var(--amber)); border:none;" onclick="router.navigate('founder')"><i class="fa-solid fa-crown"></i> لوحة التحكم</button>` : ''}
      <button class="btn-ui" onclick="Notifier.openPanel(event)" style="position:relative;">
        <i class="fa-solid fa-bell"></i>
        ${myNotifs.length > 0 ? `<span style="position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; width:16px; height:16px; border-radius:50%; font-size:9px; font-weight:900; display:flex; align-items:center; justify-content:center;">${myNotifs.length}</span>` : ''}
      </button>
      <button class="btn-ui primary" onclick="cart.toggle()" style="position:relative;">
        <i class="fa-solid fa-cart-shopping"></i>
        ${DB.cart.length > 0 ? `<span style="position:absolute; top:-4px; right:-4px; background:#fff; color:var(--emerald); width:16px; height:16px; border-radius:50%; font-size:9px; font-weight:900; display:flex; align-items:center; justify-content:center;">${DB.cart.length}</span>` : ''}
      </button>
      <button class="btn-ui" onclick="Auth.logout()" style="color:#94A3B8;"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    `;

    document.querySelectorAll('.tab.dynamic').forEach(t => t.remove());
    const tabs = document.getElementById('super-tabs');
    if (isStaff) tabs.insertAdjacentHTML('beforeend', `<button class="tab dynamic" data-sector="staff" onclick="router.navigate('staff')"><i class="fa-solid fa-headset"></i> الطابور</button>`);
    if (isDoctor) tabs.insertAdjacentHTML('beforeend', `<button class="tab dynamic" data-sector="doctor" onclick="router.navigate('doctor')"><i class="fa-solid fa-user-md"></i> بوابة الطبيب</button>`);
    if (isFounder) tabs.insertAdjacentHTML('beforeend', `<button class="tab dynamic" data-sector="founder" onclick="router.navigate('founder')"><i class="fa-solid fa-crown"></i> لوحة المؤسس</button>`);
    tabs.insertAdjacentHTML('beforeend', `<button class="tab dynamic" data-sector="dashboard" onclick="router.navigate('dashboard')"><i class="fa-solid fa-user"></i> حسابي</button>`);
  }
};

Notifier.openPanel = (e) => {
  if (e) e.stopPropagation();
  if (!Auth.currentUser) return AuthUI.open();
  const my = DB.notifications.filter(n => n.userId === Auth.currentUser.id);
  let html = `<button class="modal-close" onclick="Utils.closeModal('modal-map')"><i class="fa-solid fa-xmark"></i></button><h3 style="font-weight:900; margin:0 0 16px;">الإشعارات</h3>`;

      <div style="font-size:13px; font-weight:700;">${n.text}</div>

/* Router */
const router = {
  navigate: (sector) => {
    document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    let view = document.getElementById('view-' + sector);
    if (!view) {
      view = document.createElement('section');
      view.id = 'view-' + sector;
      view.className = 'view-section';
      document.querySelector('main').appendChild(view);
    }
    view.classList.add('active');
    const tab = document.querySelector(`.tab[data-sector="${sector}"]`);
    if (tab) tab.classList.add('active');

    const views = {
      medical: Views.medical, market: Views.market, cars: Views.cars, home: Views.home,
      founder: Views.founder, staff: Views.staff, doctor: Views.doctor, dashboard: Views.dashboard
    };
    if (views[sector]) views[sector]();
    window.scrollTo(0,0);
  }
};

  },
  render: () => {
    const body = document.getElementById('cart-body');

      document.getElementById('cart-total').innerText = '0 ج.م';
      return;
    }
    body.innerHTML = DB.cart.map(item => `

    `).join('');
    const total = DB.cart.reduce((s,i) => s + i.price, 0);
    document.getElementById('cart-total').innerText = Utils.money(total);

    if (!Auth.currentUser) { Utils.toast('سجل دخول أولاً', true); return AuthUI.open(); }
    if (!DB.cart.length) return;
    const total = DB.cart.reduce((s,i) => s + i.price, 0);
    document.getElementById('modal-payment-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-payment')"><i class="fa-solid fa-xmark"></i></button>
      <div style="text-align:center; margin-bottom:20px;">
        <div style="width:64px; height:64px; background:var(--emerald-light); color:var(--emerald); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 12px;"><i class="fa-solid fa-credit-card"></i></div>
        <h3 style="margin:0 0 4px; font-weight:900;">بوابة الدفع</h3>
        <p style="color:var(--gray); font-size:13px; font-weight:700;">المبلغ المطلوب: ${Utils.money(total)}</p>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">
        <label style="border:2px solid var(--emerald); background:var(--emerald-light); padding:14px; border-radius:10px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <input type="radio" name="pay" value="cash" checked>
          <div style="flex:1; font-weight:900; font-size:13px;">💵 الدفع عند الاستلام</div>
        </label>
        <label style="border:1.5px solid var(--line); padding:14px; border-radius:10px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <input type="radio" name="pay" value="instapay">
          <div style="flex:1; font-weight:900; font-size:13px;">🏦 إنستاباي (InstaPay)</div>
        </label>
        <label style="border:1.5px solid var(--line); padding:14px; border-radius:10px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <input type="radio" name="pay" value="wallet">
          <div style="flex:1; font-weight:900; font-size:13px;">📱 محفظة إلكترونية</div>
        </label>
      </div>
      <button onclick="cart.processPayment(${total})" class="btn-action" style="width:100%; padding:16px; font-size:16px;">تأكيد ودفع</button>
    `;
    Utils.openModal('modal-payment');
  },
  processPayment: (total) => {
    const cashback = Math.round(total * 0.05);
    Auth.currentUser.wallet = (Auth.currentUser.wallet || 0) + cashback;
    const uIdx = DB.users.findIndex(u => u.id === Auth.currentUser.id);
    DB.users[uIdx] = Auth.currentUser;
    sessionStorage.setItem('wasla_session', JSON.stringify(Auth.currentUser));

    DB.cart.forEach(item => {
      DB.orders.push({
        id: Utils.id(), userId: Auth.currentUser.id,
        title: item.title, price: item.price,
        status: 'preparing', ts: Date.now()

    });

    saveDB();
    Utils.closeModal('modal-payment'); cart.toggle(); UI.renderHeader();
    Utils.toast(`تم الدفع! كاش باك ${cashback} ج.م`);
    router.navigate('dashboard');
  }
};

    const slots = [];
    for (let i = 0; i < 8; i++) {
      const totalMin = 17 * 60 + i * doc.avgTime;
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      const period = h >= 12 ? 'م' : 'ص';
      const h12 = h > 12 ? h - 12 : h;
      slots.push(`${h12}:${m.toString().padStart(2, '0')} ${period}`);

      </div>

      <div id="insurance-select-wrap" style="display:none; margin-bottom:16px;">
        <select id="insurance-select" class="input-field" onchange="MedicalModule.updatePrice('${doc.id}')">
          ${DB.insuranceCompanies.filter(i => doc.insurances.includes(i.id)).map(ins => 
            `<option value="${ins.id}">${ins.name} (تغطية ${ins.coverage}%)</option>`
          ).join('')}
        </select>
      </div>

      <div id="price-display" style="background:var(--gray-light); padding:14px; border-radius:10px; margin-bottom:16px; text-align:center;">
        <div style="font-size:11px; color:var(--gray); font-weight:700;">المبلغ المستحق</div>

          </label>
        `).join('')}

    document.querySelectorAll('.slot-option').forEach(o => o.classList.remove('selected'));

    const doc = DB.doctors.find(d => d.id === docId);

                  <p style="margin:4px 0 0; font-size:12px; color:var(--gray); font-weight:700;">${appt.slot}</p>
                </div>
                <span style="font-size:11px; font-weight:900; padding:4px 10px; border-radius:6px; background:${appt.status==='next'?'#FEF3C7':'var(--sky-light)'}; color:${appt.status==='next'?'#92400E':'var(--sky)'};">
                  ${appt.status==='next'?'دورك الآن':'في الانتظار'}
                </span>
              </div>
              ${appt.status === 'waiting' 
                ? `<div style="background:var(--gray-light); padding:14px; border-radius:10px; text-align:center; font-weight:900; font-size:14px;">
                    ${ahead > 0 ? `فاضل عليك ${ahead} حالات` : 'أنت التالي'}
                  </div>`
                : `<div style="background:var(--amber-light); padding:14px; border-radius:10px; text-align:center; font-weight:900; color:#9A3412; font-size:14px;">
                    🚨 توجه للطبيب الآن
                  </div>`
              }
            </div>
          `;
        }).join('')}
      </div>
    ` : '';

    document.getElementById('view-dashboard').innerHTML = `
      ${queueSection}
      
      <div class="card" style="background:linear-gradient(135deg, var(--emerald-light), #D1FAE5); border-color:#A7F3D0;">
        <h2 style="margin:0 0 4px; font-weight:900; color:#047857;">أهلاً ${Auth.currentUser.name}</h2>
        <p style="margin:0; font-size:12px; font-weight:700; color:#065F46;">رقمك التعريفي: ${Auth.currentUser.waslaId}</p>
        <div style="margin-top:12px; background:#fff; padding:8px 16px; border-radius:99px; display:inline-block; font-weight:900; color:var(--emerald);">
          <i class="fa-solid fa-wallet"></i> ${Utils.money(Auth.currentUser.wallet || 0)}
        </div>
      </div>

      <h3 class="section-title"><i class="fa-solid fa-calendar-check" style="color:var(--emerald);"></i> مواعيدي (${myAppts.length})</h3>
      <div class="grid-list">
        ${myAppts.slice(0, 5).map(a => `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:12px;">
            <div>
              <h4 style="margin:0; font-weight:900; font-size:13px;">${a.doctorName}</h4>
              <p style="margin:4px 0 0; font-size:11px; color:var(--gray);">${a.slot} • ${a.price} ج.م</p>
            </div>
            <span style="font-size:10px; padding:4px 10px; border-radius:6px; background:${a.status==='completed'?'var(--emerald-light)':'var(--gray-light)'}; color:${a.status==='completed'?'var(--emerald)':'var(--gray)'}; font-weight:900;">
              ${a.status==='completed'?'مكتمل':a.status==='next'?'دورك':'انتظار'}
            </span>
          </div>
        `).join('') || '<p style="font-size:12px; color:var(--gray); text-align:center;">لا مواعيد</p>'}
      </div>

      <h3 class="section-title"><i class="fa-solid fa-box" style="color:var(--sky);"></i> طلباتي (${myOrders.length})</h3>
      <div class="grid-list">
        ${myOrders.slice(0, 3).map(o => {
          const stages = ['preparing', 'on_way', 'delivered'];
          const labels = { preparing: 'جاري التجهيز', on_way: 'في الطريق', delivered: 'تم التسليم' };
          const idx = stages.indexOf(o.status);
          return `
            <div class="card" style="padding:14px;">
              <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <div style="font-weight:900; font-size:13px;">${o.title}</div>
                <div style="font-weight:900; color:var(--emerald);">${Utils.money(o.price)}</div>
              </div>
              <div class="stepper" style="margin:0;">
                ${stages.map((s, i) => `
                  <div class="step ${i <= idx ? 'active' : ''} ${i === idx && s !== 'delivered' ? 'current' : ''}">
                    <div class="step-icon"><i class="fa-solid fa-check"></i></div>
                    <div class="step-label">${labels[s]}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('') || '<p style="font-size:12px; color:var(--gray); text-align:center;">لا طلبات</p>'}
      </div>

      <h3 class="section-title"><i class="fa-solid fa-notes-medical" style="color:var(--danger);"></i> الملف الطبي</h3>
      <div class="card grid-2">
        <div style="background:var(--danger-light); padding:14px; border-radius:10px; text-align:center;">
          <div style="font-size:10px; font-weight:900; color:var(--gray);">فصيلة الدم</div>
          <div style="font-size:20px; font-weight:900;">${emr.blood}</div>
        </div>
        <div style="background:var(--amber-light); padding:14px; border-radius:10px; text-align:center;">
          <div style="font-size:10px; font-weight:900; color:var(--gray);">حساسية</div>
          <div style="font-size:14px; font-weight:900;">${emr.allergies.join('، ') || 'لا يوجد'}</div>
        </div>
      </div>

      <h3 class="section-title"><i class="fa-solid fa-prescription" style="color:var(--emerald);"></i> الروشتات</h3>
      <div class="grid-list">
        ${DB.emrNotes.filter(n => n.patientId === Auth.currentUser.id).map(n => `
          <div class="card" style="padding:12px; border-right:4px solid var(--emerald);">
            <div style="font-size:10px; font-weight:900; color:var(--gray);">${n.doctorName || 'الطبيب'}</div>
            <div style="font-size:13px; font-weight:900; color:var(--emerald); margin-top:4px;">${n.note}</div>
            <div style="font-size:10px; color:var(--gray); margin-top:4px;">${new Date(n.ts).toLocaleDateString('ar-EG')}</div>
          </div>
        `).join('') || '<p style="font-size:12px; color:var(--gray); text-align:center;">لا روشتات</p>'}
      </div>
    `;
  }
};

/* Staff Module */
const StaffModule = {
  call: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    if (!appt) return;
    appt.status = 'next'; saveDB();
    Notifier.push(appt.patientId, `🔔 حان دورك الآن! توجه لعيادة ${appt.doctorName}`, true);
    Utils.toast('تم إرسال النداء');
    Views.staff();
  },
  finish: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    if (!appt) return;
    appt.status = 'completed'; saveDB();
    Utils.toast('تم إنهاء الكشف');
    Views.staff();
  }
};

/* Doctor Module */
const DoctorModule = {
  call: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    if (!appt) return;
    appt.status = 'next'; saveDB();
    Notifier.push(appt.patientId, `🔔 دورك الآن يا ${appt.patientName}`, true);
    Utils.toast('تم استدعاء المريض');
    Views.doctor();
  },
  finish: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    if (!appt) return;
    const followUp = confirm('هل يحتاج المريض لمتابعة؟');
    appt.status = 'completed'; appt.followUp = followUp; saveDB();
    Utils.toast('تم إنهاء الكشف' + (followUp ? ' - تم تحديد متابعة' : ''));
    Views.doctor();
  },
  scribe: (patientId) => {
    document.getElementById('modal-map-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-map')"><i class="fa-solid fa-xmark"></i></button>
      <div style="text-align:center; margin-bottom:16px;">
        <div style="width:70px; height:70px; background:var(--danger); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 16px; animation:pulse 1.5s infinite;"><i class="fa-solid fa-microphone"></i></div>
        <h3 style="margin:0; font-weight:900;">المساعد الصوتي (AI Scribe)</h3>
        <p style="margin:4px 0 0; font-size:12px; color:var(--gray);">تحدث وسيتم تحويل كلامك إلى روشتة</p>
      </div>
      <div style="background:var(--gray-light); border-radius:10px; padding:16px; min-height:120px; margin-bottom:16px;">
        <div id="scribe-text" style="font-size:13px; font-weight:700; color:var(--gray);">جاري الاستماع...</div>
      </div>
      <button onclick="DoctorModule.saveScribe('${patientId}')" class="btn-action" style="width:100%; padding:14px;">حفظ الروشتة</button>
    `;
    Utils.openModal('modal-map');
    setTimeout(() => {
      const el = document.getElementById('scribe-text');
      if (el) {
        el.style.color = 'var(--primary)';
        el.innerHTML = `"المريض يشكو من صداع شديد منذ يومين مع ارتفاع حرارة.<br><br>التشخيص: نزلة برد.<br>الروشتة: بانادول كل 8 ساعات + فيتامين سي."`;
        el.dataset.text = "المريض يشكو من صداع شديد منذ يومين مع ارتفاع حرارة. التشخيص: نزلة برد. الروشتة: بانادول كل 8 ساعات + فيتامين سي.";
      }
    }, 2500);
  },
  saveScribe: (patientId) => {
    const el = document.getElementById('scribe-text');
    const text = el.dataset.text;
    if (!text) return Utils.toast('لم يتم التعرف على شيء', true);
    DB.emrNotes.push({
      id: Utils.id(), patientId, doctorId: Auth.currentUser.id,
      doctorName: Auth.currentUser.name, note: text, ts: Date.now()
    });
    saveDB();
    Notifier.push(patientId, `📝 روشتة جديدة من ${Auth.currentUser.name}`, false);
    Utils.closeModal('modal-map');
    Utils.toast('تم حفظ الروشتة');
    Views.doctor();
  }
};

/* Founder Module */
const FounderModule = {
  addStaff: () => {
    const name = document.getElementById('stf-name').value.trim();
    const phone = document.getElementById('stf-phone').value.trim();
    if (!name || !phone) return Utils.toast('أكمل البيانات', true);
    DB.users.push({ id: 'u-' + Utils.id(), name, phone, role: 'staff', pass: '123456', wallet: 0, waslaId: 'WASLA-' + Math.floor(10000+Math.random()*90000) });
    saveDB();
    Views.founder();
    Utils.toast('تم إضافة الموظف');
  },
  deleteDoctor: (id) => {
    if (!confirm('حذف الطبيب؟')) return;
    DB.doctors = DB.doctors.filter(d => d.id !== id);
    saveDB();
    Views.founder();
    Utils.toast('تم الحذف');
  },
  deletePharmacy: (id) => {
    if (!confirm('حذف الصيدلية؟')) return;
    DB.pharmacies = DB.pharmacies.filter(p => p.id !== id);
    saveDB();
    Views.founder();
    Utils.toast('تم الحذف');
  }
};

/* INIT */
window.addEventListener('DOMContentLoaded', () => {
  UI.renderHeader();
  router.navigate('medical');
  
  setInterval(() => {
    let changed = false;
    DB.orders.forEach(o => {
      if (o.status === 'preparing') { o.status = 'on_way'; changed = true; }
      else if (o.status === 'on_way') { o.status = 'delivered'; changed = true; }
    });
    if (changed) {
      saveDB();
      if (Auth.currentUser?.role === 'patient' && document.getElementById('view-dashboard').classList.contains('active')) {
        Views.dashboard();
      }
    }
  }, 20000);
});
</script>
</body>
</html>
