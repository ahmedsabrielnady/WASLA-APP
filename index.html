<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>وصلة | منصة الرعاية الصحية المتكاملة</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { primary: '#0A8754', 'primary-dark': '#076B42', 'primary-light': '#E6F4ED', secondary: '#0B1120', accent: '#D97706', danger: '#E11D48', info: '#0284C7' },
                    },
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'fade-in-up': 'fadeInUp 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        fadeInUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.6); }
        .glass-dark { background: rgba(11, 17, 32, 0.9); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hover-lift { transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease; }
        .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.15); }
        
        .desktop-nav { display: none; }
        @media (min-width: 1024px) { .desktop-nav { display: flex; } }
        
        .modal-overlay { background: rgba(11, 17, 32, 0.7); backdrop-filter: blur(6px); }
        
        .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 9999px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        .status-confirmed { background: #D1FAE5; color: #065F46; }
        .status-completed { background: #DBEAFE; color: #1E40AF; }
        .status-cancelled { background: #FEE2E2; color: #991B1B; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #0A8754; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- TOP BAR -->
    <div class="bg-brand-secondary text-white text-[11px] py-2 border-b border-slate-700/50 overflow-hidden relative">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-2 text-brand-primary font-bold"><i class="fa-solid fa-bullhorn animate-pulse"></i><span>إعلانات المنصة:</span></div>
            <div class="flex-grow overflow-hidden relative mx-4"><div id="announcement-ticker" class="whitespace-nowrap flex gap-8 items-center font-bold text-slate-300"></div></div>
            <div class="flex items-center gap-3"><a href="tel:01000000000" class="hover:text-brand-primary transition"><i class="fa-solid fa-phone"></i> الدعم</a></div>
        </div>
    </div>

    <!-- HEADER -->
    <header id="main-header" class="glass-dark text-white sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="App.navigate('landing')">
                <div class="bg-brand-primary p-2.5 rounded-2xl text-2xl shadow-lg shadow-brand-primary/30"><i class="fa-solid fa-heart-pulse"></i></div>
                <div><h1 class="text-2xl font-black leading-tight">وَصْلَة</h1><p class="text-[10px] text-brand-primary font-bold tracking-wider">منصة شبين القناطر</p></div>
            </div>
            <nav id="desktop-nav" class="desktop-nav items-center gap-1"></nav>
            <div class="flex items-center gap-2">
                <button onclick="App.navigate('login')" id="btn-login" class="flex items-center gap-1.5 text-xs font-bold text-slate-300 hover:text-white px-3 py-2 rounded-lg transition"><i class="fa-regular fa-user"></i> دخول</button>
                <button onclick="App.logout()" id="btn-logout" class="hidden bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-700 transition shadow-lg flex items-center gap-1.5"><i class="fa-solid fa-power-off"></i> خروج</button>
                <button onclick="App.toggleMobileMenu()" class="lg:hidden text-white p-2"><i class="fa-solid fa-bars text-2xl"></i></button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden lg:hidden bg-brand-secondary border-t border-slate-700 p-4 space-y-2 absolute w-full shadow-2xl"></div>
    </header>

    <!-- MAIN CONTAINER -->
    <main id="app-container" class="flex-grow w-full max-w-7xl mx-auto px-4 py-8"></main>

    <!-- MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 modal-overlay z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto relative animate-fade-in-up shadow-2xl">
            <button onclick="App.closeModal()" class="absolute top-5 left-5 text-slate-400 hover:text-red-500 z-10 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow-md transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div id="modal-content" class="p-6 sm:p-8"></div>
        </div>
    </div>

    <!-- TOASTS -->
    <div id="toast-container" class="fixed bottom-5 left-5 z-[400] space-y-3"></div>

    <!-- FOOTER -->
    <footer class="bg-brand-secondary text-slate-400 py-8 border-t border-slate-800 mt-auto text-center text-xs">
        <p class="font-bold text-white mb-2">منصة وصلة الرقمية - شبين القناطر</p>
        <p>© 2026 جميع الحقوق محفوظة.</p>
    </footer>

    <!-- =========================================
         JAVASCRIPT: THE FULL ENGINE
    ========================================= -->
    <script>
        // 1. قاعدة البيانات
        const DB_SEED = {
            configs: { announcementText: "أهلاً بكم في منصة وصلة | نرحب بالدكتور محمد فؤاد (استشاري العظام) | تم إضافة خدمة الأشعة قريباً" },
            users: [
                { id: 'u_admin', name: 'المؤسس', phone: '01000000000', pass: '123', role: 'admin', permissions: ['all'] },
                { id: 'd1', name: 'د. أحمد الشريف', phone: '01011111111', pass: '123', role: 'doctor', permissions: [] }
            ],
            doctors: [
                { id: 'd1', name: 'د. أحمد الشريف', spec: 'باطنة وسكر', area: 'شارع بورسعيد', clinicFee: 150, homeFee: 300, slotDuration: 15, workingHours: { start: '09:00', end: '14:00' } }
            ],
            appointments: [],
            emr: [],
            services: {
                nursing: [
                    { id: 'n1', name: 'تمريض - حقن ومحاليل', desc: 'زيارة ممرض معتمد لإعطاء الحقن والمحاليل.' },
                    { id: 'n2', name: 'رعاية كبار السن', desc: 'رعاية شاملة لكبار السن في المنزل.' }
                ],
                labs: [
                    { id: 'l1', name: 'تحاليل دم عامة' },
                    { id: 'l2', name: 'وظائف كبد وكلى' }
                ],
                supplies: [
                    { id: 's1', name: 'كرسي متحرك', category: 'أجهزة حركة', price: 1500, desc: 'كرسي متحرك قابل للطي' },
                    { id: 's2', name: 'عكاز طبي', category: 'أجهزة حركة', price: 200, desc: 'عكاز ألومنيوم قابل للتعديل' }
                ]
            }
        };

        if (!localStorage.getItem('wasla_db_v4')) {
            localStorage.setItem('wasla_db_v4', JSON.stringify(DB_SEED));
        }
        const DB = JSON.parse(localStorage.getItem('wasla_db_v4'));
        const saveDB = () => localStorage.setItem('wasla_db_v4', JSON.stringify(DB));
        const sanitize = (str) => {
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        };

        // 2. المحرك الأساسي
        window.App = {
            state: {
                user: JSON.parse(localStorage.getItem('wasla_session_v4')) || null,
                currentView: 'landing'
            },

            init() {
                this.updateHeader();
                this.renderAnnouncements();
                this.navigate('landing');
            },

            renderAnnouncements() {
                const ticker = document.getElementById('announcement-ticker');
                if (ticker) ticker.innerHTML = `<span>${sanitize(DB.configs.announcementText)}</span>`;
            },

            navigate(view) {
                this.state.currentView = view;
                const container = document.getElementById('app-container');
                
                if (['patientPortal', 'doctorDashboard', 'adminDashboard'].includes(view)) {
                    if (!this.state.user) return this.navigate('login');
                    if (view === 'adminDashboard' && this.state.user.role !== 'admin') return this.navigate('landing');
                    if (view === 'doctorDashboard' && this.state.user.role !== 'doctor') return this.navigate('landing');
                }

                if (window.Views[view]) {
                    container.innerHTML = window.Views[view]();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    container.innerHTML = `<div class="text-center py-20 animate-fade-in"><h2 class="text-2xl font-black text-slate-800">قيد التطوير</h2></div>`;
                }
                this.updateHeader();
            },

            updateHeader() {
                const u = this.state.user;
                const nav = document.getElementById('desktop-nav');
                const mobileNav = document.getElementById('mobile-menu');
                const btnLogin = document.getElementById('btn-login');
                const btnLogout = document.getElementById('btn-logout');

                let commonLinks = `
                    <button onclick="App.navigate('landing')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white transition">الرئيسية</button>
                    <button onclick="App.navigate('doctors')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white transition">الأطباء</button>
                    <button onclick="App.navigate('nursing')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white transition">التمريض</button>
                    <button onclick="App.navigate('supplies')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white transition">المستلزمات</button>
                    <button onclick="App.navigate('labs')" class="px-3 py-2 text-xs font-bold text-slate-300 hover:text-white transition">المعامل</button>
                `;

                let mobileCommon = `
                    <button onclick="App.navigate('landing'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-slate-300 font-bold">الرئيسية</button>
                    <button onclick="App.navigate('doctors'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-slate-300 font-bold">الأطباء</button>
                    <button onclick="App.navigate('nursing'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-slate-300 font-bold">التمريض</button>
                    <button onclick="App.navigate('supplies'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-slate-300 font-bold">المستلزمات</button>
                    <button onclick="App.navigate('labs'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-slate-300 font-bold">المعامل</button>
                `;

                if (u) {
                    btnLogin.classList.add('hidden');
                    btnLogout.classList.remove('hidden');
                    let dashLink = '';
                    let mobileDash = '';
                    if (u.role === 'patient') { dashLink = `<button onclick="App.navigate('patientPortal')" class="px-3 py-2 text-xs font-bold text-brand-primary hover:text-white">ملفي</button>`; mobileDash = `<button onclick="App.navigate('patientPortal'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-brand-primary font-bold">ملفي الطبي</button>`; }
                    if (u.role === 'doctor') { dashLink = `<button onclick="App.navigate('doctorDashboard')" class="px-3 py-2 text-xs font-bold text-brand-primary hover:text-white">لوحة الطبيب</button>`; mobileDash = `<button onclick="App.navigate('doctorDashboard'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-brand-primary font-bold">لوحة الطبيب</button>`; }
                    if (u.role === 'admin') { dashLink = `<button onclick="App.navigate('adminDashboard')" class="px-3 py-2 text-xs font-bold text-brand-accent hover:text-white">الإدارة</button>`; mobileDash = `<button onclick="App.navigate('adminDashboard'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-brand-accent font-bold">لوحة المؤسس</button>`; }

                    nav.innerHTML = commonLinks + dashLink;
                    mobileNav.innerHTML = `${mobileCommon}<div class="border-t border-slate-700 my-2"></div>${mobileDash}<button onclick="App.logout(); App.toggleMobileMenu()" class="block w-full text-right p-2 text-red-400 font-bold mt-2">تسجيل خروج</button>`;
                } else {
                    btnLogin.classList.remove('hidden');
                    btnLogout.classList.add('hidden');
                    nav.innerHTML = commonLinks;
                    mobileNav.innerHTML = `${mobileCommon}<div class="border-t border-slate-700 my-2"></div><button onclick="App.navigate('login'); App.toggleMobileMenu()" class="block w-full text-right p-2 text-brand-primary font-bold">تسجيل الدخول</button>`;
                }
            },

            toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); },
            closeModal() { document.getElementById('modal-container').classList.add('hidden'); },

            toast(msg, type = 'info') {
                const colors = { success: 'bg-emerald-600', info: 'bg-brand-primary', warning: 'bg-amber-600', error: 'bg-red-600' };
                const el = document.createElement('div');
                el.className = `${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg text-sm font-bold mb-2 animate-fade-in-up`;
                el.innerText = msg;
                document.getElementById('toast-container').appendChild(el);
                setTimeout(() => el.remove(), 3000);
            },

            handleLogin(e) {
                e.preventDefault();
                const phone = document.getElementById('login-phone').value;
                const pass = document.getElementById('login-pass').value;
                const user = DB.users.find(u => u.phone === phone && u.pass === pass);
                if (user) {
                    this.state.user = user;
                    localStorage.setItem('wasla_session_v4', JSON.stringify(user));
                    this.toast('تم تسجيل الدخول بنجاح', 'success');
                    if (user.role === 'patient') this.navigate('patientPortal');
                    else if (user.role === 'doctor') this.navigate('doctorDashboard');
                    else if (user.role === 'admin') this.navigate('adminDashboard');
                } else {
                    this.toast('رقم الهاتف أو كلمة المرور غير صحيحة', 'error');
                }
            },

            handleRegister(e) {
                e.preventDefault();
                const name = document.getElementById('reg-name').value;
                const phone = document.getElementById('reg-phone').value;
                const pass = document.getElementById('reg-pass').value;
                const role = document.getElementById('reg-role').value;

                if (DB.users.find(u => u.phone === phone)) return this.toast('رقم الهاتف مسجل بالفعل', 'warning');

                const newUser = { id: 'u' + Date.now(), name: sanitize(name), phone: sanitize(phone), pass, role, permissions: [] };
                DB.users.push(newUser);
                if (role === 'doctor') DB.doctors.push({ id: newUser.id, name: sanitize(name), spec: 'تخصص عام', area: 'شبين القناطر', clinicFee: 100, homeFee: 200, slotDuration: 15, workingHours: { start: '09:00', end: '17:00' } });
                
                saveDB();
                this.toast('تم إنشاء الحساب بنجاح! يمكنك الدخول الآن.', 'success');
                this.navigate('login');
            },

            logout() {
                this.state.user = null;
                localStorage.removeItem('wasla_session_v4');
                this.navigate('landing');
                this.toast('تم تسجيل الخروج.', 'info');
            },

            // --- Booking & Doctors ---
            renderDoctors() {
                const grid = document.getElementById('doctors-grid');
                if (!grid) return;
                const query = document.getElementById('search-name')?.value.toLowerCase() || '';
                const specFilter = document.getElementById('filter-spec')?.value || '';
                const areaFilter = document.getElementById('filter-area')?.value || '';

                const filtered = DB.doctors.filter(d => {
                    const matchName = d.name.toLowerCase().includes(query) || d.spec.toLowerCase().includes(query);
                    return matchName && (specFilter === '' || d.spec === specFilter) && (areaFilter === '' || d.area === areaFilter);
                });

                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500 font-bold">لا يوجد أطباء مطابقون لبحثك.</div>`;
                    return;
                }

                grid.innerHTML = filtered.map(d => `
                    <div class="glass rounded-3xl p-6 border border-slate-200 hover-lift">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-brand-primary-light text-brand-primary rounded-2xl flex items-center justify-center text-3xl"><i class="fa-solid fa-user-doctor"></i></div>
                                <div><h3 class="font-black text-slate-800 text-lg">${sanitize(d.name)}</h3><p class="text-xs text-brand-primary font-bold mt-0.5">${sanitize(d.spec)}</p></div>
                            </div>
                        </div>
                        <div class="bg-slate-50 rounded-xl p-3 mb-4 space-y-2 border border-slate-100">
                            <div class="flex items-center gap-2 text-xs font-bold text-slate-600"><i class="fa-solid fa-location-dot text-brand-primary w-4"></i> ${sanitize(d.area)}</div>
                            <div class="flex items-center gap-2 text-xs font-bold text-slate-600"><i class="fa-solid fa-clock text-brand-info w-4"></i> مدة الكشف: ${d.slotDuration} دقيقة</div>
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                            <div><span class="text-[10px] text-slate-400 font-bold block">عيادة: ${d.clinicFee} ج.م</span><span class="text-brand-info font-black text-xs">منزلي: ${d.homeFee} ج.م</span></div>
                            <button onclick="App.openBookingModal('${d.id}')" class="bg-brand-primary text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-brand-primary-dark transition shadow-md">حجز</button>
                        </div>
                    </div>
                `).join('');
            },

            openBookingModal(docId) {
                const doc = DB.doctors.find(d => d.id === docId);
                if (!doc) return;
                const html = `
                    <div class="text-center mb-6"><div class="w-20 h-20 bg-brand-primary-light text-brand-primary rounded-full flex items-center justify-center mx-auto text-4xl mb-3"><i class="fa-solid fa-user-doctor"></i></div><h2 class="text-2xl font-black text-slate-800">حجز مع ${doc.name}</h2></div>
                    <form onsubmit="event.preventDefault(); App.confirmBooking(event, '${doc.id}')" class="space-y-4">
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <label class="block text-xs font-bold text-slate-700 mb-2">نوع الكشف</label>
                            <div class="flex gap-2">
                                <label class="flex-1 cursor-pointer"><input type="radio" name="bk-type" value="clinic" class="peer sr-only" required checked onchange="document.getElementById('price-label').innerText='${doc.clinicFee}'"><div class="text-center py-2 border rounded-xl text-sm font-bold peer-checked:bg-brand-primary peer-checked:text-white">عيادة (${doc.clinicFee} ج.م)</div></label>
                                <label class="flex-1 cursor-pointer"><input type="radio" name="bk-type" value="home" class="peer sr-only" required onchange="document.getElementById('price-label').innerText='${doc.homeFee}'"><div class="text-center py-2 border rounded-xl text-sm font-bold peer-checked:bg-brand-info peer-checked:text-white">كشف منزلي (${doc.homeFee} ج.م)</div></label>
                            </div>
                        </div>
                        <div><label class="block text-xs font-bold text-slate-700 mb-2">التاريخ</label><input type="date" id="bk-date" required class="w-full p-3 border border-slate-300 rounded-xl font-bold text-sm" min="${new Date().toISOString().split('T')[0]}" onchange="App.updateSlots('${doc.id}', this.value)"></div>
                        <div><label class="block text-xs font-bold text-slate-700 mb-2">الوقت المتاح</label><select id="bk-time" required class="w-full p-3 border border-slate-300 rounded-xl font-bold text-sm"><option value="">اختر التاريخ أولاً</option></select></div>
                        <div><label class="block text-xs font-bold text-slate-700 mb-2">اسم المريض</label><input type="text" id="bk-name" required class="w-full p-3 border border-slate-300 rounded-xl font-bold text-sm" value="${this.state.user ? this.state.user.name : ''}"></div>
                        <div><label class="block text-xs font-bold text-slate-700 mb-2">رقم الهاتف</label><input type="tel" id="bk-phone" required class="w-full p-3 border border-slate-300 rounded-xl font-bold text-sm" value="${this.state.user ? this.state.user.phone : ''}"></div>
                        <button type="submit" class="w-full bg-brand-primary text-white py-4 rounded-xl font-black text-base shadow-lg mt-2">تأكيد الحجز (<span id="price-label">${doc.clinicFee}</span> ج.م)</button>
                    </form>`;
                document.getElementById('modal-content').innerHTML = html;
                document.getElementById('modal-container').classList.remove('hidden');
            },

            updateSlots(docId, date) {
                const doc = DB.doctors.find(d => d.id === docId);
                const select = document.getElementById('bk-time');
                const [startH, startM] = doc.workingHours.start.split(':').map(Number);
                const [endH, endM] = doc.workingHours.end.split(':').map(Number);
                let currentMin = startH * 60 + startM;
                const endMin = endH * 60 + endM;
                const slots = [];
                const bookedAppts = DB.appointments.filter(a => a.docId === docId && a.date === date && a.status !== 'cancelled');

                while (currentMin < endMin) {
                    const h = Math.floor(currentMin / 60).toString().padStart(2, '0');
                    const m = (currentMin % 60).toString().padStart(2, '0');
                    const timeStr = `${h}:${m}`;
                    if (!bookedAppts.some(a => a.time === timeStr)) slots.push(timeStr);
                    currentMin += doc.slotDuration;
                }
                select.innerHTML = slots.length > 0 ? slots.map(s => `<option value="${s}">${s}</option>`).join('') : `<option value="">لا توجد أوقات متاحة</option>`;
            },

            confirmBooking(e, docId) {
                const doc = DB.doctors.find(d => d.id === docId);
                const type = document.querySelector('input[name="bk-type"]:checked').value;
                const name = document.getElementById('bk-name').value;
                const date = document.getElementById('bk-date').value;
                const time = document.getElementById('bk-time').value;
                const phone = document.getElementById('bk-phone').value;
                if (!time) return this.toast('يرجى اختيار وقت متاح أولاً', 'warning');

                const amount = type === 'home' ? doc.homeFee : doc.clinicFee;
                const refNum = 'WS-' + Math.floor(1000 + Math.random() * 9000);

                return `
                <div class="space-y-6 animate-fade-in">
                    <div class="bg-brand-secondary rounded-3xl p-6 sm:p-8 text-white flex flex-col sm:flex-row items-center justify-between gap-6 shadow-xl">
                        <div class="flex items-center gap-4"><div class="w-16 h-16 bg-brand-primary text-white rounded-full flex items-center justify-center text-2xl font-black"><i class="fa-solid fa-user-doctor"></i></div><div><h2 class="text-2xl font-black">أهلاً، ${u.name}</h2><p class="text-sm text-slate-300 font-bold mt-1">لوحة إدارة العيادة</p></div></div>
                        <div class="flex gap-4"><div class="bg-white/10 p-3 rounded-xl text-center min-w-[100px]"><span class="block text-xs text-slate-300 mb-1">إجمالي المواعيد</span><span class="text-2xl font-black text-white">${docAppts.length}</span></div><div class="bg-white/10 p-3 rounded-xl text-center min-w-[100px]"><span class="block text-xs text-slate-300 mb-1">حالات مكتملة</span><span class="text-2xl font-black text-emerald-400">${completedCount}</span></div></div>
                    </div>
                    <div class="glass rounded-3xl p-6 border border-slate-200">
                        <div class="flex justify-between items-center mb-6"><h3 class="font-black text-lg text-slate-800"><i class="fa-solid fa-list-check text-brand-primary ml-2"></i> قائمة الانتظار</h3><span class="text-xs font-bold bg-brand-primary-light text-brand-primary px-3 py-1 rounded-full">${pendingAppts.length} مريض</span></div>
                        <div class="space-y-3">${docAppts.length > 0 ? docAppts.map(a => `<div class="p-4 bg-white rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"><div><div class="font-bold text-slate-800 text-base flex items-center gap-2">${sanitize(a.patient)}<span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-500 font-mono">${a.refNum}</span></div><div class="text-xs text-slate-500 font-bold mt-1"><i class="fa-regular fa-calendar ml-1"></i> ${a.date} - ${a.time} <span class="mx-2">|</span> <span class="text-brand-info">${a.type === 'home' ? 'كشف منزلي' : 'عيادة'}</span></div><div class="text-xs text-slate-500 font-bold mt-1"><i class="fa-solid fa-phone ml-1 text-brand-primary"></i> ${sanitize(a.phone)}</div></div><div class="flex gap-2 w-full sm:w-auto">${a.status === 'confirmed' ? `<button onclick="App.openEMRModal('${a.patient}', '${a.phone}')" class="flex-1 sm:flex-none bg-brand-info text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-700 transition shadow-sm"><i class="fa-solid fa-file-medical"></i> إضافة ملف</button><button onclick="App.completeAppointment('${a.id}')" class="flex-1 sm:flex-none bg-brand-primary text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-brand-primary-dark transition shadow-sm"><i class="fa-solid fa-check"></i> إنهاء الكشف</button>` : `<span class="bg-emerald-50 text-emerald-600 px-4 py-2 rounded-xl text-xs font-bold w-full text-center border border-emerald-100"><i class="fa-solid fa-check-double ml-1"></i> تم الكشف</span>`}</div></div>`).join('') : '<p class="text-sm text-slate-400 font-bold text-center py-8">لا توجد مواعيد مسجلة لك حتى الآن.</p>'}</div>
                    </div>
                </div>`;
            },

            doctorEMR: (patientName, patientPhone) => `
                <div class="space-y-4">
                    <div class="text-center mb-4"><div class="w-16 h-16 bg-brand-info/10 text-brand-info rounded-full flex items-center justify-center mx-auto text-2xl mb-2"><i class="fa-solid fa-file-medical"></i></div><h3 class="font-black text-lg text-slate-800">ملف المريض: ${sanitize(patientName)}</h3></div>
                    <form onsubmit="event.preventDefault(); App.saveEMR(event, '${sanitize(patientName)}', '${sanitize(patientPhone)}')" class="space-y-3">
                        <div><label class="block text-xs font-bold mb-1">نوع الملف</label><select id="emr-type" class="w-full p-3 border rounded-xl font-bold text-sm bg-slate-50"><option value="روشتة طبية">روشتة طبية</option><option value="نتيجة تحليل">نتيجة تحليل</option><option value="أشعة">أشعة</option><option value="ملاحظة طبية">ملاحظة طبية</option></select></div>
                        <div><label class="block text-xs font-bold mb-1">التفاصيل</label><textarea id="emr-notes" required rows="4" placeholder="اكتب تفاصيل الروشتة أو التشخيص هنا..." class="w-full p-3 border rounded-xl font-bold text-sm bg-slate-50"></textarea></div>
                        <button type="submit" class="w-full bg-brand-info text-white py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition shadow-md"><i class="fa-solid fa-save ml-1"></i> حفظ في ملف المريض</button>
                    </form>
                    <div class="mt-6 border-t pt-4"><h4 class="font-bold text-sm text-slate-700 mb-3">السجلات السابقة:</h4><div class="space-y-2 max-h-40 overflow-y-auto pr-1">${DB.emr.filter(e => e.patientPhone === patientPhone).map(e => `<div class="p-3 bg-slate-50 text-xs border rounded-xl"><div class="flex justify-between font-bold text-brand-info mb-1"><span>${sanitize(e.type)}</span><span>${e.date}</span></div><p class="text-slate-700">${sanitize(e.notes)}</p></div>`).join('') || '<p class="text-xs text-slate-400 text-center">لا يوجد سجلات سابقة لهذا المريض.</p>'}</div></div>
                </div>`,

            adminDashboard: () => `
                <div class="space-y-6 animate-fade-in">
                    <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-xl flex justify-between items-center"><div><h2 class="text-2xl font-black">لوحة تحكم المؤسس</h2><p class="text-sm text-slate-400 mt-1">إدارة الإعدادات، الأطباء، الصلاحيات، والإعلانات</p></div><i class="fa-solid fa-shield-halved text-4xl text-brand-accent"></i></div>
                    <div class="flex gap-2 overflow-x-auto pb-2">
                        <button onclick="App.adminTab('settings')" id="tab-settings" class="admin-tab px-5 py-2.5 rounded-xl font-bold text-sm bg-brand-primary text-white">الإعدادات العامة</button>
                        <button onclick="App.adminTab('doctors')" id="tab-doctors" class="admin-tab px-5 py-2.5 rounded-xl font-bold text-sm bg-white border text-slate-700">الأطباء والمواعيد</button>
                        <button onclick="App.adminTab('services')" id="tab-services" class="admin-tab px-5 py-2.5 rounded-xl font-bold text-sm bg-white border text-slate-700">الخدمات والمنتجات</button>
                    </div>
                    <div id="admin-content-settings" class="admin-content glass rounded-3xl p-6 border border-slate-200 space-y-4"><h3 class="font-black text-lg mb-2">إعدادات شريط الإعلانات</h3><textarea id="admin-announcement" rows="2" class="w-full p-3 border rounded-xl font-bold text-sm bg-slate-50">${sanitize(DB.configs.announcementText)}</textarea><button onclick="App.updateAnnouncement()" class="bg-brand-primary text-white px-5 py-2.5 rounded-xl text-sm font-bold">حفظ الإعلان</button></div>
                    <div id="admin-content-doctors" class="admin-content hidden glass rounded-3xl p-6 border border-slate-200 space-y-4"><h3 class="font-black text-lg">إدارة الأطباء والمواعيد</h3><div class="grid grid-cols-1 gap-4">${DB.doctors.map(d => `<div class="p-4 bg-white border rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4"><div><div class="font-bold text-lg">${d.name}</div><div class="text-xs text-slate-500 mb-2">${d.spec} | عيادة: ${d.clinicFee} ج | منزلي: ${d.homeFee} ج</div><div class="text-xs font-bold text-brand-info bg-brand-info/10 px-2 py-1 rounded inline-block">مدة الكشف: ${d.slotDuration} دقيقة</div></div><button onclick="App.editDoctorSchedule('${d.id}')" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-200"><i class="fa-solid fa-clock"></i> تعديل الوقت والسعر</button></div>`).join('')}</div></div>
                    <div id="admin-content-services" class="admin-content hidden glass rounded-3xl p-6 border border-slate-200 space-y-6">
                        <div><div class="flex justify-between items-center mb-3"><h3 class="font-black text-lg text-slate-800">إدارة خدمات التمريض</h3><button onclick="App.adminAddNursing()" class="bg-brand-primary text-white px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-plus"></i> إضافة</button></div><div class="space-y-2">${DB.services.nursing.map(s => `<div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center"><div><div class="font-bold text-sm">${s.name}</div><div class="text-xs text-slate-500">${s.desc}</div></div><button onclick="App.adminDeleteNursing('${s.id}')" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash"></i></button></div>`).join('')}</div></div>
                        <div class="border-t pt-4"><h3 class="font-black text-lg text-slate-800 mb-3">إدارة المستلزمات (تعديل الأسعار)</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-2">${DB.services.supplies.map(s => `<div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center"><div><div class="font-bold text-sm">${s.name}</div><div class="text-xs text-brand-primary font-black">${s.price} ج.م</div></div><button onclick="App.adminUpdateSupply('${s.id}')" class="text-brand-info hover:text-blue-700 p-2"><i class="fa-solid fa-pen"></i></button></div>`).join('')}</div></div>
                    </div>
                </div>`
        };

        // التشغيل
        document.addEventListener('DOMContentLoaded', () => {
            try { App.init(); } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
