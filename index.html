<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0B1220" />
<title>منصة وصلة | WASLA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root {
  --brand-ink: #0B1220;
  --brand-ink-soft: #1E293B;
  --sector-medical: #059669;
  --sector-medical-soft: #ECFDF5;
  --sector-medical-border: rgba(5, 150, 105, 0.18);
  --sector-grocery: #EA580C;
  --sector-grocery-soft: #FFF7ED;
  --sector-grocery-border: rgba(234, 88, 12, 0.18);
  --sector-cars: #0284C7;
  --sector-cars-soft: #F0F9FF;
  --sector-cars-border: rgba(2, 132, 199, 0.18);
  --sector-home: #7C3AED;
  --sector-home-soft: #F5F3FF;
  --sector-home-border: rgba(124, 58, 237, 0.18);
  --sector-gold: #D97706;
  --sector-gold-soft: #FEF3C7;
  --color-success: #059669;
  --color-success-soft: #ECFDF5;
  --color-warning: #EA580C;
  --color-warning-soft: #FFF7ED;
  --color-danger: #E11D48;
  --color-danger-soft: #FFF1F2;
  --color-info: #0284C7;
  --color-info-soft: #F0F9FF;
  --bg-page: #F4F6FB;
  --bg-card: #FFFFFF;
  --bg-muted: #F8FAFC;
  --text-primary: #0B1220;
  --text-secondary: #475569;
  --text-muted: #64748B;
  --text-disabled: #94A3B8;
  --border-default: #E2E8F0;
  --border-strong: #CBD5E1;
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px rgba(11, 18, 32, 0.04);
  --shadow-sm: 0 2px 8px rgba(11, 18, 32, 0.06);
  --shadow-md: 0 8px 24px rgba(11, 18, 32, 0.08);
  --shadow-lg: 0 20px 55px rgba(11, 18, 32, 0.15);
  --font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  --fs-xs: 10.5px;
  --fs-sm: 12px;
  --fs-base: 13.5px;
  --fs-md: 15px;
  --fs-lg: 17px;
  --fs-xl: 20px;
  --fs-2xl: 24px;
  --container-max: 900px;
  --header-height: 68px;
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: 0; min-height: 100vh;
  font-family: var(--font-family);
  font-size: var(--fs-base); line-height: 1.6;
  color: var(--text-primary); background: var(--bg-page);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden; padding-bottom: env(safe-area-inset-bottom);
}
button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; border: none; background: none; color: inherit; }
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, h5, h6, p { margin: 0; padding: 0; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); }
.hidden { display: none !important; }
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }
.top-bar {
  background: linear-gradient(90deg, var(--brand-ink), var(--brand-ink-soft) 60%, #14213A);
  color: #fff; font-size: var(--fs-xs); padding: 6px 16px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; flex-wrap: wrap; min-height: 32px;
}
.top-bar-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.14);
  padding: 3px 9px; border-radius: var(--radius-full);
  font-weight: 700; font-size: 10px;
}
.top-bar-chip i { font-size: 10px; }
.app-header {
  position: sticky; top: 0; z-index: 90;
  background: rgba(11, 18, 32, 0.98);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: var(--shadow-md);
}
.app-header-inner {
  max-width: var(--container-max); margin: 0 auto;
  padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; min-height: var(--header-height);
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark {
  width: 42px; height: 42px; border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--sector-medical), #10B981);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff;
  box-shadow: 0 6px 18px rgba(5, 150, 105, 0.35); flex-shrink: 0;
}
.brand-text h1 { font-size: var(--fs-lg); font-weight: 900; color: #fff; line-height: 1.1; }
.brand-text h1 span {
  font-size: 9px; font-weight: 800; color: #34D399;
  background: rgba(52, 211, 153, 0.15);
  padding: 1px 6px; border-radius: var(--radius-xs);
  margin-right: 4px; vertical-align: middle;
}
.brand-text p { font-size: 10px; color: rgba(255, 255, 255, 0.55); font-weight: 600; margin-top: 2px; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.app-tabs-wrapper {
  background: #fff; border-bottom: 1px solid var(--border-default);
  position: sticky; top: var(--header-height); z-index: 85;
  box-shadow: 0 2px 8px rgba(11, 18, 32, 0.04);
}
.app-tabs {
  max-width: var(--container-max); margin: 0 auto; padding: 0 8px;
  display: flex; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
}
.app-tabs::-webkit-scrollbar { display: none; }
.app-tab {
  flex-shrink: 0; padding: 14px 18px; border: none; background: transparent;
  color: var(--text-muted); font-family: var(--font-family);
  font-weight: 800; font-size: 12.5px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; position: relative; transition: color 0.2s ease; min-width: 78px;
}
.app-tab i { font-size: 17px; }
.app-tab::after {
  content: ''; position: absolute; bottom: 0; left: 18px; right: 18px;
  height: 3px; background: transparent;
  border-radius: 3px 3px 0 0; transition: background 0.25s ease;
}
.app-tab:hover { color: var(--text-primary); }
.app-tab.active { color: var(--brand-ink); }
.app-tab.active::after { background: linear-gradient(90deg, var(--sector-medical), #10B981); }
.context-switcher {
  background: linear-gradient(135deg, var(--brand-ink), var(--brand-ink-soft));
  color: #fff; padding: 10px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: none;
}
.context-switcher.visible { display: block; }
.context-switcher-inner {
  max-width: var(--container-max); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.context-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
.context-icon {
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #fff; flex-shrink: 0;
}
.context-text { min-width: 0; }
.context-label {
  font-size: 9.5px; color: rgba(255, 255, 255, 0.55);
  font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
}
.context-name {
  font-size: 13px; font-weight: 900; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.context-switch-btn {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff; padding: 6px 12px; border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 900;
  display: inline-flex; align-items: center; gap: 5px;
  transition: background 0.15s ease; flex-shrink: 0;
  font-family: inherit; cursor: pointer;
}
.context-switch-btn:hover { background: rgba(255, 255, 255, 0.25); }
.app-main {
  flex: 1; max-width: var(--container-max); margin: 0 auto;
  padding: 16px; width: 100%;
}
.view { display: none; animation: fadeInUp 0.3s ease; }
.view.active { display: block; }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.card {
  background: var(--bg-card); border-radius: var(--radius-md);
  border: 1px solid var(--border-default); box-shadow: var(--shadow-sm);
  padding: 16px; margin-bottom: 14px;
  position: relative; overflow: hidden;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 12px;
}
.section-title {
  font-size: var(--fs-md); font-weight: 900;
  color: var(--text-primary); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title i { color: var(--sector-medical); }
.sector-hero {
  border-radius: var(--radius-lg); padding: 24px 20px;
  color: #fff; position: relative; overflow: hidden;
  box-shadow: var(--shadow-lg); margin-bottom: 16px;
}
.sector-hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 90% 15%, rgba(255, 255, 255, 0.15), transparent 55%);
  pointer-events: none;
}
.sector-hero[data-sector="medical"] { background: linear-gradient(120deg, #064E3B, #059669 55%, #10B981); }
.sector-hero[data-sector="grocery"] { background: linear-gradient(120deg, #7C2D12, #EA580C 55%, #F59E0B); }
.sector-hero[data-sector="cars"] { background: linear-gradient(120deg, #0C4A6E, #0284C7 55%, #0EA5E9); }
.sector-hero[data-sector="home"] { background: linear-gradient(120deg, #4C1D95, #7C3AED 55%, #A78BFA); }
.sector-hero[data-sector="founder"] { background: linear-gradient(120deg, #78350F, #D97706 55%, #F59E0B); }
.sector-hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.25);
  padding: 5px 12px; border-radius: var(--radius-full);
  font-size: 11px; font-weight: 800;
  position: relative; margin-bottom: 10px;
}
.sector-hero h1 {
  font-size: var(--fs-2xl); font-weight: 900;
  line-height: 1.25; position: relative; margin-bottom: 8px;
}
.sector-hero p {
  font-size: var(--fs-sm); line-height: 1.7;
  color: rgba(255, 255, 255, 0.9);
  position: relative; max-width: 620px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; padding: 11px 18px; border-radius: var(--radius-sm);
  font-family: var(--font-family); font-weight: 800; font-size: var(--fs-sm);
  border: none; cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, var(--sector-medical), #10B981);
  color: #fff; box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3);
}
.btn-grocery {
  background: linear-gradient(135deg, var(--sector-grocery), #F59E0B);
  color: #fff; box-shadow: 0 6px 16px rgba(234, 88, 12, 0.3);
}
.btn-cars {
  background: linear-gradient(135deg, var(--sector-cars), #0EA5E9);
  color: #fff; box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
}
.btn-home {
  background: linear-gradient(135deg, var(--sector-home), #A78BFA);
  color: #fff; box-shadow: 0 6px 16px rgba(124, 58, 237, 0.3);
}
.btn-ghost {
  background: #fff; color: var(--text-primary);
  border: 1.5px solid var(--border-default);
}
.btn-ghost:hover { border-color: var(--sector-medical); background: var(--sector-medical-soft); }
.btn-danger {
  background: linear-gradient(135deg, #DC2626, var(--color-danger));
  color: #fff; box-shadow: 0 6px 16px rgba(225, 29, 72, 0.3);
}
.btn-sm { padding: 7px 12px; font-size: 11px; border-radius: var(--radius-xs); }
.btn-lg { padding: 14px 24px; font-size: var(--fs-base); border-radius: var(--radius-md); }
.btn-block { width: 100%; }
.icon-btn {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #fff; display: inline-flex; align-items: center; justify-content: center;
  font-size: 15px; position: relative; cursor: pointer;
  transition: background 0.15s ease; flex-shrink: 0;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.16); }
.icon-btn .badge {
  position: absolute; top: -5px; left: -5px;
  min-width: 18px; height: 18px;
  background: var(--color-danger); color: #fff;
  font-size: 9px; font-weight: 900;
  border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px; border: 2px solid var(--brand-ink);
}
.input {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-default); background: var(--bg-muted);
  color: var(--text-primary); font-family: var(--font-family);
  font-size: var(--fs-base); font-weight: 700;
  transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}
.input:focus {
  outline: none; border-color: var(--sector-medical); background: #fff;
  box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
}
.input::placeholder { color: var(--text-disabled); }
.label {
  display: block; font-size: 11px; font-weight: 800;
  color: var(--text-secondary); margin-bottom: 6px;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius-full);
  border: 1.5px solid var(--border-default); background: #fff;
  color: var(--text-secondary); font-family: var(--font-family);
  font-size: 11.5px; font-weight: 800; cursor: pointer;
  transition: all 0.15s ease; white-space: nowrap;
}
.chip:hover { border-color: var(--sector-medical); color: var(--sector-medical); }
.chip.active {
  background: var(--sector-medical); border-color: var(--sector-medical);
  color: #fff; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
}
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 900; padding: 3px 9px;
  border-radius: var(--radius-full); white-space: nowrap;
}
.tag-medical { background: var(--sector-medical-soft); color: var(--sector-medical); border: 1px solid var(--sector-medical-border); }
.tag-grocery { background: var(--sector-grocery-soft); color: var(--sector-grocery); border: 1px solid var(--sector-grocery-border); }
.tag-cars { background: var(--sector-cars-soft); color: var(--sector-cars); border: 1px solid var(--sector-cars-border); }
.tag-home { background: var(--sector-home-soft); color: var(--sector-home); border: 1px solid var(--sector-home-border); }
.tag-gold { background: var(--sector-gold-soft); color: var(--sector-gold); border: 1px solid rgba(217, 119, 6, 0.18); }
.tag-success { background: var(--color-success-soft); color: var(--color-success); border: 1px solid rgba(5, 150, 105, 0.15); }
.tag-warning { background: var(--color-warning-soft); color: var(--color-warning); border: 1px solid rgba(234, 88, 12, 0.15); }
.tag-danger { background: var(--color-danger-soft); color: var(--color-danger); border: 1px solid rgba(225, 29, 72, 0.15); }
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(11, 18, 32, 0.78);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  z-index: 300; display: none;
  align-items: center; justify-content: center;
  padding: 16px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: var(--radius-lg);
  width: 100%; max-width: 520px; max-height: 92vh;
  overflow-y: auto; padding: 24px;
  box-shadow: var(--shadow-lg); position: relative;
  animation: modalPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  margin: auto;
}
@keyframes modalPop {
  from { opacity: 0; transform: scale(0.94) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-close {
  position: absolute; top: 14px; left: 14px;
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--bg-muted); color: var(--text-secondary);
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; transition: background 0.15s ease; z-index: 10;
}
.modal-close:hover { background: var(--border-default); }
.toast-container {
  position: fixed; bottom: 24px; right: 16px; left: 16px;
  z-index: 400; display: flex; flex-direction: column;
  align-items: flex-end; gap: 8px;
  pointer-events: none; max-width: 380px; margin-left: auto;
}
.toast {
  background: var(--brand-ink); color: #fff;
  padding: 12px 16px; border-radius: var(--radius-md);
  font-size: 12.5px; font-weight: 800;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 9px;
  animation: toastSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  border-right: 4px solid var(--sector-medical);
  pointer-events: auto; max-width: 100%;
}
.toast.error { border-right-color: var(--color-danger); }
.toast.warning { border-right-color: var(--color-warning); }
.toast.info { border-right-color: var(--color-info); }
@keyframes toastSlide {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 44px; color: var(--border-strong); margin-bottom: 14px; display: block; }
.empty-state-title { font-size: var(--fs-md); font-weight: 900; color: var(--text-primary); margin-bottom: 4px; }
.empty-state-desc { font-size: var(--fs-sm); color: var(--text-muted); }
@media (max-width: 640px) {
  .brand-text p { display: none; }
  .top-bar { display: none; }
  .app-tabs-wrapper { top: 0; }
  .app-tabs { padding: 0 4px; }
  .app-tab { padding: 12px 14px; min-width: 72px; font-size: 11.5px; }
  .app-tab i { font-size: 16px; }
  .app-header-inner { padding: 8px 12px; }
  .app-main { padding: 12px; }
  .sector-hero { padding: 20px 16px; }
  .sector-hero h1 { font-size: var(--fs-xl); }
  .modal { padding: 20px; border-radius: var(--radius-md); }
  .toast-container { bottom: 16px; right: 8px; left: 8px; }
}
:focus-visible { outline: 2px solid var(--sector-medical); outline-offset: 2px; }
</style>
</head>
<body>

<div class="app-shell">

  <div class="top-bar" id="top-bar">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <span class="top-bar-chip"><i class="fa-solid fa-bolt" style="color:#FBBF24;"></i> منصة وصلة — شبين القناطر</span>
      <span class="top-bar-chip" id="topbar-live-counter"><i class="fa-solid fa-users" style="color:#34D399;"></i> <span id="topbar-users-count">...</span> مستخدم</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <span class="top-bar-chip"><i class="fa-solid fa-phone"></i> 01068990089</span>
      <span class="top-bar-chip" id="topbar-status"><i class="fa-solid fa-circle-notch fa-spin" style="color:#FBBF24;"></i> جاري التحميل...</span>
    </div>
  </div>

  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <div class="brand-mark"><i class="fa-solid fa-heart-pulse"></i></div>
        <div class="brand-text">
          <h1>وَصْلَة <span>WASLA</span></h1>
          <p>شبكة الحياة اليومية الذكية</p>
        </div>
      </div>
      <div class="header-actions" id="header-actions"></div>
    </div>
  </header>

  <div class="context-switcher" id="context-switcher">
    <div class="context-switcher-inner">
      <div class="context-info">
        <div class="context-icon" id="context-icon"><i class="fa-solid fa-user"></i></div>
        <div class="context-text">
          <div class="context-label" id="context-label">الوضع الحالي</div>
          <div class="context-name" id="context-name">—</div>
        </div>
      </div>
      <button class="context-switch-btn" id="context-switch-btn">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span>تبديل</span>
      </button>
    </div>
  </div>

  <div class="app-tabs-wrapper">
    <nav class="app-tabs" id="app-tabs">
      <button class="app-tab active" data-tab="home">
        <i class="fa-solid fa-house"></i>
        <span>الرئيسية</span>
      </button>
      <button class="app-tab" data-tab="orders">
        <i class="fa-solid fa-receipt"></i>
        <span>طلباتي</span>
      </button>
      <button class="app-tab" data-tab="account">

    _save(events) {

        try {

    },
    log(type, payload = {}) {
      try {
        const events = this._load();
        const last = events[events.length - 1];
        const prevHash = last ? last.hash : '0'.repeat(64);
        const ts = Date.now();
        const body = { type, payload, ts, prevHash };
        const hash = Crypto._sha256(JSON.stringify(body));
        const event = {
          seq: events.length + 1, type, payload, ts, prevHash, hash,
          actorId: payload.actorId || null,
          targetId: payload.targetId || null
        };
        events.push(event);
        this._save(events);
        return event;
      } catch (e) {
        console.warn('[EventLog] فشل التسجيل:', e);
        return null;
      }
    },
    query({ type, actorId, targetId, limit = 100 } = {}) {

  // ══════════════════════════════════════════════════════════════
  // SECTION 8: MIGRATION (defensive)
  // ══════════════════════════════════════════════════════════════
  function migrateFromV4() {
    try {
      const oldRaw = localStorage.getItem('wasla_med_v4');
      if (!oldRaw) return { migrated: false, reason: 'no-old-db' };

      let oldDb;
      try { oldDb = JSON.parse(oldRaw); } catch (_) { return { migrated: false, reason: 'invalid-json' }; }
      if (!oldDb || !Array.isArray(oldDb.users) || oldDb.users.length === 0) {
        return { migrated: false, reason: 'invalid-structure' };
      }

      const newDb = Schema.empty();
      let passwordsHashed = 0;
      let usersMigrated = 0;

      oldDb.users.forEach(u => {
        if (!u || typeof u !== 'object') return;
        const migrated = { ...u };

        if (migrated.pass && !migrated.passHash) {
          try {
            const { hash, salt } = Crypto.create(migrated.pass);
            migrated.passHash = hash;
            migrated.salt = salt;
            delete migrated.pass;
            passwordsHashed++;
          } catch (_) { /* skip */ }
        }
        if (!Array.isArray(migrated.contexts)) migrated.contexts = ['citizen'];
        if (!migrated.currentContext) migrated.currentContext = 'citizen';
        if (!migrated.status) migrated.status = 'active';
        if (!migrated.waslaId) migrated.waslaId = 'WASLA-' + Math.floor(10000 + Math.random() * 90000);

        if (migrated.role === 'doctor' && !migrated.contexts.includes('doctor')) migrated.contexts.push('doctor');
        if (migrated.role === 'merchant' && !migrated.contexts.includes('merchant')) migrated.contexts.push('merchant');
        if (migrated.role === 'staff' && !migrated.contexts.includes('staff')) migrated.contexts.push('staff');
        if (migrated.role === 'founder' && !migrated.contexts.includes('founder')) migrated.contexts.push('founder');

        newDb.users.push(migrated);
        usersMigrated++;
      });

      if (usersMigrated === 0) return { migrated: false, reason: 'no-valid-users' };

      if (Array.isArray(oldDb.doctors)) {
        oldDb.doctors.forEach(d => {
          if (!d || typeof d !== 'object') return;
          const migrated = { ...d };
          migrated.acceptedInsurances = Array.isArray(d.insurances)
            ? d.insurances.map(i => typeof i === 'string' ? i : (i.id || i))
            : [];
          delete migrated.insurances;
          if (!migrated.userId) migrated.userId = null;
          newDb.doctors.push(migrated);
        });
      }

      if (Array.isArray(oldDb.appointments)) {
        newDb.appointments = oldDb.appointments.map(a => ({ ...a, status: a.status || 'waiting' }));
      }
      if (Array.isArray(oldDb.orders)) {
        newDb.orders = oldDb.orders.map(o => ({ ...o }));
      }
      if (Array.isArray(oldDb.reviews)) newDb.reviews = oldDb.reviews;
      if (Array.isArray(oldDb.auditLogs)) newDb.auditLogs = oldDb.auditLogs;
      if (Array.isArray(oldDb.reminders)) newDb.reminders = oldDb.reminders;
      if (Array.isArray(oldDb.familyMembers)) newDb.familyMembers = oldDb.familyMembers;

      const seed = buildSeed();
      if (!newDb.insuranceCompanies.length) newDb.insuranceCompanies = seed.insuranceCompanies;
      if (!newDb.carServices.length) newDb.carServices = seed.carServices;
      if (!newDb.homeServices.length) newDb.homeServices = seed.homeServices;
      if (!newDb.staff.length) newDb.staff = seed.staff;
      if (!newDb.doctors.length) newDb.doctors = seed.doctors;
      if (!newDb.merchants.length) newDb.merchants = seed.merchants;

      if (!Schema.validate(newDb)) return { migrated: false, reason: 'validation-failed' };

      Store.save(newDb);
      try {
        localStorage.setItem(MIGRATED_KEY, JSON.stringify({
          at: Date.now(), version: VERSION, from: 'v4',
          usersMigrated, passwordsHashed
        }));
      } catch (_) {}

      return { migrated: true, usersMigrated, passwordsHashed };
    } catch (e) {
      console.warn('[Migration] فشلت:', e);
      return { migrated: false, reason: 'exception', error: String(e) };
    }
  }

        // Try migration first
        const migrationResult = migrateFromV4();
        if (migrationResult.migrated) {
          console.log(`%c✅ [BOOT] تم الترحيل: ${migrationResult.usersMigrated} مستخدم`, 'color:#059669;font-weight:900');
          db = Store.load();
          usedMigration = true;
        }

        // If migration didn't work or DB still invalid, use seed
        if (!db || !Schema.validate(db)) {
          console.log('%c🌱 [BOOT] استخدام البيانات الأولية...', 'color:#EA580C;font-weight:900');
          db = buildSeed();
          Store.save(db);
          usedSeed = true;
          console.log('%c🌱 [BOOT] تم تثبيت البيانات الأولية', 'color:#0284C7;font-weight:900');
        }
      } else {
        console.log(`%c✅ [BOOT] DB صالحة (${db.users.length} مستخدم)`, 'color:#059669;font-weight:900');
      }

      // Step 2: Verify chain
      const chain = EventLog.verifyChain();
      if (!chain.ok) {
        console.warn(`⚠️ [BOOT] سلسلة الأحداث مكسورة عند #${chain.brokenAt}`);

        ts: Date.now(),
        usersCount: db.users.length,
        eventCount: EventLog.count(),
        usedSeed,
        usedMigration

      setTopbarCount(db.users.length);

            </p>
            <div style="background:var(--bg-muted);padding:12px;border-radius:var(--radius-sm);font-family:monospace;font-size:11.5px;line-height:1.9;color:var(--text-primary);">
              <div style="margin-bottom:8px;"><strong>WaslaCore.inspect()</strong> — عرض الحالة</div>
              <div style="margin-bottom:8px;"><strong>diagnoseWasla()</strong> — تشخيص تفصيلي</div>
              <div><strong>WaslaCore.reset()</strong> — إعادة تثبيت</div>
            </div>
          </div>

          <div class="card" style="background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-color:#F59E0B;">
            <div style="text-align:center;">
              <i class="fa-solid fa-info-circle" style="font-size:28px;color:#D97706;margin-bottom:8px;"></i>

  // ══════════════════════════════════════════════════════════════
  // SECTION 11: EXPOSE WaslaCore IMMEDIATELY (before boot)
  // ══════════════════════════════════════════════════════════════
  window.WaslaCore = {
    version: VERSION,
    Utils, UI, Crypto, EventLog, Store, Schema,
    db: () => Store.load(),
    inspect: () => {
      try {
        const db = Store.load();
        return {
          version: VERSION,
          hasDb: !!db,
          isValid: db ? Schema.validate(db) : false,
          users: db && Array.isArray(db.users) ? db.users.length : 0,
          doctors: db && Array.isArray(db.doctors) ? db.doctors.length : 0,
          merchants: db && Array.isArray(db.merchants) ? db.merchants.length : 0,
          events: EventLog.count(),
          chain: EventLog.verifyChain(),
          migratedAt: localStorage.getItem(MIGRATED_KEY)
        };
      } catch (e) {
        return { error: String(e) };
      }
    },
    reset: () => {
      if (confirm('⚠️ حذف كل البيانات والعودة للأصل؟')) {
        try {
          localStorage.removeItem(DB_KEY);
          localStorage.removeItem(EVENT_KEY);
          localStorage.removeItem(SESSION_KEY);
          localStorage.removeItem(MIGRATED_KEY);
          localStorage.removeItem('wasla_med_v4');
        } catch (_) {}
        location.reload();
      }
    }
  };

  window.diagnoseWasla = () => {
    const result = {
      timestamp: new Date().toISOString(),
      part: 'PART 2',
      version: VERSION,
      checks: {}
    };

    try {
      localStorage.setItem('_test_wasla', '1');
      localStorage.removeItem('_test_wasla');
      result.checks.localStorage = 'OK ✅';
    } catch (e) {
      result.checks.localStorage = 'BLOCKED ❌ (' + String(e) + ')';
    }

    try {
      const db = Store.load();
      result.checks.dbExists = !!db;
      result.checks.dbValid = db ? Schema.validate(db) : false;
      result.checks.usersCount = db && Array.isArray(db.users) ? db.users.length : 0;
    } catch (e) {
      result.checks.dbError = String(e);
    }

    try {
      result.checks.eventCount = EventLog.count();
      result.checks.chainStatus = EventLog.verifyChain();
    } catch (e) {
      result.checks.eventError = String(e);
    }

    result.checks.waslaCoreExists = !!window.WaslaCore;
    result.checks.topbarCount = Utils.$('#topbar-users-count')?.textContent;

    return result;
  };

  console.log('%c✅ [PART 2] WaslaCore exposed globally', 'color:#059669;font-weight:900');

  // ══════════════════════════════════════════════════════════════
  // SECTION 12: RUN BOOT
  // ══════════════════════════════════════════════════════════════
  if (document.readyState === 'loading') {

  } else {
    boot();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') UI.closeAllModals();
  });

  document.addEventListener('click', (e) => {
    const overlay = e.target.closest('.modal-overlay');
    if (overlay && overlay.id !== 'modal-loading' && e.target === overlay) {
      overlay.classList.remove('open');
    }
  });

})();

  border: 1px solid rgba(255, 255, 255, 0.14); border-radius: var(--radius-full);
  cursor: pointer; font-family: inherit; transition: background 0.15s ease; flex-shrink: 0;
}
.header-user-btn:hover { background: rgba(255, 255, 255, 0.16); }
.header-user-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--sector-medical), #10B981);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 900; flex-shrink: 0;
}
.header-user-name {
  font-size: 11.5px; font-weight: 800; color: #fff;
  white-space: nowrap; max-width: 100px; overflow: hidden; text-overflow: ellipsis;
}
@media (max-width: 500px) {
  .header-user-name { display: none; }
  .header-user-btn { padding: 3px; border-radius: 50%; }
}
.auth-demo-box {
  margin-top: 16px; padding: 12px; background: var(--bg-muted);
  border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
  font-size: 11px; color: var(--text-muted); line-height: 1.9;
}
.auth-demo-box strong { color: var(--text-primary); }
.auth-demo-box code { background: #fff; padding: 1px 6px; border-radius: 3px; font-family: monospace; font-size: 10.5px; }
.notif-item {
  padding: 12px; background: var(--bg-muted); border-radius: var(--radius-sm);
  margin-bottom: 8px; border-right: 3px solid var(--border-default);
}
.notif-item.unread { background: var(--sector-medical-soft); border-right-color: var(--sector-medical); }
.notif-time { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
.notif-text { font-size: 12.5px; font-weight: 800; color: var(--text-primary); }
.sector-card {
  background: var(--bg-card); border-radius: var(--radius-md);
  border: 1px solid var(--border-default); padding: 20px 12px;
  text-align: center; cursor: pointer; transition: all 0.2s ease;
}
.sector-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--border-strong); }
.sector-card-icon {
  width: 52px; height: 52px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; margin: 0 auto 10px;
}
.sector-card-title { font-size: 13.5px; font-weight: 900; color: var(--text-primary); margin-bottom: 4px; }
.sector-card-desc { font-size: 10.5px; color: var(--text-muted); font-weight: 700; line-height: 1.4; }
</style>

<script>
(function WASLA_PART_3() {
  'use strict';

  if (!window.WaslaCore) {
    console.error('❌ PART 3 requires PART 2 — WaslaCore not found');
    return;
  }

  console.log('%c🔐 [PART 3] بدء تحميل Auth + Router...', 'color:#8B5CF6;font-weight:900');

  const { Utils, UI, Crypto, EventLog, Store } = window.WaslaCore;
  const SESSION_KEY = 'wasla_v5_session';

  // ══════════════════════════════════════════════════════════════
  // SECTION 1: AUTH
  // ══════════════════════════════════════════════════════════════
  const Auth = {
    login(phone, password) {
      const db = Store.load();
      if (!db) return { ok: false, msg: 'قاعدة البيانات غير متاحة' };
      const user = db.users.find(u => u.phone === phone);
      if (!user) { EventLog.log('login_failed', { phone, reason: 'not_found' }); return { ok: false, msg: 'رقم الموبايل غير مسجل' }; }
      if (user.status === 'suspended') return { ok: false, msg: 'الحساب موقوف — تواصل مع الإدارة' };
      if (!Crypto.verify(password, user.passHash, user.salt)) { EventLog.log('login_failed', { phone, reason: 'wrong_password', actorId: user.id }); return { ok: false, msg: 'كلمة السر غير صحيحة' }; }
      
      const session = { userId: user.id, context: user.currentContext || (user.contexts && user.contexts[0]) || 'citizen', loginAt: Date.now() };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      EventLog.log('login_success', { actorId: user.id, phone, role: user.role, context: session.context });
      return { ok: true, user };
    },

    register(name, phone, password) {
      const db = Store.load();
      if (!db) return { ok: false, msg: 'قاعدة البيانات غير متاحة' };
      if (db.users.find(u => u.phone === phone)) return { ok: false, msg: 'الرقم مسجل بالفعل — سجل دخول' };
      
      const { hash, salt } = Crypto.create(password);
      const newUser = { 
        id: 'u-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), 
        phone, name: name.trim(), passHash: hash, salt, 
        role: 'patient', contexts: ['citizen'], currentContext: 'citizen', 
        wallet: 0, points: 0, waslaId: 'WASLA-' + Math.floor(10000 + Math.random() * 90000), 
        emr: { blood: 'غير محدد', allergies: [], chronic: [], vitals: [], currentMeds: [], pastMeds: [], labs: [], visitNotes: [] }, 
        familyIds: [], successfulOrders: 0, cancellations: 0, status: 'active', createdAt: Date.now() 
      };
      
      db.users.push(newUser);
      Store.save(db);
      
      const session = { userId: newUser.id, context: 'citizen', loginAt: Date.now() };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      EventLog.log('register', { actorId: newUser.id, phone, name, waslaId: newUser.waslaId });
      return { ok: true, user: newUser };
    },

    logout() { 
      const session = this.getSession(); 
      if (session) EventLog.log('logout', { actorId: session.userId }); 
      sessionStorage.removeItem(SESSION_KEY); 
    },

    getSession() { 
      try { const raw = sessionStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch (_) { return null; } 
    },

    getCurrentUser() { 
      const session = this.getSession(); 
      if (!session) return null; 
      const db = Store.load(); 
      if (!db) return null; 
      return db.users.find(u => u.id === session.userId) || null; 
    },

    getCurrentContext() { 
      const session = this.getSession(); return session ? session.context : null; 
    },

    switchContext(newContext) {
      const session = this.getSession(); if (!session) return false;
      const user = this.getCurrentUser(); if (!user) return false;
      if (!(user.contexts || ['citizen']).includes(newContext)) return false;
      
      session.context = newContext; sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      const db = Store.load(); const u = db.users.find(x => x.id === user.id);
      if (u) { u.currentContext = newContext; Store.save(db); }
      EventLog.log('context_switched', { actorId: user.id, context: newContext });
      return true;
    }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 2: AUTH UI
  // ══════════════════════════════════════════════════════════════
  const AuthUI = {
    open(mode = 'login') {
      const body = Utils.$('#modal-auth-body');
      if (!body) return;
      body.innerHTML = `
        <button class="modal-close" onclick="UI.modal('modal-auth', { open: false })">
          <i class="fa-solid fa-xmark"></i>
        </button>
        ${mode === 'login' ? this._loginForm() : this._registerForm()}
      `;
      UI.modal('modal-auth', { open: true });
      setTimeout(() => { const first = body.querySelector('input'); if (first) first.focus(); }, 200);
    },

    _loginForm() {
      return `
        <div style="text-align:center;margin-bottom:20px;">
          <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--sector-medical),#10B981);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;margin:0 auto 10px;box-shadow:0 8px 22px rgba(5,150,105,0.35);">
            <i class="fa-solid fa-heart-pulse"></i>
          </div>
          <h3 style="font-size:18px;font-weight:900;">دخول وصلة</h3>
          <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">مرحباً بك مجدداً</p>
        </div>
        <label class="label">رقم الموبايل</label>
        <input type="tel" id="login-phone" class="input" placeholder="01xxxxxxxxx" maxlength="11" style="margin-bottom:12px;" autocomplete="tel" />
        <label class="label">كلمة السر</label>
        <input type="password" id="login-pass" class="input" placeholder="********" style="margin-bottom:16px;" autocomplete="current-password" />
        <button class="btn btn-primary btn-block" onclick="AuthUI._submitLogin()">
          <i class="fa-solid fa-right-to-bracket"></i> دخول
        </button>
        <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:16px;font-weight:700;">
          ليس لديك حساب؟ <a style="color:var(--sector-medical);font-weight:900;cursor:pointer;" onclick="AuthUI.open('register')">سجّل الآن</a>
        </p>
        <div class="auth-demo-box">
          <strong>🔑 حسابات تجريبية:</strong><br>
          👑 مؤسس: <code>01068990089</code> / <code>As123789456*</code><br>
          🧑 مريض: <code>01000000001</code> / <code>123456</code><br>
          🩺 طبيب: <code>01000000002</code> / <code>123456</code><br>
          🎧 موظف: <code>01000000003</code> / <code>123456</code><br>
          🏪 تاجر: <code>01000000004</code> / <code>123456</code>
        </div>
      `;
    },

    _registerForm() {
      return `
        <div style="text-align:center;margin-bottom:20px;">
          <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--sector-medical),#10B981);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;margin:0 auto 10px;box-shadow:0 8px 22px rgba(5,150,105,0.35);">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h3 style="font-size:18px;font-weight:900;">حساب جديد</h3>
          <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">انضم لشبكة وصلة</p>
        </div>
        <label class="label">الاسم الثلاثي</label>
        <input type="text" id="reg-name" class="input" placeholder="محمد أحمد علي" style="margin-bottom:12px;" autocomplete="name" />
        <label class="label">رقم الموبايل</label>
        <input type="tel" id="reg-phone" class="input" placeholder="01xxxxxxxxx" maxlength="11" style="margin-bottom:12px;" autocomplete="tel" />
        <label class="label">كلمة السر</label>
        <input type="password" id="reg-pass" class="input" placeholder="6 أحرف على الأقل" style="margin-bottom:16px;" autocomplete="new-password" />
        <button class="btn btn-primary btn-block" onclick="AuthUI._submitRegister()">
          <i class="fa-solid fa-user-plus"></i> إنشاء الحساب
        </button>
        <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:16px;font-weight:700;">
          لديك حساب؟ <a style="color:var(--sector-medical);font-weight:900;cursor:pointer;" onclick="AuthUI.open('login')">دخول</a>
        </p>
      `;
    },

    async _submitLogin() {
      const phone = Utils.$('#login-phone').value.trim();
      const pass = Utils.$('#login-pass').value;
      if (!Utils.isValidPhone(phone)) return UI.toast('رقم موبايل غير صحيح (01xxxxxxxxx)', 'error');
      if (!pass) return UI.toast('أدخل كلمة السر', 'error');
      UI.loading('جاري الدخول...'); await Utils.sleep(250);
      const result = Auth.login(phone, pass); UI.stopLoading();
      if (result.ok) {
        UI.modal('modal-auth', { open: false });
        UI.toast(`مرحباً ${result.user.name.split(' ')[0]} 👋`);
        initApp();
      } else UI.toast(result.msg, 'error');
    },

    async _submitRegister() {
      const name = Utils.$('#reg-name').value.trim();
      const phone = Utils.$('#reg-phone').value.trim();
      const pass = Utils.$('#reg-pass').value;
      if (!Utils.isValidName(name)) return UI.toast('أدخل الاسم الثلاثي كاملاً', 'error');
      if (!Utils.isValidPhone(phone)) return UI.toast('رقم موبايل غير صحيح', 'error');
      if (pass.length < 6) return UI.toast('كلمة السر 6 أحرف على الأقل', 'error');
      UI.loading('جاري إنشاء الحساب...'); await Utils.sleep(250);
      const result = Auth.register(name, phone, pass); UI.stopLoading();
      if (result.ok) {
        UI.modal('modal-auth', { open: false });
        UI.toast(`مرحباً ${name.split(' ')[0]} 🎉 حسابك جاهز`);
        initApp();
      } else UI.toast(result.msg, 'error');
    },

    async _confirmLogout() {
      const ok = await UI.confirm('هل تريد الخروج من وصلة؟', { title: 'تسجيل الخروج', confirmText: 'خروج', cancelText: 'إلغاء', danger: true });
      if (!ok) return;
      Auth.logout(); UI.toast('تم تسجيل الخروج', 'info'); initApp();
    }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 3: ROUTER
  // ══════════════════════════════════════════════════════════════
  const Router = {
    registry: {},
    current: null,
    _sectorViews: ['medical', 'grocery', 'cars', 'home-services', 'live', 'auction'],

    register(viewName, rendererFn) { this.registry[viewName] = rendererFn; return this; },

    go(viewName, params) {
      if (!this.registry[viewName]) { console.warn(`[Router] View "${viewName}" not registered`); this._renderNotFound(viewName); return; }
      this.current = viewName;
      const container = Utils.$('#main-container'); if (!container) return;
      container.innerHTML = '';
      const viewEl = document.createElement('div');
      viewEl.id = 'view-' + viewName; viewEl.className = 'view active';
      container.appendChild(viewEl);
      try { this.registry[viewName](viewEl, params || {}); }
      catch (err) { 
        console.error('[Router] Render error:', err); 
        viewEl.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation empty-state-icon" style="color:var(--color-danger);"></i><p class="empty-state-title">حدث خطأ</p><p class="empty-state-desc">تعذر تحميل الصفحة</p></div>`; 
      }
      this.updateActiveTab(viewName);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    updateActiveTab(viewName) {
      const isSector = this._sectorViews.includes(viewName);
      const activeTab = isSector ? 'home' : viewName;
      Utils.$$('.app-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === activeTab));
    },

    _renderNotFound(viewName) {
      const container = Utils.$('#main-container'); if (!container) return;
      container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-question empty-state-icon"></i><p class="empty-state-title">صفحة غير موجودة</p><p class="empty-state-desc">${Utils.escape(viewName)}</p><button class="btn btn-primary" style="margin-top:16px;" onclick="Router.go('home')">الرئيسية</button></div>`;
    }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 4: HEADER & NAVIGATION
  // ══════════════════════════════════════════════════════════════
  function renderHeader() {
    const el = Utils.$('#header-actions'); if (!el) return;
    const user = Auth.getCurrentUser();
    if (!user) {
      el.innerHTML = `<button class="icon-btn" onclick="AuthUI.open('login')" title="دخول" style="width:auto;padding:0 14px;gap:6px;font-size:12px;font-weight:900;"><i class="fa-solid fa-right-to-bracket"></i><span>دخول</span></button>`;
      return;
    }
    const db = Store.load();
    const unread = (db.notifications || []).filter(n => n.userId === user.id && !n.read).length;
    el.innerHTML = `
      <button class="icon-btn" onclick="NotificationsPanel.open()" title="الإشعارات">
        <i class="fa-solid fa-bell"></i>
        ${unread > 0 ? `<span class="badge">${unread > 9 ? '9+' : unread}</span>` : ''}
      </button>
      <button class="header-user-btn" onclick="Router.go('account')" title="حسابي">
        <div class="header-user-avatar">${Utils.escape(user.name.charAt(0))}</div>
        <span class="header-user-name">${Utils.escape(user.name.split(' ')[0])}</span>
      </button>
      <button class="icon-btn" onclick="AuthUI._confirmLogout()" title="خروج">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    `;
  }

  const ContextSwitcher = {
    toggle() {
      const user = Auth.getCurrentUser(); if (!user) return;
      const contexts = user.contexts || ['citizen']; if (contexts.length < 2) return;
      const current = Auth.getCurrentContext() || 'citizen';
      const other = contexts.find(c => c !== current);
      if (other) this.switchTo(other);
    },
    async switchTo(context) {
      const ok = Auth.switchContext(context);
      if (!ok) return UI.toast('لا يمكن التبديل لهذا الوضع', 'error');
      UI.toast('تم تبديل الوضع ✓', 'info');
      renderHeader(); renderContextSwitcher(); renderTabs();
      const defaultViews = { citizen: 'home', doctor: 'clinic', merchant: 'store', staff: 'reception', founder: 'founder' };
      Router.go(defaultViews[context] || 'home');
    }
  };

  function renderContextSwitcher() {
    const switcher = Utils.$('#context-switcher'); if (!switcher) return;
    const user = Auth.getCurrentUser();
    if (!user) return switcher.classList.remove('visible');
    const contexts = user.contexts || ['citizen'];
    if (contexts.length < 2) return switcher.classList.remove('visible');

    switcher.classList.add('visible');
    const current = Auth.getCurrentContext() || 'citizen';
    const labels = {
      citizen: { label: 'مواطن', icon: 'fa-user', color: '#0284C7' },
      doctor: { label: 'عيادتي', icon: 'fa-user-doctor', color: '#059669' },
      merchant: { label: 'متجري', icon: 'fa-store', color: '#EA580C' },
      staff: { label: 'الاستقبال', icon: 'fa-headset', color: '#7C3AED' },
      founder: { label: 'الإدارة', icon: 'fa-crown', color: '#D97706' }
    };
    const curr = labels[current] || labels.citizen;
    const other = contexts.find(c => c !== current);
    const otherLabel = labels[other] || labels.citizen;

    const iconEl = Utils.$('#context-icon');
    const labelEl = Utils.$('#context-label');
    const nameEl = Utils.$('#context-name');
    const btnEl = Utils.$('#context-switch-btn');

    if (iconEl) { iconEl.innerHTML = `<i class="fa-solid ${curr.icon}"></i>`; iconEl.style.background = curr.color + '22'; iconEl.style.color = curr.color; }
    if (labelEl) labelEl.textContent = 'الوضع الحالي';
    if (nameEl) nameEl.textContent = curr.label;
    if (btnEl) { btnEl.innerHTML = `<i class="fa-solid ${otherLabel.icon}"></i> <span>التبديل إلى ${otherLabel.label}</span>`; btnEl.onclick = () => ContextSwitcher.switchTo(other); }
  }

  function renderTabs() {
    const tabsEl = Utils.$('#app-tabs'); if (!tabsEl) return;
    const user = Auth.getCurrentUser();
    const context = Auth.getCurrentContext() || 'citizen';

    if (!user) {
      tabsEl.innerHTML = `<button class="app-tab active" data-tab="home" onclick="Router.go('home')"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button><button class="app-tab" data-tab="account" onclick="Router.go('account')"><i class="fa-solid fa-user"></i><span>حسابي</span></button>`;
      return;
    }

    const tabsByContext = {
      citizen: [ { id: 'home', label: 'الرئيسية', icon: 'fa-house' }, { id: 'orders', label: 'طلباتي', icon: 'fa-receipt' }, { id: 'account', label: 'حسابي', icon: 'fa-user' } ],
      doctor: [ { id: 'clinic', label: 'عيادتي', icon: 'fa-user-doctor' }, { id: 'my-patients', label: 'مرضاي', icon: 'fa-users' }, { id: 'account', label: 'حسابي', icon: 'fa-user' } ],
      merchant: [ { id: 'store', label: 'متجري', icon: 'fa-store' }, { id: 'store-orders', label: 'الطلبات', icon: 'fa-box' }, { id: 'account', label: 'حسابي', icon: 'fa-user' } ],
      staff: [ { id: 'reception', label: 'الاستقبال', icon: 'fa-headset' }, { id: 'schedule', label: 'الجدول', icon: 'fa-calendar' }, { id: 'account', label: 'حسابي', icon: 'fa-user' } ],
      founder: [ { id: 'founder', label: 'الإدارة', icon: 'fa-crown' }, { id: 'account', label: 'حسابي', icon: 'fa-user' } ]
    };

    const tabs = tabsByContext[context] || tabsByContext.citizen;
    tabsEl.innerHTML = tabs.map(t => `<button class="app-tab" data-tab="${t.id}" onclick="Router.go('${t.id}')"><i class="fa-solid ${t.icon}"></i><span>${t.label}</span></button>`).join('');
  }

  const NotificationsPanel = {
    open() {
      const user = Auth.getCurrentUser(); if (!user) return;
      const db = Store.load();
      const notifs = (db.notifications || []).filter(n => n.userId === user.id).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 30);
      const body = Utils.$('#modal-generic-body');
      body.innerHTML = `
        <button class="modal-close" onclick="UI.modal('modal-generic', { open: false })"><i class="fa-solid fa-xmark"></i></button>
        <h3 style="font-size:16px;font-weight:900;margin-bottom:16px;"><i class="fa-solid fa-bell" style="color:var(--sector-medical);"></i> الإشعارات</h3>
        ${notifs.length === 0 ? `<div class="empty-state" style="padding:32px 16px;"><i class="fa-solid fa-bell-slash empty-state-icon"></i><p class="empty-state-desc">لا توجد إشعارات</p></div>` : notifs.map(n => `<div class="notif-item ${!n.read ? 'unread' : ''}"><div class="notif-time">${Utils.timeAgo(n.ts)}</div><div class="notif-text">${Utils.escape(n.text)}</div></div>`).join('')}
      `;
      UI.modal('modal-generic', { open: true });
      const freshDb = Store.load();
      freshDb.notifications = (freshDb.notifications || []).map(n => n.userId === user.id ? { ...n, read: true } : n);
      Store.save(freshDb);
      renderHeader();
    }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 5: VIEWS
  // ══════════════════════════════════════════════════════════════
  function _sectorCard(sector, title, desc, icon) {
    const sectorVar = sector === 'home-services' ? 'home' : sector;
    return `
      <div class="sector-card" onclick="Router.go('${sector}')">
        <div class="sector-card-icon" style="background:var(--sector-${sectorVar}-soft);color:var(--sector-${sectorVar});border:1px solid var(--sector-${sectorVar}-border);"><i class="fa-solid ${icon}"></i></div>
        <h3 class="sector-card-title">${title}</h3>
        <p class="sector-card-desc">${desc}</p>
      </div>
    `;
  }

  Router.register('home', (el) => {
    const user = Auth.getCurrentUser();
    const db = Store.load();
    const firstName = user ? user.name.split(' ')[0] : '';

          a.originalPrice = (a.currentPrice || a.basePrice) * 2; a.minIncrement = 10;
          a.condition = 'متاح'; a.delivery = 'توصيل متاح';
          a.bidsCount = a.bidsCount || 0; a.watchers = a.watchers || 10; a.history = a.history || [];
          changed = true;
        }
      });
    }

    if (changed) {
      Store.save(db);
      EventLog.log('schema_extended_live_auction', { ts: Date.now() });
    }
  }

  // ══════════════════════════════════════════════════════════════
  // SECTION 2: LIVE VIEW
  // ══════════════════════════════════════════════════════════════
  window.Router.register('live', (el) => {
    const db = Store.load();
    const deals = db.liveDeals || [];

    el.innerHTML = `
      <div class="sector-hero" style="background: linear-gradient(120deg, #7F1D1D, #EF4444 55%, #F87171);">
        <span class="sector-hero-badge"><i class="fa-solid fa-satellite-dish"></i> وصلة لايف</span>
        <h1>رادار شبين القناطر</h1>
        <p>كل العروض والفرص اللحظية في مكان واحد.. اللي يسبق يكسب</p>
      </div>

      <div class="flex justify-between items-center" style="margin-bottom:16px;">
        <h2 class="section-title" style="margin:0;"><i class="fa-solid fa-bolt"></i> يحدث الآن</h2>
        <span class="live-indicator"><i class="fa-solid fa-circle" style="font-size:6px;"></i> بث مباشر</span>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;">
        ${deals.map(deal => `
          <div class="live-card">
            <div class="live-icon"><i class="fa-solid ${deal.icon}"></i></div>
            <div class="live-info">
              <div class="live-store">${Utils.escape(deal.store)}</div>
              <div class="live-deal">${Utils.escape(deal.text)}</div>
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:9px;color:#9CA3AF;font-weight:800;">${deal.time}</span>
                <button class="live-action" onclick="UI.toast('تم فتح العرض! توجه للمتجر/العيادة.')">احجز الآن</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  });

  // ══════════════════════════════════════════════════════════════
  // SECTION 3: AUCTION VIEW
  // ══════════════════════════════════════════════════════════════
  window.Router.register('auction', (el) => {
    const user = window.Auth.getCurrentUser();
    const db = Store.load();
    const auctions = (db.auctions || []).filter(a => a.status === 'active');

    el.innerHTML = `
      <div class="sector-hero" style="background: linear-gradient(120deg, #78350F, #D97706 55%, #F59E0B);">
        <span class="sector-hero-badge"><i class="fa-solid fa-gavel"></i> وصلة مزاد</span>
        <h1>مزاد الليل</h1>
        <p>زايد على بضاعة الاستوك والمواعيد الفاضية.. مين هياخد اللقطة؟</p>
      </div>

      ${!user ? `
        <div class="card text-center" style="border-color:var(--sector-gold);">
          <p class="empty-state-desc">سجل دخول عشان تشارك في المزاد</p>
          <button class="btn btn-primary" style="margin-top:12px;" onclick="AuthUI.open('login')">دخول</button>
        </div>
      ` : `
        <div style="background:var(--bg-card); border:1px solid var(--border-default); border-radius:var(--radius-md); padding:12px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:10px; font-weight:900; color:var(--text-muted);">رصيدك الحالي</div>
            <div style="font-size:18px; font-weight:900; color:var(--sector-gold);">${Utils.money(user.wallet || 0)}</div>
          </div>
          <div style="text-align:left;">
            <div style="font-size:10px; font-weight:900; color:var(--text-muted);">نقاطك</div>
            <div style="font-size:14px; font-weight:900; color:var(--sector-medical);">${user.points || 0} 🪙</div>
          </div>
        </div>
      `}

      <div id="auction-list">
        ${auctions.length === 0 ? `<div class="empty-state"><p class="empty-state-desc">لا يوجد مزادات حالياً.. عود قريباً</p></div>` : auctions.map(a => renderAuctionCard(a, user)).join('')}
      </div>
    `;
    startAuctionTimers();
  });

  function renderAuctionCard(a, user) {
    const isWinning = a.highestBidder === (user ? user.id : null);
    const timeLeft = Math.max(0, a.endsAt - Date.now());
    const mins = Math.floor(timeLeft / 60000);
    const secs = Math.floor((timeLeft % 60000) / 1000);
    const discount = a.originalPrice ? Math.round(((a.originalPrice - a.currentPrice) / a.originalPrice) * 100) : 0;
    
    const catColors = { 'خضار وفاكهة': 'var(--sector-medical)', 'خدمات سيارات': 'var(--sector-cars)', 'خدمات طبية': 'var(--sector-home)' };
    const catColor = catColors[a.category] || 'var(--sector-gold)';
    
    return `
      <div class="auction-card" data-auction-id="${a.id}" style="border-color:${catColor};">
        
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div class="auction-timer">
            <i class="fa-solid fa-clock"></i> <span class="timer-text">${mins}:${String(secs).padStart(2, '0')}</span>
          </div>
          <div style="display:flex;gap:6px;">
            <span class="tag" style="background:${catColor}22; color:${catColor}; border:1px solid ${catColor}44; font-size:9px;">
              ${a.category}
            </span>
            <span class="tag tag-warning" style="font-size:9px;">
              👁️ ${a.watchers}
            </span>
          </div>
        </div>
        
        <div class="auction-item">
          <div class="auction-icon" style="background:${catColor}22; color:${catColor};">
            <i class="fa-solid ${a.icon}"></i>
          </div>
          <div style="flex:1;min-width:0;">
            <div class="auction-title">${Utils.escape(a.title)}</div>
            <div class="auction-desc">${Utils.escape(a.desc)}</div>
            <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;font-size:10.5px;font-weight:800;color:var(--text-muted);">
              <span><i class="fa-solid fa-user"></i> ${Utils.escape(a.seller)}</span>
              <span><i class="fa-solid fa-star" style="color:#F59E0B;"></i> ${a.sellerRating}</span>
              <span><i class="fa-solid fa-location-dot"></i> ${Utils.escape(a.location)}</span>
            </div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;">
          <div style="background:var(--bg-muted);padding:8px 6px;border-radius:8px;text-align:center;">
            <div style="font-size:9px;color:var(--text-muted);font-weight:800;">الكمية</div>
            <div style="font-size:12px;font-weight:900;color:var(--text-primary);">${a.quantity} ${Utils.escape(a.unit)}</div>
          </div>
          <div style="background:var(--bg-muted);padding:8px 6px;border-radius:8px;text-align:center;">
            <div style="font-size:9px;color:var(--text-muted);font-weight:800;">الحالة</div>
            <div style="font-size:11px;font-weight:900;color:var(--text-primary);">${Utils.escape(a.condition)}</div>
          </div>
          <div style="background:var(--bg-muted);padding:8px 6px;border-radius:8px;text-align:center;">
            <div style="font-size:9px;color:var(--text-muted);font-weight:800;">التوصيل</div>
            <div style="font-size:10px;font-weight:900;color:var(--text-primary);">${Utils.escape(a.delivery)}</div>
          </div>
        </div>

        <div class="auction-bid-box" style="display:flex;flex-direction:column;align-items:stretch;gap:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="text-align:right;">
              <div class="auction-current-bid">أعلى مزايدة</div>
              <div class="auction-price" style="color:${catColor};">${Utils.money(a.currentPrice)}</div>
              ${isWinning ? `<div class="auction-winner">🎉 أنت الأعلى حالياً!</div>` : ''}
            </div>
            <div style="text-align:left;">
              <div style="font-size:10px;color:var(--text-muted);font-weight:800;">السعر الأصلي</div>
              <div style="font-size:14px;font-weight:900;color:var(--text-secondary);text-decoration:line-through;">${Utils.money(a.originalPrice)}</div>
              ${discount > 0 ? `<div style="font-size:10px;color:var(--sector-medical);font-weight:900;">خصم ${discount}%</div>` : ''}
            </div>
          </div>
          
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-size:10.5px;color:var(--text-muted);font-weight:800;">
              <i class="fa-solid fa-gavel"></i> ${a.bidsCount} مزايدة
            </div>
            <div style="display:flex;gap:6px;">
              <button class="bid-btn" style="width:auto;padding:8px 14px;background:linear-gradient(135deg,${catColor},#10B981);" ${!user ? 'disabled' : ''} onclick="AuctionEngine.bid('${a.id}', ${a.minIncrement})">
                <i class="fa-solid fa-plus"></i> ${a.minIncrement} ج.م
              </button>
              <button class="bid-btn" style="width:auto;padding:8px 14px;background:linear-gradient(135deg,var(--sector-gold),#D97706);" ${!user ? 'disabled' : ''} onclick="AuctionEngine.bid('${a.id}', 50)">
                <i class="fa-solid fa-plus"></i> 50 ج.م
              </button>
            </div>
          </div>
        </div>

        ${a.history && a.history.length > 0 ? `
          <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-default);">
            <div style="font-size:10px;color:var(--text-muted);font-weight:900;margin-bottom:6px;"><i class="fa-solid fa-clock-rotate-left"></i> آخر المزايدات:</div>
            ${a.history.slice(-3).reverse().map(h => `
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;padding:3px 0;">
                <span style="color:var(--text-primary);"><i class="fa-solid fa-user-circle" style="color:${catColor};"></i> ${Utils.escape(h.bidderName)}</span>
                <span style="color:${catColor};">${Utils.money(h.amount)} · ${Utils.timeAgo(h.ts)}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  // ══════════════════════════════════════════════════════════════
  // SECTION 4: AUCTION ENGINE
  // ══════════════════════════════════════════════════════════════
  window.AuctionEngine = {
    bid(auctionId, amount) {
      const user = window.Auth.getCurrentUser();
      if (!user) return window.AuthUI.open();
      const db = Store.load();
      const auction = db.auctions.find(a => a.id === auctionId);
      if (!auction || auction.status !== 'active') return UI.toast('المزاد انتهى', 'error');
      const newPrice = auction.currentPrice + amount;
      if ((user.wallet || 0) < newPrice) return UI.toast('رصيدك غير كافي! اشحن محفظتك عشان تشارك.', 'error');

      auction.currentPrice = newPrice;
      auction.highestBidder = user.id;
      auction.bidsCount = (auction.bidsCount || 0) + 1;
      
      if (!auction.history) auction.history = [];
      auction.history.push({ bidderId: user.id, bidderName: user.name.split(' ')[0], amount: newPrice, ts: Date.now() });
      
      Store.save(db);
      EventLog.log('auction_bid', { actorId: user.id, targetId: auctionId, payload: { amount, newPrice, bidsCount: auction.bidsCount } });
      UI.toast(`مزايدتك نجحت! أنت الأعلى الآن بـ ${Utils.money(newPrice)}`, 'success');
      window.Router.go('auction');
    },

    processExpired() {
      const db = Store.load();
      let changed = false;
      (db.auctions || []).forEach(a => {
        if (a.status === 'active' && a.endsAt <= Date.now()) {
          a.status = 'ended'; changed = true;
          if (a.highestBidder) {
            const winner = db.users.find(u => u.id === a.highestBidder);
            if (winner && (winner.wallet || 0) >= a.currentPrice) {
              winner.wallet -= a.currentPrice;
              db.notifications = db.notifications || [];
              db.notifications.push({ id: Utils.id('notif'), userId: winner.id, text: `🎉 مبروك! لقد فزت في المزاد: ${a.title} بـ ${Utils.money(a.currentPrice)}`, read: false, ts: Date.now() });
            }
          }
        }
      });
      if (changed) { Store.save(db); if (Utils.$('#view-auction')) window.Router.go('auction'); }
    }
  };

  let auctionTimerInterval = null;
  function startAuctionTimers() {
    if (auctionTimerInterval) clearInterval(auctionTimerInterval);
    auctionTimerInterval = setInterval(() => {
      const cards = Utils.$$('.auction-card');
      if (cards.length === 0) return;
      cards.forEach(card => {
        const auctionId = card.getAttribute('data-auction-id');
        const db = Store.load();
        const auction = db.auctions.find(a => a.id === auctionId);
        if (!auction) return;
        const timeLeft = Math.max(0, auction.endsAt - Date.now());
        const mins = Math.floor(timeLeft / 60000);
        const secs = Math.floor((timeLeft % 60000) / 1000);
        const timerText = card.querySelector('.timer-text');
        if (timerText) timerText.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
        if (timeLeft === 0) {
          card.style.opacity = '0.5';
          card.querySelectorAll('.bid-btn').forEach(btn => btn.disabled = true);
        }
      });
      if (Math.random() < 0.2) window.AuctionEngine.processExpired();
    }, 1000);
  }

  // ══════════════════════════════════════════════════════════════
  // SECTION 5: HOME INTEGRATION & SOCIAL PROOF
  // ══════════════════════════════════════════════════════════════
  const originalRenderHome = window.Router.registry['home'];
  window.Router.register('home', (el) => {
    originalRenderHome.call(window.Router, el);
    const db = Store.load();
    const liveCount = (db.liveDeals || []).length;
    const activeAuctions = (db.auctions || []).filter(a => a.status === 'active').length;

    const bombsHTML = `
      <h2 class="section-title" style="margin-top:20px;"><i class="fa-solid fa-bomb" style="color:#EF4444;"></i> مفاجآت وصلة</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
        <div class="sector-card" style="background:linear-gradient(135deg,#1F2937,#111827);color:#fff;border:none;position:relative;overflow:hidden;" onclick="Router.go('live')">
          <div class="live-indicator" style="position:absolute;top:10px;right:10px;"><i class="fa-solid fa-circle" style="font-size:6px;"></i> بث</div>
          <div class="sector-card-icon" style="background:rgba(239,68,68,0.2);color:#F87171;"><i class="fa-solid fa-satellite-dish"></i></div>
          <h3 class="sector-card-title" style="color:#fff;">وصلة لايف</h3>
          <p class="sector-card-desc" style="color:#D1D5DB;">${liveCount} عروض لحظية</p>
        </div>
        <div class="sector-card" style="background:linear-gradient(135deg,#78350F,#D97706);color:#fff;border:none;" onclick="Router.go('auction')">
          <div class="sector-card-icon" style="background:rgba(255,255,255,0.2);color:#fff;"><i class="fa-solid fa-gavel"></i></div>
          <h3 class="sector-card-title" style="color:#fff;">وصلة مزاد</h3>
          <p class="sector-card-desc" style="color:#FEF3C7;">${activeAuctions} مزادات شغالة</p>
        </div>
      </div>
    `;
    const grid = el.querySelector('div[style*="grid-template-columns"]');
    if (grid) grid.insertAdjacentHTML('afterend', bombsHTML);
  });

  // ══════════════════════════════════════════════════════════════
  // SECTION 6: OBSERVERS (Header Button + Social Proof)
  // ══════════════════════════════════════════════════════════════
  const observer = new MutationObserver(() => {
    // 1. إضافة زر اللايف في الهيدر
    const headerActions = Utils.$('#header-actions');
    if (headerActions && window.Auth.getCurrentUser() && !headerActions.querySelector('.live-btn')) {
      const liveBtn = document.createElement('button');
      liveBtn.className = 'icon-btn live-btn';
      liveBtn.innerHTML = `<i class="fa-solid fa-satellite-dish" style="color:#F87171;"></i>`;
      liveBtn.onclick = () => window.Router.go('live');
      liveBtn.title = "وصلة لايف";
      const notifBtn = headerActions.querySelector('.icon-btn');
      if (notifBtn) headerActions.insertBefore(liveBtn, notifBtn);
      else headerActions.appendChild(liveBtn);
    }

    // 2. إضافة شارات المشاهدين (Social Proof)
    function getStableRandom(id, base = 5, range = 20) {
      let hash = 0; const str = String(id);
      for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0; return base + (Math.abs(hash) % range);
    }

    Utils.$$('.doctor-card').forEach(card => {
      if (!card.querySelector('.live-viewers-badge')) {
        const docName = card.querySelector('.doctor-name')?.textContent.trim() || 'doc';
        const viewers = getStableRandom(docName, 4, 12);
        const infoBox = card.querySelector('.doctor-info');
        if (infoBox) infoBox.insertAdjacentHTML('beforeend', `<div class="live-viewers-badge" style="margin-top:6px;"><span class="pulse"></span> ${viewers} يتصفحون العيادة الآن</div>`);
      }
    });

    Utils.$$('.merchant-card').forEach(card => {
      if (!card.querySelector('.live-viewers-badge')) {
        const storeName = card.querySelector('.merchant-name')?.textContent.trim() || 'store';
        const actionCount = getStableRandom(storeName, 6, 15);
        const metaBox = card.querySelector('.merchant-stats');
        if (metaBox) metaBox.insertAdjacentHTML('afterend', `<div class="live-viewers-badge fire" style="margin-top:8px;"><i class="fa-solid fa-fire"></i> ${actionCount} طلبوا من هنا النهاردة</div>`);
      }
    });

    Utils.$$('.service-card').forEach(card => {
      if (!card.querySelector('.live-viewers-badge')) {
        const serviceName = card.querySelector('.service-card-name')?.textContent.trim() || 'service';
        const actionCount = getStableRandom(serviceName, 3, 10);
        const infoBox = card.querySelector('.service-card-info');
        if (infoBox) infoBox.insertAdjacentHTML('beforeend', `<div class="live-viewers-badge fire" style="margin-top:6px;"><i class="fa-solid fa-bolt"></i> ${actionCount} طلبوا الخدمة اليوم</div>`);
      }
    });

    Utils.$$('.sector-card').forEach(card => {
      if (card.classList.contains('sector-card') && !card.querySelector('.live-viewers-badge') && !card.querySelector('style[data-injected="true"]')) {
        const sectorTitle = card.querySelector('.sector-card-title')?.textContent.trim() || 'sector';
        const activeCount = getStableRandom(sectorTitle, 10, 30);
        const desc = card.querySelector('.sector-card-desc');
        if (desc && !desc.parentElement.querySelector('style[data-injected="true"]')) {
          const badge = document.createElement('div');
          badge.className = 'sector-live-badge';
          badge.style.cssText = 'font-size:9px; color:var(--text-muted); margin-top:4px; font-weight:800;';
          badge.innerHTML = `<i class="fa-solid fa-circle" style="color:var(--sector-medical); font-size:5px; margin-left:2px;"></i> ${activeCount} نشط الآن`;
          desc.insertAdjacentElement('afterend', badge);
          const styleTag = document.createElement('style');
          styleTag.setAttribute('data-injected', 'true');
          badge.appendChild(styleTag);
        }
      }
    });
  });

  function boot() {
    extendSchema();
    if (window.Router && window.Router.current === 'home') window.Router.go('home');
    const targetNode = Utils.$('body');
    if (targetNode) observer.observe(targetNode, { childList: true, subtree: true });
    console.log('%c💣 [PART 4] LIVE, AUCTION & SOCIAL PROOF READY', 'background:#EF4444;color:#fff;padding:6px 14px;border-radius:6px;font-weight:900;font-size:12px');
  }

  setTimeout(boot, 400);

})();
</script>
</html>
