<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0B1220" />
<title>منصة وصلة | WASLA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root {
  --brand-ink: #0B1220;
  --brand-ink-soft: #1E293B;
  --sector-medical: #059669;
  --sector-medical-soft: #ECFDF5;
  --sector-medical-border: rgba(5, 150, 105, 0.18);
  --sector-grocery: #EA580C;
  --sector-grocery-soft: #FFF7ED;
  --sector-grocery-border: rgba(234, 88, 12, 0.18);
  --sector-cars: #0284C7;
  --sector-cars-soft: #F0F9FF;
  --sector-cars-border: rgba(2, 132, 199, 0.18);
  --sector-home: #7C3AED;
  --sector-home-soft: #F5F3FF;
  --sector-home-border: rgba(124, 58, 237, 0.18);
  --sector-gold: #D97706;
  --sector-gold-soft: #FEF3C7;
  --color-success: #059669;
  --color-success-soft: #ECFDF5;
  --color-warning: #EA580C;
  --color-warning-soft: #FFF7ED;
  --color-danger: #E11D48;
  --color-danger-soft: #FFF1F2;
  --color-info: #0284C7;
  --color-info-soft: #F0F9FF;
  --bg-page: #F4F6FB;
  --bg-card: #FFFFFF;
  --bg-muted: #F8FAFC;
  --text-primary: #0B1220;
  --text-secondary: #475569;
  --text-muted: #64748B;
  --text-disabled: #94A3B8;
  --border-default: #E2E8F0;
  --border-strong: #CBD5E1;
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px rgba(11, 18, 32, 0.04);
  --shadow-sm: 0 2px 8px rgba(11, 18, 32, 0.06);
  --shadow-md: 0 8px 24px rgba(11, 18, 32, 0.08);
  --shadow-lg: 0 20px 55px rgba(11, 18, 32, 0.15);
  --font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  --fs-xs: 10.5px;
  --fs-sm: 12px;
  --fs-base: 13.5px;
  --fs-md: 15px;
  --fs-lg: 17px;
  --fs-xl: 20px;
  --fs-2xl: 24px;
  --container-max: 900px;
  --header-height: 68px;
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: 0; min-height: 100vh;
  font-family: var(--font-family);
  font-size: var(--fs-base); line-height: 1.6;
  color: var(--text-primary); background: var(--bg-page);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden; padding-bottom: env(safe-area-inset-bottom);
}
button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; border: none; background: none; color: inherit; }
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, h5, h6, p { margin: 0; padding: 0; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); }
.hidden { display: none !important; }
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }
.top-bar {
  background: linear-gradient(90deg, var(--brand-ink), var(--brand-ink-soft) 60%, #14213A);
  color: #fff; font-size: var(--fs-xs); padding: 6px 16px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; flex-wrap: wrap; min-height: 32px;
}
.top-bar-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.14);
  padding: 3px 9px; border-radius: var(--radius-full);
  font-weight: 700; font-size: 10px;
}
.top-bar-chip i { font-size: 10px; }
.app-header {
  position: sticky; top: 0; z-index: 90;
  background: rgba(11, 18, 32, 0.98);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: var(--shadow-md);
}
.app-header-inner {
  max-width: var(--container-max); margin: 0 auto;
  padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; min-height: var(--header-height);
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark {
  width: 42px; height: 42px; border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--sector-medical), #10B981);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff;
  box-shadow: 0 6px 18px rgba(5, 150, 105, 0.35); flex-shrink: 0;
}
.brand-text h1 { font-size: var(--fs-lg); font-weight: 900; color: #fff; line-height: 1.1; }
.brand-text h1 span {
  font-size: 9px; font-weight: 800; color: #34D399;
  background: rgba(52, 211, 153, 0.15);
  padding: 1px 6px; border-radius: var(--radius-xs);
  margin-right: 4px; vertical-align: middle;
}
.brand-text p {
  font-size: 10px; color: rgba(255, 255, 255, 0.55);
  font-weight: 600; margin-top: 2px;
}
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.app-tabs-wrapper {
  background: #fff; border-bottom: 1px solid var(--border-default);
  position: sticky; top: var(--header-height); z-index: 85;
  box-shadow: 0 2px 8px rgba(11, 18, 32, 0.04);
}
.app-tabs {
  max-width: var(--container-max); margin: 0 auto; padding: 0 8px;
  display: flex; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
}
.app-tabs::-webkit-scrollbar { display: none; }
.app-tab {
  flex-shrink: 0; padding: 14px 18px; border: none; background: transparent;
  color: var(--text-muted); font-family: var(--font-family);
  font-weight: 800; font-size: 12.5px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; position: relative;
  transition: color 0.2s ease; min-width: 78px;
}
.app-tab i { font-size: 17px; }
.app-tab::after {
  content: ''; position: absolute; bottom: 0; left: 18px; right: 18px;
  height: 3px; background: transparent;
  border-radius: 3px 3px 0 0; transition: background 0.25s ease;
}
.app-tab:hover { color: var(--text-primary); }
.app-tab.active { color: var(--brand-ink); }
.app-tab.active::after { background: linear-gradient(90deg, var(--sector-medical), #10B981); }
.context-switcher {
  background: linear-gradient(135deg, var(--brand-ink), var(--brand-ink-soft));
  color: #fff; padding: 10px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: none;
}
.context-switcher.visible { display: block; }
.context-switcher-inner {
  max-width: var(--container-max); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.context-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
.context-icon {
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #fff; flex-shrink: 0;
}
.context-text { min-width: 0; }
.context-label {
  font-size: 9.5px; color: rgba(255, 255, 255, 0.55);
  font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
}
.context-name {
  font-size: 13px; font-weight: 900; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.context-switch-btn {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff; padding: 6px 12px; border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 900;
  display: inline-flex; align-items: center; gap: 5px;
  transition: background 0.15s ease; flex-shrink: 0;
  font-family: inherit; cursor: pointer;
}
.context-switch-btn:hover { background: rgba(255, 255, 255, 0.25); }
.app-main {
  flex: 1; max-width: var(--container-max); margin: 0 auto;
  padding: 16px; width: 100%;
}
.view { display: none; animation: fadeInUp 0.3s ease; }
.view.active { display: block; }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.card {
  background: var(--bg-card); border-radius: var(--radius-md);
  border: 1px solid var(--border-default); box-shadow: var(--shadow-sm);
  padding: 16px; margin-bottom: 14px;
  position: relative; overflow: hidden;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 12px;
}
.section-title {
  font-size: var(--fs-md); font-weight: 900;
  color: var(--text-primary); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title i { color: var(--sector-medical); }
.sector-hero {
  border-radius: var(--radius-lg); padding: 24px 20px;
  color: #fff; position: relative; overflow: hidden;
  box-shadow: var(--shadow-lg); margin-bottom: 16px;
}
.sector-hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 90% 15%, rgba(255, 255, 255, 0.15), transparent 55%);
  pointer-events: none;
}
.sector-hero[data-sector="medical"] { background: linear-gradient(120deg, #064E3B, #059669 55%, #10B981); }
.sector-hero[data-sector="grocery"] { background: linear-gradient(120deg, #7C2D12, #EA580C 55%, #F59E0B); }
.sector-hero[data-sector="cars"] { background: linear-gradient(120deg, #0C4A6E, #0284C7 55%, #0EA5E9); }
.sector-hero[data-sector="home"] { background: linear-gradient(120deg, #4C1D95, #7C3AED 55%, #A78BFA); }
.sector-hero[data-sector="founder"] { background: linear-gradient(120deg, #78350F, #D97706 55%, #F59E0B); }
.sector-hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.25);
  padding: 5px 12px; border-radius: var(--radius-full);
  font-size: 11px; font-weight: 800;
  position: relative; margin-bottom: 10px;
}
.sector-hero h1 {
  font-size: var(--fs-2xl); font-weight: 900;
  line-height: 1.25; position: relative; margin-bottom: 8px;
}
.sector-hero p {
  font-size: var(--fs-sm); line-height: 1.7;
  color: rgba(255, 255, 255, 0.9);
  position: relative; max-width: 620px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; padding: 11px 18px; border-radius: var(--radius-sm);
  font-family: var(--font-family); font-weight: 800; font-size: var(--fs-sm);
  border: none; cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, var(--sector-medical), #10B981);
  color: #fff; box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3);
}
.btn-grocery {
  background: linear-gradient(135deg, var(--sector-grocery), #F59E0B);
  color: #fff; box-shadow: 0 6px 16px rgba(234, 88, 12, 0.3);
}
.btn-cars {
  background: linear-gradient(135deg, var(--sector-cars), #0EA5E9);
  color: #fff; box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
}
.btn-home {
  background: linear-gradient(135deg, var(--sector-home), #A78BFA);
  color: #fff; box-shadow: 0 6px 16px rgba(124, 58, 237, 0.3);
}
.btn-ghost {
  background: #fff; color: var(--text-primary);
  border: 1.5px solid var(--border-default);
}
.btn-ghost:hover { border-color: var(--sector-medical); background: var(--sector-medical-soft); }
.btn-danger {
  background: linear-gradient(135deg, #DC2626, var(--color-danger));
  color: #fff; box-shadow: 0 6px 16px rgba(225, 29, 72, 0.3);
}
.btn-sm { padding: 7px 12px; font-size: 11px; border-radius: var(--radius-xs); }
.btn-lg { padding: 14px 24px; font-size: var(--fs-base); border-radius: var(--radius-md); }
.btn-block { width: 100%; }
.icon-btn {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #fff; display: inline-flex; align-items: center; justify-content: center;
  font-size: 15px; position: relative; cursor: pointer;
  transition: background 0.15s ease; flex-shrink: 0;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.16); }
.icon-btn .badge {
  position: absolute; top: -5px; left: -5px;
  min-width: 18px; height: 18px;
  background: var(--color-danger); color: #fff;
  font-size: 9px; font-weight: 900;
  border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px; border: 2px solid var(--brand-ink);
}
.input {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-default); background: var(--bg-muted);
  color: var(--text-primary); font-family: var(--font-family);
  font-size: var(--fs-base); font-weight: 700;
  transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}
.input:focus {
  outline: none; border-color: var(--sector-medical); background: #fff;
  box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
}
.input::placeholder { color: var(--text-disabled); }
.label {
  display: block; font-size: 11px; font-weight: 800;
  color: var(--text-secondary); margin-bottom: 6px;
}
.search-input-wrapper { position: relative; }
.search-input-wrapper i {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 13px; pointer-events: none;
}
.search-input-wrapper .input { padding-right: 40px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius-full);
  border: 1.5px solid var(--border-default); background: #fff;
  color: var(--text-secondary); font-family: var(--font-family);
  font-size: 11.5px; font-weight: 800; cursor: pointer;
  transition: all 0.15s ease; white-space: nowrap;
}
.chip:hover { border-color: var(--sector-medical); color: var(--sector-medical); }
.chip.active {
  background: var(--sector-medical); border-color: var(--sector-medical);
  color: #fff; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
}
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 900; padding: 3px 9px;
  border-radius: var(--radius-full); white-space: nowrap;
}
.tag-medical { background: var(--sector-medical-soft); color: var(--sector-medical); border: 1px solid var(--sector-medical-border); }
.tag-grocery { background: var(--sector-grocery-soft); color: var(--sector-grocery); border: 1px solid var(--sector-grocery-border); }
.tag-cars { background: var(--sector-cars-soft); color: var(--sector-cars); border: 1px solid var(--sector-cars-border); }
.tag-home { background: var(--sector-home-soft); color: var(--sector-home); border: 1px solid var(--sector-home-border); }
.tag-gold { background: var(--sector-gold-soft); color: var(--sector-gold); border: 1px solid rgba(217, 119, 6, 0.18); }
.tag-success { background: var(--color-success-soft); color: var(--color-success); border: 1px solid rgba(5, 150, 105, 0.15); }
.tag-warning { background: var(--color-warning-soft); color: var(--color-warning); border: 1px solid rgba(234, 88, 12, 0.15); }
.tag-danger { background: var(--color-danger-soft); color: var(--color-danger); border: 1px solid rgba(225, 29, 72, 0.15); }
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(11, 18, 32, 0.78);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  z-index: 300; display: none;
  align-items: center; justify-content: center;
  padding: 16px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: var(--radius-lg);
  width: 100%; max-width: 520px; max-height: 92vh;
  overflow-y: auto; padding: 24px;
  box-shadow: var(--shadow-lg); position: relative;
  animation: modalPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  margin: auto;
}
@keyframes modalPop {
  from { opacity: 0; transform: scale(0.94) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-close {
  position: absolute; top: 14px; left: 14px;
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--bg-muted); color: var(--text-secondary);
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; transition: background 0.15s ease; z-index: 10;
}
.modal-close:hover { background: var(--border-default); }
.toast-container {
  position: fixed; bottom: 24px; right: 16px; left: 16px;
  z-index: 400; display: flex; flex-direction: column;
  align-items: flex-end; gap: 8px;
  pointer-events: none; max-width: 380px; margin-left: auto;
}
.toast {
  background: var(--brand-ink); color: #fff;
  padding: 12px 16px; border-radius: var(--radius-md);
  font-size: 12.5px; font-weight: 800;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 9px;
  animation: toastSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  border-right: 4px solid var(--sector-medical);
  pointer-events: auto; max-width: 100%;
}
.toast.error { border-right-color: var(--color-danger); }
.toast.warning { border-right-color: var(--color-warning); }
.toast.info { border-right-color: var(--color-info); }
.toast.success { border-right-color: var(--color-success); }
@keyframes toastSlide {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state-icon {
  font-size: 44px; color: var(--border-strong);
  margin-bottom: 14px; display: block;
}
.empty-state-title {
  font-size: var(--fs-md); font-weight: 900;
  color: var(--text-primary); margin-bottom: 4px;
}
.empty-state-desc { font-size: var(--fs-sm); color: var(--text-muted); }
.video-overlay {
  position: fixed; inset: 0; background: #000;
  z-index: 500; display: none; flex-direction: column;
}
.video-overlay.open { display: flex; }
.video-topbar {
  background: var(--brand-ink); color: #fff;
  padding: 12px 16px; display: flex;
  align-items: center; justify-content: space-between; gap: 10px;
}
.video-frame-container { flex: 1; position: relative; }
.video-frame { width: 100%; height: 100%; border: none; background: #000; }
.profile-header {
  background: linear-gradient(135deg, #064E3B, var(--sector-medical) 55%, #10B981);
  color: #fff; border-radius: var(--radius-lg);
  padding: 20px; margin-bottom: 16px;
  position: relative; overflow: hidden;
}
.profile-header::before {
  content: ''; position: absolute; top: -50%; right: -30%;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.2), transparent 65%);
  border-radius: 50%; pointer-events: none;
}
.profile-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.22);
  border: 2px solid rgba(255, 255, 255, 0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 900; flex-shrink: 0;
}
.profile-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-top: 16px;
}
.profile-stat {
  background: rgba(255, 255, 255, 0.15);
  border-radius: var(--radius-sm);
  padding: 10px; text-align: center;
}
.profile-stat-value { font-size: 18px; font-weight: 900; line-height: 1.1; }
.profile-stat-label {
  font-size: 10px; font-weight: 800;
  opacity: 0.85; margin-top: 4px;
}
.settings-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px; background: var(--bg-card);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-default);
  margin-bottom: 8px; cursor: pointer;
  transition: all 0.15s ease;
}
.settings-item:hover {
  border-color: var(--sector-medical);
  background: var(--sector-medical-soft);
}
.settings-icon {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.settings-title {
  font-size: 13px; font-weight: 900; color: var(--text-primary);
}
.settings-desc {
  font-size: 11px; color: var(--text-muted);
  font-weight: 700; margin-top: 2px;
}
.order-card {
  background: var(--bg-card); border-radius: var(--radius-md);
  border: 1px solid var(--border-default);
  padding: 14px; margin-bottom: 10px;
  border-right: 4px solid var(--sector-medical);
}
.order-card.grocery { border-right-color: var(--sector-grocery); }

<script>
(function WASLA_PART_2() {
  'use strict';

  const VERSION = '5.0.0';
  const DB_KEY = 'wasla_v5_db';
  const EVENT_KEY = 'wasla_v5_events';
  const SESSION_KEY = 'wasla_v5_session';
  const MIGRATED_KEY = 'wasla_v5_migrated';

  // ══════════════════════════════════════════════════════════════
  // SECTION 1: UTILS
  // ══════════════════════════════════════════════════════════════
  const Utils = {
    $: (sel, root = document) => root.querySelector(sel),
    $$: (sel, root = document) => Array.from(root.querySelectorAll(sel)),
    id: (prefix = 'id') => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`,
    money: (n) => `${Number(n || 0).toLocaleString('ar-EG')} ج.م`,
    number: (n) => Number(n || 0).toLocaleString('ar-EG'),
    today: () => new Date().toISOString().split('T')[0],
    now: () => Date.now(),

    fmtDate: (iso) => {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '—';
      const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      return `${days[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
    },

    fmtTime: (ts) => new Date(ts).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),

    fmtDateTime: (ts) => `${Utils.fmtDate(new Date(ts).toISOString())} · ${Utils.fmtTime(ts)}`,

    dayKey: (iso) => ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'][new Date(iso).getDay()],

    dayArabic: (k) => ({
      sunday: 'الأحد', monday: 'الاثنين', tuesday: 'الثلاثاء',
      wednesday: 'الأربعاء', thursday: 'الخميس', friday: 'الجمعة', saturday: 'السبت'
    }[k] || ''),

    timeAgo: (ts) => {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return 'الآن';
      if (s < 3600) return `قبل ${Math.floor(s / 60)} د`;
      if (s < 86400) return `قبل ${Math.floor(s / 3600)} س`;
      if (s < 604800) return `قبل ${Math.floor(s / 86400)} ي`;
      return `قبل ${Math.floor(s / 604800)} أسبوع`;
    },

    isValidPhone: (phone) => /^01[0-9]{9}$/.test(String(phone || '').trim()),
    isValidName: (name) => name && String(name).trim().split(/\s+/).length >= 2,

    escape: (str) => String(str || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c])),

    sleep: (ms) => new Promise(r => setTimeout(r, ms)),

    debounce: (fn, ms = 300) => {
      let t;
      return function (...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), ms);
      };
    },

    timeToMin: (slot) => {
      const m = String(slot).match(/(\d{1,2}):(\d{2})\s*(م|ص|pm|am)?/i);
      if (!m) return 0;
      let h = parseInt(m[1], 10);
      const mi = parseInt(m[2], 10);
      const p = (m[3] || '').toLowerCase();
      if ((p === 'م' || p === 'pm') && h < 12) h += 12;
      if ((p === 'ص' || p === 'am') && h === 12) h = 0;
      return h * 60 + mi;
    }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 2: UI (Toast + Modal + Confirm + Loading)
  // ══════════════════════════════════════════════════════════════
  const UI = {
    toast(message, type = 'success', duration = 3200) {
      const container = Utils.$('#toast-container');
      if (!container) return;
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };
      el.innerHTML = `<i class="fa-solid ${icons[type] || icons.success}"></i><span>${Utils.escape(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity 0.3s, transform 0.3s';
        el.style.opacity = '0';
        el.style.transform = 'translateX(30px)';
        setTimeout(() => el.remove(), 320);
      }, duration);
    },

    modal(id, { open = true } = {}) {
      const el = Utils.$(`#${id}`);
      if (!el) return;
      el.classList.toggle('open', !!open);
    },

    closeAllModals() {
      Utils.$$('.modal-overlay.open').forEach(m => m.classList.remove('open'));
    },

    loading(text = 'جاري التحميل...') {
      const el = Utils.$('#loading-text');
      if (el) el.textContent = text;
      UI.modal('modal-loading', { open: true });
    },

    stopLoading() {
      UI.modal('modal-loading', { open: false });
    },

    confirm(message, { title = 'تأكيد', confirmText = 'نعم', cancelText = 'إلغاء', danger = false } = {}) {
      return new Promise((resolve) => {
        const body = Utils.$('#modal-confirm-body');
        if (!body) return resolve(false);
        body.innerHTML = `
          <h3 style="font-size:16px;font-weight:900;margin-bottom:12px;">${Utils.escape(title)}</h3>
          <p style="font-size:13px;color:var(--text-secondary);font-weight:700;line-height:1.7;margin-bottom:20px;">${Utils.escape(message)}</p>
          <div style="display:flex;gap:8px;">
            <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" style="flex:1;" id="confirm-yes">${Utils.escape(confirmText)}</button>
            <button class="btn btn-ghost" style="flex:1;" id="confirm-no">${Utils.escape(cancelText)}</button>
          </div>
        `;
        UI.modal('modal-confirm', { open: true });
        const cleanup = () => UI.modal('modal-confirm', { open: false });
        Utils.$('#confirm-yes').onclick = () => { cleanup(); resolve(true); };
        Utils.$('#confirm-no').onclick = () => { cleanup(); resolve(false); };
      });
    }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 3: CRYPTO (SHA-256 + Salt)
  // ══════════════════════════════════════════════════════════════
  const Crypto = {
    _sha256(str) {
      const rr = (v, a) => (v >>> a) | (v << (32 - a));
      const K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      const bytes = new TextEncoder().encode(str);
      const bitLen = bytes.length * 8;
      const padded = new Uint8Array(Math.ceil((bytes.length + 9) / 64) * 64);
      padded.set(bytes);
      padded[bytes.length] = 0x80;
      const dv = new DataView(padded.buffer);
      dv.setUint32(padded.length - 4, bitLen, false);
      for (let i = 0; i < padded.length; i += 64) {
        const W = new Array(64);
        for (let t = 0; t < 16; t++) {
          W[t] = (padded[i + t * 4] << 24) | (padded[i + t * 4 + 1] << 16) | (padded[i + t * 4 + 2] << 8) | padded[i + t * 4 + 3];
        }
        for (let t = 16; t < 64; t++) {
          const s0 = rr(W[t - 15], 7) ^ rr(W[t - 15], 18) ^ (W[t - 15] >>> 3);
          const s1 = rr(W[t - 2], 17) ^ rr(W[t - 2], 19) ^ (W[t - 2] >>> 10);
          W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let t = 0; t < 64; t++) {
          const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
          const ch = (e & f) ^ (~e & g);
          const t1 = (h + S1 + ch + K[t] + W[t]) >>> 0;
          const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + maj) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0;
          d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
        H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
        H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
        H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
      }
      return H.map(x => x.toString(16).padStart(8, '0')).join('');
    },

    salt() {
      const arr = new Uint8Array(16);
      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(arr);
      } else {
        for (let i = 0; i < 16; i++) arr[i] = Math.floor(Math.random() * 256);
      }
      return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
    },

    hash(password, salt) {
      return this._sha256(`${password}::${salt}`);
    },

    create(password) {
      const salt = this.salt();
      return { hash: this.hash(password, salt), salt };
    },

    verify(password, storedHash, storedSalt) {
      if (!storedHash || !storedSalt) return false;
      return this.hash(password, storedSalt) === storedHash;
    }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 4: EVENT LOG (append-only, hash-chained)
  // ══════════════════════════════════════════════════════════════
  const EventLog = {
    _load() {
      try {
        const raw = localStorage.getItem(EVENT_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (_) { return []; }
    },

    _save(events) {
      try {
        const trimmed = events.length > 8000 ? events.slice(-8000) : events;
        localStorage.setItem(EVENT_KEY, JSON.stringify(trimmed));
      } catch (_) {
        try {
          localStorage.setItem(EVENT_KEY, JSON.stringify(events.slice(-1000)));
        } catch (__) {}
      }
    },

    log(type, payload = {}) {
      const events = this._load();
      const last = events[events.length - 1];
      const prevHash = last ? last.hash : '0'.repeat(64);
      const ts = Date.now();
      const body = { type, payload, ts, prevHash };
      const hash = Crypto._sha256(JSON.stringify(body));
      const event = {
        seq: events.length + 1,
        type,
        payload,
        ts,
        prevHash,
        hash,
        actorId: payload.actorId || null,
        targetId: payload.targetId || null
      };
      events.push(event);
      this._save(events);
      return event;
    },

    query({ type, actorId, targetId, limit = 100 } = {}) {
      let events = this._load();
      if (type) events = events.filter(e => e.type === type);
      if (actorId) events = events.filter(e => e.actorId === actorId);
      if (targetId) events = events.filter(e => e.targetId === targetId);
      return events.slice(-limit).reverse();
    },

    verifyChain() {
      const events = this._load();
      for (let i = 1; i < events.length; i++) {
        if (events[i].prevHash !== events[i - 1].hash) {
          return { ok: false, brokenAt: i, seq: events[i].seq };
        }
      }
      return { ok: true, count: events.length };
    },

    count() { return this._load().length; }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 5: STORE (DB Layer)
  // ══════════════════════════════════════════════════════════════
  const Store = {
    _read(key, fallback = null) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_) { return fallback; }
    },

    _write(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        console.error('Storage write failed:', e);
        return false;
      }
    },

    load() { return this._read(DB_KEY, null); },
    save(db) { return this._write(DB_KEY, db); },
    exists() { return !!this.load(); }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 6: SCHEMA
  // ══════════════════════════════════════════════════════════════
  const Schema = {
    empty() {
      return {
        version: VERSION,
        createdAt: Date.now(),
        users: [],
        doctors: [],
        merchants: [],
        staff: [],
        carServices: [],
        homeServices: [],

        appointments: [],
        orders: [],
        familyMembers: [],
        reviews: [],
        notifications: [],
        chats: [],

        auditLogs: [],
        blockedRelations: [],
        coupons: [],
        settings: {
          commissionRate: 0.15,

          platformName: 'منصة وصلة',

          depositRules: {
            medical: { firstOrderFree: true, secondOrderRate: 0.25 },
            grocery: { firstOrderThreshold: 300, firstOrderRate: 0.20, secondOrderRate: 0.20 },
            cars: { firstOrderThreshold: 300, firstOrderRate: 0.20, secondOrderRate: 0.20 },
            home: { firstOrderThreshold: 300, firstOrderRate: 0.20, secondOrderRate: 0.20 }
          }
        }
      };
    }
  };

  // ══════════════════════════════════════════════════════════════
  // SECTION 7: SEED DATA
  // ══════════════════════════════════════════════════════════════
  function buildSeed() {
    const db = Schema.empty();

    // Insurance companies (بدون نسب مزيفة)
    db.insuranceCompanies = [
      { id: 'ins1', name: 'جلوب ميد', logo: 'fa-shield-halved' },

    ];

      { id: 'car2', name: 'شحن بطارية', price: 150, duration: 15, icon: 'fa-car-battery', desc: 'شحن سريع آمن' },

  // ══════════════════════════════════════════════════════════════
  // SECTION 8: MIGRATION (from wasla_med_v4 if exists)
  // ══════════════════════════════════════════════════════════════
  function migrateFromV4() {
    const oldRaw = localStorage.getItem('wasla_med_v4');
    if (!oldRaw) return { migrated: false, reason: 'no-old-db' };

    let oldDb;
    try { oldDb = JSON.parse(oldRaw); } catch (_) { return { migrated: false, reason: 'invalid' }; }
    if (!oldDb || !oldDb.users) return { migrated: false, reason: 'invalid-structure' };

    const newDb = Schema.empty();
    let passwordsHashed = 0;
    let usersMigrated = 0;

    (oldDb.users || []).forEach(u => {
      const migrated = { ...u };
      if (migrated.pass && !migrated.passHash) {
        const { hash, salt } = Crypto.create(migrated.pass);
        migrated.passHash = hash;
        migrated.salt = salt;
        delete migrated.pass;
        passwordsHashed++;
      }
      if (!migrated.contexts) migrated.contexts = ['citizen'];
      if (!migrated.currentContext) migrated.currentContext = 'citizen';
      if (!migrated.status) migrated.status = 'active';
      if (migrated.role === 'doctor' && !migrated.contexts.includes('doctor')) migrated.contexts.push('doctor');
      if (migrated.role === 'merchant' && !migrated.contexts.includes('merchant')) migrated.contexts.push('merchant');
      if (migrated.role === 'staff' && !migrated.contexts.includes('staff')) migrated.contexts.push('staff');
      if (migrated.role === 'founder' && !migrated.contexts.includes('founder')) migrated.contexts.push('founder');
      newDb.users.push(migrated);
      usersMigrated++;
    });

    (oldDb.doctors || []).forEach(d => {
      const migrated = { ...d };
      migrated.acceptedInsurances = (d.insurances || []).map(i => typeof i === 'string' ? i : (i.id || i));
      delete migrated.insurances;
      if (!migrated.userId) migrated.userId = null;
      newDb.doctors.push(migrated);
    });

    newDb.appointments = (oldDb.appointments || []).map(a => ({ ...a, status: a.status || 'waiting' }));
    newDb.orders = (oldDb.orders || []).map(o => ({ ...o }));

    if (oldDb.groceryStores) {
      oldDb.groceryStores.forEach(g => {
        newDb.merchants.push({
          id: g.id,
          userId: null,
          name: g.name,
          area: g.area,
          rating: g.rating || 4.5,
          deliveryTime: g.deliveryTime || '30-45 دقيقة',
          minOrder: g.minOrder || 50,
          deliveryFee: 10,
          icon: g.icon || 'fa-store',
          products: oldDb.groceryProducts && oldDb.groceryProducts[g.id] ? oldDb.groceryProducts[g.id] : [],
          verified: true,
          createdAt: Date.now()
        });
      });
    }

    if (oldDb.carServices) newDb.carServices = oldDb.carServices;
    if (oldDb.homeServices) newDb.homeServices = oldDb.homeServices;
    if (oldDb.familyMembers) newDb.familyMembers = oldDb.familyMembers;
    if (oldDb.reviews) newDb.reviews = oldDb.reviews;
    if (oldDb.auditLogs) newDb.auditLogs = oldDb.auditLogs;
    if (oldDb.reminders) newDb.reminders = oldDb.reminders;
    if (oldDb.healthRecords) newDb.healthRecords = oldDb.healthRecords;
    if (oldDb.healthLogs) newDb.healthLogs = oldDb.healthLogs;
    if (oldDb.prescriptions) newDb.prescriptions = oldDb.prescriptions;

    const seed = buildSeed();
    if (!newDb.insuranceCompanies.length) newDb.insuranceCompanies = seed.insuranceCompanies;
    if (!newDb.carServices.length) newDb.carServices = seed.carServices;
    if (!newDb.homeServices.length) newDb.homeServices = seed.homeServices;
    if (!newDb.staff.length) newDb.staff = seed.staff;

    Store.save(newDb);
    localStorage.setItem(MIGRATED_KEY, JSON.stringify({
      at: Date.now(),
      version: VERSION,
      from: 'v4',
      usersMigrated,
      passwordsHashed
    }));

    return { migrated: true, usersMigrated, passwordsHashed };
  }

  // ══════════════════════════════════════════════════════════════
  // SECTION 9: BOOT
  // ══════════════════════════════════════════════════════════════
  function boot() {
    if (!Store.exists()) {
      const migrationResult = migrateFromV4();
      if (migrationResult.migrated) {
        console.log('%c✅ تم ترحيل البيانات من v4', 'color:#059669;font-weight:900');
        console.log(`   • ${migrationResult.usersMigrated} مستخدم`);
        console.log(`   • ${migrationResult.passwordsHashed} كلمة سر مشفرة`);
      } else {
        const seed = buildSeed();
        Store.save(seed);
        console.log('%c🌱 تم تثبيت البيانات الأولية', 'color:#0284C7;font-weight:900');
      }
    }

    const db = Store.load();
    if (!db) {
      console.error('❌ فشل تحميل قاعدة البيانات');
      return;
    }

    const chain = EventLog.verifyChain();
    if (!chain.ok) {
      console.warn(`⚠️ سلسلة الأحداث مكسورة عند #${chain.brokenAt}`);
    }

    EventLog.log('app_boot', {
      version: VERSION,
      ts: Date.now(),
      usersCount: db.users.length,
      eventCount: EventLog.count()
    });

    const counter = Utils.$('#topbar-users-count');
    if (counter) counter.textContent = db.users.length;

    window.WaslaCore = {
      version: VERSION,
      Utils, UI, Crypto, EventLog, Store, Schema,
      db: () => Store.load(),
      inspect: () => ({
        version: VERSION,
        users: Store.load().users.length,
        doctors: Store.load().doctors.length,
        merchants: Store.load().merchants.length,
        events: EventLog.count(),
        chain: EventLog.verifyChain(),
        migratedAt: localStorage.getItem(MIGRATED_KEY)
      }),
      reset: () => {
        if (confirm('⚠️ حذف كل البيانات والعودة للأصل؟')) {
          localStorage.removeItem(DB_KEY);
          localStorage.removeItem(EVENT_KEY);
          localStorage.removeItem(SESSION_KEY);
          localStorage.removeItem(MIGRATED_KEY);
          location.reload();
        }
      }
    };

    console.log('%c⚡ WASLA v' + VERSION + ' — PART 2/15 READY',
      'background:#059669;color:#fff;padding:6px 14px;border-radius:6px;font-weight:900;font-size:12px');
    console.log('%c💡 لمراجعة الحالة، اكتب في Console: WaslaCore.inspect()',
      'color:#7C3AED;font-weight:900');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') UI.closeAllModals();
  });

  Utils.$$('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay && overlay.id !== 'modal-loading') {
        overlay.classList.remove('open');
      }
    });
  });

})();
