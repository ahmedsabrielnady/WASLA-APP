      <p style="font-size:13px; color:var(--gray); font-weight:700; margin-bottom:16px;">صنايعية معتمدين بفيش وتشبيه</p>
      
      <div class="grid-2">
        <div class="card text-center" onclick="cart.add('زيارة سباك', 100, 'fa-wrench')" style="cursor:pointer;">
          <i class="fa-solid fa-wrench" style="font-size:30px; color:var(--sky); margin-bottom:12px;"></i><h4 style="font-weight:900; margin:0;">سباكة</h4>
        </div>
        <div class="card text-center" onclick="cart.add('زيارة كهربائي', 100, 'fa-bolt')" style="cursor:pointer;">
          <i class="fa-solid fa-bolt" style="font-size:30px; color:var(--amber); margin-bottom:12px;"></i><h4 style="font-weight:900; margin:0;">كهرباء</h4>
        </div>
        <div class="card text-center" onclick="cart.add('فني تكييف', 150, 'fa-wind')" style="cursor:pointer;">
          <i class="fa-solid fa-wind" style="font-size:30px; color:var(--emerald); margin-bottom:12px;"></i><h4 style="font-weight:900; margin:0;">تكييف</h4>
        </div>
        <div class="card text-center" onclick="cart.add('نجار', 120, 'fa-hammer')" style="cursor:pointer;">
          <i class="fa-solid fa-hammer" style="font-size:30px; color:#8B5CF6; margin-bottom:12px;"></i><h4 style="font-weight:900; margin:0;">نجارة</h4>
        </div>
      </div>
    `;
  },

  /* --- 5. FOUNDER DASHBOARD --- */
  founder: () => {
    if (!Auth.currentUser || Auth.currentUser.role !== 'founder') return router.navigate('medical');
    const el = document.getElementById('view-founder');
    const totalRev = DB.orders.reduce((s, o) => s + o.price, 0);
    const commission = Math.round(totalRev * 0.15);
    const staff = DB.users.filter(u => u.role === 'staff');

    el.innerHTML = `
      <div class="card" style="background:var(--primary); color:#fff; border:none; box-shadow:var(--shadow-lg);">
        <h2 style="margin:0 0 16px; font-weight:900;"><i class="fa-solid fa-crown" style="color:var(--gold);"></i> لوحة المؤسس</h2>
        <div class="grid-2" style="gap:12px;">
          <div style="background:rgba(255,255,255,0.1); padding:16px; border-radius:12px;">
            <div style="font-size:11px; color:#94A3B8;">إجمالي الأرباح</div>
            <div style="font-size:20px; font-weight:900; color:#34D399;">${Utils.money(commission)}</div>
          </div>
          <div style="background:rgba(255,255,255,0.1); padding:16px; border-radius:12px;">
            <div style="font-size:11px; color:#94A3B8;">الاشتراكات (برو)</div>
            <div style="font-size:20px; font-weight:900; color:var(--gold);">148</div>
          </div>
          <div style="background:rgba(255,255,255,0.1); padding:16px; border-radius:12px;">
            <div style="font-size:11px; color:#94A3B8;">معدل النمو</div>
            <div style="font-size:20px; font-weight:900; color:#60A5FA;">+24%</div>
          </div>
          <div style="background:rgba(255,255,255,0.1); padding:16px; border-radius:12px;">
            <div style="font-size:11px; color:#94A3B8;">إجمالي الحجوزات</div>
            <div style="font-size:20px; font-weight:900; color:#fff;">${DB.appointments.length}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 class="section-title">إدارة الموظفين</h3>
        <div style="display:flex; gap:8px; margin-bottom:16px;">
          <input type="text" id="stf-name" class="input-field" placeholder="اسم الموظف" style="margin:0;">
          <input type="text" id="stf-phone" class="input-field" placeholder="الموبايل" style="margin:0;">
          <button onclick="Views.addStaff()" class="btn-action" style="padding:0 16px;">إضافة</button>
        </div>
        ${staff.map(s => `
          <div class="item-box mb-4" style="padding:12px;">
            <div class="item-info"><div class="item-title">${s.name}</div><div class="item-sub">${s.phone}</div></div>
            <button onclick="Views.delUser('${s.id}')" style="color:var(--danger); background:none; border:none; font-size:16px;"><i class="fa-solid fa-trash"></i></button>
          </div>
        `).join('') || '<p style="font-size:13px; color:var(--gray);">لا يوجد موظفين</p>'}
      </div>

      <div class="card">
        <h3 class="section-title">إدارة الإعلانات (الشريط العلوي)</h3>
        <div style="display:flex; gap:8px; margin-bottom:16px;">
          <input type="text" id="ad-text" class="input-field" placeholder="نص الإعلان" style="margin:0;">
          <button onclick="Views.addAd()" class="btn-action" style="padding:0 16px; background:var(--amber);">إضافة</button>
        </div>
        ${DB.ads.map(a => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);">
            <span style="font-size:13px; font-weight:700;">${a.text}</span>
            <button onclick="Views.delAd('${a.id}')" style="color:var(--danger); background:none; border:none; font-size:16px;"><i class="fa-solid fa-trash"></i></button>
          </div>
        `).join('')}
      </div>
    `;
  },

  addStaff: () => {
    const name = document.getElementById('stf-name').value;
    const phone = document.getElementById('stf-phone').value;
    if (!name || !phone) return Utils.toast('أدخل البيانات', true);
    DB.users.push({ id: Utils.id(), name, phone, role: 'staff', pass: '123456', wallet: 0 });
    saveDB(); Views.founder(); Utils.toast('تمت الإضافة');
  },

  delUser: (id) => {
    if(!confirm('تأكيد الحذف؟')) return;
    DB.users = DB.users.filter(u => u.id !== id); saveDB(); Views.founder();
  },

  addAd: () => {
    const val = document.getElementById('ad-text').value;
    if(!val) return;
    DB.ads.push({id: Utils.id(), text: val, active: true});
    saveDB(); Views.founder(); UI.renderTicker(); Utils.toast('تمت إضافة الإعلان');
  },

  delAd: (id) => {
    DB.ads = DB.ads.filter(a => a.id !== id); saveDB(); Views.founder(); UI.renderTicker();
  },

  /* --- 6. STAFF DASHBOARD --- */
  staff: () => {
    if (!Auth.currentUser || Auth.currentUser.role !== 'staff') return router.navigate('medical');
    const el = document.getElementById('view-staff');
    const appts = DB.appointments.filter(a => a.status !== 'completed').sort((a,b) => a.ts - b.ts);

    el.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg, var(--primary), var(--primary-light)); color:#fff; border:none;">
        <h2 style="margin:0; font-weight:900;"><i class="fa-solid fa-headset"></i> إدارة طابور المرضى</h2>
        <p style="margin:4px 0 0; font-size:12px; opacity:0.8;">اضغط "نداء" عند حضور المريض، و"إنهاء" بعد الكشف.</p>
      </div>

      <div class="grid-list">
        ${appts.map(a => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <h4 style="margin:0; font-weight:900;">${a.patientName}</h4>
                <p style="margin:4px 0; font-size:12px; color:var(--gray);">${a.doctorName} • ${a.slot}</p>
              </div>
              <div style="display:flex; gap:8px;">
                ${a.status === 'next' 
                  ? `<button onclick="Views.finishAppt('${a.id}')" class="btn-action" style="background:var(--emerald);"><i class="fa-solid fa-check"></i> إنهاء</button>`
                  : `<button onclick="Views.callPatient('${a.id}')" class="btn-action" style="background:var(--amber);"><i class="fa-solid fa-bullhorn"></i> نداء</button>`
                }
              </div>
            </div>
          </div>
        `).join('') || '<div class="card text-center" style="color:var(--gray);">لا يوجد مرضى في الانتظار اليوم</div>'}
      </div>
    `;
  },

  callPatient: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    appt.status = 'next'; saveDB();
    Notifier.push(appt.patientId, `🔔 حان دورك الآن يا ${appt.patientName}! توجه لعيادة ${appt.doctorName}`, true);
    Views.staff();
    Utils.toast('تم إرسال النداء للمريض');
  },

  finishAppt: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    appt.status = 'completed'; saveDB(); Views.staff(); Utils.toast('تم إنهاء الكشف');
  },

  /* --- 7. DOCTOR DASHBOARD --- */
  doctor: () => {
    if (!Auth.currentUser || Auth.currentUser.role !== 'doctor') return router.navigate('medical');
    const el = document.getElementById('view-doctor');
    el.innerHTML = `
      <h2 class="section-title"><i class="fa-solid fa-user-md" style="color:var(--primary);"></i> إحصائيات العيادة</h2>
      <div class="card grid-3 text-center" style="padding:24px 16px;">
        <div><div style="font-size:28px; font-weight:900; color:var(--emerald);">12</div><div style="font-size:11px; color:var(--gray); font-weight:700;">حالات جديدة</div></div>
        <div><div style="font-size:28px; font-weight:900; color:var(--amber);">5</div><div style="font-size:11px; color:var(--gray); font-weight:700;">متابعة</div></div>
        <div><div style="font-size:28px; font-weight:900; color:var(--sky);">17</div><div style="font-size:11px; color:var(--gray); font-weight:700;">عبر وصلة</div></div>
      </div>
    `;
  },

  /* --- 8. PATIENT DASHBOARD --- */
  dashboard: () => {
    if (!Auth.currentUser) return AuthUI.open();
    const el = document.getElementById('view-dashboard');
    const myAppts = DB.appointments.filter(a => a.patientId === Auth.currentUser.id).sort((a,b) => b.ts - a.ts);
    const myOrders = DB.orders.filter(o => o.userId === Auth.currentUser.id).sort((a,b) => b.ts - a.ts);
    const emr = Auth.currentUser.emr || { blood: 'غير محدد', allergies: [], chronic: [] };

    const renderStepper = (status) => {
      const steps = ['waiting', 'next', 'completed'];
      const labels = { waiting: 'انتظار', next: 'دورك الآن', completed: 'مكتمل' };
      const idx = steps.indexOf(status);
      return `
        <div class="stepper">
          ${steps.map((s, i) => `
            <div class="step ${i <= idx ? 'active' : ''} ${i === idx && s !== 'completed' ? 'current' : ''}">
              <div class="step-icon"><i class="fa-solid ${i < idx ? 'fa-check' : i === idx ? 'fa-hourglass-half' : 'fa-circle'}"></i></div>
              <div class="step-label">${labels[s]}</div>
            </div>
          `).join('')}
        </div>
      `;
    };

    el.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg, var(--emerald-light), #D1FAE5); border-color:#A7F3D0;">
        <h2 style="margin:0 0 4px; font-weight:900; color:#047857;">أهلاً ${Auth.currentUser.name}</h2>
        <p style="margin:0; font-size:12px; font-weight:700; color:#065F46;">الرقم التعريفي: ${Auth.currentUser.id.toUpperCase()}</p>
        <div style="margin-top:12px; background:#fff; padding:8px 16px; border-radius:99px; display:inline-flex; align-items:center; gap:8px; font-weight:900; color:var(--emerald); box-shadow:var(--shadow-sm);">
          <i class="fa-solid fa-wallet"></i> رصيد المحفظة: ${Utils.money(Auth.currentUser.wallet || 0)}
        </div>
      </div>

      <h3 class="section-title mt-4">مواعيدي وتتبع الطابور</h3>
      <div class="grid-list">
        ${myAppts.map(a => `
          <div class="card" style="border-right:4px solid ${a.status==='next'?'var(--amber)':'var(--emerald)'};">
            <div style="display:flex; justify-content:space-between;">
              <div>
                <h4 style="margin:0; font-weight:900;">${a.doctorName}</h4>
                <p style="margin:4px 0; font-size:12px; color:var(--gray); font-weight:700;"><i class="fa-regular fa-clock"></i> ${a.slot}</p>
              </div>
              <span style="font-size:11px; font-weight:900; padding:4px 10px; border-radius:6px; height:fit-content; background:${a.status==='next'?'#FEF3C7':'var(--emerald-light)'}; color:${a.status==='next'?'#92400E':'var(--emerald)'};">
                ${a.status === 'next' ? 'دورك الآن' : a.status === 'completed' ? 'مكتمل' : 'انتظار'}
              </span>
            </div>
            ${renderStepper(a.status)}
          </div>
        `).join('') || '<div class="card text-center" style="color:var(--gray);">لا توجد مواعيد حالية</div>'}
      </div>

      <h3 class="section-title mt-4">ملفي الطبي (EMR)</h3>
      <div class="card grid-2">
        <div class="vital-card" style="background:var(--danger-light);">
          <div class="vital-label" style="color:var(--danger);">فصيلة الدم</div>
          <div class="vital-value" style="color:var(--danger);">${emr.blood}</div>
        </div>
        <div class="vital-card" style="background:var(--amber-light);">
          <div class="vital-label" style="color:var(--amber);">حساسية</div>
          <div class="vital-value" style="color:var(--amber); font-size:14px;">${emr.allergies.join('، ') || 'لا يوجد'}</div>
        </div>
      </div>

      <h3 class="section-title mt-4">تتبع طلباتي</h3>
      <div class="grid-list">
        ${myOrders.map(o => `
          <div class="item-box" style="flex-direction:column; align-items:stretch; gap:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="item-info">
                <div class="item-title">${o.title}</div>
                <div class="item-sub">${new Date(o.ts).toLocaleDateString('ar-EG')}</div>
              </div>
              <div class="item-price">${Utils.money(o.price)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; background:var(--emerald-light); padding:8px; border-radius:6px; font-size:11px; font-weight:900; color:var(--emerald);">
              <i class="fa-solid fa-truck-fast"></i> جاري التجهيز للطلب...
            </div>
          </div>
        `).join('') || '<div class="card text-center" style="color:var(--gray);">لا توجد طلبات سابقة</div>'}
      </div>
    `;
  }
};

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
window.onload = () => {
  UI.renderHeader();
  UI.renderTicker();
  router.navigate('medical');
};
</script>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>منصة وصلة | WASLA - Super App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* ==========================================================================
     WASLA DESIGN SYSTEM (CSS)
     ========================================================================== */
  :root {
    --primary: #0B1220; --primary-light: #1E293B;
    --emerald: #059669; --emerald-light: #ECFDF5;
    --amber: #EA580C; --amber-light: #FFF7ED;
    --sky: #0284C7; --sky-light: #F0F9FF;
    --danger: #E11D48; --danger-light: #FFF1F2;
    --gold: #D97706; --gray: #64748B; --gray-light: #F8FAFC;
    --line: #E2E8F0; --bg: #F4F6FB;
    --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg); color: var(--primary); margin: 0; padding-bottom: 70px; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--gray); border-radius: 10px; }

  /* Ticker */
  .ticker-wrap { background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; padding: 8px 0; overflow: hidden; white-space: nowrap; display: flex; }
  .ticker-content { display: inline-block; padding-right: 100%; animation: ticker 25s linear infinite; }
  @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(100%); } }

  /* Header */
  .app-header { position: sticky; top: 0; z-index: 100; background: rgba(11,18,32,0.98); backdrop-filter: blur(10px); color: #fff; padding: 10px 16px; box-shadow: var(--shadow-md); }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--emerald), #10B981); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 12px rgba(5,150,105,0.4); }
  .brand-title { font-size: 20px; font-weight: 900; margin: 0; line-height: 1; }
  .brand-title span { font-size: 10px; color: #34D399; background: rgba(52,211,153,0.15); padding: 2px 6px; border-radius: 6px; vertical-align: middle; margin-right: 4px; }
  
  .header-actions { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .header-actions::-webkit-scrollbar { display: none; }
  .btn-ui { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
  .btn-ui:active { transform: scale(0.95); }
  .btn-ui.primary { background: var(--emerald); border: none; }
  
  /* Tabs */
  .super-tabs { display: flex; gap: 8px; padding: 12px; overflow-x: auto; scrollbar-width: none; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 60px; z-index: 99; }
  .super-tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 900; color: var(--gray); background: var(--gray-light); border: 1px solid var(--line); white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }

  /* Layout */
  .page-container { max-width: 800px; margin: 0 auto; padding: 16px; }
  .view-section { display: none; animation: fadeUp 0.4s ease; }
  .view-section.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  
  .card { background: #fff; border-radius: var(--radius-md); border: 1px solid var(--line); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
  .section-title { font-size: 18px; font-weight: 900; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
  
  .item-box { background: #FAFCFE; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
  .item-icon { width: 48px; height: 48px; border-radius: var(--radius-sm); background: var(--emerald-light); color: var(--emerald); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .item-info { flex: 1; }
  .item-title { font-weight: 900; font-size: 14px; margin: 0 0 4px; color: var(--primary); }
  .item-sub { font-size: 11px; color: var(--gray); font-weight: 700; margin: 0; }
  .item-price { font-weight: 900; color: var(--emerald); font-size: 15px; }
  
  .btn-action { background: var(--emerald); color: #fff; border: none; padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 900; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
  .btn-action:active { transform: scale(0.98); }
  .btn-danger { background: var(--danger-light); color: var(--danger); border: 1px solid #FECACA; }
  
  .input-field { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; background: var(--gray-light); margin-bottom: 12px; transition: 0.2s; }
  .input-field:focus { outline: none; border-color: var(--emerald); background: #fff; box-shadow: 0 0 0 4px var(--emerald-light); }

  /* Trackers */
  .stepper { display: flex; justify-content: space-between; position: relative; padding: 10px 0; margin-top: 15px; }
  .stepper::before { content: ''; position: absolute; top: 24px; left: 10%; right: 10%; height: 3px; background: var(--line); z-index: 0; }
  .step { display: flex; flex-direction: column; align-items: center; z-index: 1; flex: 1; }
  .step-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--line); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-bottom: 6px; border: 3px solid #fff; transition: 0.3s; }
  .step.active .step-icon { background: var(--emerald); }
  .step.current .step-icon { background: var(--amber); animation: pulse 1.5s infinite; }
  .step-label { font-size: 10px; font-weight: 900; color: var(--gray); text-align: center; }
  .step.active .step-label { color: var(--emerald); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(234,88,12,0.4); } 70% { box-shadow: 0 0 0 8px rgba(234,88,12,0); } 100% { box-shadow: 0 0 0 0 rgba(234,88,12,0); } }

  .vital-card { background: var(--gray-light); padding: 12px; border-radius: var(--radius-sm); text-align: center; }
  .vital-label { font-size: 10px; font-weight: 900; color: var(--gray); margin-bottom: 4px; }
  .vital-value { font-size: 18px; font-weight: 900; color: var(--primary); }
  
  .chart-container { height: 120px; display: flex; align-items: flex-end; gap: 8px; padding-top: 20px; }
  .bar { flex: 1; background: var(--emerald); border-radius: 4px 4px 0 0; position: relative; min-height: 5px; transition: height 0.5s; }
  .bar-label { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 900; color: var(--gray); }

  /* Bottom Sheet & Modals */
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: 0.3s; }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: #fff; border-radius: var(--radius-lg) var(--radius-lg) 0 0; z-index: 201; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
  .bottom-sheet.open { bottom: 0; }
  .sheet-header { padding: 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .sheet-body { padding: 20px; overflow-y: auto; flex: 1; }
  .sheet-footer { padding: 20px; border-top: 1px solid var(--line); background: var(--gray-light); }
  
  .modal-wrap { position: fixed; inset: 0; background: rgba(11,18,32,0.85); backdrop-filter: blur(4px); z-index: 300; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-wrap.open { display: flex; }
  .modal-box { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 450px; padding: 24px; position: relative; max-height: 90vh; overflow-y: auto; animation: popIn 0.3s; }
  @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-close { position: absolute; top: 16px; left: 16px; background: var(--gray-light); border: none; width: 32px; height: 32px; border-radius: var(--radius-sm); cursor: pointer; color: var(--gray); font-size: 16px; display: flex; align-items: center; justify-content: center; }
  
  #toast-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast-msg { background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 99px; font-size: 13px; font-weight: 900; box-shadow: var(--shadow-lg); border-right: 4px solid var(--emerald); animation: slideDown 0.3s; display: flex; align-items: center; gap: 8px; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="wasla-ticker" class="ticker-wrap"></div>

<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></div>
      <div><h1 class="brand-title">وَصْلَة <span>WASLA</span></h1></div>
    </div>
    <div class="header-actions" id="header-actions"></div>
  </div>
</header>

<div class="super-tabs" id="super-tabs">
  <button class="tab active" data-sector="medical" onclick="router.navigate('medical')"><i class="fa-solid fa-stethoscope"></i> طبي</button>
  <button class="tab" data-sector="market" onclick="router.navigate('market')"><i class="fa-solid fa-cart-shopping"></i> تسوق</button>
  <button class="tab" data-sector="cars" onclick="router.navigate('cars')"><i class="fa-solid fa-car"></i> سيارات</button>
  <button class="tab" data-sector="home" onclick="router.navigate('home')"><i class="fa-solid fa-screwdriver-wrench"></i> صيانة</button>
</div>

<main class="page-container">
  <section class="view-section active" id="view-medical"></section>
  <section class="view-section" id="view-market"></section>
  <section class="view-section" id="view-cars"></section>
  <section class="view-section" id="view-home"></section>
  <section class="view-section" id="view-founder"></section>
  <section class="view-section" id="view-staff"></section>
  <section class="view-section" id="view-doctor"></section>
  <section class="view-section" id="view-dashboard"></section>
</main>

<div class="sheet-overlay" id="cart-overlay" onclick="cart.toggle()"></div>
<div class="bottom-sheet" id="cart-sheet">
  <div class="sheet-header">
    <h3 style="margin:0; font-weight:900;"><i class="fa-solid fa-basket-shopping" style="color:var(--emerald);"></i> سلة الطلبات</h3>
    <button onclick="cart.toggle()" style="background:var(--gray-light); border:none; width:36px; height:36px; border-radius:var(--radius-sm); cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="sheet-body" id="cart-body"></div>
  <div class="sheet-footer">
    <div style="display:flex; justify-content:space-between; margin-bottom:16px; font-weight:900; font-size:18px;">
      <span>الإجمالي:</span>
      <span id="cart-total" style="color:var(--emerald);">0 ج.م</span>
    </div>
    <button onclick="cart.checkout()" class="btn-action" style="width:100%; padding:16px; font-size:16px;">تأكيد الدفع (كاش باك 5%)</button>
  </div>
</div>

<div class="modal-wrap" id="modal-auth"><div class="modal-box" id="modal-auth-body"></div></div>
<div class="modal-wrap" id="modal-book"><div class="modal-box" id="modal-book-body"></div></div>
<div class="modal-wrap" id="modal-payment"><div class="modal-box" id="modal-payment-body"></div></div>
<div class="modal-wrap" id="modal-map"><div class="modal-box" id="modal-map-body"></div></div>

<div id="toast-box"></div>

<script>
/* ==========================================================================
   WASLA CORE ENGINE (FULL MASTER BUILD)
   ========================================================================== */
const Utils = {
  id: () => Math.random().toString(36).substring(2, 10),
  money: (num) => Number(num).toLocaleString('ar-EG') + ' ج.م',
  toast: (msg, isError = false) => {
    const el = document.createElement('div');
    el.className = 'toast-msg';
    el.style.borderRightColor = isError ? 'var(--danger)' : 'var(--emerald)';
    el.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${msg}`;
    document.getElementById('toast-box').appendChild(el);
    setTimeout(() => el.remove(), 3000);
  },
  openModal: (id) => document.getElementById(id).classList.add('open'),
  closeModal: (id) => document.getElementById(id).classList.remove('open')
};

/* Audio Engine */
let audioCtx;
document.body.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

function playSound(isAlert = false) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = isAlert ? 'square' : 'sine';
  osc.frequency.setValueAtTime(isAlert ? 880 : 600, audioCtx.currentTime);
  if (isAlert) osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

/* ==========================================================================
   DATABASE & STATE
   ========================================================================== */
const DB_KEY = 'wasla_db_master_v4';
let DB = JSON.parse(localStorage.getItem(DB_KEY));

if (!DB) {
  DB = {
    users: [
      { id: 'u-f', phone: '01068990089', pass: 'As123789456*', name: 'أحمد صبري', role: 'founder', wallet: 0 },
      { id: 'u-p1', phone: '01000000001', pass: '123456', name: 'محمد المريض', role: 'patient', wallet: 150, emr: { blood: 'O+', allergies: ['بنسلين'], chronic: ['سكري'], vitals: [120, 135, 118, 110] } },
      { id: 'u-d1', phone: '01000000002', pass: '123456', name: 'د. محمد الشريف', role: 'doctor', wallet: 0 },
      { id: 'u-s1', phone: '01000000003', pass: '123456', name: 'موظف الاستقبال', role: 'staff', wallet: 0 }
    ],
    doctors: [
      { id: 'd1', name: 'د. محمد الشريف', spec: 'باطنة وكبد', price: 170, avgTime: 15, area: 'شارع بورسعيد', lat: 30.3546, lng: 31.2153, services: ['سكر وضغط', 'مناظير'], schedule: ['5:00 م', '5:30 م', '6:00 م'] },
      { id: 'd2', name: 'د. سارة أحمد', spec: 'أطفال وحديثي الولادة', price: 150, avgTime: 12, area: 'ميدان المحطة', lat: 30.3575, lng: 31.2160, services: ['تطعيمات', 'حساسية'], schedule: ['4:00 م', '4:30 م', '5:00 م'] }
    ],
    pharmacies: [
      { id: 'ph1', name: 'صيدلية النور', area: 'شارع بورسعيد', insurances: ['GlobeMed', 'MetLife'] },
      { id: 'ph2', name: 'صيدلية الشفاء', area: 'ميدان المحطة', insurances: ['MedRight', 'AXA'] }
    ],
    appointments: [],
    orders: [],
    notifications: [],
    cart: [],
    ads: [{ id: 'a1', text: '🎉 خصم 20% على أول كشف', active: true }, { id: 'a2', text: '🚀 ونش إنقاذ متاح الآن', active: true }]
  };
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}

function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

let Auth = {
  currentUser: JSON.parse(sessionStorage.getItem('wasla_session')) || null,
  
  login: (phone, pass) => {
    const user = DB.users.find(u => u.phone === phone && u.pass === pass);
    if (user) {
      Auth.currentUser = user;
      sessionStorage.setItem('wasla_session', JSON.stringify(user));
      UI.renderHeader();
      Utils.closeModal('modal-auth');
      Utils.toast('مرحباً بك ' + user.name);
      if (user.role === 'founder') router.navigate('founder');
      else if (user.role === 'staff') router.navigate('staff');
      else if (user.role === 'doctor') router.navigate('doctor');
      else router.navigate('dashboard');
      return true;
    }
    return false;
  },
  
  logout: () => {
    Auth.currentUser = null;
    sessionStorage.removeItem('wasla_session');
    UI.renderHeader();
    router.navigate('medical');
    Utils.toast('تم تسجيل الخروج');
  }
};

let Notifier = {
  push: (userId, text, isAlert = false) => {
    DB.notifications.unshift({ id: Utils.id(), userId, text, read: false, ts: Date.now() });
    saveDB();
    if (Auth.currentUser && Auth.currentUser.id === userId) {
      UI.renderHeader(); playSound(isAlert); Utils.toast(text);
    }
  },
  
  openPanel: (e) => {
    e.stopPropagation();
    const my = DB.notifications.filter(n => n.userId === Auth.currentUser.id);
    let html = `<button class="modal-close" onclick="Utils.closeModal('modal-map')"><i class="fa-solid fa-xmark"></i></button><h3 style="font-weight:900; margin:0 0 16px;">الإشعارات</h3>`;
    if (!my.length) html += `<p style="text-align:center; color:var(--gray);">لا توجد إشعارات</p>`;
    my.forEach(n => {
      html += `<div style="padding:12px; border-bottom:1px solid var(--line); background:${n.read?'#fff':'var(--emerald-light)'}; border-radius:var(--radius-sm); margin-bottom:8px;">
        <div style="font-size:10px; color:var(--gray); margin-bottom:4px;">${new Date(n.ts).toLocaleTimeString('ar-EG')}</div>
        <div style="font-size:13px; font-weight:700;">${n.text}</div>
      </div>`;
    });
    document.getElementById('modal-map-body').innerHTML = html;
    Utils.openModal('modal-map');
    DB.notifications.filter(n => n.userId === Auth.currentUser.id).forEach(n => n.read = true);
    saveDB(); UI.renderHeader();
  }
};

/* UI Components */
const UI = {
  renderHeader: () => {
    const actions = document.getElementById('header-actions');
    const tabs = document.getElementById('super-tabs');
    document.querySelectorAll('.tab.dynamic').forEach(t => t.remove());

    if (!Auth.currentUser) {
      actions.innerHTML = `<button class="btn-ui primary" onclick="AuthUI.open()"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>`;
      return;
    }

    const isFounder = Auth.currentUser.role === 'founder';
    const isStaff = Auth.currentUser.role === 'staff';
    const isDoctor = Auth.currentUser.role === 'doctor';
    const myNotifs = DB.notifications.filter(n => n.userId === Auth.currentUser.id && !n.read);

    actions.innerHTML = `
      <div style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); padding:6px 10px; border-radius:var(--radius-sm); cursor:pointer;" onclick="router.navigate('${isFounder?'founder':isStaff?'staff':isDoctor?'doctor':'dashboard'}')">
        <div style="width:24px; height:24px; border-radius:50%; background:var(--emerald); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px;">${Auth.currentUser.name[0]}</div>
        <div style="font-size:11px; font-weight:900; color:#fff;">${Auth.currentUser.name.split(' ')[0]}</div>
        <div style="font-size:10px; color:#34D399; font-weight:800; margin-right:4px;">${Auth.currentUser.wallet || 0} ج.م</div>
      </div>
      
      ${isFounder ? `<button class="btn-ui" style="background:linear-gradient(135deg,var(--gold),var(--amber)); border:none;" onclick="router.navigate('founder')"><i class="fa-solid fa-crown"></i> لوحة التحكم</button>` : ''}
      
      <button class="btn-ui" onclick="Notifier.openPanel(event)" style="position:relative;">
        <i class="fa-solid fa-bell"></i>
        ${myNotifs.length > 0 ? `<span style="position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; width:16px; height:16px; border-radius:50%; font-size:9px; font-weight:900; display:flex; align-items:center; justify-content:center;">${myNotifs.length}</span>` : ''}
      </button>

      <button class="btn-ui primary" onclick="cart.toggle()" style="position:relative;">
        <i class="fa-solid fa-cart-shopping"></i>
        ${DB.cart.length > 0 ? `<span style="position:absolute; top:-4px; right:-4px; background:#fff; color:var(--emerald); width:16px; height:16px; border-radius:50%; font-size:9px; font-weight:900; display:flex; align-items:center; justify-content:center;">${DB.cart.length}</span>` : ''}
      </button>

      <button class="btn-ui" onclick="Auth.logout()" style="color:#94A3B8;"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    `;

    if (isStaff) tabs.insertAdjacentHTML('beforeend', `<button class="tab dynamic" data-sector="staff" onclick="router.navigate('staff')"><i class="fa-solid fa-headset"></i> إدارة الطابور</button>`);
    if (isDoctor) tabs.insertAdjacentHTML('beforeend', `<button class="tab dynamic" data-sector="doctor" onclick="router.navigate('doctor')"><i class="fa-solid fa-user-md"></i> بوابة الطبيب</button>`);
  },
  
  renderTicker: () => {
    const active = DB.ads.filter(a => a.active);
    const el = document.getElementById('wasla-ticker');
    if (!active.length) return el.style.display = 'none';
    el.style.display = 'flex';
    el.innerHTML = `<div class="ticker-content">${active.map(a => `<span style="margin-left:40px;"><i class="fa-solid fa-bullhorn" style="color:var(--gold);"></i> ${a.text}</span>`).join('')}</div>`;
  }
};

/* Router */
const router = {
  navigate: (sector) => {
    document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    const view = document.getElementById('view-' + sector);
    if (view) view.classList.add('active');
    
    const tab = document.querySelector(`.tab[data-sector="${sector}"]`);
    if (tab) tab.classList.add('active');

    const views = { medical: Views.medical, market: Views.market, cars: Views.cars, home: Views.home, founder: Views.founder, staff: Views.staff, doctor: Views.doctor, dashboard: Views.dashboard };
    if (views[sector]) views[sector]();
    window.scrollTo(0,0);
  }
};

/* Cart */
const cart = {
  toggle: () => {
    document.getElementById('cart-sheet').classList.toggle('open');
    document.getElementById('cart-overlay').classList.toggle('open');
    cart.render();
  },
  add: (title, price, icon) => {
    DB.cart.push({ cartId: Utils.id(), title, price, icon });
    saveDB(); UI.renderHeader(); Utils.toast('تمت الإضافة للسلة'); cart.toggle();
  },
  remove: (id) => {
    DB.cart = DB.cart.filter(i => i.cartId !== id);
    saveDB(); cart.render(); UI.renderHeader();
  },
  render: () => {
    const body = document.getElementById('cart-body');
    if (!DB.cart.length) {
      body.innerHTML = `<div style="text-align:center; padding:40px; color:var(--gray);"><i class="fa-solid fa-basket-shopping" style="font-size:40px; margin-bottom:12px;"></i><br>السلة فارغة</div>`;
      document.getElementById('cart-total').innerText = '0 ج.م'; return;
    }
    body.innerHTML = DB.cart.map(item => `
      <div class="item-box" style="margin-bottom:10px;">
        <div class="item-icon"><i class="fa-solid ${item.icon}"></i></div>
        <div class="item-info"><div class="item-title">${item.title}</div></div>
        <div class="item-price">${Utils.money(item.price)}</div>
        <button onclick="cart.remove('${item.cartId}')" style="background:var(--danger-light); color:var(--danger); border:none; width:32px; height:32px; border-radius:var(--radius-sm); cursor:pointer; margin-right:10px;"><i class="fa-solid fa-trash"></i></button>
      </div>
    `).join('');
    const total = DB.cart.reduce((s,i) => s + i.price, 0);
    document.getElementById('cart-total').innerText = Utils.money(total);
  },
  checkout: () => {
    if (!Auth.currentUser) { Utils.toast('سجل دخول أولاً', true); return AuthUI.open(); }
    if (!DB.cart.length) return;
    const total = DB.cart.reduce((s,i) => s + i.price, 0);
    document.getElementById('modal-payment-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-payment')"><i class="fa-solid fa-xmark"></i></button>
      <div style="text-align:center; margin-bottom:24px;">
        <div style="width:64px; height:64px; background:var(--emerald-light); color:var(--emerald); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 12px;"><i class="fa-solid fa-credit-card"></i></div>
        <h3 style="margin:0 0 4px; font-weight:900;">بوابة الدفع</h3>
        <p style="color:var(--gray); font-size:13px; font-weight:700;">المبلغ المطلوب: ${Utils.money(total)}</p>
      </div>
      <div class="item-box mb-4" style="border:2px solid var(--emerald); background:var(--emerald-light);">
        <div class="item-icon" style="background:#fff;"><i class="fa-solid fa-money-bill"></i></div>
        <div class="item-info"><div class="item-title">الدفع عند الاستلام (كاش)</div></div>
        <i class="fa-solid fa-circle-check" style="color:var(--emerald); font-size:20px;"></i>
      </div>
      <button onclick="cart.processPayment(${total})" class="btn-action" style="width:100%; padding:16px; font-size:16px;">تأكيد ودفع</button>
    `;
    Utils.openModal('modal-payment');
  },
  processPayment: (total) => {
    const cashback = Math.round(total * 0.05);
    Auth.currentUser.wallet = (Auth.currentUser.wallet || 0) + cashback;
    const uIdx = DB.users.findIndex(u => u.id === Auth.currentUser.id);
    DB.users[uIdx] = Auth.currentUser;
    sessionStorage.setItem('wasla_session', JSON.stringify(Auth.currentUser));

    DB.cart.forEach(item => {
      DB.orders.push({ id: Utils.id(), userId: Auth.currentUser.id, title: item.title, price: item.price, status: 'preparing', ts: Date.now() });
    });
    DB.cart = [];
    saveDB();
    Utils.closeModal('modal-payment'); cart.toggle(); UI.renderHeader();
    Utils.toast(`تم الدفع بنجاح! حصلت على ${cashback} ج.م كاش باك`);
    if(Auth.currentUser.role === 'patient') router.navigate('dashboard');
  }
};

/* Auth UI */
const AuthUI = {
  open: () => {
    document.getElementById('modal-auth-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-auth')"><i class="fa-solid fa-xmark"></i></button>
      <div style="text-align:center; margin-bottom:24px;">
        <div style="width:64px; height:64px; background:var(--emerald); color:#fff; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 12px;"><i class="fa-solid fa-heart-pulse"></i></div>
        <h3 style="margin:0; font-weight:900;">تسجيل الدخول</h3>
      </div>
      <input type="text" id="auth-phone" class="input-field" placeholder="رقم الموبايل" value="01068990089">
      <input type="password" id="auth-pass" class="input-field" placeholder="كلمة السر" value="As123789456*">
      <button onclick="AuthUI.submit()" class="btn-action" style="width:100%; padding:16px; font-size:16px;">دخول</button>
      <div style="margin-top:24px; padding:16px; background:var(--gray-light); border-radius:var(--radius-sm); font-size:12px; font-weight:700; color:var(--gray);">
        <div style="color:var(--primary); font-weight:900; margin-bottom:8px;">🔑 حسابات تجريبية:</div>
        👑 مؤسس: 01068990089 (As123789456*)<br>
        🧑 مريض: 01000000001 (123456)<br>
        🩺 طبيب: 01000000002 (123456)<br>
        🎧 موظف: 01000000003 (123456)
      </div>
    `;
    Utils.openModal('modal-auth');
  },
  submit: () => {
    const p = document.getElementById('auth-phone').value;
    const s = document.getElementById('auth-pass').value;
    if (!Auth.login(p, s)) Utils.toast('بيانات الدخول غير صحيحة', true);
  }
};

/* ==========================================================================
   VIEWS (SECTORS) - FULL LOGIC
   ========================================================================== */
const Views = {
  /* --- MEDICAL --- */
  medical: () => {
    const el = document.getElementById('view-medical');
    el.innerHTML = `
      <h2 class="section-title"><i class="fa-solid fa-user-doctor" style="color:var(--emerald);"></i> دليل الأطباء</h2>
      <div class="grid-list">
        ${DB.doctors.map(d => `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div style="flex:1;">
              <h4 style="margin:0 0 4px; font-weight:900; font-size:16px;">${d.name}</h4>
              <span style="background:var(--emerald-light); color:var(--emerald); padding:2px 8px; border-radius:6px; font-size:10px; font-weight:900;">${d.spec}</span>
              <p style="margin:8px 0 4px; font-size:11px; color:var(--gray); font-weight:700;"><i class="fa-solid fa-location-dot"></i> ${d.area} • ${d.avgTime} دقيقة</p>
              <div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:8px;">
                ${d.services.map(s => `<span style="background:var(--gray-light); border:1px solid var(--line); font-size:10px; padding:2px 8px; border-radius:6px; font-weight:700;">${s}</span>`).join('')}
              </div>
            </div>
            <div style="text-align:left;">
              <div style="font-weight:900; color:var(--emerald); font-size:20px;">${Utils.money(d.price)}</div>
              <button onclick="Views.openBooking('${d.id}')" class="btn-action" style="margin-top:10px; padding:10px 20px;">حجز</button>
            </div>
          </div>
        `).join('')}
      </div>

      <h2 class="section-title mt-4"><i class="fa-solid fa-prescription-bottle-medical" style="color:var(--sky);"></i> صيدليات التأمين</h2>
      <div class="grid-list">
        ${DB.pharmacies.map(p => `
          <div class="item-box">
            <div class="item-icon" style="background:var(--sky-light); color:var(--sky);"><i class="fa-solid fa-pills"></i></div>
            <div class="item-info">
              <div class="item-title">${p.name}</div>
              <div class="item-sub"><i class="fa-solid fa-location-dot"></i> ${p.area}</div>
            </div>
            <div style="font-size:10px; font-weight:900; color:var(--sky); border:1px solid var(--sky); padding:4px 8px; border-radius:6px;">${p.insurances[0]}</div>
          </div>
        `).join('')}
      </div>
    `;
  },

  openBooking: (docId) => {
    if (!Auth.currentUser) return AuthUI.open();
    const doc = DB.doctors.find(d => d.id === docId);
    const bookedSlots = DB.appointments.filter(a => a.doctorId === docId && a.status !== 'cancelled').map(a => a.slot);

    document.getElementById('modal-book-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-book')"><i class="fa-solid fa-xmark"></i></button>
      <h3 style="margin:0 0 4px; font-weight:900; font-size:20px;">${doc.name}</h3>
      <p style="margin:0 0 20px; font-size:13px; color:var(--gray); font-weight:700;">${doc.spec} • الكشف: ${Utils.money(doc.price)}</p>
      
      <label style="font-size:13px; font-weight:900; display:block; margin-bottom:12px;">اختر الموعد (المحجوز يظهر مقفول):</label>
      <div class="grid-2" style="margin-bottom:24px;">
        ${doc.schedule.map(slot => {
          const isBooked = bookedSlots.includes(slot);
          return `
            <label style="border:${isBooked?'1px solid var(--line)':'2px solid var(--emerald)'}; background:${isBooked?'var(--gray-light)':'var(--emerald-light)'}; padding:14px; border-radius:var(--radius-sm); text-align:center; cursor:${isBooked?'not-allowed':'pointer'}; font-weight:900; font-size:14px; color:${isBooked?'var(--gray)':'var(--emerald)'}; opacity:${isBooked?'0.5':'1'};">
              ${isBooked ? `<i class="fa-solid fa-lock"></i> ` : ''} 
              <input type="radio" name="slot" value="${slot}" ${isBooked?'disabled':''} class="hidden"> ${slot}
            </label>
          `;
        }).join('')}
      </div>
      
      <button onclick="Views.confirmBooking('${doc.id}')" class="btn-action" style="width:100%; padding:16px; font-size:16px;">تأكيد الحجز</button>
    `;
    Utils.openModal('modal-book');
  },

  confirmBooking: (docId) => {
    const doc = DB.doctors.find(d => d.id === docId);
    const slotInput = document.querySelector('input[name="slot"]:checked');
    if(!slotInput) return Utils.toast('اختر موعداً متاحاً', true);

    DB.appointments.push({
      id: Utils.id(), patientId: Auth.currentUser.id, patientName: Auth.currentUser.name,
      doctorId: doc.id, doctorName: doc.name, slot: slotInput.value, price: doc.price, status: 'waiting', ts: Date.now()
    });
    saveDB();
    Utils.closeModal('modal-book'); Utils.toast('تم تأكيد الحجز');
    router.navigate('dashboard');
  },

  /* --- MARKET --- */
  market: () => {
    const el = document.getElementById('view-market');
    el.innerHTML = `
      <h2 class="section-title"><i class="fa-solid fa-store" style="color:var(--amber);"></i> تسوق الآن</h2>
      <div class="grid-2">
        <div class="card text-center" onclick="Views.openShop('rest', 'مطاعم')" style="cursor:pointer;">
          <div class="item-icon" style="margin:0 auto 12px; width:60px; height:60px; font-size:26px; background:var(--amber-light); color:var(--amber);"><i class="fa-solid fa-utensils"></i></div><h4 style="font-weight:900; margin:0;">مطاعم ومشويات</h4>
        </div>
        <div class="card text-center" onclick="Views.openShop('grocery', 'سوبرماركت')" style="cursor:pointer;">
          <div class="item-icon" style="margin:0 auto 12px; width:60px; height:60px; font-size:26px; background:var(--emerald-light); color:var(--emerald);"><i class="fa-solid fa-basket-shopping"></i></div><h4 style="font-weight:900; margin:0;">بقالة</h4>
        </div>
      </div>
    `;
  },

  openShop: (type, title) => {
    let items = type === 'rest' ? [{ n: 'كباب وكفتة', p: 180 }, { n: 'بيتزا رانش', p: 120 }] : [{ n: 'زيت عافية', p: 95 }, { n: 'أرز مصري', p: 60 }];
    document.getElementById('modal-map-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-map')"><i class="fa-solid fa-xmark"></i></button>
      <h3 style="margin:0 0 16px; font-weight:900;">${title}</h3>
      <div class="grid-list">
        ${items.map(i => `
          <div class="item-box">
            <div class="item-info"><div class="item-title">${i.n}</div></div>
            <div class="item-price">${Utils.money(i.p)}</div>
            <button onclick="cart.add('${i.n}', ${i.p}, 'fa-shopping-bag')" class="btn-action" style="padding:8px; border-radius:50%; width:36px; height:36px;"><i class="fa-solid fa-plus"></i></button>
          </div>
        `).join('')}
      </div>
    `;
    Utils.openModal('modal-map');
  },

  /* --- CARS --- */
  cars: () => {
    const el = document.getElementById('view-cars');
    el.innerHTML = `
      <h2 class="section-title"><i class="fa-solid fa-car" style="color:var(--primary);"></i> خدمات السيارات</h2>
      <div class="grid-2">
        <div class="card text-center" onclick="cart.add('تغيير إطار', 100, 'fa-circle-dot')" style="cursor:pointer;">
          <i class="fa-solid fa-circle-dot" style="font-size:30px; color:var(--primary); margin-bottom:12px;"></i><h4 style="font-weight:900; margin:0;">إطارات</h4>
        </div>
        <div class="card text-center" onclick="cart.add('ونش إنقاذ', 300, 'fa-truck-pickup')" style="cursor:pointer; background:var(--danger-light); border-color:#FECACA;">
          <i class="fa-solid fa-truck-pickup" style="font-size:30px; color:var(--danger); margin-bottom:12px;"></i><h4 style="font-weight:900; margin:0; color:var(--danger);">ونش إنقاذ</h4>
        </div>
      </div>
    `;
  },

  /* --- HOME --- */
  home: () => {
    const el = document.getElementById('view-home');
    el.innerHTML = `
      <h2 class="section-title"><i class="fa-solid fa-screwdriver-wrench" style="color:var(--sky);"></i> الصيانة المنزلية</h2>
      <div class="grid-2">
        <div class="card text-center" onclick="cart.add('زيارة سباك', 100, 'fa-wrench')" style="cursor:pointer;">
          <i class="fa-solid fa-wrench" style="font-size:30px; color:var(--sky); margin-bottom:12px;"></i><h4 style="font-weight:900; margin:0;">سباكة</h4>
        </div>
        <div class="card text-center" onclick="cart.add('زيارة كهربائي', 100, 'fa-bolt')" style="cursor:pointer;">
          <i class="fa-solid fa-bolt" style="font-size:30px; color:var(--amber); margin-bottom:12px;"></i><h4 style="font-weight:900; margin:0;">كهرباء</h4>
        </div>
      </div>
    `;
  },

  /* --- FOUNDER (P&L) --- */
  founder: () => {
    if (!Auth.currentUser || Auth.currentUser.role !== 'founder') return router.navigate('medical');
    const el = document.getElementById('view-founder');
    const totalRev = DB.orders.reduce((s, o) => s + o.price, 0);
    const commission = Math.round(totalRev * 0.15);

    // حساب أرباح الأطباء
    const docRev = {};
    DB.appointments.forEach(a => {
      docRev[a.doctorId] = docRev[a.doctorId] || { name: a.doctorName, total: 0 };
      docRev[a.doctorId].total += a.price;
    });

    el.innerHTML = `
      <div class="card" style="background:var(--primary); color:#fff; border:none;">
        <h2 style="margin:0 0 16px; font-weight:900;"><i class="fa-solid fa-crown" style="color:var(--gold);"></i> لوحة المؤسس</h2>
        <div class="grid-2" style="gap:12px;">
          <div style="background:rgba(255,255,255,0.1); padding:16px; border-radius:12px;">
            <div style="font-size:11px; color:#94A3B8;">أرباح المنصة (15%)</div>
            <div style="font-size:20px; font-weight:900; color:#34D399;">${Utils.money(commission)}</div>
          </div>
          <div style="background:rgba(255,255,255,0.1); padding:16px; border-radius:12px;">
            <div style="font-size:11px; color:#94A3B8;">إجمالي الحجوزات</div>
            <div style="font-size:20px; font-weight:900; color:#fff;">${DB.appointments.length}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 class="section-title">تقرير الأرباح (P&L)</h3>
        <table style="width:100%; text-align:right; font-size:12px; font-weight:700;">
          <thead><tr style="background:var(--gray-light); color:var(--gray);"><th style="padding:10px;">الطبيب</th><th style="padding:10px;">إجمالي التحصيل</th><th style="padding:10px;">عمولة المنصة</th></tr></thead>
          <tbody>
            ${Object.values(docRev).map(d => `
              <tr style="border-bottom:1px solid var(--line);">
                <td style="padding:10px;">${d.name}</td>
                <td style="padding:10px;">${Utils.money(d.total)}</td>
                <td style="padding:10px; color:var(--emerald);">+${Utils.money(d.total * 0.15)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  },

  /* --- STAFF --- */
  staff: () => {
    if (!Auth.currentUser || Auth.currentUser.role !== 'staff') return router.navigate('medical');
    const el = document.getElementById('view-staff');
    const appts = DB.appointments.filter(a => a.status !== 'completed').sort((a,b) => a.ts - b.ts);

    el.innerHTML = `
      <div class="card" style="background:var(--primary); color:#fff;">
        <h2 style="margin:0; font-weight:900;">إدارة طابور المرضى</h2>
      </div>
      <div class="grid-list">
        ${appts.map(a => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div><h4 style="margin:0; font-weight:900;">${a.patientName}</h4><p style="margin:4px 0; font-size:12px; color:var(--gray);">${a.doctorName} • ${a.slot}</p></div>
              ${a.status === 'next' 
                ? `<button onclick="Views.finishAppt('${a.id}')" class="btn-action">إنهاء</button>`
                : `<button onclick="Views.callPatient('${a.id}')" class="btn-action" style="background:var(--amber);">نداء</button>`
              }
            </div>
          </div>
        `).join('') || '<div class="card text-center">لا يوجد مرضى</div>'}
      </div>
    `;
  },

  callPatient: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    appt.status = 'next'; saveDB();
    Notifier.push(appt.patientId, `🔔 حان دورك الآن! توجه لعيادة ${appt.doctorName}`, true);
    Views.staff(); Utils.toast('تم إرسال النداء');
  },

  finishAppt: (apptId) => {
    const appt = DB.appointments.find(a => a.id === apptId);
    appt.status = 'completed'; saveDB(); Views.staff(); Utils.toast('تم إنهاء الكشف');
  },

  /* --- DOCTOR --- */
  doctor: () => {
    if (!Auth.currentUser || Auth.currentUser.role !== 'doctor') return router.navigate('medical');
    document.getElementById('view-doctor').innerHTML = `
      <h2 class="section-title"><i class="fa-solid fa-user-md" style="color:var(--primary);"></i> إحصائيات العيادة</h2>
      <div class="card grid-3 text-center" style="padding:24px 16px;">
        <div><div style="font-size:28px; font-weight:900; color:var(--emerald);">12</div><div style="font-size:11px; color:var(--gray); font-weight:700;">جديد</div></div>
        <div><div style="font-size:28px; font-weight:900; color:var(--amber);">5</div><div style="font-size:11px; color:var(--gray); font-weight:700;">متابعة</div></div>
        <div><div style="font-size:28px; font-weight:900; color:var(--sky);">17</div><div style="font-size:11px; color:var(--gray); font-weight:700;">وصلة</div></div>
      </div>
    `;
  },

  /* --- PATIENT DASHBOARD & TRACKING --- */
  dashboard: () => {
    if (!Auth.currentUser) return AuthUI.open();
    const el = document.getElementById('view-dashboard');
    const myAppts = DB.appointments.filter(a => a.patientId === Auth.currentUser.id).sort((a,b) => b.ts - a.ts);
    const myOrders = DB.orders.filter(o => o.userId === Auth.currentUser.id).sort((a,b) => b.ts - a.ts);
    const emr = Auth.currentUser.emr || { blood: 'O+', allergies: [], chronic: [], vitals: [] };

    const renderTracker = (status) => {
      const stages = ['received', 'preparing', 'on_way', 'delivered'];
      const labels = { received: 'تم الاستلام', preparing: 'جاري التجهيز', on_way: 'في الطريق', delivered: 'تم التسليم' };
      const idx = stages.indexOf(status);
      return `
        <div class="stepper">
          ${stages.map((s, i) => `
            <div class="step ${i <= idx ? 'active' : ''} ${i === idx && s !== 'delivered' ? 'current' : ''}">
              <div class="step-icon"><i class="fa-solid fa-check"></i></div>
              <div class="step-label">${labels[s]}</div>
            </div>
          `).join('')}
        </div>
      `;
    };

    // رسم بياني للسكر
    const maxVital = Math.max(...emr.vitals, 150);
    const renderChart = () => `
      <div class="chart-container">
        ${emr.vitals.map(v => `
          <div class="bar" style="height: ${(v/maxVital)*100}%;">
            <span class="bar-label">${v}</span>
          </div>
        `).join('')}
      </div>
    `;

    el.innerHTML = `
      <div class="card" style="background:var(--emerald-light); border-color:#A7F3D0;">
        <h2 style="margin:0 0 4px; font-weight:900; color:#047857;">أهلاً ${Auth.currentUser.name}</h2>
        <p style="margin:0; font-size:12px; font-weight:700; color:#065F46;">الرقم التعريفي: ${Auth.currentUser.id.toUpperCase()}</p>
        <div style="margin-top:12px; background:#fff; padding:8px 16px; border-radius:99px; display:inline-block; font-weight:900; color:var(--emerald);">
          <i class="fa-solid fa-wallet"></i> ${Utils.money(Auth.currentUser.wallet || 0)}
        </div>
      </div>

      <h3 class="section-title mt-4">تتبع طلباتي الحية</h3>
      <div class="grid-list">
        ${myOrders.map(o => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <div class="item-title">${o.title}</div>
              <div class="item-price">${Utils.money(o.price)}</div>
            </div>
            ${renderTracker(o.status)}
          </div>
        `).join('') || '<div class="card text-center">لا توجد طلبات.</div>'}
      </div>

      <h3 class="section-title mt-4">ملفي الطبي (EMR)</h3>
      <div class="card">
        <div class="grid-2 mb-4">
          <div class="vital-card" style="background:var(--danger-light);"><div class="vital-label">فصيلة الدم</div><div class="vital-value">${emr.blood}</div></div>
          <div class="vital-card" style="background:var(--amber-light);"><div class="vital-label">حساسية</div><div class="vital-value" style="font-size:14px;">${emr.allergies.join('، ')}</div></div>
        </div>
        <div style="font-size:12px; font-weight:900; color:var(--gray); margin-bottom:8px;">مؤشر السكر (آخر 4 قراءات):</div>
        ${renderChart()}
      </div>
    `;
  }
};

/* Order Simulator (Auto advance orders every 15s) */
setInterval(() => {
  let changed = false;
  DB.orders.forEach(o => {
    if (o.status === 'preparing') { o.status = 'on_way'; changed = true; }
    else if (o.status === 'on_way') { o.status = 'delivered'; changed = true; }
  });
  if (changed) {
    saveDB();
    if (Auth.currentUser && Auth.currentUser.role === 'patient') router.navigate('dashboard');
  }
}, 15000);

/* INIT */
window.onload = () => {
  UI.renderHeader();
  UI.renderTicker();
  router.navigate('medical');
};
</script>
</body>
</html>
</body>
</html>
