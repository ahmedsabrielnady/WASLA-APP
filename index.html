<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة وصلة الرقمية | القطاع الطبي الشامل في شبين القناطر</title>
    <style>
        /* ==========================================================================
           1. نظام الهوية البصرية، الألوان والتحكم بالحركة (WASLA MEDICAL CORE)
           ========================================================================== */
        @import url('https://googleapis.com');
        
        :root {
            --wasla-dark: #0f172a;
            --wasla-blue: #2563eb;
            --wasla-blue-light: #eff6ff;
            --medical-emerald: #10b981;
            --medical-emerald-hover: #059669;
            --medical-soft: #f0fdf4;
            --medical-border: #bbf7d0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-canvas: #f8fafc;
            --white: #ffffff;
            --shadow-md: 0 10px 15px -3px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           2. شريط التنقل العلوي الفخم والهوية (HEADER & NAVIGATION)
           ========================================================================== */
        header {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--wasla-blue) 0%, #1d4ed8 100%);
            color: var(--white);
            padding: 8px 22px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 24px;
            box-shadow: 0 8px 16px rgba(37, 99, 213, 0.2);
        }

        .brand-subtext h2 {
            font-size: 15px;
            font-weight: 800;
            color: var(--wasla-dark);
        }

        .brand-subtext p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .quick-actions-nav {
            display: flex;
            gap: 12px;
        }

        .action-nav-link {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 10px;
            transition: all 0.2s ease;
            background: var(--bg-canvas);
        }

        .action-nav-link:hover {
            background: var(--wasla-blue-light);
            color: var(--wasla-blue);
        }

        /* ==========================================================================
           3. البانر التعريفي وقسم الفلترة والبحث (HERO & ADVANCED FILTER)
           ========================================================================== */
        .medical-hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%);
            color: var(--white);
            padding: 60px 24px;
            text-align: center;
            position: relative;
        }

        .medical-hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--medical-emerald);
        }

        .hero-inner {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-inner h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .hero-inner h1 span {
            color: #38bdf8;
        }

        .hero-inner p {
            font-size: 15px;
            color: #93c5fd;
            line-height: 1.6;
        }

        .search-filter-widget {
            max-width: 1200px;
            margin: -30px auto 40px auto;
            padding: 0 24px;
            position: relative;
            z-index: 10;
        }

        .filter-bar {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid #e2e8f0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        @media (max-width: 768px) {
            .filter-bar { grid-template-columns: 1fr; }
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--wasla-dark);
        }

        .filter-select, .filter-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            background-color: var(--bg-canvas);
            transition: all 0.2s;
        }

        .filter-select:focus, .filter-input:focus {
            border-color: var(--medical-emerald);
            background-color: var(--white);
        }

        /* ==========================================================================
           4. شبكة عرض بطاقات العيادات الطبية (CLINICS GRID DISPLAY)
           ========================================================================== */
        .main-content-layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 60px 24px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .section-title-wrapper {
            border-right: 4px solid var(--medical-emerald);
            padding-right: 12px;
            margin-bottom: 24px;
        }

        .section-title-wrapper h3 {
            font-size: 20px;
            font-weight: 800;
            color: var(--wasla-dark);
        }

        .clinics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        @media (max-width: 850px) {
            .clinics-grid { grid-template-columns: 1fr; }
        }

        .clinic-card {
            background: var(--white);
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            padding: 24px;
            position: relative;
            transition: all 0.3s ease;
        }

        .clinic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .badge-status {
            position: absolute;
            top: 24px;
            left: 24px;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
        }

        .badge-available { background: var(--medical-soft); color: #166534; border: 1px solid var(--medical-border); }
        .badge-busy { background: #fffbeb; color: #92400e; border: 1px solid #fef3c7; }

        .doctor-profile {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }

        .doctor-avatar {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: var(--medical-soft);
            color: var(--medical-emerald);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            border: 1px solid var(--medical-border);
        }

        .doctor-details h4 {
            font-size: 18px;
            font-weight: 800;
            color: var(--wasla-dark);
        }

        .doctor-details p {
            font-size: 13px;
            color: var(--wasla-blue);
            font-weight: 600;
            margin-top: 2px;
        }

        .doctor-address {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .price-insurance-table {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px 0;
            border-top: 1px dashed #e2e8f0;
            border-bottom: 1px dashed #e2e8f0;
            margin-bottom: 20px;
        }

        .table-cell {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 600;
        }

        .table-cell span {
            font-weight: 800;
            color: var(--wasla-dark);
        }

        .book-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: var(--medical-emerald);
            color: var(--white);
            transition: background 0.2s;
        }

        .book-btn:hover { background: var(--medical-emerald-hover); }
