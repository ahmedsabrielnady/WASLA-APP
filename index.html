<style>
  :root{
    --primary:#0B1220;--primary-light:#1E293B;--emerald:#059669;--emerald-light:#ECFDF5;
    --amber:#EA580C;--amber-light:#FFF7ED;--sky:#0284C7;--sky-light:#F0F9FF;
    --danger:#E11D48;--danger-light:#FFF1F2;--gold:#D97706;--gold-light:#FEF3C7;
    --indigo:#3730A3;--indigo-light:#EEF2FF;--purple:#7C3AED;--purple-light:#F5F3FF;
    --gray:#64748B;--gray-light:#F8FAFC;--line:#E2E8F0;--bg:#F4F6FB;
    --radius-sm:10px;--radius-md:16px;--radius-lg:24px;
    --shadow-sm:0 2px 8px rgba(0,0,0,.04);--shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 12px 48px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Cairo',sans-serif}
  body{background:var(--bg);color:var(--primary);margin:0;padding-bottom:80px;overflow-x:hidden}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--gray);border-radius:10px}
  .app-header{position:sticky;top:0;z-index:100;background:rgba(11,18,32,.98);backdrop-filter:blur(10px);color:#fff;padding:10px 16px;box-shadow:var(--shadow-md)}
  .header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--emerald),#10B981);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(5,150,105,.4)}
  .brand-title{font-size:19px;font-weight:900;margin:0;line-height:1}
  .brand-title span{font-size:9px;color:#34D399;background:rgba(52,211,153,.15);padding:2px 6px;border-radius:6px;margin-right:4px}
  .header-actions{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.header-actions::-webkit-scrollbar{display:none}
  .btn-ui{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:8px 12px;border-radius:var(--radius-sm);font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;font-family:inherit;transition:.2s}
  .btn-ui:active{transform:scale(.95)}.btn-ui.primary{background:var(--emerald);border:none}
  .super-tabs{display:flex;gap:8px;padding:12px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:99}
  .super-tabs::-webkit-scrollbar{display:none}
  .tab{padding:10px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:900;color:var(--gray);background:var(--gray-light);border:1px solid var(--line);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.3s;font-family:inherit}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .page-container{max-width:800px;margin:0 auto;padding:16px}
  .view-section{display:none;animation:fadeUp .4s ease}.view-section.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
  .card{background:#fff;border-radius:var(--radius-md);border:1px solid var(--line);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .section-title{font-size:18px;font-weight:900;margin:0 0 16px;display:flex;align-items:center;gap:8px}
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid-list{display:grid;grid-template-columns:1fr;gap:12px}
  .item-box{background:#FAFCFE;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;display:flex;align-items:center;gap:12px;transition:.2s;cursor:pointer}

  .item-icon{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--emerald-light);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

  .chip.active{background:var(--emerald);color:#fff;border-color:var(--emerald)}
  .search-wrap{position:relative}.search-wrap i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:14px}
  .search-wrap .input-field{padding-right:40px;margin:0}
  .modal-wrap{position:fixed;inset:0;background:rgba(11,18,32,.85);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-wrap.open{display:flex}
  .modal-box{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:520px;padding:24px;position:relative;max-height:90vh;overflow-y:auto}
  .modal-close{position:absolute;top:16px;left:16px;background:var(--gray-light);border:none;width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;color:var(--gray);font-size:16px;display:flex;align-items:center;justify-content:center}

  .cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:900;cursor:pointer;background:var(--gray-light);position:relative;border:2px solid transparent;transition:.2s}

  .cal-badge{position:absolute;bottom:2px;font-size:9px;background:var(--danger);color:#fff;padding:0 4px;border-radius:6px}
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px;max-height:220px;overflow-y:auto;padding:4px}
  .slot-option{display:block;padding:10px;border-radius:8px;border:1.5px solid var(--line);text-align:center;cursor:pointer;font-size:12px;font-weight:900;background:#fff}
  .slot-option.selected{background:var(--emerald);color:#fff;border-color:var(--emerald)}
  .slot-option.disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}

  .stepper{display:flex;justify-content:space-between;position:relative;padding:10px 0;margin-top:15px}

  .step-label{font-size:10px;font-weight:900;color:var(--gray);text-align:center}

  .bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:10px 0}

  .bubble.me{background:var(--emerald);color:#fff;align-self:flex-end;border-bottom-left-radius:4px}
  .chat-input{display:flex;gap:8px}
  .chat-input input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-weight:700;font-size:13px;background:#fff}
  .video-wrap{position:fixed;inset:0;background:#000;z-index:500;display:none;flex-direction:column}

  .video-bar{background:var(--primary);color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
  .reward-card{background:linear-gradient(135deg,var(--gold-light),#FEF9C3);border:2px solid var(--gold);border-radius:12px;padding:14px;text-align:center}
  .record-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .record-icon{width:40px;height:40px;border-radius:10px;background:var(--sky-light);color:var(--sky);display:flex;align-items:center;justify-content:center;font-size:16px}

<script>
const Utils = {
  id: () => Math.random().toString(36).substring(2,10),
  money: n => Number(n).toLocaleString('ar-EG') + ' ج.م',
  todayISO: () => new Date().toISOString().split('T')[0],
  fmtDate: iso => {
    const d = new Date(iso);
    const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    return days[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
  },
  dayKey: iso => ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][new Date(iso).getDay()],
  dayArabic: k => ({saturday:'السبت',sunday:'الأحد',monday:'الاثنين',tuesday:'الثلاثاء',wednesday:'الأربعاء',thursday:'الخميس',friday:'الجمعة'}[k]),
  toast: (msg, isError=false) => {
    const el = document.createElement('div');
    el.className = 'toast-msg';
    el.style.borderRightColor = isError ? 'var(--danger)' : 'var(--emerald)';
    el.innerHTML = `<i class="fa-solid ${isError?'fa-circle-exclamation':'fa-circle-check'}"></i> ${msg}`;
    document.getElementById('toast-box').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  },
  openModal: id => document.getElementById(id).classList.add('open'),
  closeModal: id => document.getElementById(id).classList.remove('open'),
  stars: r => {
    const full = Math.floor(r);
    let h = '<span class="stars">';
    for (let i=0;i<5;i++) h += `<i class="fa-solid fa-star ${i<full?'':'off'}"></i>`;
    return h + '</span>';
  }
};
let audioCtx;
document.body.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, {once:true});
function playSound(isAlert=false){
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = isAlert ? 'square' : 'sine';
    o.frequency.setValueAtTime(isAlert?880:600, audioCtx.currentTime);
    if (isAlert) o.frequency.setValueAtTime(1100, audioCtx.currentTime+0.1);
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.4);
    o.start(); o.stop(audioCtx.currentTime+0.4);
  } catch(e){}
}
function requestNotifPermission(){
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}
function pushNotification(title, body){
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, {body}); } catch(e){}
  }
}

<script>
const router = {
  navigate: (sector, data) => {
    document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    let view = document.getElementById('view-' + sector);
    if (!view) {
      view = document.createElement('section');
      view.id = 'view-' + sector;
      view.className = 'view-section';
      document.getElementById('main-container').appendChild(view);
    }
    view.classList.add('active');
    const tab = document.querySelector(`.tab[data-sector="${sector}"]`);
    if (tab) tab.classList.add('active');
    const views = {
      medical: () => MedicalModule.render(),
      calendar: () => CalendarModule.render(),
      queue: () => QueueModule.render(),
      dashboard: () => PatientDashboard.render(),
      'doctor-profile': () => MedicalModule.renderProfile(data),
      staff: () => StaffDashboard.render(),
      doctor: () => DoctorDashboard.render(),
      'doctor-analytics': () => AnalyticsModule.render(),
      founder: () => FounderDashboard.render(),
      'symptom-checker': () => SymptomChecker.render(),
      vault: () => VaultModule.render(),
      tracker: () => TrackerModule.render(),
      rewards: () => RewardsModule.render(),
      family: () => FamilyModule.render(),
      reminders: () => RemindersModule.render(),
      chat: () => ChatModule.render(data)
    };
    if (views[sector]) views[sector]();
    window.scrollTo(0,0);
  }
};
function generateSlots(doctorId, dateISO) {
  const doc = DB.doctors.find(d => d.id === doctorId);
  if (!doc) return [];
  const day = Utils.dayKey(dateISO);
  const sched = doc.schedule[day];
  if (!sched || !sched.active) return [];
  const [sh,sm] = sched.start.split(':').map(Number);
  const [eh,em] = sched.end.split(':').map(Number);
  const startMin = sh*60+sm, endMin = eh*60+em, dur = sched.duration||20;
  const bs = sched.breakStart ? sched.breakStart.split(':').map(Number) : null;
  const be = sched.breakEnd ? sched.breakEnd.split(':').map(Number) : null;
  const bsMin = bs ? bs[0]*60+bs[1] : null, beMin = be ? be[0]*60+be[1] : null;
  const booked = DB.appointments.filter(a => a.doctorId === doctorId && a.date === dateISO && a.status !== 'canceled').map(a => a.slot);
  const slots = [];
  for (let t = startMin; t + dur <= endMin; t += dur) {
    if (bsMin !== null && t >= bsMin && t < beMin) continue;
    const h = Math.floor(t/60), m = t%60;
    const label = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
    slots.push({time:label, booked:booked.includes(label)});
  }
  return slots;
}

    el.classList.add('selected'); el.querySelector('input').checked = true;
    document.getElementById('insurance-select-wrap').style.display = el.querySelector('input').value === 'insurance' ? 'block' : 'none';
    MedicalModule.recalcTotal(docId);
  },
  recalcTotal: (docId) => {
    const doc = DB.doctors.find(d => d.id === docId);
    let total = doc.price;
    document.querySelectorAll('.svc-check:checked').forEach(c => total += parseInt(c.dataset.price));
    const payEl = document.querySelector('input[name="paymethod"]:checked');
    let disc = '';
    if (payEl && payEl.value === 'insurance') {
      const ins = DB.insuranceCompanies.find(i=>i.id===document.getElementById('insurance-select').value);
      const d = Math.round(total * ins.coverage/100);
      total -= d; disc = `خصم تأمين: ${Utils.money(d)} (${ins.coverage}%)`;
    }
    document.getElementById('total-amount').innerText = Utils.money(total);
    const ins = document.getElementById('insurance-discount');
    if (disc) { ins.style.display='block'; ins.innerText=disc; } else ins.style.display='none';
  },
  confirmBooking: (docId) => {
    const doc = DB.doctors.find(d => d.id === docId);
    const dateISO = document.getElementById('book-date').value;
    const slotEl = document.querySelector('input[name="slot"]:checked');
    if (!slotEl) return Utils.toast('اختر موعد', true);
    const payEl = document.querySelector('input[name="paymethod"]:checked');
    const payMethod = payEl ? payEl.value : 'cash';
    let total = doc.price;
    document.querySelectorAll('.svc-check:checked').forEach(c => total += parseInt(c.dataset.price));
    let insuranceId = null;
    if (payMethod === 'insurance') { insuranceId = document.getElementById('insurance-select').value; const ins = DB.insuranceCompanies.find(i=>i.id===insuranceId); total = Math.round(total * (1-ins.coverage/100)); }
    const forId = document.getElementById('book-for').value;
    const forWhom = forId === 'self' ? {name:Auth.currentUser.name} : (DB.familyMembers.find(f=>f.id===forId)||{name:''});
    const apptId = Utils.id();
    const qNum = DB.appointments.filter(a=>a.doctorId===docId && a.date===dateISO).length + 1;
    DB.appointments.push({id:apptId, patientId:Auth.currentUser.id, patientName:forWhom.name, forWhomId:forId, doctorId:doc.id, doctorName:doc.name, doctorSpec:doc.spec, date:dateISO, slot:slotEl.value, price:total, paymentType:payMethod, insuranceId, visitType:MedicalModule.currentVisitType, status:'waiting', queueNumber:qNum, followUp:false, ts:Date.now()});
    saveDB();
    Auth.addPoints(REWARD_RULES.book_appointment);
    Utils.closeModal('modal-book');
    const waMsg = `✅ حجزك في وصلة\n👨‍⚕️ ${doc.name}\n📅 ${Utils.fmtDate(dateISO)}\n⏰ ${slotEl.value}\n💰 ${Utils.money(total)}\n🎫 #${apptId.substring(0,6).toUpperCase()}`;
    const wa = `https://wa.me/2${Auth.currentUser.phone}?text=${encodeURIComponent(waMsg)}`;
    document.getElementById('modal-generic-body').innerHTML = `<button class="modal-close" onclick="Utils.closeModal('modal-generic')"><i class="fa-solid fa-xmark"></i></button><div style="text-align:center;"><div style="width:70px;height:70px;background:var(--emerald-light);color:var(--emerald);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;"><i class="fa-solid fa-check"></i></div><h3 style="margin:0 0 8px;font-weight:900;color:var(--emerald);">تم الحجز!</h3><p style="font-size:13px;color:var(--gray);margin-bottom:16px;">دورك رقم <strong style="color:var(--emerald);">${qNum}</strong></p><p style="font-size:12px;color:var(--gold);font-weight:900;margin-bottom:16px;">🎁 +${REWARD_RULES.book_appointment} نقطة</p><a href="${wa}" target="_blank" class="btn-action" style="width:100%;background:#25D366;text-decoration:none;margin-bottom:8px;"><i class="fa-brands fa-whatsapp"></i> تأكيد واتساب</a><button onclick="Utils.closeModal('modal-generic');router.navigate('queue')" class="btn-action" style="width:100%;margin-bottom:8px;"><i class="fa-solid fa-users-viewfinder"></i> تتبع</button><button onclick="Utils.closeModal('modal-generic');router.navigate('dashboard')" class="btn-action" style="width:100%;background:var(--primary);">حسابي</button></div>`;
    Utils.openModal('modal-generic');
  },
  orderService: (svcId) => {
    if (!Auth.currentUser) return AuthUI.open();
    const svc = DB.nursingServices.find(s => s.id === svcId);
    document.getElementById('modal-generic-body').innerHTML = `<button class="modal-close" onclick="Utils.closeModal('modal-generic')"><i class="fa-solid fa-xmark"></i></button><h3 style="margin:0 0 8px;font-weight:900;">${svc.name}</h3><p style="margin:0 0 16px;font-size:13px;color:var(--gray);">${svc.desc} • ${Utils.money(svc.price)}</p><input type="text" id="svc-addr" class="input-field" placeholder="العنوان"><button onclick="MedicalModule.confirmServiceOrder('${svc.id}')" class="btn-action" style="width:100%;">تأكيد</button>`;
    Utils.openModal('modal-generic');
  },
  confirmServiceOrder: (svcId) => {
    const svc = DB.nursingServices.find(s => s.id === svcId);
    const addr = document.getElementById('svc-addr').value.trim();
    if (!addr) return Utils.toast('اكتب العنوان', true);
    DB.orders.push({id:Utils.id(), userId:Auth.currentUser.id, title:svc.name, price:svc.price, status:'preparing', address:addr, ts:Date.now()});
    saveDB(); Utils.closeModal('modal-generic'); Utils.toast('تم الطلب'); router.navigate('dashboard');
  }
};
</script>

<script>
const CalendarModule = {
  render: () => {
    const el = document.getElementById('view-calendar');
    const [year, month] = DB.calendarCursor.split('-').map(Number);
    const firstDay = new Date(year, month-1, 1);
    const daysInMonth = new Date(year, month, 0).getDate();
    const startWeekDay = firstDay.getDay();
    const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const dayNames = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
    const apptsByDate = {};
    DB.appointments.forEach(a => { if (a.status === 'canceled') return; if (!apptsByDate[a.date]) apptsByDate[a.date] = []; apptsByDate[a.date].push(a); });
    const todayISO = Utils.todayISO();
    let cells = '';
    for (let i = 0; i < startWeekDay; i++) cells += '<div class="cal-cell other-month"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const dateISO = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const appts = apptsByDate[dateISO] || [];
      const isToday = dateISO === todayISO;
      cells += `<div class="cal-cell ${isToday?'today':''} ${appts.length?'has-appts':''}" onclick="CalendarModule.openDay('${dateISO}')"><span>${d}</span>${appts.length?`<span class="cal-badge">${appts.length}</span>`:''}</div>`;
    }
    el.innerHTML = `<h2 class="section-title"><i class="fa-solid fa-calendar-days" style="color:var(--emerald);"></i> الكاليندر</h2><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><button onclick="CalendarModule.prev()" class="btn-ui" style="background:var(--gray-light);color:var(--primary);"><i class="fa-solid fa-chevron-right"></i></button><h3 style="margin:0;font-weight:900;">${monthNames[month-1]} ${year}</h3><button onclick="CalendarModule.next()" class="btn-ui" style="background:var(--gray-light);color:var(--primary);"><i class="fa-solid fa-chevron-left"></i></button></div><div class="cal-grid" style="margin-bottom:8px;">${dayNames.map(d => `<div style="text-align:center;font-size:10px;font-weight:900;color:var(--gray);padding:4px;">${d}</div>`).join('')}</div><div class="cal-grid">${cells}</div></div>`;
  },
  prev: () => { const [y,m] = DB.calendarCursor.split('-').map(Number); const d = new Date(y, m-2, 1); DB.calendarCursor = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; saveDB(); CalendarModule.render(); },
  next: () => { const [y,m] = DB.calendarCursor.split('-').map(Number); const d = new Date(y, m, 1); DB.calendarCursor = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; saveDB(); CalendarModule.render(); },
  openDay: (dateISO) => {
    const appts = DB.appointments.filter(a => a.date === dateISO && a.status !== 'canceled');
    document.getElementById('modal-generic-body').innerHTML = `<button class="modal-close" onclick="Utils.closeModal('modal-generic')"><i class="fa-solid fa-xmark"></i></button><h3 style="margin:0 0 12px;font-weight:900;">${Utils.fmtDate(dateISO)}</h3>${appts.length ? appts.map(a => `<div class="item-box" style="margin-bottom:8px;"><div class="item-icon"><i class="fa-solid fa-user-doctor"></i></div><div class="item-info"><div class="item-title">${a.doctorName}</div><div class="item-sub">${a.slot} • ${a.patientName}</div></div></div>`).join('') : '<p style="text-align:center;color:var(--gray);">لا حجوزات</p>'}`;
    Utils.openModal('modal-generic');
  }
};
const QueueModule = {
  render: () => {
    const el = document.getElementById('view-queue');
    if (!Auth.currentUser) { el.innerHTML = `<div class="card text-center"><button onclick="AuthUI.open()" class="btn-action">دخول</button></div>`; return; }
    const mine = DB.appointments.filter(a => a.patientId === Auth.currentUser.id && a.status !== 'completed' && a.status !== 'canceled').sort((a,b) => a.ts - b.ts);
    if (!mine.length) { el.innerHTML = `<div class="card text-center" style="padding:40px;"><i class="fa-solid fa-calendar-xmark" style="font-size:48px;color:var(--gray);margin-bottom:16px;"></i><p style="font-weight:900;">لا حجز نشط</p><button onclick="router.navigate('medical')" class="btn-action">احجز</button></div>`; return; }
    el.innerHTML = `<h2 class="section-title"><i class="fa-solid fa-users-viewfinder" style="color:var(--sky);"></i> تتبع الدور (Live)</h2>${mine.map(appt => {
      const same = DB.appointments.filter(a => a.doctorId === appt.doctorId && a.date === appt.date && a.status !== 'canceled' && a.status !== 'completed').sort((a,b) => a.ts - b.ts);
      const pos = same.findIndex(a => a.id === appt.id) + 1;
      const ahead = pos - 1;
      const doc = DB.doctors.find(d => d.id === appt.doctorId);
      const eta = ahead * (doc?.avgTime || 20);
      const isCur = appt.status === 'next';
      return `<div class="card" style="border-right:4px solid ${isCur?'var(--amber)':'var(--sky)'};"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><div><h4 style="margin:0;font-weight:900;">${appt.doctorName}</h4><p style="margin:4px 0 0;font-size:11px;color:var(--sky);font-weight:900;"><i class="fa-solid fa-calendar"></i> ${Utils.fmtDate(appt.date)} • ${appt.slot}</p>${appt.patientName !== Auth.currentUser.name ? `<p style="font-size:10px;color:var(--purple);font-weight:900;margin:2px 0 0;">لـ ${appt.patientName}</p>` : ''}</div><span style="font-size:11px;font-weight:900;padding:4px 10px;border-radius:6px;background:${isCur?'#FEF3C7':'var(--sky-light)'};color:${isCur?'#92400E':'var(--sky)'};">${isCur?'دورك!':'انتظار'}</span></div><div style="background:var(--gray-light);padding:16px;border-radius:12px;text-align:center;margin-bottom:12px;"><div style="font-size:11px;color:var(--gray);font-weight:900;">رقم دورك</div><div style="font-size:42px;font-weight:900;color:${isCur?'var(--amber)':'var(--emerald)'};line-height:1;">#${pos}</div><div style="font-size:11px;color:var(--gray);font-weight:700;margin-top:6px;">${isCur?'توجه الآن':ahead>0?`${ahead} قبلك`:'التالي'}</div></div>${!isCur ? `<div style="background:var(--sky-light);padding:12px;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:12px;"><span style="font-size:11px;font-weight:900;color:var(--sky);"><i class="fa-solid fa-clock"></i> متوقع</span><span style="font-size:14px;font-weight:900;color:var(--sky);">~${eta}د</span></div>` : `<div style="background:var(--amber-light);padding:14px;border-radius:10px;text-align:center;color:#9A3412;font-weight:900;margin-bottom:12px;">🔔 توجه للطبيب</div>`}<div style="display:flex;gap:6px;">${appt.visitType === 'video' ? `<button onclick="VideoModule.start('${appt.doctorId}')" class="btn-action" style="flex:1;padding:10px;font-size:12px;background:var(--purple);"><i class="fa-solid fa-video"></i> فيديو</button>` : ''}<button onclick="QueueModule.cancel('${appt.id}')" class="btn-action" style="flex:1;background:var(--danger-light);color:var(--danger);padding:10px;font-size:12px;"><i class="fa-solid fa-xmark"></i> إلغاء</button></div></div>`;
    }).join('')}`;
  },
  cancel: (id) => { if (!confirm('إلغاء؟')) return; const a = DB.appointments.find(x => x.id === id); if (a) { a.status = 'canceled'; saveDB(); Utils.toast('تم الإلغاء'); QueueModule.render(); } }
};
const SymptomChecker = {
  selected: [],
  render: () => {
    const el = document.getElementById('view-symptom-checker');
    SymptomChecker.selected = [];
    el.innerHTML = `<div class="card" style="background:linear-gradient(135deg,var(--purple),#8B5CF6);color:#fff;border:none;"><h2 style="margin:0;font-weight:900;"><i class="fa-solid fa-notes-medical"></i> فحص الأعراض الذكي</h2><p style="margin:4px 0 0;font-size:12px;opacity:.9;">اختار الأعراض وهنقولك تروح لمين ودرجة الاستعجال</p></div><div class="card"><h3 style="margin:0 0 12px;font-size:14px;font-weight:900;">الأعراض الشائعة:</h3><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;" id="symptoms-grid">${SYMPTOMS_KB.map((s,i) => `<div class="symptom-chip" onclick="SymptomChecker.toggle(${i})" data-idx="${i}">${s.symptom}</div>`).join('')}</div><button onclick="SymptomChecker.analyze()" class="btn-action" style="width:100%;padding:14px;margin-top:16px;background:var(--purple);"><i class="fa-solid fa-microscope"></i> حلل الأعراض</button></div><div id="symptom-result"></div>`;
  },
  toggle: (idx) => {
    const el = document.querySelector(`.symptom-chip[data-idx="${idx}"]`);
    if (el.classList.contains('selected')) { el.classList.remove('selected'); SymptomChecker.selected = SymptomChecker.selected.filter(i => i !== idx); }
    else { el.classList.add('selected'); SymptomChecker.selected.push(idx); }
  },
  analyze: () => {
    if (!SymptomChecker.selected.length) return Utils.toast('اختر عرض واحد على الأقل', true);
    const results = SymptomChecker.selected.map(i => SYMPTOMS_KB[i]);
    const specs = [...new Set(results.map(r => r.spec))];
    const maxUrgency = results.some(r => r.urgency==='critical') ? 'critical' : results.some(r => r.urgency==='high') ? 'high' : results.some(r => r.urgency==='medium') ? 'medium' : 'low';
    const urgData = {critical:{color:'var(--danger)',label:'عاجل جداً - توجه للطوارئ',icon:'fa-triangle-exclamation'},high:{color:'var(--amber)',label:'يحتاج زيارة قريبة',icon:'fa-exclamation-circle'},medium:{color:'var(--sky)',label:'راجع الطبيب خلال أيام',icon:'fa-info-circle'},low:{color:'var(--emerald)',label:'متابعة روتينية',icon:'fa-check-circle'}}[maxUrgency];
    const matchedDocs = DB.doctors.filter(d => specs.some(s => d.spec.includes(s)));
    document.getElementById('symptom-result').innerHTML = `<div class="card" style="border-right:4px solid ${urgData.color};"><div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;"><div style="font-size:32px;color:${urgData.color};"><i class="fa-solid ${urgData.icon}"></i></div><div><div style="font-weight:900;font-size:14px;color:${urgData.color};">${urgData.label}</div><div style="font-size:11px;color:var(--gray);">بناءً على الأعراض</div></div></div><h4 style="margin:12px 0 8px;font-weight:900;font-size:13px;">التخصصات:</h4><div style="display:flex;gap:6px;flex-wrap:wrap;">${specs.map(s => `<span style="background:var(--purple-light);color:var(--purple);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:900;">${s}</span>`).join('')}</div><h4 style="margin:12px 0 8px;font-weight:900;font-size:13px;">النصائح:</h4>${results.map(r => `<div style="padding:8px;background:var(--gray-light);border-radius:8px;margin-bottom:6px;font-size:11px;font-weight:700;"><strong>${r.symptom}:</strong> ${r.advice}</div>`).join('')}</div><h3 class="section-title"><i class="fa-solid fa-user-doctor" style="color:var(--emerald);"></i> أطباء مناسبون (${matchedDocs.length})</h3><div class="grid-list">${matchedDocs.map(d => `<div class="card" style="padding:14px;"><div style="display:flex;justify-content:space-between;align-items:center;"><div><h4 style="margin:0;font-weight:900;font-size:14px;">${d.name}</h4><p style="margin:4px 0 0;font-size:11px;color:var(--emerald);font-weight:900;">${d.spec} • ${Utils.money(d.price)}</p></div><button onclick="MedicalModule.openBooking('${d.id}')" class="btn-action" style="padding:8px 14px;font-size:11px;">احجز</button></div></div>`).join('') || '<p style="text-align:center;color:var(--gray);">لا أطباء</p>'}</div>`;
    document.getElementById('symptom-result').scrollIntoView({behavior:'smooth'});
  }
};
</script>

<script>
const VaultModule = {
  render: () => {
    if (!Auth.currentUser) return AuthUI.open();
    const el = document.getElementById('view-vault');
    const records = DB.healthRecords.filter(r => r.userId === Auth.currentUser.id).sort((a,b) => b.ts - a.ts);
    const categories = [
      {id:'lab', name:'تحاليل', icon:'fa-vial', color:'var(--sky)'},
      {id:'xray', name:'أشعة', icon:'fa-x-ray', color:'var(--purple)'},
      {id:'prescription', name:'روشتات', icon:'fa-prescription', color:'var(--emerald)'},
      {id:'report', name:'تقارير', icon:'fa-file-medical', color:'var(--amber)'},
      {id:'vaccine', name:'تطعيمات', icon:'fa-syringe', color:'var(--gold)'}
    ];
    el.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,var(--sky),#0EA5E9);color:#fff;border:none;">
        <h2 style="margin:0;font-weight:900;"><i class="fa-solid fa-folder-medical"></i> خزنتك الطبية</h2>
        <p style="margin:4px 0 0;font-size:12px;opacity:.9;">كل تحاليلك وأشعتك وروشتاتك في مكان واحد آمن</p>
      </div>
      <div class="grid-3" style="margin-bottom:16px;">
        ${categories.map(c => `<div class="card" onclick="VaultModule.upload('${c.id}')" style="cursor:pointer;text-align:center;padding:14px;margin:0;"><i class="fa-solid ${c.icon}" style="font-size:24px;color:${c.color};margin-bottom:6px;"></i><div style="font-size:11px;font-weight:900;">${c.name}</div></div>`).join('')}
      </div>
      <h3 class="section-title"><i class="fa-solid fa-list" style="color:var(--emerald);"></i> مستنداتك (${records.length})</h3>
      <div class="grid-list">
        ${records.length ? records.map(r => {
          const cat = categories.find(c => c.id === r.type) || categories[3];
          return `<div class="record-card"><div class="record-icon" style="background:${cat.color}20;color:${cat.color};"><i class="fa-solid ${cat.icon}"></i></div><div style="flex:1;"><div style="font-weight:900;font-size:13px;">${r.title}</div><div style="font-size:10px;color:var(--gray);">${new Date(r.ts).toLocaleDateString('ar-EG')}</div></div><button onclick="VaultModule.view('${r.id}')" class="btn-ui" style="background:var(--sky-light);color:var(--sky);padding:6px 10px;"><i class="fa-solid fa-eye"></i></button><button onclick="VaultModule.remove('${r.id}')" class="btn-ui" style="background:var(--danger-light);color:var(--danger);padding:6px 10px;"><i class="fa-solid fa-trash"></i></button></div>`;
        }).join('') : '<div class="card text-center" style="color:var(--gray);">لا مستندات بعد. ابدأ برفع أول تحليل!</div>'}
      </div>
    `;
  },
  upload: (type) => {
    const names = {lab:'تحليل', xray:'أشعة', prescription:'روشتة', report:'تقرير', vaccine:'تطعيم'};
    document.getElementById('modal-generic-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-generic')"><i class="fa-solid fa-xmark"></i></button>
      <h3 style="margin:0 0 16px;font-weight:900;">رفع ${names[type]} جديد</h3>
      <input type="text" id="rec-title" class="input-field" placeholder="عنوان المستند">
      <textarea id="rec-notes" class="input-field" placeholder="ملاحظات (اختياري)" rows="3"></textarea>
      <div style="padding:20px;border:2px dashed var(--line);border-radius:10px;text-align:center;color:var(--gray);margin-bottom:12px;">
        <i class="fa-solid fa-camera" style="font-size:32px;margin-bottom:8px;"></i>
        <div style="font-size:12px;font-weight:900;">صوّر المستند أو ارفعه</div>
        <div style="font-size:10px;">(محاكاة - يُخزن النص فقط)</div>
      </div>
      <button onclick="VaultModule.saveRecord('${type}')" class="btn-action" style="width:100%;"><i class="fa-solid fa-save"></i> حفظ</button>
    `;
    Utils.openModal('modal-generic');
  },
  saveRecord: (type) => {
    const title = document.getElementById('rec-title').value.trim();
    const notes = document.getElementById('rec-notes').value.trim();
    if (!title) return Utils.toast('اكتب عنوان', true);
    DB.healthRecords.push({id:'rec-'+Utils.id(), userId:Auth.currentUser.id, type, title, notes, ts:Date.now()});
    saveDB();
    Auth.addPoints(REWARD_RULES.upload_record);
    Utils.closeModal('modal-generic');
    VaultModule.render();
  },
  view: (id) => {
    const r = DB.healthRecords.find(x => x.id === id);
    if (!r) return;
    document.getElementById('modal-generic-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-generic')"><i class="fa-solid fa-xmark"></i></button>
      <h3 style="margin:0 0 8px;font-weight:900;">${r.title}</h3>

const TrackerModule = {
  render: () => {
    if (!Auth.currentUser) return AuthUI.open();
    const el = document.getElementById('view-tracker');
    const logs = DB.healthLogs.filter(l => l.userId === Auth.currentUser.id);
    const latest = {};
    HEALTH_METRICS.forEach(m => {
      const metricLogs = logs.filter(l => l.metricId === m.id).sort((a,b) => b.ts - a.ts);
      latest[m.id] = metricLogs[0];
    });
    el.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,var(--emerald),#10B981);color:#fff;border:none;">
        <h2 style="margin:0;font-weight:900;"><i class="fa-solid fa-chart-line"></i> صحتي</h2>

      <button onclick="TrackerModule.addLog()" class="btn-action" style="width:100%;padding:14px;margin-bottom:16px;"><i class="fa-solid fa-plus"></i> تسجيل قياس جديد (+${REWARD_RULES.track_health} نقاط)</button>
      <h3 class="section-title"><i class="fa-solid fa-heart-pulse" style="color:var(--danger);"></i> أحدث القياسات</h3>
      <div class="grid-2" style="margin-bottom:16px;">
        ${HEALTH_METRICS.map(m => {
          const val = latest[m.id];
          return `<div class="metric-card"><i class="fa-solid ${m.icon}" style="font-size:20px;color:${m.color};margin-bottom:6px;"></i><div class="metric-value" style="color:${m.color};">${val ? val.value : '—'}<span class="metric-unit">${val ? m.unit : ''}</span></div><div class="metric-label">${m.name}</div><div style="font-size:9px;color:var(--gray);margin-top:2px;">طبيعي: ${m.normal}</div></div>`;
        }).join('')}
      </div>
      <h3 class="section-title"><i class="fa-solid fa-chart-simple" style="color:var(--sky);"></i> الرسوم البيانية</h3>
      ${HEALTH_METRICS.map(m => {
        const metricLogs = logs.filter(l => l.metricId === m.id).sort((a,b) => a.ts - b.ts).slice(-7);
        if (!metricLogs.length) return '';
        const max = Math.max(...metricLogs.map(l => l.value)) * 1.2;
        return `<div class="card"><h4 style="margin:0 0 12px;font-weight:900;font-size:13px;color:${m.color};"><i class="fa-solid ${m.icon}"></i> ${m.name}</h4><div class="bar-chart">${metricLogs.map(l => { const h = (l.value/max)*100; return `<div class="bar-col"><div class="bar-val">${l.value}</div><div class="bar" style="height:${h}%;background:linear-gradient(180deg,${m.color},${m.color}88);"></div><div class="bar-label">${new Date(l.ts).getDate()}/${new Date(l.ts).getMonth()+1}</div></div>`; }).join('')}</div></div>`;
      }).join('')}
    `;
  },
  addLog: () => {
    document.getElementById('modal-generic-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-generic')"><i class="fa-solid fa-xmark"></i></button>
      <h3 style="margin:0 0 16px;font-weight:900;">تسجيل قياس</h3>
      <select id="log-metric" class="input-field">
        ${HEALTH_METRICS.map(m => `<option value="${m.id}">${m.name} (${m.unit})</option>`).join('')}

    const value = parseFloat(document.getElementById('log-value').value);
    const dateISO = document.getElementById('log-date').value;
    if (!value) return Utils.toast('أدخل القيمة', true);
    DB.healthLogs.push({id:'hl-'+Utils.id(), userId:Auth.currentUser.id, metricId, value, dateISO, ts:new Date(dateISO).getTime()});

    Auth.addPoints(REWARD_RULES.track_health);

};

<script>
const AnalyticsModule = {
  render: () => {
    if (!Auth.currentUser || Auth.currentUser.role !== 'doctor') return router.navigate('medical');
    const docId = Auth.currentUser.doctorId;
    const doc = DB.doctors.find(d => d.id === docId);
    const el = document.getElementById('view-doctor-analytics');
    const allAppts = DB.appointments.filter(a => a.doctorId === docId);
    const completed = allAppts.filter(a => a.status === 'completed');
    const canceled = allAppts.filter(a => a.status === 'canceled');
    const totalRevenue = completed.reduce((s,a) => s + a.price, 0);
    const platformFee = Math.round(totalRevenue * 0.15);
    const netRevenue = totalRevenue - platformFee;
    const uniquePatients = new Set(allAppts.map(a => a.patientId)).size;
    const reviews = DB.reviews.filter(r => r.doctorId === docId);
    const avgRating = reviews.length ? (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1) : doc.rating;
    const last7 = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const iso = d.toISOString().split('T')[0];
      const dayAppts = allAppts.filter(a => a.date === iso);
      last7.push({date:iso, count:dayAppts.length});
    }
    const maxAppts = Math.max(...last7.map(x=>x.count), 1);
    el.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,var(--primary),#1E293B);color:#fff;border:none;">
        <h2 style="margin:0;font-weight:900;"><i class="fa-solid fa-chart-pie"></i> تحليلات العيادة</h2>
        <p style="margin:4px 0 0;font-size:12px;opacity:.8;">أداءك الشهري على وصلة</p>
      </div>
      <div class="grid-2" style="margin-bottom:16px;">
        <div class="card" style="margin:0;padding:14px;background:var(--emerald-light);border-color:var(--emerald);"><div style="font-size:11px;font-weight:900;color:var(--gray);">إجمالي الإيرادات</div><div style="font-size:22px;font-weight:900;color:var(--emerald);">${Utils.money(totalRevenue)}</div></div>
        <div class="card" style="margin:0;padding:14px;background:var(--gold-light);border-color:var(--gold);"><div style="font-size:11px;font-weight:900;color:var(--gray);">صافي بعد العمولة (15%)</div><div style="font-size:22px;font-weight:900;color:var(--gold);">${Utils.money(netRevenue)}</div></div>

const DoctorModule = {
  call: (id) => {
    const a = DB.appointments.find(x => x.id === id);

      <button onclick="DoctorModule.saveScribe('${apptId}')" class="btn-action" style="width:100%;">حفظ الروشتة</button>
    `;
    Utils.openModal('modal-generic');
    setTimeout(() => {
      const el = document.getElementById('scribe-text');
      if (el) {
        el.style.color = 'var(--primary)';
        el.innerHTML = `"المريض يشكو من صداع شديد منذ يومين مع ارتفاع حرارة.<br><br><strong>التشخيص:</strong> نزلة برد.<br><strong>الروشتة:</strong> بانادول 500mg كل 8 ساعات + فيتامين سي يومياً."`;
        el.dataset.text = "المريض يشكو من صداع شديد منذ يومين مع ارتفاع حرارة. التشخيص: نزلة برد. الروشتة: بانادول 500mg كل 8 ساعات + فيتامين سي يومياً.";
      }
    }, 2500);
  },
  saveScribe: (apptId) => {
    const el = document.getElementById('scribe-text');
    const text = el.dataset.text;
    if (!text) return Utils.toast('لم يتم التعرف', true);
    const appt = DB.appointments.find(a => a.id === apptId);
    if (appt) {
      DB.prescriptions = DB.prescriptions || [];
      DB.prescriptions.push({id:'rx-'+Utils.id(), apptId, doctorId:Auth.currentUser.doctorId, patientId:appt.patientId, patientName:appt.patientName, text, ts:Date.now()});
      saveDB();
      Notifier.push(appt.patientId, `📝 روشتة جديدة من ${Auth.currentUser.name}`, false);
    }
    Utils.closeModal('modal-generic');
    Utils.toast('تم حفظ الروشتة');

  updateSchedule: (docId, day, field, value) => {
    const doc = DB.doctors.find(d => d.id === docId);
    if (!doc) return;
    if (field === 'duration') value = parseInt(value) || 20;
    doc.schedule[day][field] = value;
    saveDB();
    Utils.toast('تم التحديث');
  },
  toggleDay: (docId, day) => {
    const doc = DB.doctors.find(d => d.id === docId);
    if (!doc) return;
    const s = doc.schedule[day];
    doc.schedule[day] = s.active ? {active:false} : {active:true,start:'17:00',end:'21:00',duration:20,breakStart:null,breakEnd:null};
    saveDB();
    DoctorDashboard.render();
  },
  addServiceModal: (docId) => {
    document.getElementById('modal-generic-body').innerHTML = `

    const dur = parseInt(document.getElementById('svc-dur').value) || 15;
    if (!name) return Utils.toast('اكتب اسم', true);
    const doc = DB.doctors.find(d => d.id === docId);
    doc.services.push({id:'sv-'+Utils.id(), name, price, duration:dur, icon:'fa-stethoscope'});
    saveDB(); Utils.closeModal('modal-generic'); Utils.toast('تمت'); DoctorDashboard.render();
  },
  removeService: (docId, svcId) => {
    if (!confirm('حذف؟')) return;
    const doc = DB.doctors.find(d => d.id === docId);
    doc.services = doc.services.filter(s => s.id !== svcId);
    saveDB(); DoctorDashboard.render();
  }
};
const StaffModule = {
  call: (id) => {
    const a = DB.appointments.find(x => x.id === id);
    if (!a) return;
    a.status = 'next'; saveDB();
    Notifier.push(a.patientId, `🔔 دورك الآن!`, true);
    StaffDashboard.render();

  finish: (id) => {
    const a = DB.appointments.find(x => x.id === id);
    if (!a) return;
    a.status = 'completed'; saveDB();
    StaffDashboard.render();
  }
};
</script>

      <div class="grid-list">
        ${myRx.slice(0,3).map(r => `<div class="card" style="padding:12px;border-right:4px solid var(--emerald);"><div style="font-size:10px;color:var(--gray);font-weight:900;">${new Date(r.ts).toLocaleDateString('ar-EG')}</div><div style="font-size:12px;margin-top:4px;">${r.text.substring(0,120)}...</div></div>`).join('')}
      </div>` : ''}
      <h3 class="section-title"><i class="fa-solid fa-notes-medical" style="color:var(--danger);"></i> الملف الطبي</h3>
      <div class="card grid-2">
        <div style="background:var(--danger-light);padding:14px;border-radius:10px;text-align:center;"><div style="font-size:10px;font-weight:900;color:var(--gray);">فصيلة الدم</div><div style="font-size:20px;font-weight:900;">${emr.blood}</div></div>
        <div style="background:var(--amber-light);padding:14px;border-radius:10px;text-align:center;"><div style="font-size:10px;font-weight:900;color:var(--gray);">حساسية</div><div style="font-size:14px;font-weight:900;">${emr.allergies.join('، ') || 'لا يوجد'}</div></div>
      </div>
      <h3 class="section-title"><i class="fa-solid fa-clock" style="color:var(--gray);"></i> كل الحجوزات (${myAppts.length})</h3>
      <div class="grid-list">
        ${myAppts.slice(0,10).map(a => `<div class="card" style="padding:12px;"><div style="display:flex;justify-content:space-between;align-items:center;"><div><h4 style="margin:0;font-weight:900;font-size:13px;">${a.doctorName}</h4><p style="margin:4px 0 0;font-size:11px;color:var(--gray);">${Utils.fmtDate(a.date)} • ${a.slot} • ${Utils.money(a.price)}</p></div><span style="font-size:10px;padding:4px 10px;border-radius:6px;background:${a.status==='completed'?'var(--emerald-light)':a.status==='canceled'?'var(--danger-light)':'var(--gray-light)'};color:${a.status==='completed'?'var(--emerald)':a.status==='canceled'?'var(--danger)':'var(--gray)'};font-weight:900;">${a.status==='completed'?'✓':a.status==='canceled'?'✗':a.status==='next'?'دورك':'انتظار'}</span></div></div>`).join('') || '<p style="font-size:12px;color:var(--gray);text-align:center;">لا حجوزات</p>'}
      </div>
    `;
  }
};
const FounderDashboard = {
  render: () => {
    if (!Auth.currentUser || Auth.currentUser.role !== 'founder') return router.navigate('medical');
    const totalRevenue = DB.appointments.filter(a => a.status === 'completed').reduce((s,a) => s + a.price, 0) + DB.orders.reduce((s,o) => s + o.price, 0);
    const commission = Math.round(totalRevenue * 0.15);
    const patients = DB.users.filter(u => u.role === 'patient');
    document.getElementById('view-founder').innerHTML = `
      <div class="card" style="background:var(--primary);color:#fff;border:none;">
        <h2 style="margin:0 0 16px;font-weight:900;"><i class="fa-solid fa-crown" style="color:var(--gold);"></i> لوحة المؤسس</h2>
        <div class="grid-2" style="gap:10px;">
          <div style="background:rgba(255,255,255,.1);padding:14px;border-radius:10px;"><div style="font-size:11px;color:#94A3B8;">الإيرادات</div><div style="font-size:18px;font-weight:900;color:#34D399;">${Utils.money(totalRevenue)}</div></div>
          <div style="background:rgba(255,255,255,.1);padding:14px;border-radius:10px;"><div style="font-size:11px;color:#94A3B8;">العمولة</div><div style="font-size:18px;font-weight:900;color:var(--gold);">${Utils.money(commission)}</div></div>
          <div style="background:rgba(255,255,255,.1);padding:14px;border-radius:10px;"><div style="font-size:11px;color:#94A3B8;">المرضى</div><div style="font-size:18px;font-weight:900;">${patients.length}</div></div>
          <div style="background:rgba(255,255,255,.1);padding:14px;border-radius:10px;"><div style="font-size:11px;color:#94A3B8;">الأطباء</div><div style="font-size:18px;font-weight:900;">${DB.doctors.length}</div></div>
        </div>
      </div>
      <h3 class="section-title"><i class="fa-solid fa-user-doctor" style="color:var(--emerald);"></i> الأطباء</h3>
      <div class="grid-list">
        ${DB.doctors.map(d => `<div class="item-box"><div class="item-icon"><i class="fa-solid fa-user-doctor"></i></div><div class="item-info"><div class="item-title">${d.name}</div><div class="item-sub">${d.spec} • ⭐ ${d.rating} • ${d.services.length} خدمة</div></div></div>`).join('')}
      </div>
      <h3 class="section-title" style="margin-top:24px;"><i class="fa-solid fa-shield-halved" style="color:var(--gold);"></i> التأمين (${DB.insuranceCompanies.length})</h3>
      <div class="grid-list">
        ${DB.insuranceCompanies.map(ins => `<div class="item-box"><div class="item-icon" style="background:var(--gold-light);color:var(--gold);"><i class="fa-solid ${ins.logo}"></i></div><div class="item-info"><div class="item-title">${ins.name}</div><div class="item-sub">تغطية ${ins.coverage}%</div></div></div>`).join('')}
      </div>
    `;
  }
};
window.addEventListener('DOMContentLoaded', () => {
  UI.renderHeader();
  router.navigate('medical');
  setInterval(() => {
    let changed = false;
    DB.orders.forEach(o => {
      if (o.status === 'preparing') { o.status = 'on_way'; changed = true; }
      else if (o.status === 'on_way') { o.status = 'delivered'; changed = true; }
    });
    if (changed) saveDB();
    if (Auth.currentUser) {
      if (document.getElementById('view-queue')?.classList.contains('active')) QueueModule.render();
      if (document.getElementById('view-dashboard')?.classList.contains('active')) PatientDashboard.render();
    }
  }, 15000);
  setInterval(() => {
    if (!Auth.currentUser) return;
    const now = new Date();
    const hhmm = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    DB.reminders.filter(r => r.userId === Auth.currentUser.id && r.times.includes(hhmm)).forEach(r => {
      Notifier.push(Auth.currentUser.id, `💊 وقت دواء ${r.medName} - ${r.dose}`, true);
    });
  }, 60000);
});
</script>
</body>
