<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>منصة وصلة | WASLA - Super App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* ==========================================================================
     WASLA DESIGN SYSTEM (CSS) - PRESERVED IDENTITY
     ========================================================================== */
  :root {
    --primary: #0B1220;
    --primary-light: #1E293B;
    --emerald: #059669;
    --emerald-light: #ECFDF5;
    --amber: #EA580C;
    --amber-light: #FFF7ED;
    --sky: #0284C7;
    --sky-light: #F0F9FF;
    --danger: #E11D48;
    --danger-light: #FFF1F2;
    --gold: #D97706;
    --gray: #64748B;
    --gray-light: #F8FAFC;
    --line: #E2E8F0;
    --bg: #F4F6FB;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg); color: var(--primary); margin: 0; padding-bottom: 70px; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--gray); border-radius: 10px; }

  /* Dark Mode */
  body.dark-mode {
    --primary: #F8FAFC; --primary-light: #E2E8F0;
    --bg: #0B1220; --gray-light: #1E293B;
    --line: #334155; --gray: #94A3B8;
  }
  body.dark-mode .app-header, body.dark-mode .super-tabs { background: #0F172A; border-color: #334155; }
  body.dark-mode .card, body.dark-mode .item-box { background: #1E293B; border-color: #334155; }
  body.dark-mode .item-title, body.dark-mode .section-title { color: #F8FAFC; }
  body.dark-mode .input-field { background: #0F172A; border-color: #334155; color: #F8FAFC; }
  body.dark-mode .bottom-sheet, body.dark-mode .modal-box { background: #1E293B; color: #F8FAFC; }
  body.dark-mode .sheet-footer { background: #0F172A; }

  /* Ticker */
  .ticker-wrap { background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; padding: 8px 0; overflow: hidden; white-space: nowrap; display: flex; }
  .ticker-content { display: inline-block; padding-right: 100%; animation: ticker 25s linear infinite; }
  @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(100%); } }

  /* Header */
  .app-header { position: sticky; top: 0; z-index: 100; background: rgba(11,18,32,0.98); backdrop-filter: blur(10px); color: #fff; padding: 10px 16px; box-shadow: var(--shadow-md); }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--emerald), #10B981); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 12px rgba(5,150,105,0.4); }
  .brand-title { font-size: 20px; font-weight: 900; margin: 0; line-height: 1; }
  .brand-title span { font-size: 10px; color: #34D399; background: rgba(52,211,153,0.15); padding: 2px 6px; border-radius: 6px; vertical-align: middle; margin-right: 4px; }
  
  .header-actions { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .header-actions::-webkit-scrollbar { display: none; }
  .btn-ui { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
  .btn-ui:active { transform: scale(0.95); }
  .btn-ui.primary { background: var(--emerald); border: none; }
  
  /* Super Tabs */
  .super-tabs { display: flex; gap: 8px; padding: 12px; overflow-x: auto; scrollbar-width: none; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 60px; z-index: 99; }
  .super-tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 900; color: var(--gray); background: var(--gray-light); border: 1px solid var(--line); white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }

  /* Layout */
  .page-container { max-width: 800px; margin: 0 auto; padding: 16px; }
  .view-section { display: none; animation: fadeUp 0.4s ease; }
  .view-section.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  
  .card { background: #fff; border-radius: var(--radius-md); border: 1px solid var(--line); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
  .section-title { font-size: 18px; font-weight: 900; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
  
  .item-box { background: #FAFCFE; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
  .item-icon { width: 48px; height: 48px; border-radius: var(--radius-sm); background: var(--emerald-light); color: var(--emerald); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .item-info { flex: 1; }
  .item-title { font-weight: 900; font-size: 14px; margin: 0 0 4px; color: var(--primary); }
  .item-sub { font-size: 11px; color: var(--gray); font-weight: 700; margin: 0; }
  .item-price { font-weight: 900; color: var(--emerald); font-size: 15px; }
  
  .btn-action { background: var(--emerald); color: #fff; border: none; padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 900; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
  .btn-action:active { transform: scale(0.98); }
  
  .input-field { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; background: var(--gray-light); margin-bottom: 12px; transition: 0.2s; }
  .input-field:focus { outline: none; border-color: var(--emerald); background: #fff; box-shadow: 0 0 0 4px var(--emerald-light); }

  /* Bottom Sheet & Modals */
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: 0.3s; }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: #fff; border-radius: var(--radius-lg) var(--radius-lg) 0 0; z-index: 201; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
  .bottom-sheet.open { bottom: 0; }
  .sheet-header { padding: 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .sheet-body { padding: 20px; overflow-y: auto; flex: 1; }
  .sheet-footer { padding: 20px; border-top: 1px solid var(--line); background: var(--gray-light); }
  
  .modal-wrap { position: fixed; inset: 0; background: rgba(11,18,32,0.85); backdrop-filter: blur(4px); z-index: 300; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-wrap.open { display: flex; }
  .modal-box { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 450px; padding: 24px; position: relative; max-height: 90vh; overflow-y: auto; animation: popIn 0.3s; }
  @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-close { position: absolute; top: 16px; left: 16px; background: var(--gray-light); border: none; width: 32px; height: 32px; border-radius: var(--radius-sm); cursor: pointer; color: var(--gray); font-size: 16px; display: flex; align-items: center; justify-content: center; }
  
  #toast-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast-msg { background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 99px; font-size: 13px; font-weight: 900; box-shadow: var(--shadow-lg); border-right: 4px solid var(--emerald); animation: slideDown 0.3s; display: flex; align-items: center; gap: 8px; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

  /* SOS Button */
  #sos-btn { position: fixed; bottom: 80px; left: 20px; z-index: 90; width: 50px; height: 50px; border-radius: 50%; background: var(--danger); color: #fff; border: none; font-size: 20px; box-shadow: 0 0 0 0 rgba(225,29,72,0.7); animation: sos-pulse 2s infinite; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  @keyframes sos-pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225,29,72,0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(225,29,72,0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225,29,72,0); } }
  
  /* Medical Stepper */
  .stepper { display: flex; justify-content: space-between; position: relative; padding: 10px 0; margin-top: 15px; }
  .stepper::before { content: ''; position: absolute; top: 24px; left: 10%; right: 10%; height: 3px; background: var(--line); z-index: 0; }
  .step { display: flex; flex-direction: column; align-items: center; z-index: 1; flex: 1; }
  .step-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--line); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-bottom: 6px; border: 3px solid #fff; transition: 0.3s; }
  .step.active .step-icon { background: var(--emerald); }
  .step.current .step-icon { background: var(--amber); animation: pulse 1.5s infinite; }
  .step-label { font-size: 10px; font-weight: 900; color: var(--gray); text-align: center; }
  .step.active .step-label { color: var(--emerald); }
</style>
</head>
<body>

<!-- Ticker Ads -->
<div id="wasla-ticker" class="ticker-wrap"></div>

<!-- App Header -->
<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></div>
      <div><h1 class="brand-title">وَصْلَة <span>WASLA</span></h1></div>
    </div>
    <div class="header-actions" id="header-actions"></div>
  </div>
</header>

<!-- Navigation Tabs -->
<div class="super-tabs" id="super-tabs">
  <button class="tab active" data-sector="medical" onclick="router.navigate('medical')"><i class="fa-solid fa-stethoscope"></i> طبي</button>
  <button class="tab" data-sector="market" onclick="router.navigate('market')"><i class="fa-solid fa-cart-shopping"></i> تسوق</button>
  <button class="tab" data-sector="cars" onclick="router.navigate('cars')"><i class="fa-solid fa-car"></i> سيارات</button>
  <button class="tab" data-sector="home" onclick="router.navigate('home')"><i class="fa-solid fa-screwdriver-wrench"></i> صيانة</button>
</div>

<!-- Main Content -->
<main class="page-container">
  <section class="view-section active" id="view-medical"></section>
  <section class="view-section" id="view-market"></section>
  <section class="view-section" id="view-cars"></section>
  <section class="view-section" id="view-home"></section>
  <section class="view-section" id="view-founder"></section>
  <section class="view-section" id="view-staff"></section>
  <section class="view-section" id="view-doctor"></section>
  <section class="view-section" id="view-dashboard"></section>
</main>

<!-- Cart Bottom Sheet -->
<div class="sheet-overlay" id="cart-overlay" onclick="cart.toggle()"></div>
<div class="bottom-sheet" id="cart-sheet">
  <div class="sheet-header">
    <h3 style="margin:0; font-weight:900;"><i class="fa-solid fa-basket-shopping" style="color:var(--emerald);"></i> سلة الطلبات</h3>
    <button onclick="cart.toggle()" style="background:var(--gray-light); border:none; width:36px; height:36px; border-radius:var(--radius-sm); cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="sheet-body" id="cart-body"></div>
  <div class="sheet-footer">
    <div style="display:flex; justify-content:space-between; margin-bottom:16px; font-weight:900; font-size:18px;">
      <span>الإجمالي:</span>
      <span id="cart-total" style="color:var(--emerald);">0 ج.م</span>
    </div>
    <button onclick="cart.checkout()" class="btn-action" style="width:100%; padding:16px; font-size:16px;">تأكيد الدفع</button>
  </div>
</div>

<!-- Modals -->
<div class="modal-wrap" id="modal-auth"><div class="modal-box" id="modal-auth-body"></div></div>
<div class="modal-wrap" id="modal-book"><div class="modal-box" id="modal-book-body"></div></div>
<div class="modal-wrap" id="modal-payment"><div class="modal-box" id="modal-payment-body"></div></div>
<div class="modal-wrap" id="modal-map"><div class="modal-box" id="modal-map-body"></div></div>

<div id="toast-box"></div>

<button id="sos-btn" onclick="Views.openSOS()"><i class="fa-solid fa-triangle-exclamation"></i></button>

<script>
/* ==========================================================================
   WASLA MASTER ENGINE — PART 1 (CORE & MEDICAL)
   ========================================================================== */

// --- 1. UTILS ---
const Utils = {
  id: () => Math.random().toString(36).substring(2, 10),
  money: (num) => Number(num).toLocaleString('ar-EG') + ' ج.م',
  toast: (msg, isError = false) => {
    const el = document.createElement('div');
    el.className = 'toast-msg';
    el.style.borderRightColor = isError ? 'var(--danger)' : 'var(--emerald)';
    el.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${msg}`;
    document.getElementById('toast-box').appendChild(el);
    setTimeout(() => el.remove(), 3000);
  },
  openModal: (id) => document.getElementById(id).classList.add('open'),
  closeModal: (id) => document.getElementById(id).classList.remove('open')
};

// --- 2. AUDIO ENGINE ---
let audioCtx;
document.body.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

function playSound(isAlert = false) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = isAlert ? 'square' : 'sine';
  osc.frequency.setValueAtTime(isAlert ? 880 : 600, audioCtx.currentTime);
  if (isAlert) osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

// --- 3. DATABASE ---
const DB_KEY = 'wasla_db_clean_v1';
let DB = JSON.parse(localStorage.getItem(DB_KEY));

if (!DB) {
  DB = {
    users: [
      { id: 'u-f', phone: '01068990089', pass: 'As123789456*', name: 'أحمد صبري', role: 'founder', wallet: 0, waslaId: 'WASLA-F-0001' },
      { id: 'u-p1', phone: '01000000001', pass: '123456', name: 'محمد المريض', role: 'patient', wallet: 150, waslaId: 'WASLA-P-0001', emr: { blood: 'O+', allergies: ['بنسلين'], chronic: ['سكري'], vitals: [120, 135, 118, 110] } },
      { id: 'u-d1', phone: '01000000002', pass: '123456', name: 'د. محمد الشريف', role: 'doctor', wallet: 0, waslaId: 'WASLA-D-0001' },
      { id: 'u-s1', phone: '01000000003', pass: '123456', name: 'موظف الاستقبال', role: 'staff', wallet: 0, waslaId: 'WASLA-S-0001' }
    ],
    doctors: [
      { id: 'd1', name: 'د. محمد الشريف', spec: 'باطنة وكبد', price: 170, avgTime: 15, area: 'شارع بورسعيد', lat: 30.3546, lng: 31.2153, services: ['سكر وضغط', 'مناظير'], schedule: ['5:00 م', '5:30 م', '6:00 م'], status: 'available' },
      { id: 'd2', name: 'د. سارة أحمد', spec: 'أطفال وحديثي الولادة', price: 150, avgTime: 12, area: 'ميدان المحطة', lat: 30.3575, lng: 31.2160, services: ['تطعيمات', 'حساسية'], schedule: ['4:00 م', '4:30 م', '5:00 م'], status: 'busy' },
      { id: 'd3', name: 'د. كريم عبد العزيز', spec: 'قلب وأوعية دموية', price: 250, avgTime: 20, area: 'شارع المستشفى', lat: 30.3550, lng: 31.2145, services: ['تخطيط قلب', 'ضغط الدم'], schedule: ['5:00 م', '6:00 م'], status: 'available' }
    ],
    appointments: [], orders: [], notifications: [], cart: [], emrNotes: [],
    ads: [{ id: 'a1', text: '🎉 خصم 20% على أول كشف', active: true }, { id: 'a2', text: '🚀 ونش إنقاذ متاح الآن', active: true }],
    loyalty: {}
  };
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}
function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

// --- 4. AUTH ---
let Auth = {
  currentUser: JSON.parse(sessionStorage.getItem('wasla_session')) || null,
  
  login: (phone, pass) => {
    const user = DB.users.find(u => u.phone === phone && u.pass === pass);
    if (user) {
      Auth.currentUser = user;
      sessionStorage.setItem('wasla_session', JSON.stringify(user));
      UI.renderHeader(); Utils.closeModal('modal-auth'); Utils.toast('مرحباً بك ' + user.name);
      if (user.role === 'founder') router.navigate('founder');
      else if (user.role === 'staff') router.navigate('staff');
      else if (user.role === 'doctor') router.navigate('doctor');
      else router.navigate('dashboard');
      return true;
    }
    return false;
  },
  
  register: (name, phone, pass) => {
    if (DB.users.find(u => u.phone === phone)) return Utils.toast('رقم الموبايل مسجل بالفعل', true);
    const newId = 'u-' + Utils.id();
    const waslaId = 'WASLA-' + Math.floor(1000 + Math.random() * 9000);
    const newUser = { id: newId, phone, pass, name, role: 'patient', wallet: 0, waslaId, emr: { blood: 'غير محدد', allergies: [], chronic: [], vitals: [] } };
    DB.users.push(newUser); saveDB();
    Auth.currentUser = newUser;
    sessionStorage.setItem('wasla_session', JSON.stringify(newUser));
    UI.renderHeader(); Utils.closeModal('modal-auth'); Utils.toast('تم إنشاء الحساب بنجاح');
    router.navigate('dashboard');
  },

  logout: () => {
    Auth.currentUser = null;
    sessionStorage.removeItem('wasla_session');
    UI.renderHeader(); router.navigate('medical'); Utils.toast('تم تسجيل الخروج');
  }
};

// --- 5. NOTIFIER ---
let Notifier = {
  push: (userId, text, isAlert = false) => {
    DB.notifications.unshift({ id: Utils.id(), userId, text, read: false, ts: Date.now() });
    saveDB();
    if (Auth.currentUser && Auth.currentUser.id === userId) {
      UI.renderHeader(); playSound(isAlert); Utils.toast(text);
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("منصة وصلة | WASLA", { body: text });
      }
    }
  },
  openPanel: (e) => {
    e.stopPropagation();
    const my = DB.notifications.filter(n => n.userId === Auth.currentUser.id);
    let html = `<button class="modal-close" onclick="Utils.closeModal('modal-map')"><i class="fa-solid fa-xmark"></i></button><h3 style="font-weight:900; margin:0 0 16px;">الإشعارات</h3>`;
    if (!my.length) html += `<p style="text-align:center; color:var(--gray);">لا توجد إشعارات</p>`;
    my.forEach(n => {
      html += `<div style="padding:12px; border-bottom:1px solid var(--line); background:${n.read?'#fff':'var(--emerald-light)'}; border-radius:var(--radius-sm); margin-bottom:8px;">
        <div style="font-size:10px; color:var(--gray); margin-bottom:4px;">${new Date(n.ts).toLocaleTimeString('ar-EG')}</div>
        <div style="font-size:13px; font-weight:700;">${n.text}</div>
      </div>`;
    });
    document.getElementById('modal-map-body').innerHTML = html;
    Utils.openModal('modal-map');
    DB.notifications.filter(n => n.userId === Auth.currentUser.id).forEach(n => n.read = true);
    saveDB(); UI.renderHeader();
  }
};

// --- 6. UI ---
const UI = {
  renderHeader: () => {
    const actions = document.getElementById('header-actions');
    const tabs = document.getElementById('super-tabs');
    document.querySelectorAll('.tab.dynamic').forEach(t => t.remove());

    if (!Auth.currentUser) {
      actions.innerHTML = `<button class="btn-ui primary" onclick="AuthUI.open()"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>`;
      return;
    }

    const isFounder = Auth.currentUser.role === 'founder';
    const isStaff = Auth.currentUser.role === 'staff';
    const isDoctor = Auth.currentUser.role === 'doctor';
    const myNotifs = DB.notifications.filter(n => n.userId === Auth.currentUser.id && !n.read);

    actions.innerHTML = `
      <div style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); padding:6px 10px; border-radius:var(--radius-sm); cursor:pointer;" onclick="router.navigate('${isFounder?'founder':isStaff?'staff':isDoctor?'doctor':'dashboard'}')">

// --- 7. ROUTER ---
const router = {
  navigate: (sector) => {
    document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    let view = document.getElementById('view-' + sector);
    if (!view) {
      view = document.createElement('section'); view.id = 'view-' + sector; view.className = 'view-section';
      document.querySelector('main').appendChild(view);
    }
    view.classList.add('active');
    const tab = document.querySelector(`.tab[data-sector="${sector}"]`);
    if (tab) tab.classList.add('active');
    
    const views = { medical: Views.medical, dashboard: Views.dashboard, doctor: Views.doctor, founder: Views.founder, staff: Views.staff, market: Views.market, cars: Views.cars, home: Views.home };
    if (views[sector]) views[sector]();
    window.scrollTo(0,0);
  }
};

const cart = {
  toggle: () => {
    document.getElementById('cart-sheet').classList.toggle('open');
    document.getElementById('cart-overlay').classList.toggle('open');
    cart.render();
  },
  add: (title, price, icon) => {
    DB.cart.push({ cartId: Utils.id(), title, price, icon });
    saveDB(); UI.renderHeader(); Utils.toast('تمت الإضافة للسلة'); cart.toggle();
  },
  remove: (id) => {
    DB.cart = DB.cart.filter(i => i.cartId !== id);
    saveDB(); cart.render(); UI.renderHeader();
  },
  render: () => {
    const body = document.getElementById('cart-body');
    if (!DB.cart.length) {
      body.innerHTML = `<div style="text-align:center; padding:40px; color:var(--gray);"><i class="fa-solid fa-basket-shopping" style="font-size:40px; margin-bottom:12px;"></i><br>السلة فارغة</div>`;
      document.getElementById('cart-total').innerText = '0 ج.م'; return;
    }
    body.innerHTML = DB.cart.map(item => `
      <div class="item-box" style="margin-bottom:10px;">
        <div class="item-icon"><i class="fa-solid ${item.icon}"></i></div>
        <div class="item-info"><div class="item-title">${item.title}</div></div>
        <div class="item-price">${Utils.money(item.price)}</div>
        <button onclick="cart.remove('${item.cartId}')" style="background:var(--danger-light); color:var(--danger); border:none; width:32px; height:32px; border-radius:var(--radius-sm); cursor:pointer; margin-right:10px;"><i class="fa-solid fa-trash"></i></button>
      </div>
    `).join('');
    const total = DB.cart.reduce((s,i) => s + i.price, 0);
    document.getElementById('cart-total').innerText = Utils.money(total);
  },
  checkout: () => {
    if (!Auth.currentUser) { Utils.toast('سجل دخول أولاً', true); return AuthUI.open(); }
    if (!DB.cart.length) return;
    const total = DB.cart.reduce((s,i) => s + i.price, 0);
    document.getElementById('modal-payment-body').innerHTML = `
      <button class="modal-close" onclick="Utils.closeModal('modal-payment')"><i class="fa-solid fa-xmark"></i></button>
      <div style="text-align:center; margin-bottom:20px;">
        <div style="width:64px; height:64px; background:var(--emerald-light); color:var(--emerald); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 12px;"><i class="fa-solid fa-credit-card"></i></div>

        <p style="color:var(--gray); font-size:13px; font-weight:700;">المبلغ المطلوب: ${Utils.money(total)}</p>
      </div>
      <div class="item-box mb-4" style="border:2px solid var(--emerald); background:var(--emerald-light);">
        <div class="item-icon" style="background:#fff;"><i class="fa-solid fa-money-bill"></i></div>
        <div class="item-info"><div class="item-title">الدفع عند الاستلام (كاش)</div></div>
        <i class="fa-solid fa-circle-check" style="color:var(--emerald); font-size:20px;"></i>
      </div>
      <button onclick="cart.processPayment(${total})" class="btn-action" style="width:100%; padding:16px; font-size:16px;">تأكيد ودفع</button>
    `;
    Utils.openModal('modal-payment');
  },
  processPayment: (total) => {
    const cashback = Math.round(total * 0.05);
    Auth.currentUser.wallet = (Auth.currentUser.wallet || 0) + cashback;
    const uIdx = DB.users.findIndex(u => u.id === Auth.currentUser.id);
    DB.users[uIdx] = Auth.currentUser;
    sessionStorage.setItem('wasla_session', JSON.stringify(Auth.currentUser));
    DB.cart.forEach(item => {
      DB.orders.push({ id: Utils.id(), userId: Auth.currentUser.id, title: item.title, price: item.price, status: 'preparing', ts: Date.now() });
    });
    DB.cart = [];
    saveDB();
    Utils.closeModal('modal-payment'); cart.toggle(); UI.renderHeader();
    Utils.toast(`تم الدفع بنجاح! كاش باك ${cashback} ج.م`);
    router.navigate('dashboard');
  }
};

      list.innerHTML = doctorsToRender.map(d => {
        const docReviews = DB.reviews ? DB.reviews.filter(r => r.targetId === d.id && r.targetType === 'doctor') : [];
        const avgRating = docReviews.length ? (docReviews.reduce((s, r) => s + r.rating, 0) / docReviews.length).toFixed(1) : 'جديد';
        
        return `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div style="flex:1;">
              <div style="display:flex; align-items:center; gap:8px;">
                <h4 style="margin:0; font-weight:900; font-size:16px;">${d.name}</h4>
                <span style="background:var(--emerald-light); color:var(--emerald); font-size:10px; font-weight:900; padding:2px 6px; border-radius:4px;">${d.spec}</span>
              </div>
              <p style="margin:8px 0 4px; font-size:11px; color:var(--gray); font-weight:700;">
                <i class="fa-solid fa-location-dot"></i> ${d.area}
              </p>
              <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
                <span style="background:var(--gray-light); padding:2px 8px; border-radius:6px; font-size:10px; font-weight:900;">⭐ ${avgRating}</span>
                <span style="background:var(--gray-light); padding:2px 8px; border-radius:6px; font-size:10px; font-weight:900;">⏱ ${d.avgTime} دقيقة</span>
                ${d.status === 'available' ? `<span style="background:#ECFDF5; color:#059669; font-size:10px; font-weight:900; padding:2px 6px; border-radius:4px;">🟢 متاح</span>` : `<span style="background:#FEF2F2; color:#E11D48; font-size:10px; font-weight:900; padding:2px 6px; border-radius:4px;">🔴 مشغول</span>`}
              </div>
            </div>
            <div style="text-align:left;">
              <div style="font-weight:900; color:var(--emerald); font-size:20px;">${Utils.money(d.price)}</div>
              <button onclick="MedicalModule.openBooking('${d.id}')" class="btn-action" style="margin-top:10px; padding:10px 20px;">حجز</button>
            </div>
          </div>
        `;
      }).join('');
    },

    getFilteredDoctors: () => {
      return DB.doctors.filter(d => {
        // فلترة البحث
        const matchesSearch = !MedicalModule.currentFilters.search || 
          d.name.includes(MedicalModule.currentFilters.search) || 
          d.spec.includes(MedicalModule.currentFilters.search);
        
        // فلترة التخصص
        const matchesSpec = MedicalModule.currentFilters.spec === 'all' || 
          d.spec.includes(MedicalModule.currentFilters.spec);
        
        // فلترة التأمين
        let matchesInsurance = true;
        if (MedicalModule.currentFilters.insurance) {
          const insurance = DB.insuranceCompanies.find(i => i.id === MedicalModule.currentFilters.insurance);
          matchesInsurance = insurance && insurance.doctors.includes(d.id);
        }
        
        return matchesSearch && matchesSpec && matchesInsurance;
      });
    },

    filterDoctors: () => {
      MedicalModule.currentFilters.search = document.getElementById('med-search').value.trim();
      MedicalModule.renderDoctorsList();
    },

    applySpecChip: (el) => {
      document.querySelectorAll('#spec-chips .chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      MedicalModule.currentFilters.spec = el.dataset.chip;
      MedicalModule.renderDoctorsList();
    },

    filterByInsurance: (insuranceId) => {
      MedicalModule.currentFilters.insurance = insuranceId;
      MedicalModule.currentFilters.spec = 'all';
      document.querySelectorAll('#spec-chips .chip').forEach(c => c.classList.remove('active'));
      document.querySelector('#spec-chips .chip[data-chip="all"]').classList.add('active');
      
      const insurance = DB.insuranceCompanies.find(i => i.id === insuranceId);
      Utils.toast(`عرض أطباء ${insurance.name} فقط`);
      MedicalModule.renderDoctorsList();
    },

    // =========================================================================
    // 4. نظام الحجز (Booking with Time Slots)
    // =========================================================================
    openBooking: (docId) => {
      if (!Auth.currentUser) return AuthUI.open();
      const doc = DB.doctors.find(d => d.id === docId);
      
      // بناء جدول المواعيد بناءً على مدة الكشف
      const startHour = 17; // 5 مساءً
      const endHour = 22; // 10 مساءً
      const slots = [];
      let currentMinutes = startHour * 60;
      
      while (currentMinutes < endHour * 60) {
        const hours = Math.floor(currentMinutes / 60);
        const mins = currentMinutes % 60;
        const period = hours >= 12 ? 'م' : 'ص';
        const displayHour = hours > 12 ? hours - 12 : hours;
        slots.push(`${displayHour}:${mins.toString().padStart(2, '0')} ${period}`);
        currentMinutes += doc.avgTime;
      }

      document.getElementById('modal-book-body').innerHTML = `
        <button class="modal-close" onclick="Utils.closeModal('modal-book')"><i class="fa-solid fa-xmark"></i></button>
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
          <div style="width:50px; height:50px; border-radius:50%; background:var(--emerald-light); color:var(--emerald); display:flex; align-items:center; justify-content:center; font-size:24px;"><i class="fa-solid fa-user-doctor"></i></div>
          <div>
            <h3 style="margin:0; font-weight:900; font-size:18px;">${doc.name}</h3>
            <p style="margin:2px 0 0; font-size:12px; color:var(--gray);">${doc.spec} • الكشف: ${Utils.money(doc.price)}</p>
          </div>
        </div>

        <label style="font-size:13px; font-weight:900; display:block; margin-bottom:8px;">طريقة الدفع:</label>
        <div class="grid-2" style="margin-bottom:16px;">
          <label style="border:2px solid var(--emerald); background:var(--emerald-light); padding:10px; border-radius:10px; text-align:center; cursor:pointer; font-size:12px; font-weight:900;">
            <input type="radio" name="payment" value="cash" checked class="hidden" onchange="MedicalModule.updatePrice('${doc.id}')"> 💵 كاش
          </label>
          <label style="border:1px solid var(--line); padding:10px; border-radius:10px; text-align:center; cursor:pointer; font-size:12px; font-weight:900;">
            <input type="radio" name="payment" value="insurance" class="hidden" onchange="MedicalModule.updatePrice('${doc.id}')"> 🛡️ تأمين
          </label>
        </div>

        <div id="insurance-options" style="display:none; margin-bottom:16px;">
          <select id="insurance-select" class="input-field" onchange="MedicalModule.updatePrice('${doc.id}')">
            ${DB.insuranceCompanies.filter(i => i.doctors.includes(doc.id)).map(ins => `<option value="${ins.id}">${ins.name} (تغطية ${ins.coverage}%)</option>`).join('')}
          </select>
        </div>

        <div id="booking-price-display" style="background:var(--gray-light); padding:12px; border-radius:10px; margin-bottom:16px; text-align:center;">
          <div style="font-size:11px; color:var(--gray);">المبلغ المستحق</div>
          <div style="font-size:22px; font-weight:900; color:var(--emerald);">${Utils.money(doc.price)}</div>
        </div>

        <label style="font-size:13px; font-weight:900; display:block; margin-bottom:8px;">اختر الموعد (مدة الكشف: ${doc.avgTime} دقيقة):</label>
        <div class="grid-2" style="margin-bottom:20px; max-height:150px; overflow-y:auto;">
          ${slots.map((slot, idx) => `
            <label style="border:1px solid var(--line); padding:10px; border-radius:8px; text-align:center; cursor:pointer; font-weight:900; font-size:12px; color:var(--gray);">
              <input type="radio" name="slot" value="${slot}" ${idx === 0 ? 'checked' : ''} class="hidden"> ${slot}
            </label>
          `).join('')}
        </div>

        <button onclick="MedicalModule.confirmBooking('${doc.id}')" class="btn-action" style="width:100%; padding:14px; font-size:15px;">تأكيد الحجز</button>
      `;
      Utils.openModal('modal-book');
    },

    updatePrice: (docId) => {
      const doc = DB.doctors.find(d => d.id === docId);
      const paymentType = document.querySelector('input[name="payment"]:checked').value;
      const insuranceOptions = document.getElementById('insurance-options');
      const priceDisplay = document.getElementById('booking-price-display');
      
      if (paymentType === 'insurance') {
        insuranceOptions.style.display = 'block';
        const insuranceId = document.getElementById('insurance-select').value;
        const insurance = DB.insuranceCompanies.find(i => i.id === insuranceId);
        const patientShare = doc.price * (1 - (insurance.coverage / 100));
        priceDisplay.innerHTML = `
          <div style="font-size:11px; color:var(--gray);">المبلغ المستحق (بعد تغطية ${insurance.coverage}%)</div>
          <div style="font-size:22px; font-weight:900; color:var(--emerald);">${Utils.money(Math.round(patientShare))}</div>
        `;
      } else {
        insuranceOptions.style.display = 'none';
        priceDisplay.innerHTML = `
          <div style="font-size:11px; color:var(--gray);">المبلغ المستحق</div>
          <div style="font-size:22px; font-weight:900; color:var(--emerald);">${Utils.money(doc.price)}</div>
        `;
      }
    },

    confirmBooking: (docId) => {
      const doc = DB.doctors.find(d => d.id === docId);
      const slot = document.querySelector('input[name="slot"]:checked').value;
      const paymentType = document.querySelector('input[name="payment"]:checked').value;
      
      let finalPrice = doc.price;
      let insuranceId = null;
      
      if (paymentType === 'insurance') {
        insuranceId = document.getElementById('insurance-select').value;
        const insurance = DB.insuranceCompanies.find(i => i.id === insuranceId);
        finalPrice = Math.round(doc.price * (1 - (insurance.coverage / 100)));
      }

      const apptId = Utils.id();
      DB.appointments.push({ 
        id: apptId, patientId: Auth.currentUser.id, patientName: Auth.currentUser.name, 
        doctorId: doc.id, doctorName: doc.name, slot: slot, price: finalPrice, 
        paymentType: paymentType, insuranceId: insuranceId, status: 'waiting', ts: Date.now() 
      });
      saveDB();
      
      Utils.closeModal('modal-book');
      UI.renderHeader();
      Utils.toast('✅ تم الحجز بنجاح!');
      
      const waMsg = `مرحباً، تم تأكيد حجزك.\n👨‍⚕️ الطبيب: ${doc.name}\n⏰ الموعد: ${slot}\n💰 السعر: ${finalPrice} ج.م\nطريقة الدفع: ${paymentType === 'insurance' ? 'تأمين' : 'كاش'}`;
      const waUrl = `https://wa.me/2${Auth.currentUser.phone || '01000000000'}?text=${encodeURIComponent(waMsg)}`;
      
      document.getElementById('modal-map-body').innerHTML = `
        <button class="modal-close" onclick="Utils.closeModal('modal-map')"><i class="fa-solid fa-xmark"></i></button>
        <div style="text-align:center;">
          <div style="width:70px; height:70px; background:var(--emerald-light); color:var(--emerald); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 16px;"><i class="fa-solid fa-check"></i></div>
          <h3 style="margin:0 0 8px; font-weight:900; color:var(--emerald);">تم الحجز!</h3>
          <p style="font-size:12px; color:var(--gray); margin-bottom:16px;">سيتم إرسال إشعار لك عند اقتراب دورك.</p>
          <a href="${waUrl}" target="_blank" class="btn-action" style="width:100%; background:#25D366; text-decoration:none; margin-bottom:12px;"><i class="fa-brands fa-whatsapp"></i> إرسال تأكيد واتساب</a>
          <button onclick="Utils.closeModal('modal-map'); router.navigate('dashboard');" class="btn-action" style="width:100%; background:var(--primary);">الذهاب للوحة التحكم</button>
        </div>
      `;
      Utils.openModal('modal-map');
    },

    // =========================================================================
    // 5. طلب خدمة منزلية
    // =========================================================================
    orderService: (serviceId) => {
      if (!Auth.currentUser) return AuthUI.open();
      const service = DB.nursingServices.find(s => s.id === serviceId);
      
      document.getElementById('modal-map-body').innerHTML = `
        <button class="modal-close" onclick="Utils.closeModal('modal-map')"><i class="fa-solid fa-xmark"></i></button>
        <h3 style="margin:0 0 8px; font-weight:900;">${service.name}</h3>
        <p style="margin:0 0 16px; font-size:13px; color:var(--gray);">${service.desc} • ${Utils.money(service.price)}</p>
        
        <label style="font-size:12px; font-weight:900; display:block; margin-bottom:8px;">العنوان:</label>
        <input type="text" class="input-field" id="service-address" placeholder="اكتب عنوانك بالتفصيل">
        
        <label style="font-size:12px; font-weight:900; display:block; margin-bottom:8px;">طريقة الدفع:</label>
        <select class="input-field">
          <option>كاش</option>
          <option>إنستاباي (InstaPay)</option>
          <option>فودافون كاش</option>
        </select>

        <button onclick="MedicalModule.confirmServiceOrder('${service.id}')" class="btn-action" style="width:100%; padding:14px;">تأكيد الطلب</button>
      `;
      Utils.openModal('modal-map');
    },

    confirmServiceOrder: (serviceId) => {
      const service = DB.nursingServices.find(s => s.id === serviceId);
      const address = document.getElementById('service-address').value.trim();
      if (!address) return Utils.toast('أدخل العنوان', true);

      DB.orders.push({
        id: Utils.id(), userId: Auth.currentUser.id, title: service.name, price: service.price,
        status: 'preparing', type: service.category, address: address, ts: Date.now()
      });
      saveDB();
      Utils.closeModal('modal-map');
      Utils.toast('✅ تم إرسال طلبك! سيتم التواصل معك قريباً');
      router.navigate('dashboard');
    },

    // =========================================================================
    // 6. فتح الصيدلية
    // =========================================================================
    openPharmacy: (pharmacyId) => {
      const ph = DB.pharmacies.find(p => p.id === pharmacyId);
      document.getElementById('modal-map-body').innerHTML = `
        <button class="modal-close" onclick="Utils.closeModal('modal-map')"><i class="fa-solid fa-xmark"></i></button>
        <h3 style="margin:0 0 4px; font-weight:900;">${ph.name}</h3>
        <p style="margin:0 0 16px; font-size:12px; color:var(--gray);"><i class="fa-solid fa-location-dot"></i> ${ph.area}</p>
        
        <div class="grid-list">
          <div class="item-box" onclick="Utils.toast('يرجى رفع صورة الروشتة')">
            <div class="item-icon" style="background:var(--sky-light); color:var(--sky);"><i class="fa-solid fa-prescription"></i></div>
            <div class="item-info"><div class="item-title">اطلب بالأدوية</div><div class="item-sub">ارفع صورة الروشتة</div></div>
          </div>
          <div class="item-box" onclick="Utils.toast('سيتم إضافة المنتجات قريباً')">
            <div class="item-icon" style="background:var(--emerald-light); color:var(--emerald);"><i class="fa-solid fa-pills"></i></div>
            <div class="item-info"><div class="item-title">أدوية بدون روشتة</div><div class="item-sub">مسكنات، فيتامينات</div></div>
          </div>
        </div>
      `;
      Utils.openModal('modal-map');
    }
  };

  // =========================================================================
  // 7. تصدير الوحدة للاستخدام العالمي
  // =========================================================================
  window.MedicalModule = MedicalModule;

  console.log('✅ WASLA MEDICAL MODULE V8.0 LOADED: Professional UI, Time Slots, Insurance, Filtering.');

})();
</script>
</body>
</html>
