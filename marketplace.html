<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#059669"><title>السوق والمتاجر | وصلة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#0f172a}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:1100px;margin:20px auto}.head,.provider{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:14px}.brand{font-size:24px;font-weight:900;color:#059669}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:10px 15px;border:0;border-radius:10px;background:#059669;color:white;font:inherit;font-weight:800;cursor:pointer}.active{background:#0f172a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.product{border:1px solid #e2e8f0;border-radius:12px;padding:14px}.price{font-weight:900;color:#059669;font-size:18px}.muted{color:#64748b;font-size:13px;line-height:1.7}.notice{padding:12px;background:#ecfdf5;border-radius:10px;color:#065f46}.hidden{display:none!important}
</style></head><body><main class="wrap"><section class="head"><div class="brand">وصلة | السوق</div><h1>متاجر ومطاعم شبين القناطر</h1><p class="muted">تصفح الأنشطة والمنتجات المنشورة والمعتمدة. هذه النسخة تعرض الكتالوج وبيانات التواصل؛ إتمام الطلب والدفع داخل وصلة لم يُفعّل بعد.</p><div class="filters"><button data-sector="all" class="active">الكل</button><button data-sector="restaurants">مطاعم وأطعمة</button><button data-sector="market">سوبر ماركت ومتاجر</button></div><div id="message" class="notice hidden"></div></section><div id="catalog"></div></main>
<script>
const URL='https://fdduzcytuhoelnnejgkl.supabase.co',KEY='sb_publishable_qRwoBnYmdrjrNfAVhTChnA_H8XzY529',db=window.supabase?.createClient(URL,KEY),$=id=>document.getElementById(id);let allProviders=[],allProducts=[],filter='all';
function say(t){$('message').textContent=t;$('message').classList.remove('hidden');}
async function load(){const root=$('catalog');root.textContent='جاري تحميل السوق...';const {data:providers,error:pe}=await db.from('wasla_provider_profiles').select('id,business_name,sector,contact_phone,city,address,description').in('sector',['restaurants','market']).order('business_name');if(pe)throw pe;allProviders=providers||[];if(!allProviders.length){root.textContent='لا توجد متاجر أو مطاعم منشورة حاليًا.';return;}const ids=allProviders.map(p=>p.id);const {data:products,error:pr}=await db.from('wasla_provider_products').select('id,provider_id,name,category,description,price,stock_quantity').in('provider_id',ids).eq('is_available',true).gt('stock_quantity',0).order('name');if(pr)throw pr;allProducts=products||[];render();}
function render(){const root=$('catalog');root.replaceChildren();const providers=allProviders.filter(p=>filter==='all'||p.sector===filter);if(!providers.length){root.textContent='لا توجد نتائج لهذا التصنيف.';return;}providers.forEach(p=>{const card=document.createElement('section');card.className='provider';const title=document.createElement('h2');title.textContent=p.business_name;const type=document.createElement('p');type.className='muted';type.textContent=(p.sector==='market'?'سوبر ماركت ومتجر':'مطعم وأطعمة')+' · '+p.city+' · '+p.address;const desc=document.createElement('p');desc.className='muted';desc.textContent=p.description||'';const contact=document.createElement('a');contact.href='tel:'+p.contact_phone;contact.textContent='اتصال بالنشاط: '+p.contact_phone;const grid=document.createElement('div');grid.className='grid';const items=allProducts.filter(x=>x.provider_id===p.id);if(!items.length){const empty=document.createElement('p');empty.textContent='لا توجد منتجات متاحة حاليًا.';grid.append(empty);}items.forEach(item=>{const product=document.createElement('article');product.className='product';const name=document.createElement('h3');name.textContent=item.name;const category=document.createElement('p');category.className='muted';category.textContent=item.category+' · متاح: '+item.stock_quantity;const description=document.createElement('p');description.className='muted';description.textContent=item.description||'';const price=document.createElement('div');price.className='price';price.textContent=Number(item.price).toFixed(2)+' ج.م';product.append(name,category,description,price);grid.append(product);});card.append(title,type,desc,contact,grid);root.append(card);});}
document.querySelectorAll('[data-sector]').forEach(button=>button.onclick=()=>{filter=button.dataset.sector;document.querySelectorAll('[data-sector]').forEach(b=>b.classList.toggle('active',b===button));render();});
load().catch(e=>{ $('catalog').textContent='تعذر تحميل السوق: '+e.message;});
</script></body></html>
