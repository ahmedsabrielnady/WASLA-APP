<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./styles.css"><title>WASLA Operations Component QA</title></head>
<body>
<main style="max-width:1100px;margin:20px auto;padding:16px">
<h1>WASLA Operations QA</h1>
<div id="preview-admin"></div><div id="preview-staff"></div><div id="preview-customer"></div>
<pre id="result" style="direction:ltr;text-align:left;white-space:pre-wrap;background:#fff;color:#111;padding:16px;border:1px solid #ddd"></pre>
</main>
<script>
window.addEventListener("error", (event) => {
  const result = document.querySelector("#result");
  if (result && !result.textContent.trim()) {
    result.textContent = JSON.stringify({result:"FAIL",stage:"browser-runtime",error:event.message||"Unknown browser error"},null,2);
  }
});
window.addEventListener("unhandledrejection", (event) => {
  const result = document.querySelector("#result");
  if (result && !result.textContent.trim()) {
    result.textContent = JSON.stringify({result:"FAIL",stage:"unhandled-rejection",error:String(event.reason)},null,2);
  }
});
</script>
<script type="module">
const checks=[];
const sampleOrders=[{
 id:"10000000-0000-4000-8000-000000000001",
 ref:"OR-QA-0001",sector:"maintenance",status:"new",
 price_egp:50,deposit_egp:0,deposit_paid:false,
 created_at:new Date().toISOString(),updated_at:new Date().toISOString(),
 scheduled_at:null,address:"شارع الاختبار",provider_id:null,item_id:4,
 product_id:null,quantity:1
}];
const sampleProviders=[
 {id:"20000000-0000-4000-8000-000000000001",kind:"technician",display_name:"فني معتمد",specialty:"سباكة",area:"شبين",approved:true,active:true,is_test:false},
 {id:"20000000-0000-4000-8000-000000000002",kind:"technician",display_name:"فني ينتظر الاعتماد",specialty:"كهرباء",area:"شبين",approved:false,active:true,is_test:false},
 {id:"20000000-0000-4000-8000-000000000003",kind:"technician",display_name:"فني تجريبي",specialty:"تجريبي",area:"شبين",approved:true,active:true,is_test:true}
];
function check(name,ok,details){checks.push({check:name,ok:Boolean(ok),...(details===undefined?{}:{details})});}
function mount(selector,profile,renderer){
 const el=document.querySelector(selector);
 el.innerHTML=renderer({profile,orders:sampleOrders,providers:sampleProviders,preview:true,saving:false});
 return el;
}
try {
 const [{ renderOperationsView }, { renderRoadmapPage, renderRoadmapHome }, { calculateRoadmapMetrics, validateRoadmapUpdate }, { dataApi }] = await Promise.all([
  import("./src/operations.js"),
  import("./src/roadmap.js"),
  import("./src/domain.js"),
  import("./src/supabase.js")
 ]);
 const admin=mount("#preview-admin",{role:"admin",full_name:"Founder QA"},renderOperationsView);
 const staff=mount("#preview-staff",{role:"staff",full_name:"Staff QA"},renderOperationsView);
 const customer=mount("#preview-customer",{role:"customer",full_name:"Customer QA"},renderOperationsView);

 check("admin sees operations console",!!admin.querySelector(".operations-page"));
 check("staff sees operations console",!!staff.querySelector(".operations-page"));
 check("customer is denied operations console",!customer.querySelector(".operations-page"));

 for(const [name,el] of [["admin",admin],["staff",staff]]){
  check(name+" sees one order",el.querySelectorAll(".ops-order-card").length===1);
  check(name+" sees approved non-test technician",!!el.querySelector('.ops-action-form select option[value="20000000-0000-4000-8000-000000000001"]'));
  check(name+" sees pending provider approval",!!el.querySelector('[data-action="approve-provider"][data-provider-id="20000000-0000-4000-8000-000000000002"]'));
  check(name+" cannot assign test provider",!el.querySelector('.ops-action-form select option[value="20000000-0000-4000-8000-000000000003"]'));
  check(name+" status changes disabled in preview",el.querySelector('[data-action="ops-set-status"]')?.disabled===true);
  check(name+" approval disabled in preview",el.querySelector('[data-action="approve-provider"]')?.disabled===true);
  check(name+" quote and assign disabled in preview",[...el.querySelectorAll('.ops-action-form button[type="submit"]')].every(b=>b.disabled));
  check(name+" preview notice visible",el.textContent.includes("للقراءة فقط"));
 }

 const clinic=renderOperationsView({
  profile:{role:"admin"},orders:[{...sampleOrders[0],sector:"clinic"}],
  providers:sampleProviders,preview:true,saving:false
 });
 check("clinic booking excluded from generic assignment",clinic.includes("الحجوزات الطبية لها مسار مستقل"));

 const less=String.fromCharCode(60), greater=String.fromCharCode(62);
 const hostile=less+"img src=x onerror=alert(1)"+greater;
 const escaped=renderOperationsView({
  profile:{role:"admin"},orders:sampleOrders,
  providers:[{...sampleProviders[0],display_name:hostile}],
  preview:true,saving:false
 });
 check("provider HTML is escaped",escaped.includes("&lt;img")&&!escaped.includes(hostile));

 let writes=0;
 const originalFetch=window.fetch;
 window.fetch=async()=>{writes++;return new Response(null,{status:204});};
 const attempts=[
  ["status",()=>dataApi.updateOrderStatus(sampleOrders[0].id,"confirmed")],
  ["quote",()=>dataApi.quoteOrder(sampleOrders[0].id,100)],
  ["assignment",()=>dataApi.assignOrder(sampleOrders[0].id,sampleProviders[0].id)],
  ["approval",()=>dataApi.approveProvider(sampleProviders[1].id)]
 ];
 for(const [label,action] of attempts){
  try{await action();check(label+" write guard",false);}
  catch(e){check(label+" write guard",String(e.message).includes("نسخة معاينة"),String(e.message));}
 }
 window.fetch=originalFetch;
 check("preview mutation guards send zero requests",writes===0,String(writes));


 // Roadmap progress and founder/editor permissions.
 const roadmapItems = [
  {
   id:"qa-item-1",area:"اختبار",title:"بند قيد التنفيذ",
   description:"عنصر اصطناعي لقياس النسبة والتعديل.",
   weight:6,status:"in_progress",progress_percent:60,
   test_status:"not_tested",sort_order:1,public_visible:true
  },
  {
   id:"qa-item-2",area:"اختبار",title:"بند مكتمل",
   description:"عنصر اصطناعي مكتمل ومختبر.",
   weight:4,status:"done",progress_percent:100,
   test_status:"passed",sort_order:2,public_visible:true
  }
 ];
 const roadmapAudit = [{
  id:1,milestone_id:"qa-item-1",milestone_title_snapshot:"بند قيد التنفيذ",
  old_status:"planned",new_status:"in_progress",
  old_progress_percent:0,new_progress_percent:60,
  old_test_status:"not_tested",new_test_status:"not_tested",
  created_at:new Date().toISOString()
 }];
 const metricsBefore = calculateRoadmapMetrics(roadmapItems);
 const roadmapHome = renderRoadmapHome(roadmapItems,"");
 check("weighted roadmap formula uses item weights",metricsBefore.weightedProgress===76,{actual:metricsBefore.weightedProgress,expected:76});
 check("verified completion excludes unfinished work",metricsBefore.verifiedCompletion===40,{actual:metricsBefore.verifiedCompletion,expected:40});
 check("home progress card shows calculated percent",roadmapHome.includes("76%"));

 const adminRoadmap = renderRoadmapPage({
  items:roadmapItems,profile:{role:"admin"},preview:false,audit:roadmapAudit,savingId:""
 });
 const staffRoadmap = renderRoadmapPage({
  items:roadmapItems,profile:{role:"staff"},preview:false,audit:roadmapAudit,savingId:""
 });
 const customerRoadmap = renderRoadmapPage({
  items:roadmapItems,profile:{role:"customer"},preview:false,audit:roadmapAudit,savingId:""
 });
 const previewAdminRoadmap = renderRoadmapPage({
  items:roadmapItems,profile:{role:"admin"},preview:true,audit:roadmapAudit,savingId:""
 });
 check("founder sees milestone editor",adminRoadmap.includes('data-form="roadmap-milestone"'));
 check("founder sees change audit",adminRoadmap.includes("آخر تحديثات الخطة"));
 check("staff cannot see milestone editor",!staffRoadmap.includes('data-form="roadmap-milestone"'));
 check("customer cannot see milestone editor",!customerRoadmap.includes('data-form="roadmap-milestone"'));
 check("public preview admin editor is locked",!previewAdminRoadmap.includes('data-form="roadmap-milestone"')&&previewAdminRoadmap.includes("التعديل متوقف"));

 const updatedMetrics=calculateRoadmapMetrics([
  {...roadmapItems[0],progress_percent:80},
  roadmapItems[1]
 ]);
 check("progress percent increases after item completion update",updatedMetrics.weightedProgress===88,{actual:updatedMetrics.weightedProgress,expected:88});
 check("completion is rejected without passed test",!validateRoadmapUpdate("done",100,"not_tested").valid);
 check("completion is accepted only at 100 percent with passed test",validateRoadmapUpdate("done",100,"passed").valid);
 check("planned item cannot have partial progress",!validateRoadmapUpdate("planned",25,"not_tested").valid);

 // Exercise the actual Supabase client request builder with a mocked fetch.
 const roadmapOriginalFetch = window.fetch;
 const mockRequests=[];
 localStorage.setItem("wasla.auth.session.v1",JSON.stringify({
  access_token:"mock-roadmap-admin-token",
  refresh_token:"mock-roadmap-refresh",
  expires_at:Math.floor(Date.now()/1000)+3600,
  token_type:"bearer"
 }));
 window.fetch=async(url,init={})=>{
  mockRequests.push({url:String(url),method:init.method||"GET",body:init.body||null});
  return new Response(null,{status:204});
 };

 try {
  await dataApi.updateRoadmapMilestone("qa-item-1",{
   status:"in_progress",progressPercent:65,testStatus:"failed"
  });
  check("public preview blocks roadmap update",false);
 } catch(error) {
  check("public preview blocks roadmap update",String(error.message).includes("نسخة معاينة"));
 }
 check("preview roadmap guard sends zero requests",mockRequests.length===0,String(mockRequests.length));

 window.fetch=roadmapOriginalFetch;
 localStorage.removeItem("wasla.auth.session.v1");

 document.querySelector("#result").textContent=JSON.stringify({
  result:checks.every(x=>x.ok)?"PASS":"FAIL",
  passed:checks.filter(x=>x.ok).length,
  total:checks.length,
  checks,
  note:"Synthetic role/order/provider records. Mutating Data API methods are blocked by the preview guard before fetch. No production writes."
 },null,2);
} catch(error) {
 document.querySelector("#result").textContent=JSON.stringify({
  result:"FAIL",error:String(error),passed:checks.filter(x=>x.ok).length,total:checks.length,checks
 },null,2);
}
</script>
</body>
</html>
