<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./styles.css">
  <title>WASLA Operations QA</title>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <pre id="qa-result" style="direction:ltr;text-align:left;white-space:pre-wrap;background:#fff;color:#111;padding:16px;margin:12px;border:1px solid #ddd"></pre>
  <script type="module">
    const output = document.querySelector("#qa-result");
    const checks = [];
    const requests = [];
    const role = new URLSearchParams(location.search).get("role") || "admin";
    const userId = role === "customer"
      ? "11111111-1111-4111-8111-111111111111"
      : role === "staff"
        ? "33333333-3333-4333-8333-333333333333"
        : "44444444-4444-4444-8444-444444444444";

    localStorage.setItem("wasla.auth.session.v1", JSON.stringify({
      access_token: "mock-operations-token",
      refresh_token: "mock-operations-refresh",
      expires_at: Math.floor(Date.now() / 1000) + 3600,
      token_type: "bearer"
    }));

    const orders = [{
      id:"55555555-5555-4555-8555-555555555555",
      ref:"OR-OPS-QA001",
      sector:"maintenance",
      status:"new",
      price_egp:null,
      deposit_egp:0,
      deposit_paid:false,
      created_at:new Date().toISOString(),
      updated_at:new Date().toISOString(),
      scheduled_at:null,
      address:"شارع الاختبار",
      provider_id:null,
      item_id:4,
      product_id:null,
      quantity:1
    }];
    const providers = [
      { id:"66666666-6666-4666-8666-666666666666",kind:"technician",display_name:"فني معتمد",specialty:"سباكة",area:"شبين",approved:true,active:true,is_test:false,created_at:new Date().toISOString() },
      { id:"77777777-7777-4777-8777-777777777777",kind:"technician",display_name:"فني ينتظر المراجعة",specialty:"كهرباء",area:"شبين",approved:false,active:true,is_test:false,created_at:new Date().toISOString() },
      { id:"88888888-8888-4888-8888-888888888888",kind:"technician",display_name:"فني تجريبي",specialty:"تجريبي",area:"شبين",approved:true,active:true,is_test:true,created_at:new Date().toISOString() }
    ];
    const services=[{id:4,sector:"maintenance",name:"كشف سباك",price_egp:50,active:true}];

    function response(data,status=200){
      return new Response(JSON.stringify(data),{status,headers:{"Content-Type":"application/json"}});
    }
    window.fetch=async(input,init={})=>{
      const url=String(input), method=init.method||"GET";
      requests.push({url,method,body:init.body||null});
      if(url.includes("/auth/v1/user")) return response({id:userId,email:"qa-operations@example.test"});
      if(url.includes("/rest/v1/profiles?")) return response([{id:userId,full_name:"اختبار صلاحيات",phone:"01012345678",role}]);
      if(url.includes("/rest/v1/service_items?")) return response(services);
      if(url.includes("/rest/v1/offers?")) return response([]);
      if(url.includes("/rest/v1/roadmap_milestones?")) return response([]);
      if(url.includes("/rest/v1/orders?")) return response(orders);
      if(url.includes("/rest/v1/providers?")) return response(providers);
      return response({message:"Unexpected or blocked API call: "+url},500);
    };

    const waitFor=async(predicate,label,timeout=5000)=>{
      const start=Date.now();
      while(Date.now()-start<timeout){
        if(predicate()) return;
        await new Promise(resolve=>setTimeout(resolve,50));
      }
      throw new Error("Timed out waiting for "+label);
    };

    try{
      await import("./src/main.js");
      const authModule = await import("./src/supabase.js");
      const testSession = authModule.authApi.getSession();
      const testUser = await authModule.authApi.getUser();
      const testProfile = testUser?.id ? await authModule.dataApi.getProfile(testUser.id) : null;
      checks.push({check:"mock session is loaded",ok:!!testSession?.access_token});
      checks.push({check:"mock Auth user is returned",ok:testUser?.id===userId,user:testUser});
      checks.push({check:"mock profile role is returned",ok:testProfile?.role===role,profile:testProfile});
      await waitFor(() => {
        const opsReady = !!document.querySelector(".operations-page");
        const customerReady = role === "customer"
          && !opsReady
          && document.querySelector("#app")?.textContent.includes("خدمات مدينتك");
        return role === "customer" ? customerReady : opsReady;
      }, "fully loaded role-specific view");

      const ops=document.querySelector(".operations-page");
      checks.push({check:"customer cannot open operations",ok:role==="customer" ? !ops : !!ops});
      if(role==="customer"){
        checks.push({check:"customer route returns to public home",ok:document.querySelector("#app")?.textContent.includes("خدمات مدينتك")===true});
      } else {
        checks.push({check:"staff/admin operations view renders",ok:!!ops});
        checks.push({check:"orders are loaded for operations role",ok:document.querySelectorAll(".ops-order-card").length===1});
        checks.push({check:"active approved non-test technician is selectable",ok:document.querySelector('.ops-action-form select option[value="66666666-6666-4666-8666-666666666666"]')!==null});
        checks.push({check:"pending provider approval action appears",ok:document.querySelector('[data-action="approve-provider"][data-provider-id="77777777-7777-4777-8777-777777777777"]')!==null});
        checks.push({check:"test provider is excluded from assignment options",ok:document.querySelector('.ops-action-form select option[value="88888888-8888-4888-8888-888888888888"]')===null});
        checks.push({check:"preview disables order status actions",ok:document.querySelector('[data-action="ops-set-status"]')?.disabled===true});
        checks.push({check:"preview disables provider approval",ok:document.querySelector('[data-action="approve-provider"]')?.disabled===true});
        checks.push({check:"preview disables quote and assignment submits",ok:[...document.querySelectorAll('.ops-action-form button[type="submit"]')].every(b=>b.disabled)});
        checks.push({check:"preview shows read-only notice",ok:document.querySelector(".operations-page")?.textContent.includes("للقراءة فقط")===true});

        const before=requests.length;
        const action=document.querySelector('[data-action="ops-set-status"]');
        if(action) action.dispatchEvent(new Event("click",{bubbles:true}));
        const quote=document.querySelector('form[data-form="operations-quote"]');
        if(quote) quote.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
        const assign=document.querySelector('form[data-form="operations-assign"]');
        if(assign) assign.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
        const approve=document.querySelector('[data-action="approve-provider"]');
        if(approve) approve.dispatchEvent(new Event("click",{bubbles:true}));
        checks.push({check:"preview operational mutations make zero network writes",ok:requests.slice(before).every(x=>x.method==="GET")});
      }

      output.textContent=JSON.stringify({
        result:checks.every(x=>x.ok)?"PASS":"FAIL",
        role,
        passed:checks.filter(x=>x.ok).length,
        total:checks.length,
        checks,
        requestCount:requests.length,
        requests,
        note:"All data is mocked. Preview write guards are tested. No database changes are sent."
      },null,2);
    }catch(error){
      output.textContent=JSON.stringify({result:"FAIL",role,error:String(error),checks,requests},null,2);
    }
  </script>
</body>
</html>
