<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./styles.css"><title>WASLA Operations Component QA</title></head>
<body>
<main style="max-width:1100px;margin:20px auto;padding:16px">
<h1>WASLA Operations QA</h1>
<div id="preview-admin"></div><div id="preview-staff"></div><div id="preview-customer"></div>
<pre id="result" style="direction:ltr;text-align:left;white-space:pre-wrap;background:#fff;color:#111;padding:16px;border:1px solid #ddd"></pre>
</main>
<script type="module">
import { renderOperationsView } from "./src/operations.js";
import { dataApi } from "./src/supabase.js";

const checks=[];
const sampleOrders=[{
 id:"10000000-0000-4000-8000-000000000001",
 ref:"OR-QA-0001", sector:"maintenance", status:"new",
 price_egp:50, deposit_egp:0, deposit_paid:false,
 created_at:new Date().toISOString(),updated_at:new Date().toISOString(),
 scheduled_at:null,address:"شارع الاختبار",provider_id:null,item_id:4,product_id:null,quantity:1
}];
const sampleProviders=[
 {id:"20000000-0000-4000-8000-000000000001",kind:"technician",display_name:"فني معتمد",specialty:"سباكة",area:"شبين",approved:true,active:true,is_test:false},
 {id:"20000000-0000-4000-8000-000000000002",kind:"technician",display_name:"فني ينتظر الاعتماد",specialty:"كهرباء",area:"شبين",approved:false,active:true,is_test:false},
 {id:"20000000-0000-4000-8000-000000000003",kind:"technician",display_name:"فني تجريبي",specialty:"تجريبي",area:"شبين",approved:true,active:true,is_test:true}
];
const preview=true;

function check(name,ok,details=null){checks.push({check:name,ok:Boolean(ok),...(details===null?{}:{details})});}
function mount(id,profile){
 document.querySelector(id).innerHTML=renderOperationsView({
  profile,orders:sampleOrders,providers:sampleProviders,preview,saving:false
 });
 return document.querySelector(id);
}

try{
 const admin=mount("#preview-admin",{role:"admin",full_name:"Founder QA"});
 const staff=mount("#preview-staff",{role:"staff",full_name:"Staff QA"});
 const customer=mount("#preview-customer",{role:"customer",full_name:"Customer QA"});

 check("admin sees operations console",admin.querySelector(".operations-page")!==null);
 check("staff sees operations console",staff.querySelector(".operations-page")!==null);
 check("customer does not see operations console",customer.querySelector(".operations-page")===null);

 for(const [name,element] of [["admin",admin],["staff",staff]]){
  check(name+" sees one order",element.querySelectorAll(".ops-order-card").length===1);
  check(name+" sees approved non-test technician",element.querySelector('.ops-action-form select option[value="20000000-0000-4000-8000-000000000001"]')!==null);
  check(name+" sees pending provider approval",element.querySelector('[data-action="approve-provider"][data-provider-id="20000000-0000-4000-8000-000000000002"]')!==null);
  check(name+" cannot assign test provider",element.querySelector('.ops-action-form select option[value="20000000-0000-4000-8000-000000000003"]')===null);
  check(name+" status change button is disabled in preview",element.querySelector('[data-action="ops-set-status"]')?.disabled===true);
  check(name+" provider approval button is disabled in preview",element.querySelector('[data-action="approve-provider"]')?.disabled===true);
  check(name+" quote and assignment submits are disabled",Array.from(element.querySelectorAll('.ops-action-form button[type="submit"]')).every(b=>b.disabled));
  check(name+" read-only preview notice is visible",element.textContent.includes("للقراءة فقط"));
 }

 const clinic=renderOperationsView({
  profile:{role:"admin"},
  orders:[{...sampleOrders[0],id:"30000000-0000-4000-8000-000000000001",sector:"clinic"}],
  providers:sampleProviders,preview:true,saving:false
 });
 check("clinic order does not use generic assignment",clinic.includes("الحجوزات الطبية لها مسار مستقل"));

 const hostileProvider={...sampleProviders[0],display_name:"<img src=x onerror=alert(1)>"};
 const hostile=renderOperationsView({profile:{role:"admin"},orders:sampleOrders,providers:[hostileProvider],preview:true,saving:false});
 check("provider display names are escaped",hostile.includes("&lt;img")&&!hostile.includes("<img src=x"));

 // Exercise all public-preview mutation guards. Each must reject before fetch.
 let writeGuardsPassed=0;
 const mutations=[
  ["status",()=>dataApi.updateOrderStatus(sampleOrders[0].id,"confirmed")],
  ["quote",()=>dataApi.quoteOrder(sampleOrders[0].id,100)],
  ["assignment",()=>dataApi.assignOrder(sampleOrders[0].id,sampleProviders[0].id)],
  ["approval",()=>dataApi.approveProvider(sampleProviders[1].id)]
 ];
 for(const [name,fn] of mutations){
  try{await fn();check(name+" write is blocked in preview",false);}
  catch(error){
   const ok=String(error.message).includes("نسخة معاينة");
   check(name+" write is blocked in preview",ok,String(error.message));
   if(ok) writeGuardsPassed++;
  }
 }
 check("all four operational writes are blocked",writeGuardsPassed===4);

 document.querySelector("#result").textContent=JSON.stringify({
  result:checks.every(x=>x.ok)?"PASS":"FAIL",
  passed:checks.filter(x=>x.ok).length,
  total:checks.length,
  checks,
  note:"Rendering uses synthetic profiles/orders/providers. Mutation guard calls fail before network access. No production writes."
 },null,2);
}catch(error){
 document.querySelector("#result").textContent=JSON.stringify({
  result:"FAIL",error:String(error),passed:checks.filter(x=>x.ok).length,total:checks.length,checks
 },null,2);
}
</script>
</body>
</html>
